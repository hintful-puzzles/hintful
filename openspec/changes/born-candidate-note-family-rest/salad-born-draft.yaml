# yaml-language-server: $schema=../../../../describe/description.schema.json

# A draft of Salad's born description, compiled to find what the engine
# lacks; removed at the flip.
game: saladborn
produces: latin
words:
  cell: square
  value: letter
sizes:
  w: { min: 3, max: 10 }
  # The symbols each line holds; the rest of it is empty.
  n: { min: 2, max: 9 }
  # 0 ABC End View's letters, 1 Number Ball's numbers.
  mode: { min: 0, max: 1 }
space:
  grid: { w: "w", h: "w" }
  slots: true
  units: [rows, cols]
answer:
  # n + 1 is the empty square, which fills the rest of each line.
  value:
    sort: cell
    domain: "range(1, n + 1)"
    repeat: { value: "n + 1", times: "w - n" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, n + 1)" }
shape:
  - "latin(value, lines)"
clues:
  # ABC End View: the first square from the clue that is not empty holds it.
  border:
    at: slot
    glyph: true
    value: "range(1, n)"
    means: >-
      exists c in sight(at):
      value(c) = v and (forall c2 in before(c, sight(at)): value(c2) = n + 1)
  # Number Ball: a ball's square is not empty.
  ball: { at: cell, value: "range(0, 0)", means: "value(at) != n + 1" }
freedom: { kind: fill }
play:
  numbers: { empty: { ball: ball } }
  boards: [4x4n3L, 5x5n3L, 5x5n4L, 6x6n4L, 7x7n4L, 8x8n5L, 5x5n3B, 5x5n4B, 6x6n3B, 6x6n4B, 7x7n4B, 8x8n5B]
  default: 4x4n3L
  # Normal where its deal is quick: forty deals each took at most 0.2 s on a
  # loaded machine. Every other Numbers shape took seconds at Normal.
  boardTiers:
    4x4n3L: [Easy, Easy]
    7x7n4L: [Easy, Easy]
    8x8n5L: [Easy, Easy]
    5x5n3B: [Easy, Easy]
    5x5n4B: [Normal, Normal]
    6x6n3B: [Easy, Easy]
    6x6n4B: [Easy, Easy]
    7x7n4B: [Easy, Easy]
    8x8n5B: [Easy, Easy]
  hintMarks:
    ring: the square the step fills in.
    strike: the pencil marks the step crosses out.
    outline: what the step reasons from.
    stripes: the row or column the sentence names.
deal:
  answer: a Latin square of o symbols, those past n read as empty
  border: every clue the answer shows, then each hidden while the board still finishes
  ball: every square's ball, then each weakened, then hidden
  given: every square, then each hidden while the board still finishes
  tier: one of the tiers
  sample: { latin: true }
  # A board whose empty squares all fall out with no symbol placed never asks
  # where a symbol goes.
  refuse: { by: [ball, emptyLine, emptySquare], places: "n + 1" }
  hide:
    # A Letters board below 8x8 is clued on its border alone.
    given: { whole: { with: Letters, shorter: { max: 7 } } }
    border:
    # A number given is weakened to its ball before the ball goes.
    ball: { after: given }
settings:
  n:
    kind: number
    gives: size
    letter: n
    kw: symbols
    name: Symbols
    doc: The amount of different symbols that appear in each row.
    min: 2
    max: 9
    default: 3
    words: "{n} symbols"
    under: w
  mode:
    kind: choice
    gives: size
    choices:
      - name: Letters
        code: L
        rule: The letters on the edge show which letter appears first when 'looking' into the grid.
        deals: [border]
        letters: true
        # No board of two letters is Normal clued on its border alone.
        bounds: { tiers: { Normal: { sizes: { n: 2 }, shorter: { min: 8 } } } }
      - name: Numbers
        code: B
        rule: Squares with a ball must contain a number. Squares with a cross must remain empty.
        deals: [ball]
        bounds: { tiers: { Normal: { sizes: { n: 2 }, shorter: { min: 5 } } } }
id:
  - { digits: border, glyphs: true, sides: [top, left, bottom, right], after: "," }
  - { digits: given, glyphs: true, codes: { O: "ball 0" } }
tierLetters: ex
tiers: [Easy, Normal]
names:
  dup: "a placed letter's row and column"
  single: "the only letter left in a square"
  hiddenSingle: "the only square left for a letter"
  set: "letters already accounted for"
  wing: "a wing"
  borderNear: "the letter a clue sees first"
  borderFar: "how far in a clue's letter sits"
  ball: "a ball's square"
  emptyLine: "a line's last squares that can be empty"
  emptySquare: "a square that can hold no symbol"
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  - id: border
    tier: Easy
    rung: [borderNear, borderFar]
    for: >-
      k in clues(border),
      L = sight(at(k)),
      H = w - n,
      f = index(first({c in L where not (known(c) and value(c) = n + 1)}), L),
      reach = H - count(c in L where index(c, L) >= H and known(c) and value(c) = n + 1),
      stop = index(first({c in L where n + 1 not in cand(c)}), L)
    conclude: >-
      forall c in L, i = index(c, L):
      ((f < 0 or i <= f) implies (forall e in domain where e != v(k) and e <= n: strike(c, e)))
      and (((stop >= 0 and i > stop) or i > reach) implies strike(c, v(k)))
    says:
      shown: value
      terms: { k: k, L: L, v: "v(k)" }
      marks: {}
      arms:
        borderNear:
          when: "f >= 0"
          look: "{outline k: This clue} sees {v} first, and nothing nearer it is known to hold a letter"
        borderFar:
          when: "true"
          look: "{outline k: This clue} sees {v} first, so {v} sits no further in"
  # A ball's square is struck the empty square.
  - id: ball
    tier: Easy
    rung: ball
    for: "c in cells where clue(ball, c) != none"
    conclude: "strike(c, n + 1)"
    says:
      terms:
        at: c
      marks: {}
      wordings:
        - when: "true"
          look: "{outline at: The ball} means its square holds a number"
  # A line with only as many squares left that may be empty as it has empty
  # squares to place has one in each.
  - id: emptyLine
    tier: Easy
    rung: emptyLine
    for: >-
      L in units,
      E = {c in cells(L) where not known(c) and n + 1 in cand(c)},
      k = w - n - count(c in cells(L) where known(c) and value(c) = n + 1)
      where |E| > 0 and |E| = k
    conclude: "forall c in E: place(c, n + 1)"
    says:
      terms: { L: L }
      marks:
        stripes: "cells(L)"
      wordings:
        - look: "{stripes: this {unit}} has only as many squares left that can be empty as it has empty squares to place"
  # A square that can hold no symbol is empty.
  - id: emptySquare
    tier: Easy
    rung: emptySquare
    for: "c in cells where not known(c) and |cand(c)| = 1 and n + 1 in cand(c)"
    conclude: "place(c, n + 1)"
    says:
      terms: { at: c }
      marks: {}
      wordings:
        - look: "{outline at: This square} has nothing left but the empty square"
  - { use: latin.hiddenSingle, tier: Easy, rung: hiddenSingle }
  - { use: latin.single, tier: Easy, rung: single }
  - { use: latin.set, tier: Normal, rung: set }
  - { use: latin.fish, tier: Normal, rung: set }
  - { use: latin.wing, tier: Normal, rung: wing }
