schema: spec-driven

# Shown to the AI when creating artifacts. Deliberately a *pointer*, not a copy:
# the previous `openspec/project.md` duplicated AGENTS.md and drifted — it still
# described `puzzles/` as a live subtree after that directory was deleted, and
# cited two AGENTS.md sections that no longer existed. A second copy of the brief
# is a second thing to keep true.
context: |
  Hintful Puzzles (repository `hintful`) is a PWA of Simon Tatham's Portable
  Puzzle Collection, rewritten from C/WASM into native TypeScript. All 57 games
  and the engine are TypeScript;
  there is no C, no build system, and nothing generated anywhere in the tree.
  `npm install` is the entire setup.

  Read AGENTS.md at the repository root before proposing or implementing
  anything: it holds the rules that bind every session and a map of the guides.
  Before planning a change, also read `docs/work-management.md` (how a change
  is scoped, finished and accepted here), `docs/doctrine.md` (what the project
  is for) and `docs/method.md` (how to trust a check or a number a proposal
  argues from), then the guide the map names for the part of the tree the
  change touches. `openspec/specs/` is what is normatively true; the record of
  what was built is `openspec/changes/archive/` and the git log, and is not
  required reading.

# Shown to whoever writes that artifact. The gate holds the first two of these
# (`openspec validate --strict` and `scripts/checks/spec-form.mjs`); the rest
# only a reader can.
rules:
  specs:
    - A requirement states what must hold, in the present tense, in SHALL sentences, in at most 500 characters before its first scenario. Split a longer one into requirements that each state one behavior.
    - No date, no change id, no count of games or other measured figure, and no account of what the rule replaced or how it was decided. Those belong in this change's proposal and design, which the archive keeps.
    - At most one sentence of reason, where the rule would look arbitrary without it. A longer argument goes in the guide under docs/ for that part of the tree.
    - Name a Game hook, an exported helper, a params letter or a sentence the player reads. Do not name a test file or a private function.
    - A change to a subject the capability already covers MODIFIES that requirement. Do not ADD a second requirement beside it titled for what this change did.
    - A MODIFIED requirement is restated whole, and reads afterwards as the rule that now holds, with no mention of the change.
    - A scenario gives a case the rule's sentence does not. Do not write one that restates the rule or says that a named test fails.

# Per-operation guidance (optional)
# Example:
#   operations:
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
