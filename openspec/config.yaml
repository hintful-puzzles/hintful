schema: spec-driven

# Shown to the AI when creating artifacts. Deliberately a *pointer*, not a copy:
# the previous `openspec/project.md` duplicated AGENTS.md and drifted — it still
# described `puzzles/` as a live subtree after that directory was deleted, and
# cited two AGENTS.md sections that no longer existed. A second copy of the brief
# is a second thing to keep true.
context: |
  Hintful Puzzles (repository `hintful`) is a PWA of Simon Tatham's Portable
  Puzzle Collection, rewritten from C/WASM into native TypeScript. All 57 games
  and the engine are TypeScript;
  there is no C, no build system, and nothing generated anywhere in the tree.
  `npm install` is the entire setup.

  Read AGENTS.md at the repository root before proposing or implementing
  anything: it holds the rules that bind every session and a map of the guides.
  Before planning a change, also read `docs/work-management.md` (how a change
  is scoped, finished and accepted here), `docs/doctrine.md` (what the project
  is for) and `docs/method.md` (how to trust a check or a number a proposal
  argues from), then the guide the map names for the part of the tree the
  change touches. `openspec/specs/` is what is normatively true; the record of
  what was built is `openspec/changes/archive/` and the git log, and is not
  required reading.

# Per-artifact rules (optional)
# Example:
