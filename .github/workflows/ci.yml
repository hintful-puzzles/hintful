# CI backstop for this project.
#
# Trunk-based (no PRs), so the gate runs post-push on `main`: it runs the SAME
# gate as the husky pre-commit hook, `npm run gate`, whose steps are defined in
# `scripts/gate.sh` and nowhere else. So a `--no-verify` commit or a fresh
# clone whose hooks never installed cannot land breakage on `main` undetected.
# The deploy waits only on the gate's fast checks and the build (the `build`
# job); the full gate runs beside it and marks the commit red after the fact.
# (If contributors arrive later and PRs become useful, add a `pull_request:`
# trigger here.)
#
# Nothing is generated and no native tool is provisioned, so each job is
# `npm ci` and the gate.
name: CI

on:
  push:
    branches: [main]
  # Manual trigger — run the gate on demand.
  workflow_dispatch:

# Cancel an in-progress run when a newer commit lands on the same ref — the
# older run's result is moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The full gate, beside the deploy rather than in front of it (owner,
  # 2026-09-27: ten minutes per push was the velocity cost). Every commit has
  # passed the hook's gate already; this job is the backstop for what the hook
  # scopes away (tests a commit could not have affected, checks deferred to
  # push) and for a `--no-verify` commit, and it still fails the run and marks
  # the commit red. It builds too, and throws that build away.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Run the gate
        run: npm run gate

  # The gate's fast checks and the production build, which is the artifact
  # that ships. The fast checks are the prefix of `scripts/gate.sh`, which is
  # where they are listed; they run first, so a commit that fails one of them
  # still does not deploy.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # This job's `vite build` IS the artifact that gets published, so it runs
    # with the deploy-time environment rather than a bare one. Without this the
    # deploy job would have to rebuild, and "deployed only from a checked build"
    # would mean "deployed from a build resembling one that passed" — the CSP
    # would differ (no Sentry origin), and the sitemap and canonical links
    # would be absent from the thing that was checked but present in the thing
    # that shipped. `needs:` propagates a verdict; only an artifact propagates
    # the bytes. (deploy-the-web-app design.md §3.)
    #
    # Each is empty until configured, and empty is a working configuration:
    # vite.config.ts branches on falsiness, so no canonical URL means no
    # sitemap and no DSN means no Sentry. `vars` rather than `secrets` for the
    # base URL because it is not a secret and wants to be readable; the DSN is
    # a secret only by convention — it is compiled into a public bundle and is
    # readable out of `dist/assets/` by anyone. Sentry's allowed-domains list
    # is the control that actually does something.
    env:
      VITE_CANONICAL_BASE_URL: ${{ vars.VITE_CANONICAL_BASE_URL }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_GIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Current LTS-track major; matches the local dev environment. A
          # preference: nothing in the build needs this major.
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run the gate's fast checks and the prod build
        run: GATE_BUILD_ONLY=1 npm run gate

      # The gate's build-only run ends in `vite build` into dist/, so this is
      # that exact output, not a second build of the same commit.
      - name: Keep the build for the deploy job
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
          # An empty or missing dist/ means the gate's build branch silently
          # produced nothing; fail here rather than deploy a hole.
          if-no-files-found: error

  # Publish to Cloudflare Pages — direct upload, NOT the Pages GitHub
  # integration.
  #
  # The integration is one OAuth click and would be the easy path, but it
  # builds and publishes on push to `main` with no way to wait on a GitHub
  # check: Cloudflare offers no "deploy only if CI passed" setting. It would
  # therefore publish exactly the commits this workflow exists to catch — a
  # `--no-verify` commit, or one from a clone whose hooks never installed —
  # which is what `build-pipeline`, "The app is published once the fast checks
  # and the build pass" forbids. It would also mean a second build environment,
  # built from the same source by a different toolchain, free to drift.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `main` only. `workflow_dispatch` on another ref runs the gate and stops.
    if: github.ref == 'refs/heads/main'
    steps:
      # v8 downloads what v7 uploads — the two version independently and the
      # pairing is the documented one. They were introduced here at v4, which
      # runs on Node 20 and already draws a deprecation warning from the
      # runner; a deprecation warning is a dated fact that becomes a hard
      # failure, so it is worth clearing rather than reading every run.
      - name: Fetch the gated build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to Cloudflare Pages
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned, so "has this been fixed upstream?" is answerable from
          # inside the repo rather than being whatever the runner resolved
          # today. Bump it deliberately.
          wranglerVersion: "4.129.1"
          # The project name is the product's, not the repository's. Players
          # reach it at hintful.click; `hintful-puzzles.pages.dev` is its Pages
          # origin. The product is Hintful Puzzles, the repository
          # is hintful.
          command: pages deploy dist --project-name=hintful-puzzles --branch=main

      - name: Say where it went
        run: echo "Deployed to ${{ steps.publish.outputs.deployment-url }}"
