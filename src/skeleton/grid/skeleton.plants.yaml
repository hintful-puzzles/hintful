# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound. A placed kind brings its own plant.

techniques:
  # Two numbers whose open squares only overlap read as nested.
  shared:
    for: >-
      k in clues(count), c = at(k), O = open(adj4(c)) where |O| >= 2, b in
      within(c, 2) where b != c and clue(count, b) != none, M = open(adj4(b))
      where |M| > 0 and |M| < |O| and (exists d in M: d in O), by = need(c) -
      need(b), R = O - M where by <= 0 or by >= |R|
