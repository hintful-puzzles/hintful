# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # The skeleton of a grid game: a number one short of its open squares
  # read as needing them all.
  count:
    for: >-
      k in clues(count), c = at(k), n = need(c), O = open(c) where |O| > 0 and
      (n <= 0 or n >= |O| - 1)
    conclude: >-
      n >= 0 and (n = 0 implies (forall d in O: place(d, 2))) and (n = 0 or
      (forall d in O: place(d, 1)))
  # Two numbers whose open squares only overlap read as nested.
  shared:
    for: >-
      k in clues(count), c = at(k), O = open(c) where |O| >= 2, b in within(c,
      2) where b != c and clue(count, b) != none, M = open(b) where |M| > 0 and
      |M| < |O| and (exists d in M: d in O), by = need(c) - need(b), R = O - M
      where by <= 0 or by >= |R|
