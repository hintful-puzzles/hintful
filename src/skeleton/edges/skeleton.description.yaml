# yaml-language-server: $schema=../../describe/description.schema.json

game: skeleton
help:
  rules: |-
    You have a grid of squares with walls between some of them. Draw one loop
    that runs from square to square through the middles of the squares, never
    diagonally, passes through every square once, and never crosses a wall. So
    every square takes two lines, one in and one out, and the loop may close only
    once it has passed through every square.

    Every puzzle has exactly one solution, and none needs a guess.
  controls: |-
    Drag from square to square to draw a line along the edges you pass. To
    change your mind mid-stroke, draw back along its end: the squares you
    retrace are taken back. Brushing any other part of the stroke does
    nothing, and it carries on once you return to where it reached. Undo takes
    a stroke back. A drag along a line you
    have drawn and on past its end carries that line on, and a drag that runs
    only along lines you have drawn takes them up. A line stops where it would
    give a square more than two lines, or at a wall or an edge you have crossed
    out. You can also click near the edge between two squares to draw or remove a
    line there.

    Right-click an edge to cross it out, to mark that you are sure no line goes
    there, and keep the button down and drag to cross out every edge you pass.
    Right-click it again to clear the cross. You never need to cross anything out
    to finish.

    The keyboard can also be used. The arrow keys move a cursor. Press Enter to
    start a line, move the cursor along the way you want it, and press Enter
    again to draw it; Space, Escape, Backspace or Delete abandons it instead.
    Holding Ctrl while pressing an arrow key draws or removes the line in that
    direction and moves along it, holding Ctrl and Shift together does the same
    without moving, and holding Shift alone crosses out or clears the edge in
    that direction.

    A line turns red when it closes a loop that leaves some squares out.
  hints: |-
    **Hint** explains the next step rather than simply making it. It reasons only
    from the walls and the lines and crosses you have drawn, so it carries on
    from wherever you are, as long as none of those is wrong; if one is, it asks
    you to fix the highlighted mistakes first.

    {{hint-marks}}

    An edge beside a square that already has its two lines can never take
    another, and neither can an edge whose line would close a loop that leaves
    some squares out. The hint counts these as closed without asking you to cross
    them out, as it does a wall, and most steps are then one rule at work: a
    square with only as many open edges left as it still needs lines takes a line
    on each of them.

    On Normal boards a step sometimes looks at what a line would do, drawing it
    thin. A square with no line and three open edges left takes lines on two of
    them, and takes the third if lines on the other two would break the board:
    leave a square a dead end or cut off, or close a loop too soon.
name: Skeleton
family: lines
sizes:
  # At most 400 squares, each side even.
  w: { min: 4, max: 100 }
  h: { min: 4, max: 100 }
space:
  grid: { w: "w", h: "h" }
  edges: true
  units: []
answer:
  # The edge between two squares side by side: 1 a line, 2 none.
  value:
    sort: edge
    domain: "range(1, 2)"
define:
  # The lines square c has.
  lines(c): "count(y in adj4(c) where value(edge(c, y)) = 1)"
  # The squares the lines join to square c.
  piece(c): "through(c, {e in edges where value(e) = 1})"
  # Whether the edge between a and b may still take a line: neither has its
  # two lines, and a line there would not close a loop short of every
  # square. A player sees each at a glance, so such an edge counts as
  # closed, and no technique crosses it out.
  live(a, b): >-
    not known(edge(a, b)) and lines(a) < 2 and lines(b) < 2
    and (b not in piece(a) or |piece(a)| = w * h)
  # The edges square c may still take a line on.
  ways(c): "{y in adj4(c) where live(c, y)}"
  # Whether square c is left short of its two lines: too few edges left for
  # them.
  stuck(c): "lines(c) < 2 and lines(c) + |ways(c)| < 2"
  # Whether a square near the piece through a, where lines were just tried
  # on the edges of a, b and d, is left short: a square whose lines the
  # trial changed, an end of the piece, or one beside either.
  shortNear(a, b, d): >-
    exists t in piece(a) where t = a or t = b or t = d or lines(t) < 2:
    stuck(t) or (exists s in adj4(t): stuck(s))
  # Whether lines on both edges between square c and squares i and j, two
  # of its own, would break the board at once: close a loop short of every
  # square, or leave a square short.
  bothBreak(c, i, j): >-
    (j in piece(i) and |piece(i)| + 1 < w * h)
    or (with place(edge(c, i), 1): with place(edge(c, j), 1): shortNear(c, i, j))
shape:
  # Every square has two lines, one in and one out.
  - "forall c in cells: lines(c) = 2"
rules:
  # The lines are one loop: every square reaches every other along them.
  loop: >-
    forall R = {e in edges where value(e) = 1}, a in cells, b in cells:
    b in through(a, R)
clues:
  # A wall between two squares, which no line crosses.
  wall: { at: edge, value: "range(1, 1)", means: "value(at) = 2" }
freedom: { kind: fill }
deal:
  answer: a loop through every square, its 2 × 2 blocks joined along a random spanning tree
  wall: >-
    every edge off the loop, then walls taken away in a random order while
    the ladder still finishes the board at the tier
  tier: one of the tiers
tiers: [Easy, Normal]
techniques:
  # A square with only as many edges left as it still needs lines takes a
  # line on each. One with more lines than two, or fewer edges left than it
  # needs, makes the marks inconsistent.
  - id: forced
    tier: Easy
    for: >-
      c in cells, n = 2 - lines(c), U = ways(c)
      where n < 0 or (n > 0 and |U| <= n)
    conclude: "n >= 0 and |U| = n and (forall y in U: place(edge(c, y), 1))"
    # The hint outlines the square and says how many lines it still needs; it
    # reads the squares round it.
    says:
      terms: { c: "c", need: "n" }
      marks: { outline: "{c}", reads: "{c} + adj4(c)" }
  # A square with no line and three edges left, where lines on two of them
  # would break the board: the third takes a line. Each of the three is
  # asked to be open still, since a solve places the line of one binding
  # before it reads the next.
  - id: pairBreaks
    tier: Normal
    for: >-
      c in cells where lines(c) = 0, U = ways(c) where |U| = 3,
      k in U, I = U - {k}, i = nth(I, 0), j = nth(I, 1)
      where not known(edge(c, k)) and not known(edge(c, i))
      and not known(edge(c, j)) and bothBreak(c, i, j)
    conclude: "place(edge(c, k), 1)"
    # The hint draws thin the two edges tried; it reads the squares they run
    # between.
    says:
      terms: { c: "c", first: "edge(c, i)", second: "edge(c, j)" }
      marks: { reads: "{c} + {i} + {j}" }
