# A defect planted in each of the techniques the library states, keyed by its
# id: the statement with a condition loosened, or a quantity read too finely,
# which the soundness checks under research/technique-check must find unsound.

techniques:
  placed:
    conclude: "forall p in cells(col(c)): strike(p, value(c))"
  hiddenSingle:
    for: >-
      u in units, placed = set(value(c) over c in cells(u) where known(c)), d in
      domain - placed, n = count(c in cells(u) where d in cand(c)) where n < 3
    conclude: n >= 1 and place(first({c in cells(u) where d in cand(c)}), d)
  single:
    for: L in cols, c in cells(L) where not known(c) and |cand(c)| < 3
    conclude: place(c, first(cand(c)))
  set:
    conclude: >-
      (|T| > 0 or (forall c in cells(u): |cand(c)| > 0)) and |S| >= |V| - |T|
      and (forall c in open where c not in S, d in V - T where d in cand(c):
      strike(c, d))
    for: >-
      u in units, V = domain - set(value(c) over c in cells(u) where known(c)),
      open = {c in cells(u) where not known(c)}, T in subsets(V) where |T| = 0
      or (2 <= |T| and |T| <= |V| - 2), S = {c in open where not (exists d in T:
      d in cand(c))} where |S| >= |V| - |T| - 1
  fish:
    for: >-
      d in domain, X0 = {L in cols where not (exists c in cells(L): value(c) =
      d)}, Y0 = range(0, h - 1) - set(y(c) over c in cells where value(c) = d),
      T in subsets(Y0) where |T| = 0 or (2 <= |T| and |T| <= |X0| - 2), X = {L
      in X0 where not (exists c in cells(L): y(c) in T and d in cand(c))} where
      |X| >= |X0| - |T| - 1
    conclude: >-
      (|T| > 0 or (forall L in cols: exists c in cells(L): d in cand(c))) and
      (forall L in X0 - X, c in cells(L) where y(c) in Y0 - T and d in cand(c):
      strike(c, d))
  wing:
    for: >-
      m in cells where not known(m), x in domain, R = cand(m) - {x} where |R| >=
      1 and (forall a in R: exists k in peers(m): not known(k) and cand(k) = {a,
      x}), k0 in peers(m) where not known(k0) and cand(k0) = {min(a in R), x}, t
      in peers(k0) where t != m and not known(t) and x in cand(t) and (forall a
      in R: exists k in peers(m): not known(k) and cand(k) = {a, x} and k != t
      and k in peers(t)), E = set(first({k in peers(m) where not known(k) and
      cand(k) = {a, x} and k != t and k in peers(t)}) over a in R)
# A second defect in each technique that reads how many times a value
# appears: the technique reading it as once, which must come out unsound
# where a value repeats.
once:
  # A repeated value's placed copies not counted among its places.
  hiddenSingle:
    for: >-
      u in units, placed = set(value(c) over c in cells(u) where known(c) and
      times(value(c)) = 1), d in domain - placed, n = count(c in cells(u) where
      d in cand(c) and not known(c)) where n <= times(d)
  # The repeated value's surplus copies not counted.
  set:
    for: >-
      u in units, V = domain - set(value(c) over c in cells(u) where known(c)
      and times(value(c)) = 1), open = {c in cells(u) where not known(c)}, R =
      {d in V where times(d) > 1}, extra = |open| - |V|, T in subsets(V) where
      |T| = 0 or (2 <= |T| and |T| <= |V| - 2), S = {c in open where not (exists
      d in T: d in cand(c))} where |S| >= |V| - |T|
    conclude: >-
      (|T| > 0 or (forall c in cells(u): |cand(c)| > 0)) and |S| = |V| - |T| and
      (forall c in open where c not in S, d in V - T where d in cand(c):
      strike(c, d))
  # A repeated value's columns counted as lines, not copies.
  fish:
    for: >-
      d in domain, k = times(d), X0 = {L in cols where not (exists c in
      cells(L): value(c) = d) or (k > 1 and count(c in cells(L) where value(c) =
      d) < k)}, Y0 = range(0, h - 1) - set(y(c) over c in cells where value(c) =
      d and (k = 1 or count(p in cells(row(c)) where value(p) = d) >= k)), T in
      subsets(Y0) where |T| = 0 or (2 <= |T| and |T| <= |X0| - 2), X = {L in X0
      where not (exists c in cells(L): y(c) in T and d in cand(c) and (k = 1 or
      not known(c)))} where |X| >= |X0| - |T|
    conclude: >-
      (|T| > 0 or (forall L in cols: exists c in cells(L): d in cand(c))) and
      |X| = |X0| - |T| and (forall L in X0 - X, c in cells(L) where y(c) in Y0 -
      T and d in cand(c) and (k = 1 or not known(c)): strike(c, d))
  # The repeated value weighed as x.
  wing:
    for: >-
      m in cells where not known(m), x in domain, R = cand(m) - {x} where |R| >=
      1 and (forall a in R: exists k in peers(m): not known(k) and cand(k) = {a,
      x}), k0 in peers(m) where not known(k0) and cand(k0) = {min(a in R), x}, t
      in peers(k0) where t != m and not known(t) and x in cand(t) and (x not in
      cand(m) or t in peers(m)) and (forall a in R: exists k in peers(m): not
      known(k) and cand(k) = {a, x} and k != t and k in peers(t)), E =
      set(first({k in peers(m) where not known(k) and cand(k) = {a, x} and k !=
      t and k in peers(t)}) over a in R)
