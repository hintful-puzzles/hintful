# yaml-language-server: $schema=../../../../describe/description.schema.json

# A fixture, not a game: a Latin square with, where some four squares meet,
# what each diagonal pair through that corner makes, for the fill engine's
# tests of a clue at a corner (dealt from the answer, written in the desc a
# code a corner between runs of corners without one, drawn on a disc where
# its squares meet, red where it breaks, printed in the text) on a
# description that names no game. The sum, difference and same never meet at
# one corner: two pairs of a Latin square that add alike can take nothing
# else alike. Parity meets each, so a corner deals the first kind that holds
# of those its letters switch on.
game: cornering
produces: latin
sizes:
  w: { min: 3, max: 6 }
space:
  grid: { w: "w", h: "w" }
  corners: true
  units: [rows, cols]
answer:
  value: { sort: cell, domain: "range(1, w)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, w)" }
define:
  # Values d and e diagonally across corner k make its clue.
  makes(k, d, e): >-
    (clue(sum, k) = none or d + e = clue(sum, k))
    and (clue(difference, k) = none or abs(d - e) = clue(difference, k))
    and (clue(same, k) = none or d = e)
shape:
  - "latin(value, lines)"
clues:
  sum:
    at: corner
    value: "range(2, 2 * w)"
    means: "forall c in cells(at): value(c) + value(across(at, c)) = v"
  difference:
    at: corner
    value: "range(1, w - 1)"
    means: "forall c in cells(at): abs(value(c) - value(across(at, c))) = v"
  same:
    at: corner
    value: "range(0, 0)"
    means: "forall c in cells(at): value(c) = value(across(at, c))"
  parity:
    at: corner
    value: "range(0, 1)"
    means: "forall c in cells(at): value(c) mod 2 = v"
freedom: { kind: fill }
play:
  numbers: {}
  signs: { sum: "+", difference: "−", same: "=", parity: [E, O] }
  hintNotes: implicit
  boards: [4x4, 5x5]
  hintMarks:
    ring: the square the step decides.
    strike: the notes the step crosses out.
    outline: the two squares a corner's clue joins.
    stripes: the line the step is about.
deal:
  answer: a Latin square
  given: every square's number, then each hidden while the board still finishes
  sum: every corner's clue, then each hidden while the board still finishes
  tier: one of the tiers
  sample: { latin: true }
  hide: { given: { first: true }, sum, difference, same, parity }
  oneKind: { kinds: [sum, difference, same, parity], pick: first }
settings:
  clueTypes:
    kind: set
    after: tier
    members:
      - { letter: A, kind: sum, kw: sum-clues, name: Sum clues, doc: Allows sum clues to appear., word: sum }
      - { letter: S, kind: difference, kw: difference-clues, name: Difference clues, doc: Allows difference clues to appear., word: difference }
      - { letter: E, kind: same, kw: same-clues, name: Same clues, doc: Allows same clues to appear., word: same }
      - { letter: O, kind: parity, kw: parity-clues, name: Parity clues, doc: Allows E and O clues to appear., word: parity }
# Upstream Mathrax's: the givens a digit each between runs of squares
# without one, then a comma and a code a corner, `S0` the same's, `E` and `O`
# the parities'.
id:
  - { digits: given }
  - codes: { A: sum, S: difference, S0: "same 0", E: "parity 0", O: "parity 1" }
    before: ","
    always: true
tiers: [Easy, Normal]
names:
  dup: "a placed number's row and column"
  single: "the only number left in a square"
  regionsFull: "every other number already placed"
  hiddenSingle: "the only square left for a number"
  pair: "what a corner's clue allows"
  parity: "what a corner's parity allows"
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  # Square by square, each corner of it with a parity: a note of the other
  # parity is struck.
  - id: parity
    tier: Easy
    for: "c in cells, k in corners(c) where clue(parity, k) != none"
    conclude: "forall d in cand(c) where d mod 2 != clue(parity, k): strike(c, d)"
    says:
      terms:
        at: c
        parity: "clue(parity, k)"
      marks:
        outline: "{x in cells(k)}"
      wordings:
        - when: "clue(parity, k) = 0"
          look: "{outline: The E clue} means all four numbers round it are even"
        - when: "true"
          look: "{outline: The O clue} means all four numbers round it are odd"
  - { use: latin.hiddenSingle, tier: Easy, rung: hiddenSingle }
  - { use: latin.single, tier: Easy, rung: single }
  # Square by square, each corner of it with a clue: a note nothing open
  # across the corner makes the clue with is struck.
  - id: pair
    tier: Normal
    for: >-
      c in cells, k in corners(c), o = across(k, c)
      where clue(sum, k) != none or clue(difference, k) != none or clue(same, k) != none
    conclude: "forall d in cand(c) where not (exists e in cand(o): makes(k, d, e)): strike(c, d)"
    says:
      terms:
        at: c
        sum: "clue(sum, k)"
        difference: "clue(difference, k)"
      marks:
        outline: "{c, o}"
      wordings:
        - when: "clue(sum, k) != none"
          look: "Nothing open across {outline: the {numeral sum}+ clue} adds with {struckOr} to make {numeral sum}"
        - when: "clue(difference, k) != none"
          look: "Nothing open across {outline: the {numeral difference}− clue} is {numeral difference} away from {struckOr}"
        - when: "true"
          look: "Nothing open across {outline: the = clue} matches {struckOr}"
