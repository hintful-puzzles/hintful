# yaml-language-server: $schema=../../../../describe/description.schema.json

# A fixture, not a game: a 4x4 board in 2x2 blocks, each row, column and
# block holding 1 to 4, with a rule the player switches on that adds the two
# diagonals, and areas of four squares grown at random that also hold no
# number twice, for the fill engine's tests of the walk of notes over any
# unit (a block, a diagonal) beside a partition a rule holds distinct, on a
# description that names no game.
game: boxing
produces: latin
sizes:
  w: { min: 4, max: 4 }
space:
  grid: { w: "w", h: "w" }
  regions: { box: "blocks(2, 2)", area: dealt }
  # The blocks first, as Solo lists them: a single is named by the first
  # unit it is read in.
  units: [box, rows, cols]
answer:
  value: { sort: cell, domain: "range(1, w)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, w)" }
shape:
  - "latin(value, units)"
  - "forall r in area: distinct(value(c) over c in cells(r))"
variations:
  # The diagonals are units, after the rest.
  X:
    add:
      space: { diagonals: true, units: [diagonals] }
freedom: { kind: fill }
play:
  numbers: {}
  boards: [4x4]
  variants: [{ board: 4x4, with: [X], tier: Easy }]
  modifiers:
    X:
      letter: x
      kw: diagonals
      name: Diagonals
      words: X
      rule: each of the two diagonals holds every number once too.
  hintMarks:
    ring: the square the step decides.
    strike: the notes the step crosses out.
    outline: the squares the step reasons from.
    stripes: the row, column, block, diagonal or area the step is about.
deal:
  areas: the partition, connected areas of four squares
  answer: searched under the areas
  given: every square's number, then each hidden while the board still finishes
  tier: one of the tiers
  divide: { partition: area, sizes: [[4]] }
  sample: { search: true }
  hide: given
id:
  - walls: area
  - { digits: given, before: "," }
# A 4x4 board this bound needs no more than its singles, so one tier.
tiers: [Easy]
names:
  dup: "a placed number's row, column, block and area"
  single: "the only number left in a square"
  regionsFull: "every other number already placed"
  hiddenSingle: "the only square left for a number"
  set: "numbers already accounted for"
# The walk's words for how far a placed number reaches: its row, column,
# block and area, and with X on its diagonals.
steps:
  clean:
    ring: cell
    terms: { X: flag }
    wordings:
      - when: X
        move: "any number already in its square's row, column, block, diagonal or area"
      - move: "any number already in its square's row, column, block or area"
  note:
    ring: cell
    terms: { X: flag, vs: values, unruled: flag }
    wordings:
      - when: unruled
        look: "No number stands in {ring}'s row, column, block or area yet"
        move: "pencil in every one"
      - when: X
        look: >-
          Only {vs} {vs: isn't | aren't} already in {ring}'s row, column, block,
          diagonal or area
        move: "pencil {vs: it | them} in"
      - look: "Only {vs} {vs: isn't | aren't} already in {ring}'s row, column, block or area"
        move: "pencil {vs: it | them} in"
  cull:
    ring: cell
    terms: { X: flag, n: number }
    wordings:
      - when: X
        move: "row, column, block, diagonal or area"
      - move: "row, column, block or area"
  regionsFull:
    ring: cell
    terms: { X: flag, n: number }
    wordings:
      - when: X
        look: >-
          Every other number is already in {ring}'s row, column, block,
          diagonal or area
        move: "it can only be {n}"
      - look: "Every other number is already in {ring}'s row, column, block or area"
        move: "it can only be {n}"
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  # A placed number leaves the rest of its area.
  - kind: peer.placed
    as: areaCull
    tier: Easy
    rung: dup
    with:
      peer: "p in cells where p != c and area(p) = area(c)"
  - { use: latin.hiddenSingle, tier: Easy, rung: hiddenSingle }
  - { use: latin.single, tier: Easy, rung: single }
  - { use: latin.set, tier: Easy, rung: set }
