# yaml-language-server: $schema=../../../../describe/description.schema.json

# A fixture, not a game: ghosts and zombies among mirrors, a number beyond
# each end of every row and column counting the zombies its sightline passes,
# and a count at the board of how many of each the board holds, for the fill
# engine's tests of values only the deal places on a board of numbers (the
# mirrors, drawn by their painters whatever the player's preference, typed by
# no key and noted by no note), and of an ID written as upstream undead.c's:
# the counts, then the grid's mirrors and given monsters between runs of
# empty squares, then the numbers going round the grid clockwise from the top
# left; and of upstream undead.c's deal: mirrors laid first a square at a
# time, either way, and kept where no sightline is long, sightlines filled
# so their numbers single them out, a board kept by its counts, and a tier
# bounding how often a rung fires; on a description that names no game.
game: sighting
produces: numbers
sizes:
  w: { min: 2, max: 6 }
  h: { min: 2, max: 6 }
space:
  grid: { w: "w", h: "h" }
  slots: true
  units: []
answer:
  # 1 is a ghost, 2 a zombie, and 3 a mirror `\` and 4 a mirror `/`, which
  # hold neither.
  value:
    sort: cell
    domain: "{d in range(1, 4) where (clue(mirror, c) < 0 and d < 3) or d = clue(mirror, c) + 2}"
given: [value]
define:
  # How many of monster d the board holds, and the most squares a sightline
  # passes.
  holds(d): "sum(k in clues(total) where item(k) = d of many(k))"
  longest: "max(s in slots of |sight(s, mirror)|)"
marks:
  cand: { sort: cell, notation: "set of range(1, 4)" }
clues:
  # A mirror, `\` (1) or `/` (2), which only a game ID carries.
  mirror:
    at: cell
    value: "range(1, 2)"
    means: "value(at) = v + 2"
  # A number beyond a row's or a column's end: how many zombies its
  # sightline passes.
  sees:
    at: slot
    value: "range(0, 2 * |cells|)"
    means: "count(x in sight(at, mirror) where value(x) = 2) = v"
  # How many of each monster the board holds.
  total:
    at: board
    fields:
      item: { value: "range(1, 2)" }
      many: { value: "range(0, |cells|)" }
    means: "count(c in cells where value(c) = item(k)) = many(k)"
freedom: { kind: fill }
play:
  numbers:
    letters: GZ
    pictures:
      paint: { 1: ghost, 2: zombie }
      names: { 1: ghost, 2: zombie }
      pref: { kw: monsters, name: Monster representation }
  given:
    3: { glyph: " \\ ", paint: fall }
    4: { glyph: " / ", paint: rise }
  counts: { total: item }
  boards: [4x4]
  hintMarks:
    ring: the square the step decides.
    strike: the notes the step crosses out.
    stripes: the sightline the step is about.
deal:
  mirror: a square in five at random, either way, until a sightline is short
  answer: >-
    sightlines whose numbers single out their monsters, shortest first, then
    a random monster on a random empty square and every square the ladder
    decides from them
  given: every square's monster, then each hidden while the board still finishes
  sees: every number
  total: every count, as many zombies as ghosts or more
  tier: one of the tiers
  sample:
    first:
      value: [3, 4]
      chance: 0.2
      within: { min: 0.1, max: 0.5 }
      keep: "longest <= w + 1"
    sightlines: { through: mirror, ends: sees, open: "n / 3" }
    build: true
  # A keep that half the boards fail, so a deal that skipped it shows.
  keep: "holds(2) >= holds(1) and holds(1) > 0"
  hide: given
  never: { given: [3, 4] }
# Upstream undead.c's: the counts, the grid (`L` a mirror `\`, `R` one `/`,
# `G` and `Z` a given monster, a run of empty squares a letter from a to z),
# and each number round the grid clockwise from the top left.
id:
  - numbers: total
  - codes: { L: mirror 1, R: mirror 2, G: given 1, Z: given 2 }
    before: ","
    always: true
  - numbers: sees
    before: ","
    sides: [top, right, bottom backwards, left backwards]
tiers: [Easy, Normal]
names:
  none: "a sightline passing no zombie"
  single: "the only monster left in a square"
techniques:
  # A sightline passing no zombie holds none. An Easy board needs one pass of
  # it at most, as it always does.
  - id: none
    tier: Easy
    most: 1
    for: >-
      s in slots where clue(sees, s) = 0,
      X = {x in sight(s, mirror) where 2 in cand(x) and |cand(x)| > 1}
      where |X| > 0
    conclude: "forall x in X: strike(x, 2)"
    says:
      terms: { s: s }
      marks: { stripes: "sight(s, mirror)" }
      look: "{stripes: This sightline} passes no zombie"
      move: "{ring: its squares} can hold none"
  - kind: one.cell
    as: single
    tier: Easy
    with:
      square: "true"
      move: "(known(c) or place(c, first(U)))"
# A placed monster rules none out of another square, so the walk's steps
# name no neighbors.
steps:
  clean:
    ring: cell
    move: "nothing, since a monster rules out no other square"
  note:
    ring: cell
    terms: { unruled: flag, vs: values }
    wordings:
      - when: unruled
        look: "Nothing rules out a monster in {ring} yet"
        move: "pencil in every one"
      - look: "Only {vs} {vs: is | are} still possible in {ring}"
        move: "pencil {vs: it | them} in"
  regionsFull:
    ring: cell
    terms: { n: number }
    look: "Every other monster is ruled out in {ring}"
    move: "it can only be {n}"
  cull:
    ring: cell
    terms: { n: number }
    move: "no other square"
