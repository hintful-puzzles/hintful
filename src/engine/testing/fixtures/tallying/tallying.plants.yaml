# A defect planted in each of the fixture's techniques, which the soundness checks
# under research/technique-check must find unsound.

techniques:
  # A square beside a piece read as at its corner.
  corner:
    for: "c in cells where value(c) = 1, x in adj4(c) where not known(x)"
  # A line one short of its piece squares read as having them all.
  full:
    for: "L in lines, O = open(L) where |O| > 0 and clue(n, L) >= 0 and need(L) <= 1"
  # A line read as needing every open square when it needs all but one.
  room:
    for: "L in lines, O = open(L) where |O| > 0 and clue(n, L) >= 0 and need(L) + 1 >= |O|"
