# A defect planted in each of the techniques the description states, keyed by
# its id, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # A line's first fitting number left out of what it allows.
  narrow:
    conclude: >-
      forall d in cand(x) where not (exists k in K - {first(K)}: digit(k, x, L)
      = d): strike(x, d)
  # A number placed in a line it does not fit.
  onlyLine:
    for: >-
      k in clues(numbers) where count(M in lines where fits(k, M)) = 1,
      L in lines where not fits(k, L) and |digits(k)| = |cells(L)|
      and (exists x in cells(L): not known(x))
