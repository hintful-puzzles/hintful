# yaml-language-server: $schema=../../../../describe/description.schema.json

# A fixture, not a game: a Latin square with, beyond some ends of its rows
# and columns, the sum of the two squares nearest that end, for the fill
# engine's tests of a clue at a slot (dealt from the answer, written in the
# desc a slot at a time between slashes and the givens after a comma only
# where there are any, drawn in the margin at both ends of each line, red
# where it breaks, hatched with its line, gray where the player marks it
# done, printed in the text) and of the candidate walk outlining a slot a
# technique names, on a description that names no game.
game: flanking
produces: latin
sizes:
  w: { min: 3, max: 9 }
space:
  grid: { w: "w", h: "w" }
  slots: true
  units: [rows, cols]
answer:
  value: { sort: cell, domain: "range(1, w)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, w)" }
shape:
  - "latin(value, lines)"
clues:
  flank:
    at: slot
    value: "range(3, 2 * w - 1)"
    means: "value(nth(sight(at), 0)) + value(nth(sight(at), 1)) = v"
freedom: { kind: fill }
play:
  numbers: {}
  done: { flank: clue }
  hintNotes: implicit
  boards: [4x4, 5x5]
  hintMarks:
    ring: the square the step decides.
    strike: the notes the step crosses out.
    outline: the clue the step reads, beside the grid.
    stripes: the line the step is about.
deal:
  answer: a Latin square
  given: every square's number, then each hidden while the board still finishes
  flank: every sum, then above Easy each hidden, once no more squares can be, while the board still finishes
  tier: one of the tiers
  sample: { latin: true }
  hide: { given: { first: true }, flank: { from: Normal } }
id:
  - { numbers: flank, between: "/" }
  - { digits: given, apart: "_", before: "," }
tiers: [Easy, Normal]
names:
  dup: "a placed number's row and column"
  single: "the only number left in a square"
  regionsFull: "every other number already placed"
  hiddenSingle: "the only square left for a number"
  flank: "a sum beside the grid"
  flankTight: "a sum only one pair makes"
  rest: "the rest of a sum"
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  # Every sum whose nearest square is known and the next is not: the next
  # holds the rest of the sum. It reads no notes, so a walk of notes offers
  # it before they are set up, and its later squares continue the first.
  - id: rest
    tier: Easy
    for: >-
      P = {k in clues(flank) where known(nth(sight(at(k)), 0))
      and not known(nth(sight(at(k)), 1))}
      where |P| > 0
    conclude: >-
      forall k in P, L = sight(at(k)), near = value(nth(L, 0)):
      place(nth(L, 1), v(k) - near)
    says:
      terms: {}
      marks: {}
      fact:
        terms: { s: "at(k)", v: "v(k)", near: near, n: "v(k) - near" }
        look: "{outline s: Clue {v}} already has {near} in the {noun} nearest it"
        follows: "the next {noun} holds the rest of the sum"
        move: "{ring} must be {n}"
        again: "{outline s: clue {v}} less the {near} nearest it"
  - { use: latin.hiddenSingle, tier: Easy, rung: hiddenSingle }
  - { use: latin.single, tier: Easy, rung: single }
  # Sum by sum, each of the two squares nearest it in turn: a note no note
  # of the other square makes the sum with is struck. Said a number at a
  # time, from both squares; a sum of the two smallest or the two largest
  # numbers is made by one pair alone.
  - id: flank
    tier: Normal
    rung: [flankTight, flank]
    for: "k in clues(flank), s = at(k), v = v(k), L = sight(s)"
    conclude: >-
      forall c in {nth(L, 0), nth(L, 1)}, o = the(q in {nth(L, 0), nth(L, 1)} where q != c),
      d in cand(c) where not (exists e in cand(o): e != d and d + e = v):
      strike(c, d)
    says:
      shown: value
      terms: { s: s, v: v, L: L }
      marks: {}
      arms:
        flankTight:
          when: "v = 3 or v = 2 * w - 1"
          look: >-
            Only one pair of numbers sums to {v} for {outline s: this clue},
            and it holds no {struck}, so none can stand in {ring: these {nouns}}
            of {stripes L: its line}
        flank:
          when: "true"
          look: >-
            No two numbers that sum to {v} for {outline s: this clue} put
            {struckOr} in {ring: these {nouns}} of {stripes L: its line}
