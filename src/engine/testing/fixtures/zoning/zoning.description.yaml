# yaml-language-server: $schema=../../../../describe/description.schema.json

# A fixture, not a game: a board in areas, each holding the numbers 1 to its
# size, two equal numbers never side by side, some squares given, for the
# fill engine's tests of a partition dealt to drawn sizes before the answer
# and the answer searched under it, on a description that names no game.
game: zoning
produces: numbers
sizes:
  w: { min: 3, max: 12 }
  h: { min: 3, max: 12 }
  # Which squares keep equal numbers apart: 0 those side by side, 1 those
  # at a corner too.
  mode: { min: 0, max: 1 }
space:
  grid: { w: "w", h: "h" }
  regions: { area: dealt }
  units: []
answer:
  # An area of N squares holds the numbers 1 to N.
  value: { sort: cell, domain: "range(1, |cells(area(c))|)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, |cells(area(c))|)" }
define:
  # Whether p keeps an equal number from c: beside it, or with `mode` 1 at
  # a corner too.
  apart(c, p): "p in adj4(c) or (mode = 1 and p in adj8(c))"
shape:
  - "forall r in area: distinct(value(c) over c in cells(r))"
  - "forall c in cells, p in adj8(c) where apart(c, p): value(p) != value(c)"
freedom: { kind: fill }
play:
  numbers: {}
  boards: [4x4, 5x5, 5x5D]
  hintMarks:
    ring: the square the step decides.
    outline: the squares the step reasons from.
    stripes: the area the step is about.
deal:
  areas: the partition, connected areas of a size drawn from a list
  answer: searched under the areas
  given: every square's number, then each hidden while the board still finishes
  tier: one of the tiers
  # Areas of up to four, or with corners apart, of four or five.
  divide: { partition: area, by: mode, sizes: [[2, 3, 4, 4], [4, 5]] }
  sample: { search: true }
  hide: given
settings:
  # The second ruleset is written as its bare code, the first as nothing
  # (Seismic's Tectonic `T`).
  mode:
    kind: choice
    gives: size
    choices:
      - name: Sides
        code: ""
        rule: Two equal numbers may not be side by side.
      - name: Corners
        code: D
        rule: Two equal numbers may not touch, even at a corner.
id:
  - walls: area
  - { digits: given, before: "," }
tiers: [Easy, Normal]
names:
  dup: "a placed number's area and neighbors"
  single: "the only number left in a square"
  regionsFull: "every other number placed nearby"
  hiddenSingle: "the only square left for a number"
  starve: "a number an area needs"
# The walk's words for how far a placed number reaches: its area, and the
# squares beside it, or with `mode` 1 touching it.
steps:
  clean:
    ring: cell
    terms: { mode: number }
    wordings:
      - when: mode = 1
        move: "any number already in its square's area or in a square touching it"
      - move: "any number already in its square's area or in a square beside it"
  note:
    ring: cell
    terms: { mode: number, vs: values, unruled: flag }
    wordings:
      - when: unruled
        look: "No number stands in {ring}'s area or near it yet"
        move: "pencil in every one"
      - when: mode = 1
        look: "Only {vs} {vs: isn't | aren't} already in {ring}'s area or a square touching it"
        move: "pencil {vs: it | them} in"
      - look: "Only {vs} {vs: isn't | aren't} already in {ring}'s area or a square beside it"
        move: "pencil {vs: it | them} in"
  cull:
    ring: cell
    terms: { mode: number, n: number }
    wordings:
      - when: mode = 1
        move: "area or the squares touching it"
      - move: "area or the squares beside it"
  regionsFull:
    ring: cell
    terms: { mode: number, n: number }
    wordings:
      - when: mode = 1
        look: "Every other number is already in {ring}'s area or a square touching it"
        move: "it can only be {n}"
      - look: "Every other number is already in {ring}'s area or a square beside it"
        move: "it can only be {n}"
techniques:
  # A placed number leaves the rest of its area and the squares it keeps
  # apart.
  - kind: peer.placed
    as: cull
    tier: Easy
    with:
      peer: "p in cells where p != c and (area(p) = area(c) or apart(c, p))"
  # A square down to one number holds it.
  - kind: one.cell
    as: lone
    tier: Easy
    rung: single
  # A number with one place left in its area goes there.
  - kind: one.place
    as: areaSingle
    tier: Easy
    rung: hiddenSingle
    with:
      group: "r in area, n in range(1, |cells(r)|) where not (exists c in cells(r): value(c) = n)"
      set: cells(r)
      value: n
  # Every place an area has left for its n keeps an n from a square outside
  # it, so that square cannot hold n: an n there would leave the area none.
  - id: starve
    tier: Normal
    for: >-
      r in area, n in range(1, |cells(r)|) where not (exists c in cells(r): value(c) = n),
      H = {h in cells(r) where not known(h) and n in cand(h)} where |H| > 0
    conclude: >-
      forall c in cells where area(c) != r and not known(c) and n in cand(c)
      and (forall h in H: apart(c, h)): strike(c, n)
    says:
      terms: { n: n, corners: "mode = 1" }
      # The area's notes are where it can put its n: the premise.
      marks: { stripes: "cells(r)", reads: "cells(r)" }
      look: >-
        Every square {stripes: this area} has left for its {n} is {if corners:
        touching | beside} {ring}
