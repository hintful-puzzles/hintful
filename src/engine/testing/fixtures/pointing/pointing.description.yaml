# yaml-language-server: $schema=../../../../describe/description.schema.json

# A fixture, not a game: a Latin square of the four arrows, some of its
# squares given, for the fill engine's tests of a board of numbers drawn as
# pieces that point (`numbers.pictures` naming arrows, and no preference):
# each value placed as its arrow, in ink where given, and noted small, in
# pencil, on the side of its square it points to; always pictures, `A`
# switching nothing; on a description that names no game.
game: pointing
produces: latin
sizes:
  w: { min: 4, max: 4 }
space:
  grid: { w: "w", h: "w" }
  units: [rows, cols]
answer:
  # 1 up, 2 down, 3 left, 4 right.
  value: { sort: cell, domain: "range(1, 4)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, 4)" }
shape:
  - "latin(value, lines)"
freedom: { kind: fill }
play:
  numbers:
    pictures:
      paint: { 1: arrowUp, 2: arrowDown, 3: arrowLeft, 4: arrowRight }
      names: { 1: up, 2: down, 3: left, 4: right }
  boards: [4x4]
  hintMarks:
    ring: the square the step decides.
    strike: the notes the step crosses out.
    outline: the squares the step reasons from.
    stripes: the line the step is about.
deal:
  answer: a Latin square
  given: every square's arrow, then each hidden while the board still finishes
  tier: the one tier
  sample: { latin: true }
  hide: given
id:
  - { digits: given }
tiers: [Easy]
names:
  dup: "a placed arrow's row and column"
  single: "the only arrow left in a square"
  hiddenSingle: "the only square left for an arrow"
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  - { use: latin.hiddenSingle, tier: Easy, rung: hiddenSingle }
  - { use: latin.single, tier: Easy, rung: single }
