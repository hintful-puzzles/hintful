# yaml-language-server: $schema=../../../../describe/description.schema.json

# A fixture, not a game: a board of the letters A to the `k`-th, `k` a size
# the params give, no two alike side by side, with a number beside each row
# and column for each letter saying how many of it the line holds; no unit
# holds a value once, so a placed letter reaches only as far as its
# technique strikes. For the fill engine's tests of a size that is a number,
# a clue one a value derived, written and read, an answer built on no clue,
# the walk of notes on a board with no unit, and values drawn, typed and
# said as letters, on a description that names no game.
game: counting
produces: numbers
words:
  value: letter
sizes:
  w: { min: 2, max: 6 }
  h: { min: 2, max: 6 }
  k: { min: 2, max: 4 }
space:
  grid: { w: "w", h: "h" }
  units: []
answer:
  value: { sort: cell, domain: "range(1, k)" }
marks:
  cand: { sort: cell, notation: "set of range(1, k)" }
define:
  holds(L, d): "count(c in cells(L) where value(c) = d)"
shape:
  - "forall c in cells, p in adj4(c): value(p) != value(c)"
clues:
  # How many of value `per` a row or column holds.
  count:
    at: line
    per: value
    value: "range(0, |cells(at)|)"
    means: "holds(at, per) = v"
freedom: { kind: fill }
play:
  numbers: { letters: true }
  done: { count: number }
  cornerCrosses: touchless
  # The second takes the touchless rule, which needs four values.
  boards: [4x4k3, 4x4k4]
  hintMarks:
    ring: the square the step fills in.
    strike: the notes the step crosses out.
    outline: the squares the step reasons from.
    stripes: the row or column the step is about.
deal:
  answer: a letter a square, none beside its twin, built at random
  count: every letter
  tier: the one tier
  sample: { build: true }
  hide: { count: { when: removeClues } }
settings:
  k:
    kind: number
    gives: size
    letter: k
    kw: values
    name: Values
    doc: The letters each square may hold, from A.
    min: 2
    max: 4
    default: 3
    words: "{n} values"
    # The four squares of any 2 by 2 touch each other.
    least: { touchless: 4 }
  touchless:
    kind: flag
    gives: variation
    letter: D
    kw: touchless
    name: No diagonal touching
    words: touchless
    rule: no two alike corner to corner either.
  removeClues:
    kind: flag
    letter: R
    kw: remove-clues
    name: Remove clues
    doc: Hide as many numbers as the board stays unique without.
    words: { on: clues hidden, off: every clue showing }
    # A board of four squares with every number showing is too easy to deal.
    offBounds: { tiers: { Easy: { area: { min: 5 } } } }
variations:
  touchless:
    add:
      shape:
        - "forall c in cells, p in adj8(c): value(p) != value(c)"
      techniques:
        - kind: peer.placed
          as: placedCorner
          tier: Easy
          with:
            peer: "p in adj8(c) where p not in adj4(c) and not known(p)"
id:
  - numbers: count
    hidden: "-"
    closed: true
tiers: [Easy]
names:
  dup: "a placed letter's neighbors"
  single: "the only letter left in a square"
  regionsFull: "every other letter beside it"
  full: "a line with all of a letter"
  room: "a line with just enough room for a letter"
# How far a placed letter reaches, which no unit says: the squares beside
# it.
steps:
  clean:
    ring: cell
    move: "any letter already beside its square"
  note:
    ring: cell
    terms: { vs: values, unruled: flag }
    wordings:
      - when: unruled
        look: "No letter stands beside {ring} yet"
        move: "pencil in every one"
      - look: "Only {vs} {vs: isn't | aren't} already beside {ring}"
        move: "pencil {vs: it | them} in"
  cull:
    ring: cell
    terms: { n: number }
    move: "neighbors"
  regionsFull:
    ring: cell
    terms: { n: number }
    look: "Every other letter is already beside {ring}"
    move: "it can only be {n}"
techniques:
  - kind: peer.placed
    as: placed
    tier: Easy
    with:
      peer: "p in adj4(c) where not known(p)"
  - kind: one.cell
    as: single
    tier: Easy
  # A line holding all of a letter it counts has room for no more. The
  # clue it reads is a term, outlined in the margin.
  - id: full
    tier: Easy
    for: "q in clues(count), L = at(q), d = per(q), v = v(q) where holds(L, d) >= v"
    conclude: "holds(L, d) = v and (forall c in cells(L) where not known(c): strike(c, d))"
    says:
      terms: { L: L, d: d, v: v, q: q }
      marks: { stripes: "cells(L)" }
      look: "{stripes: this {unit}} already holds {outline q: all {numeral v}} of its {d}s"
  # A line with just as many squares left for a letter as it still needs.
  - id: room
    tier: Easy
    for: >-
      L in lines, d in domain, v = clue(count, L, d) where v > holds(L, d),
      O = {c in cells(L) where not known(c) and d in cand(c)}
      where |O| = v - holds(L, d)
    conclude: "forall c in O: place(c, d)"
    says:
      terms: { L: L, d: d }
      marks: { stripes: "cells(L)" }
      look: "{stripes: this {unit}} has just enough squares left for its {d}s"
      move: "{ring} must be {d}"
