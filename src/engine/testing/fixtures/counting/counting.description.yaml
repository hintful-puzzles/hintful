# yaml-language-server: $schema=../../../../describe/description.schema.json

# A fixture, not a game: a board of the numbers 1 to `k`, `k` a size the
# params give, no two alike side by side, with a number beside each row and
# column for each value saying how many of it the line holds; no unit holds
# a value once, so a placed number reaches only as far as its technique
# strikes. For the fill engine's tests of a size that is a number, a clue
# one a value derived, written and read, an answer built on no clue, and the
# walk of notes on a board with no unit, on a description that names no
# game.
game: counting
produces: numbers
sizes:
  w: { min: 2, max: 6 }
  h: { min: 2, max: 6 }
  k: { min: 2, max: 4 }
space:
  grid: { w: "w", h: "h" }
  units: []
answer:
  value: { sort: cell, domain: "range(1, k)" }
marks:
  cand: { sort: cell, notation: "set of range(1, k)" }
define:
  holds(L, d): "count(c in cells(L) where value(c) = d)"
shape:
  - "forall c in cells, p in adj4(c): value(p) != value(c)"
clues:
  # How many of value `per` a row or column holds.
  count:
    at: line
    per: value
    value: "range(0, |cells(at)|)"
    means: "holds(at, per) = v"
freedom: { kind: fill }
play:
  numbers: {}
  boards: [4x4k3]
  hintMarks:
    ring: the square the step fills in.
    strike: the notes the step crosses out.
    outline: the squares the step reasons from.
    stripes: the row or column the step is about.
deal:
  answer: a number a square, none beside its twin, built at random
  count: every number
  tier: the one tier
  sample: { build: true }
settings:
  k:
    kind: number
    gives: size
    letter: k
    kw: values
    name: Values
    doc: The numbers each square may hold, from 1.
    min: 2
    max: 4
    default: 3
    words: "{n} values"
id:
  - numbers: count
    hidden: "-"
    closed: true
tiers: [Easy]
names:
  dup: "a placed number's neighbors"
  single: "the only number left in a square"
  regionsFull: "every other number beside it"
  full: "a line with all of a number"
  room: "a line with just enough room for a number"
# How far a placed number reaches, which no unit says: the squares beside
# it.
steps:
  clean:
    ring: cell
    move: "any number already beside its square"
  note:
    ring: cell
    terms: { vs: values, unruled: flag }
    wordings:
      - when: unruled
        look: "No number stands beside {ring} yet"
        move: "pencil in every one"
      - look: "Only {vs} {vs: isn't | aren't} already beside {ring}"
        move: "pencil {vs: it | them} in"
  cull:
    ring: cell
    terms: { n: number }
    move: "neighbors"
  regionsFull:
    ring: cell
    terms: { n: number }
    look: "Every other number is already beside {ring}"
    move: "it can only be {n}"
techniques:
  - kind: peer.placed
    as: placed
    tier: Easy
    with:
      peer: "p in adj4(c) where not known(p)"
  - kind: one.cell
    as: single
    tier: Easy
  # A line holding all of a number it counts has room for no more.
  - id: full
    tier: Easy
    for: "L in lines, d in domain, v = clue(count, L, d) where v >= 0 and holds(L, d) >= v"
    conclude: "holds(L, d) = v and (forall c in cells(L) where not known(c): strike(c, d))"
    says:
      terms: { L: L, d: d, v: v }
      marks: { stripes: "cells(L)" }
      look: "{stripes: this {unit}} already holds all {numeral v} of its {d}s"
  # A line with just as many squares left for a number as it still needs.
  - id: room
    tier: Easy
    for: >-
      L in lines, d in domain, v = clue(count, L, d) where v > holds(L, d),
      O = {c in cells(L) where not known(c) and d in cand(c)}
      where |O| = v - holds(L, d)
    conclude: "forall c in O: place(c, d)"
    says:
      terms: { L: L, d: d }
      marks: { stripes: "cells(L)" }
      look: "{stripes: this {unit}} has just enough squares left for its {d}s"
      move: "{ring} must be {d}"
