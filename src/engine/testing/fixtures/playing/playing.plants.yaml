# A defect planted in each of the fixture's techniques, which the soundness checks
# under research/technique-check must find unsound.

techniques:
  # A line one short of its number read as already at it.
  lineMet:
    for: "L in lines, O = open(L) where |O| > 0 and need(L) <= 1"
  # A line read as needing every open square when it needs all but one.
  lineFull:
    for: "L in lines, O = open(L) where |O| > 0 and need(L) + 1 >= |O|"
