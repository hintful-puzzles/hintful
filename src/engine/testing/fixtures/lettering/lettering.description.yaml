# yaml-language-server: $schema=../../../../describe/description.schema.json

# A fixture, not a game: a Latin square of letters, some of its squares
# given, its lines labeled by the letter each holds first, for the fill
# engine's tests of an alphabet (`letters`, a string): value 1 drawn as the
# alphabet's first letter, typed by it in either case, the ruleset choosing
# the alphabet and written after the tier by its code alone (Group's `e`
# first, or plain under `i`), on a description that names no game.
game: lettering
produces: latin
sizes:
  w: { min: 3, max: 9 }
  # 0 the first letter `e`, 1 the letters in order.
  plain: { min: 0, max: 1 }
space:
  grid: { w: "w", h: "w" }
  units: [rows, cols]
answer:
  value: { sort: cell, domain: "range(1, w)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, w)" }
shape:
  - "latin(value, lines)"
freedom: { kind: fill }
play:
  numbers: {}
  labels: { start: "i + 1", glyph: true }
  boards: [4x4, 4x4i]
  hintMarks:
    ring: the square the step decides.
    strike: the notes the step crosses out.
    outline: the squares the step reasons from.
    stripes: the line the step is about.
deal:
  answer: a Latin square
  given: every square's letter, then each hidden while the board still finishes
  tier: the one tier
  sample: { latin: true }
  hide: given
settings:
  plain:
    kind: choice
    gives: size
    after: tier
    choices:
      - name: E first
        code: ""
        letters: eabcdfghijklmnopqrstuvwxyz
      - name: In order
        code: i
        letters: abcdefghijklmnopqrstuvwxyz
id:
  - digits: given
    apart: _
tiers: [Easy]
names:
  dup: "a placed letter's row and column"
  single: "the only letter left in a square"
  hiddenSingle: "the only square left for a letter"
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  - { use: latin.hiddenSingle, tier: Easy, rung: hiddenSingle }
  - { use: latin.single, tier: Easy, rung: single }
