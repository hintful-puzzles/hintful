# yaml-language-server: $schema=../../../../describe/description.schema.json

# A fixture, not a game: the four sets of two letters, each placed once on a
# 2x2 board, with a horseshoe between two squares side by side wherever one's
# set holds the other's, and every one there is shown. For the fill engine's
# tests of a horseshoe drawn in a gap (`paint: shoe`), on a description that
# names no game.
game: holding
produces: latin
sizes: {}
space:
  grid: { w: "2", h: "2" }
  edges: true
  units: []
answer:
  # A set, one more than the number its letters add up to, A as 1 and B as
  # 2, since the marks hold no value 0.
  value: { sort: cell, domain: "range(1, 4)" }
given: [value]
# The sets a square can still hold, every one from the deal.
marks:
  cand: { sort: cell, notation: "set of range(1, 4)", full: true }
define:
  letters(d): "bits(d - 1)"
  holds(x, y): "x != y and letters(y) subset letters(x)"
shape:
  - "distinct(value(c) over c in cells)"
clues:
  # 1 where the first square's set holds the second's, 2 the other way, and
  # 0 where neither holds the other.
  shoe:
    at: edge
    value: "range(0, 2)"
    complete: true
    means: >-
      (v = 1) = holds(value(end1(at)), value(end2(at)))
      and (v = 2) = holds(value(end2(at)), value(end1(at)))
freedom: { kind: fill }
play:
  # A set drawn as its letters, A in the first slot and B in the second.
  numbers: { features: { of: "letters(d)", names: AB } }
  # Every set beneath the board, gray once placed.
  band: true
  gaps: { shoe: shoe }
  boards: [2x2]
  hintMarks:
    ring: the square the step decides.
    outline: the squares the step reasons from.
deal:
  answer: every set in a square, shuffled
  shoe: every edge's, read off the answer
  value: every set, then as many hidden as the board still finishes
  tier: the one tier
  sample: { once: true }
  hide: given
# Upstream subsets.c's: a square's set counted from 0, `_` where it is
# hidden, then the letters of the horseshoes open at it, a comma between two.
id:
  - { records: given, sides: shoe, hidden: _, from: 0, closed: false }
tiers: [Easy]
names:
  placed: "a set already placed"
  lone: "the only set left for a square"
  noShoe: "no empty or full set by a gap"
  smaller: "room for a smaller set inside"
# A board loads only where deduction solves it, so it has the steps that
# solve the boards its tests load. A placed set strikes itself, the notes
# being full, so the hint's steps are `noShoe`'s strikes and the singles.
techniques:
  # Neither of two squares side by side with no horseshoe between them holds
  # the empty set, which every set holds, or {A, B}, which holds every set.
  - id: noShoe
    tier: Easy
    for: "e in edges where clue(shoe, e) = 0, c in ends(e)"
    conclude: >-
      forall d in cand(c) where |letters(d)| = 0 or |letters(d)| = 2:
      strike(c, d)
    says:
      marks: { outline: "{other(e, c)}" }
      look: >-
        With no horseshoe to {outline: its neighbor}, neither set lies inside
        the other
  # The open end of a horseshoe holds a set only where the closed end can
  # hold a smaller one inside it.
  - kind: rel.support
    as: smaller
    tier: Easy
    says:
      marks: { outline: "{b}" }
      look: >-
        {ring}'s set must hold a smaller one {outline: its neighbor} can
        still hold
    with:
      group: >-
        e in edges, a in ends(e) where (clue(shoe, e) = 1 and a = end1(e))
        or (clue(shoe, e) = 2 and a = end2(e)), b = other(e, a)
      end: a
      partner: b
      rel: "holds(d, u)"
      marks: {}
  - kind: peer.placed
    as: placed
    tier: Easy
    with:
      peer: "p in cells where p != c and not known(p)"
  - kind: one.cell
    as: lone
    tier: Easy
