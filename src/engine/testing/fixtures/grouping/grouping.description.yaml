# yaml-language-server: $schema=../../../../describe/description.schema.json

# A fixture, not a game: a group's table of letters, row a, column b holding
# a·b, for the fill engine's tests of an answer drawn from shipped data
# (`deal.sample.group`): a group of the board's order from its generators,
# its elements permuted, the identity kept first as `e` and its row and
# column kept given (the hide's `keep`), or under `i` permuted with the
# rest, its lines and another element's dealt no given, and the hide from
# the lowest tier the ruleset takes.
game: grouping
produces: latin
sizes:
  w: { min: 3, max: 6 }
  # 0 the identity shown, first as `e`; 1 hidden, the letters in order.
  plain: { min: 0, max: 1 }
space:
  grid: { w: "w", h: "w" }
  units: [rows, cols]
answer:
  value: { sort: cell, domain: "range(1, w)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, w)" }
define:
  mul(a, b): "cell(b - 1, a - 1)"
  left(c): "y(c) + 1"
  right(c): "x(c) + 1"
shape:
  - "latin(value, lines)"
rules:
  associative: >-
    forall a in domain, b in domain, c in domain:
    value(mul(value(mul(a, b)), c)) = value(mul(a, value(mul(b, c))))
# A failed product drawn as its triple on its two sides, as upstream's Group.
breaches:
  associative:
    - { at: "mul(value(mul(a, b)), c)", says: "({a}{b}){c}", place: above }
    - { at: "mul(a, value(mul(b, c)))", says: "{a}({b}{c})", place: below }
freedom: { kind: fill }
play:
  numbers: {}
  labels: { start: "i + 1", glyph: true }
  leadingDiagonal: true
  boards: [4x4, 6x6, 5x5i]
  hintMarks:
    ring: the square the step decides.
    strike: the notes the step crosses out.
    outline: the squares the step reasons from.
    stripes: the line the step is about.
deal:
  answer: a group's table, from the shipped generators, its elements permuted
  given: every square's letter, then each hidden while the board still finishes; the identity's row and column kept where it is shown
  tier: one of the tiers
  sample:
    group:
      hidden: In order
      tables:
        3: [[BCA]]
        4: [[BCDA], [BADC, CDAB]]
        5: [[BCDEA]]
        6: [[CFEBAD, BADCFE], [DCFEBA]]
  hide:
    given: { keep: "plain = 0 and (x(at) = 0 or y(at) = 0)" }
settings:
  plain:
    kind: choice
    gives: size
    after: tier
    choices:
      - name: E first
        code: ""
        letters: eabcdf
      - name: In order
        code: i
        letters: abcdef
        least: 4
        tiers: [Normal, Tricky]
id:
  - digits: given
    apart: _
tiers: [Easy, Normal, Tricky]
names:
  dup: "a placed letter's row and column"
  single: "the only letter left in a square"
  hiddenSingle: "the only square left for a letter"
  set: "letters already accounted for"
  associativity: "associativity"
  identityFill: "finding the identity"
  identityElim: "a letter that isn't the identity"
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  - { use: latin.hiddenSingle, tier: Easy, rung: hiddenSingle }
  - { use: latin.single, tier: Easy, rung: single }
  - id: associativity
    tier: Normal
    rung: associativity
    for: >-
      a in domain, b in domain, p = mul(a, b) where known(p),
      c in domain, q = mul(b, c) where known(q),
      l = mul(value(p), c), r = mul(a, value(q)) where known(l) != known(r)
    conclude: >-
      ((known(l) and value(l) in cand(r)) implies place(r, value(l)))
      and ((known(r) and value(r) in cand(l)) implies place(l, value(r)))
  - id: identity
    tier: Normal
    rung: identityFill
    for: >-
      w0 = first({c in cells where known(c) and (value(c) = left(c) or value(c) = right(c))})
      where w0 != none,
      e in domain where (value(w0) = left(w0) and e = right(w0))
      or (value(w0) != left(w0) and e = left(w0))
    conclude: >-
      forall j in domain, c in {mul(j, e), mul(e, j)} where not known(c):
      j in cand(c) and place(c, j)
  - id: notIdentity
    tier: Tricky
    rung: identityElim
    for: >-
      a in domain,
      o = min(j in domain where (known(mul(j, a)) and value(mul(j, a)) != j)
      or (known(mul(a, j)) and value(mul(a, j)) != j))
      where o != none
    conclude: "forall j in domain: strike(mul(j, a), j) and (j = a or strike(mul(a, j), j))"
  - { use: latin.set, tier: Tricky, rung: set }
