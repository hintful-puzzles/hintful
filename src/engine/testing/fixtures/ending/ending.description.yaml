# yaml-language-server: $schema=../../../../describe/description.schema.json

# A fixture, not a game: a board of 1, 2 and 3, no two 1s side by side and
# no two 3s, with each row's and column's count of 1s before its start and
# its count of 3s past its end; its count of 2s follows from those two and
# is neither drawn nor written. For the fill engine's tests of a clue one a
# value of some values alone, laid at a line's two ends, and written a
# character a value, a value at a time, on a description that names no
# game.
game: ending
produces: numbers
sizes:
  w: { min: 2, max: 8 }
  h: { min: 2, max: 8 }
space:
  grid: { w: "w", h: "h" }
  units: []
answer:
  value: { sort: cell, domain: "range(1, 3)" }
marks:
  cand: { sort: cell, notation: "set of range(1, 3)" }
define:
  holds(L, d): "count(c in cells(L) where value(c) = d)"
  # The 2s a line with both its counts holds: the rest of its squares.
  twos(L): "|cells(L)| - clue(count, L, 1) - clue(count, L, 3)"
shape:
  - "forall c in cells where value(c) != 2, p in adj4(c): value(p) != value(c)"
clues:
  # How many 1s, or 3s, a row or column holds.
  count:
    at: line
    per: [1, 3]
    value: "range(0, |cells(at)|)"
    means: "holds(at, per) = v"
freedom: { kind: fill }
play:
  numbers: {}
  ends: { start: [1], end: [3] }
  done: { count: number }
  boards: [4x4, 5x3]
  hintMarks:
    ring: the square the step fills in.
    strike: the notes the step crosses out.
    outline: the squares and numbers the step reasons from.
    stripes: the row or column the step is about.
deal:
  answer: a 1, 2 or 3 a square, no two 1s or 3s side by side, built at random
  count: every number, then each hidden while the board still finishes
  tier: the one tier
  sample: { build: true }
  hide: count
id:
  - numbers: count
    alphabet: true
    byValue: true
    order: columns
    hidden: "."
    closed: true
tiers: [Easy]
names:
  dup: "a placed 1 or 3's neighbors"
  single: "the only number left in a square"
  regionsFull: "every other number beside it"
  full: "a line with all of a number"
  room: "a line with just enough room for a number"
  twos: "a line with just enough room for its 2s"
steps:
  clean:
    ring: cell
    move: "any 1 or 3 already beside its square"
  note:
    ring: cell
    terms: { vs: values, unruled: flag }
    wordings:
      - when: unruled
        look: "No 1 or 3 stands beside {ring} yet"
        move: "pencil in every one"
      - look: "Only {vs} {vs: isn't | aren't} already beside {ring}"
        move: "pencil {vs: it | them} in"
  cull:
    ring: cell
    terms: { n: number }
    move: "neighbors"
  regionsFull:
    ring: cell
    terms: { n: number }
    look: "Every other number is already beside {ring}"
    move: "it can only be {n}"
techniques:
  - kind: peer.placed
    as: placed
    tier: Easy
    rung: dup
    with:
      peer: "p in adj4(c) where n != 2 and not known(p)"
  - kind: one.cell
    as: single
    tier: Easy
  # A line holding all of a number it counts has room for no more.
  - id: full
    tier: Easy
    for: "L in lines, d in {1, 3}, v = clue(count, L, d) where v >= 0 and holds(L, d) >= v"
    conclude: "holds(L, d) = v and (forall c in cells(L) where not known(c): strike(c, d))"
    says:
      terms: { d: d, v: v }
      marks: { stripes: "cells(L)" }
      look: "{stripes: this {unit}} already holds all {numeral v} of its {d}s"
  # A line with just as many squares left for a number as it still needs.
  - id: room
    tier: Easy
    for: >-
      L in lines, d in {1, 3}, v = clue(count, L, d) where v > holds(L, d),
      O = {c in cells(L) where not known(c) and d in cand(c)}
      where |O| = v - holds(L, d)
    conclude: "forall c in O: place(c, d)"
    says:
      terms: { d: d }
      marks: { stripes: "cells(L)" }
      look: "{stripes: this {unit}} has just enough squares left for its {d}s"
      move: "{ring} must be {d}"
  # A line with both its counts holds its other squares' 2s, so one with
  # just as many squares left for a 2 as it still needs takes one in each.
  - id: twos
    tier: Easy
    for: >-
      L in lines where clue(count, L, 1) >= 0 and clue(count, L, 3) >= 0
      and twos(L) > holds(L, 2),
      O = {c in cells(L) where not known(c) and 2 in cand(c)}
      where |O| = twos(L) - holds(L, 2)
    conclude: "forall c in O: place(c, 2)"
    says:
      marks: { stripes: "cells(L)" }
      look: "{stripes: this {unit}}'s counts leave just enough squares for its 2s"
      move: "{ring} must be 2"
