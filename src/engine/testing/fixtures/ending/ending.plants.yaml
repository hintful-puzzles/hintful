# A defect planted in each of the techniques the description states, keyed by
# its id, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # A line one short of a number read as holding them all.
  full:
    for: "L in lines, d in {1, 3}, v = clue(count, L, d) where v >= 0 and holds(L, d) + 1 >= v"
    conclude: "forall c in cells(L) where not known(c): strike(c, d)"
  # A line with one square more than it needs read as having just enough.
  room:
    for: >-
      L in lines, d in {1, 3}, v = clue(count, L, d) where v > holds(L, d),
      O = {c in cells(L) where not known(c) and d in cand(c)}
      where |O| = v - holds(L, d) + 1
  # The 2s read as one more than the counts leave.
  twos:
    for: >-
      L in lines where clue(count, L, 1) >= 0 and clue(count, L, 3) >= 0
      and twos(L) + 1 > holds(L, 2),
      O = {c in cells(L) where not known(c) and 2 in cand(c)}
      where |O| = twos(L) + 1 - holds(L, 2)
