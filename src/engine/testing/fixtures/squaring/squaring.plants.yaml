# A defect planted in each of the fixture's techniques, which the soundness checks
# under research/technique-check must find unsound.

techniques:
  # A placed number struck from its own square too.
  placed:
    conclude: "forall p in cells(u): strike(p, d)"
  # A square with two numbers left read as down to one.
  single:
    for: "c in cells where not known(c) and |cand(c)| < 3"
    conclude: "place(c, first(cand(c)))"
