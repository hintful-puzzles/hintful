# yaml-language-server: $schema=../../../../describe/description.schema.json

# A fixture, not a game: a Latin square, some of its squares given, for the
# fill engine's tests of a value drawn as its number and typed into a
# selected square (`play.numbers`), the player's candidate notes (`marks:`),
# givens compiled from `given:`, an answer sampled as a Latin square, and the
# Latin library on the fill ladder, which the candidate walk hints from the
# notes, on a description that names no game.
game: squaring
produces: latin
sizes:
  w: { min: 3, max: 9 }
space:
  grid: { w: "w", h: "w" }
  units: [rows, cols]
answer:
  value: { sort: cell, domain: "range(1, w)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, w)" }
shape:
  - "latin(value, lines)"
freedom: { kind: fill }
play:
  numbers: {}
  hintNotes: implicit
  boards: [4x4, 5x5]
  hintMarks:
    ring: the square the step decides.
    strike: the notes the step crosses out.
    outline: the squares the step reasons from.
    stripes: the line the step is about.
deal:
  answer: a Latin square
  given: every square's number, then each hidden while the board still finishes
  tier: the one tier
  sample: { latin: true }
  hide: given
id:
  - digits: given
    apart: _
tiers: [Easy]
names:
  dup: "a placed number's row and column"
  single: "the only number left in a square"
  regionsFull: "every other number already placed"
  hiddenSingle: "the only square left for a number"
  set: "numbers already accounted for"
  wing: "a wing"
# The Latin library alone, which the candidate walk words: the hint of a board
# with notes on the library's steps.
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  - { use: latin.hiddenSingle, tier: Easy, rung: hiddenSingle }
  - { use: latin.single, tier: Easy, rung: single }
  - { use: latin.set, tier: Easy, rung: set }
  - { use: latin.fish, tier: Easy, rung: set }
  - { use: latin.wing, tier: Easy, rung: wing }
