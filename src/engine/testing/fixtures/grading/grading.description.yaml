# yaml-language-server: $schema=../../../../describe/description.schema.json

# A fixture, not a game: a Latin square divided into small cages, each
# showing its sum, with some numbers given, whose cage readings grade on a
# scale of their own beside the tiers, for the fill engine's tests of a
# second scale (every board capped at the top of it, and dealt to need its
# top as it is dealt to need the asked tier) on a description that names no
# game.
game: grading
produces: latin
sizes:
  w: { min: 4, max: 6 }
space:
  grid: { w: "w", h: "w" }
  regions: { cage: dealt }
  units: [rows, cols]
answer:
  value: { sort: cell, domain: "range(1, w)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, w)" }
shape:
  - "latin(value, lines)"
  # No number repeats within a cage, as in Solo's Killer.
  - "forall r in cage: distinct(value(c) over c in cells(r))"
clues:
  sum:
    at: cage
    complete: true
    value: "range(1, |cells(at)| * w)"
    means: "sum(c in cells(at) of value(c)) = v"
define:
  # What a cage's sum leaves once its filled squares are taken out.
  owed(r): "clue(sum, r) - sum(c in cells(r) where known(c) of value(c))"
freedom: { kind: fill }
play:
  numbers: {}
  signs: { sum: "+" }
  boards: [4x4, 5x5]
  hintMarks:
    ring: the square the step decides.
    strike: the notes the step crosses out.
    stripes: the cage or the line the step is about.
deal:
  cage: the squares in dominoes and then small cages, at random
  answer: searched under the cages
  sum: a cage's sum
  given: every square's number, then each hidden while the board still finishes
  tier: one of the tiers
  sample: { search: true }
  divide: { partition: cage, pairs: 0.75, most: 4 }
  hide: given
id:
  - blocks: cage
  - parts: cage
    before: ","
    codes: { a: sum }
  - { digits: given, before: "," }
tiers: [Easy, Normal]
# The cages' readings grade on a scale of their own.
scales:
  cages: [Last, Sets]
names:
  dup: "a placed number's row and column"
  single: "the only number left in a square"
  regionsFull: "every other number already placed"
  hiddenSingle: "the only square left for a number"
  set: "numbers already accounted for"
  cageLast: "a cage's last square"
  cageSets: "the sets that make a cage's sum"
# The walk's words for how far a placed number reaches: its row, column and
# cage.
steps:
  clean:
    ring: cell
    move: "any number already in its square's row, column or cage"
  note:
    ring: cell
    terms: { vs: values, unruled: flag }
    wordings:
      - when: unruled
        look: "No number stands in {ring}'s row, column or cage yet"
        move: "pencil in every one"
      - look: "Only {vs} {vs: isn't | aren't} already in {ring}'s row, column or cage"
        move: "pencil {vs: it | them} in"
  cull:
    ring: cell
    terms: { n: number }
    move: "row, column or cage"
  regionsFull:
    ring: cell
    terms: { n: number }
    look: "Every other number is already in {ring}'s row, column or cage"
    move: "it can only be {n}"
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  # A placed number leaves the rest of its cage.
  - kind: peer.placed
    as: cageCull
    tier: Easy
    rung: dup
    with:
      peer: "p in cells where p != c and cage(p) = cage(c)"
  - { use: latin.hiddenSingle, tier: Easy, rung: hiddenSingle }
  - { use: latin.single, tier: Easy, rung: single }
  # A cage with one open square holds what its sum leaves there. A cage
  # with no sum is one the answer's search has not dealt it yet.
  - kind: sum.last
    as: cageLast
    tier: Last
    with:
      group: >-
        r in cage where clue(sum, r) != none,
        K = {c in cells(r) where not known(c)}, t = owed(r)
      set: K
      total: t
    says:
      terms: { r: r, t: t }
      marks: { stripes: "cells(r)" }
      look: "{stripes: This cage}'s other squares leave {numeral t}"
      move: "{ring: its last square} must be {numeral t}"
  # Cage by cage, of two to four open squares: a value in no set of
  # different values that makes what its sum leaves is struck.
  - kind: sum.sets
    as: cageSets
    tier: Sets
    with:
      group: >-
        r in cage where clue(sum, r) != none,
        K = {c in cells(r) where not known(c)}, t = owed(r)
        where t != 0 and |K| > 1
      set: K
      total: t
    says:
      terms: { r: r, t: t }
      marks: { stripes: "cells(r)" }
      look: "No set of different numbers that makes {numeral t} in {stripes: this cage} has {struckOr}"
  - { use: latin.set, tier: Normal, rung: set }
