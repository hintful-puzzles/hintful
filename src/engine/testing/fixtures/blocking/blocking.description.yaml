# yaml-language-server: $schema=../../../../describe/description.schema.json

# A fixture, not a game: a Latin square cut into blocks, `across` of them
# across and `down` down, each holding every number once as a row does;
# where the blocks are one square wide, the board deals connected blocks as
# large as a row instead. For the fill engine's tests of a board sized by its blocks, as
# upstream solo.c writes it (`2x3`, `5j`), the Custom dialog's fields for it,
# and a partition among the units dealt only under the variation that deals
# it, on a description that names no game.
game: blocking
produces: latin
sizes:
  across: { min: 2, max: 6 }
  down: { min: 1, max: 3 }
space:
  grid: { w: "across * down", h: "across * down" }
  # Each block `down` squares wide and `across` tall.
  regions: { box: "blocks(down, across)" }
  units: [box, rows, cols]
answer:
  value: { sort: cell, domain: "range(1, across * down)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, across * down)" }
shape:
  - "latin(value, units)"
variations:
  # Blocks one square wide are dealt.
  Jigsaw:
    replace:
      space:
        regions: { box: dealt }
  # The diagonals are units, after the rest.
  X:
    add:
      space: { diagonals: true, units: [diagonals] }
freedom: { kind: fill }
play:
  numbers: {}
  modifiers:
    X:
      letter: x
      kw: diagonals
      name: Diagonals
      words: X
      rule: each of the two diagonals holds every number once too.
  boards: [2x2, 2x3, 5j]
  blocks:
    letter: j
    columns:
      kw: columns-of-sub-blocks
      name: Columns of sub-blocks
      doc: How many blocks the grid has across and down.
    rows:
      kw: rows-of-sub-blocks
      name: Rows of sub-blocks
    rulesets:
      Standard: The blocks are rectangles.
      Jigsaw: The blocks are irregular shapes.
  bounds: { longer: { max: 6 } }
  hintMarks:
    ring: the square the step decides.
    strike: the notes the step crosses out.
    outline: the squares the step reasons from.
    stripes: the row, column or block the step is about.
deal:
  blocks: cut by the sizes, or where they are one square wide connected blocks as large as a row that tile the board
  answer: searched under the blocks
  given: every square's number, then each hidden while the board still finishes
  tier: the one tier
  divide: { partition: box, equal: w }
  sample: { search: true }
  hide: given
id:
  - { blocks: box, after: "," }
  - digits: given
    apart: _
tiers: [Easy]
names:
  dup: "a placed number's row, column and block"
  single: "the only number left in a square"
  regionsFull: "every other number already placed"
  hiddenSingle: "the only square left for a number"
  set: "numbers already accounted for"
# The walk's words for how far a placed number reaches: its row, column and
# block, and with X on its diagonals.
steps:
  clean:
    ring: cell
    terms: { X: flag }
    wordings:
      - when: X
        move: "any number already in its square's row, column, block or diagonal"
      - move: "any number already in its square's row, column or block"
  note:
    ring: cell
    terms: { X: flag, vs: values, unruled: flag }
    wordings:
      - when: unruled
        look: "No number stands in {ring}'s row, column or block yet"
        move: "pencil in every one"
      - when: X
        look: "Only {vs} {vs: isn't | aren't} already in {ring}'s row, column, block or diagonal"
        move: "pencil {vs: it | them} in"
      - look: "Only {vs} {vs: isn't | aren't} already in {ring}'s row, column or block"
        move: "pencil {vs: it | them} in"
  cull:
    ring: cell
    terms: { X: flag, n: number }
    wordings:
      - when: X
        move: "row, column, block or diagonal"
      - move: "row, column or block"
  regionsFull:
    ring: cell
    terms: { X: flag, n: number }
    wordings:
      - when: X
        look: "Every other number is already in {ring}'s row, column, block or diagonal"
        move: "it can only be {n}"
      - look: "Every other number is already in {ring}'s row, column or block"
        move: "it can only be {n}"
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  - { use: latin.hiddenSingle, tier: Easy, rung: hiddenSingle }
  - { use: latin.single, tier: Easy, rung: single }
  - { use: latin.set, tier: Easy, rung: set }
