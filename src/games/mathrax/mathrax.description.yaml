# yaml-language-server: $schema=../../describe/description.schema.json

game: mathrax
help:
  rules: |-
    Fill a square grid with digits from 1 to its size, so that no digit appears twice in a row or column and every clue is satisfied.

    A clue sits where four squares meet, and speaks of their two diagonal pairs:

    * 'E': all four are even.
    * 'O': all four are odd.
    * '=': each pair's digits are equal.
    * A number and sign, such as 6×: each pair's larger and smaller digit give that number by that sign.
  controls: |-
    Left-click to select a cell, then type a number on your keyboard to enter it. Press Backspace, Space or 0 to clear a cell.

    Right-click a cell, then type a number to add a pencil mark. Pencil marks can be used for any purpose. {{sticky-pencil}}

    You can also use the arrow keys to move the selected cell around. Press Enter to toggle between entering numbers and entering pencil marks.

    {{mark-all}} Once every empty cell has marks, the press crosses out of each the numbers already placed in its row and column.
  origins: |-
    The inventor of Mathrax is unknown.

    More information: https://www.janko.at/Raetsel/Mathrax/index.htm
  hints: |-
    **Hint** explains the next step rather than simply making it. It works from your own numbers and pencil marks, so it carries on from wherever you are; if a number you've entered is wrong, or a cell's pencil marks have crossed out its answer, it asks you to fix the highlighted mistakes first. It pencils in only as it needs to: a cell with no marks counts as holding every number its row and column don't already hold, and the hint writes a cell's marks only when its next step crosses one out or reasons from them. If you would rather it filled in every cell's marks first (the same as pressing **Fill marks**), set **Hints pencil in** to **Every candidate first** in the preferences.

    {{hint-marks}}

    The hint names a clue as it is drawn ("the 7+ clue", "the 2÷ clue", "the = clue"), and "the 3 across it" is the number in the cell diagonally opposite across that clue. A number is *open* in a cell while it is still possible there: in the cell's pencil marks, or, in a cell with no marks, not yet ruled out by its row and column. So "nothing open across the 7+ clue adds with 1 to make 7" means the cell across can't be 6, so this cell can't be 1.

    {{wing}}

    If you've turned on the preference that removes a number from pencil marks in its row and column when you place it, the hint leaves that tidying to the placement rather than spelling it out as a step of its own. On an Unreasonable board, deduction can run out before the grid is full; the hint says so rather than guessing.
