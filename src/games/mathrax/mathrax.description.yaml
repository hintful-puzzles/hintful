# yaml-language-server: $schema=../../describe/description.schema.json

game: mathrax
catalog:
  name: Mathrax
  description: Latin square puzzle
  objective: Place each number according to the arithmetic clues.
  collection: unreleased
  family: latin
help:
  rules: |-
    Fill a square grid with digits from 1 to its size, so that no digit appears twice in a row or column and every clue is satisfied.

    A clue sits where four squares meet, and speaks of their two diagonal pairs:

    * 'E': all four are even.
    * 'O': all four are odd.
    * '=': each pair's digits are equal.
    * A number and sign, such as 6×: each pair's larger and smaller digit give that number by that sign.
  controls: |-
    Left-click to select a cell, then type a number on your keyboard to enter it. Press Backspace, Space or 0 to clear a cell.

    Right-click a cell, then type a number to add a pencil mark. Pencil marks can be used for any purpose. {{sticky-pencil}}

    You can also use the arrow keys to move the selected cell around. Press Enter to toggle between entering numbers and entering pencil marks.

    {{mark-all}} Once every empty cell has marks, the press crosses out of each the numbers already placed in its row and column.
  origins: |-
    The inventor of Mathrax is unknown.

    More information: https://www.janko.at/Raetsel/Mathrax/index.htm
  hints: |-
    **Hint** explains the next step rather than simply making it. It works from your own numbers and pencil marks, so it carries on from wherever you are; if a number you've entered is wrong, or a cell's pencil marks have crossed out its answer, it asks you to fix the highlighted mistakes first. It pencils in only as it needs to: a cell with no marks counts as holding every number its row and column don't already hold, and the hint writes a cell's marks only when its next step crosses one out or reasons from them. If you would rather it filled in every cell's marks first (the same as pressing **Fill marks**), set **Hints pencil in** to **Every candidate first** in the preferences.

    {{hint-marks}}

    The hint names a clue as it is drawn ("the 7+ clue", "the 2÷ clue", "the = clue"), and "the 3 across it" is the number in the cell diagonally opposite across that clue. A number is *open* in a cell while it is still possible there: in the cell's pencil marks, or, in a cell with no marks, not yet ruled out by its row and column. So "nothing open across the 7+ clue adds with 1 to make 7" means the cell across can't be 6, so this cell can't be 1.

    {{wing:cell}}

    If you've turned on the preference that removes a number from pencil marks in its row and column when you place it, the hint leaves that tidying to the placement rather than spelling it out as a step of its own. On an Unreasonable board, deduction can run out before the grid is full; the hint says so rather than guessing.

produces: latin
words:
  cell: cell
sizes:
  w: { min: 3, max: 9 }
space:
  grid: { w: "w", h: "w" }
  corners: true
  units: [rows, cols]
answer:
  value: { sort: cell, domain: "range(1, w)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, w)" }
define:
  # Values d and e diagonally across corner k make its arithmetic clue,
  # whichever kind it is.
  makes(k, d, e): >-
    (clue(sum, k) = none or d + e = clue(sum, k))
    and (clue(difference, k) = none or abs(d - e) = clue(difference, k))
    and (clue(equal, k) = none or d = e)
    and (clue(product, k) = none or d * e = clue(product, k))
    and (clue(quotient, k) = none or d = clue(quotient, k) * e or e = clue(quotient, k) * d)
  # Whether corner k holds a clue that reads the cell across it.
  arithmetic(k): >-
    clue(sum, k) != none or clue(difference, k) != none or clue(equal, k) != none
    or clue(product, k) != none or clue(quotient, k) != none
  # Whether corner k's clue can rule a value out of a cell: a corner with
  # none, and at Easy an arithmetic clue with two values open across it,
  # allow every one.
  constrains(k): "clue(parity, k) != none or arithmetic(k)"
  constrainsEasy(k, c): "clue(parity, k) != none or (arithmetic(k) and |cand(across(k, c))| < 2)"
  # Whether the parity clue at corner k, where it has one, allows d.
  matches(k, d): "clue(parity, k) = none or d mod 2 = clue(parity, k)"
  # The clue at corner k allows d in cell c, with something open across it
  # to make its arithmetic clue.
  allows(k, c, d): >-
    matches(k, d)
    and (not arithmetic(k) or (exists e in cand(across(k, c)): makes(k, d, e)))
  # As allows, reading an arithmetic clue only where the cell across has at
  # most one value open.
  allowsEasy(k, c, d): >-
    matches(k, d)
    and (not arithmetic(k) or |cand(across(k, c))| > 1
    or (exists e in cand(across(k, c)): makes(k, d, e)))
shape:
  - "latin(value, lines)"
# An arithmetic clue's sign is its kind, and E and O one kind whose value is
# the remainder each cell leaves by 2. The values are those two cells could
# make: a difference of 0 is the = clue, and a ratio of 1 none.
clues:
  sum:
    at: corner
    value: "range(2, 2 * w)"
    means: "forall c in cells(at): value(c) + value(across(at, c)) = v"
  difference:
    at: corner
    value: "range(1, w - 1)"
    means: "forall c in cells(at): abs(value(c) - value(across(at, c))) = v"
  equal:
    at: corner
    value: "range(0, 0)"
    means: "forall c in cells(at): value(c) = value(across(at, c))"
  product:
    at: corner
    value: "range(1, w * w)"
    means: "forall c in cells(at): value(c) * value(across(at, c)) = v"
  quotient:
    at: corner
    value: "range(2, w)"
    means: >-
      forall c in cells(at):
      value(c) = v * value(across(at, c)) or value(across(at, c)) = v * value(c)
  parity:
    at: corner
    value: "range(0, 1)"
    means: "forall c in cells(at): value(c) mod 2 = v"
freedom: { kind: fill }
play:
  numbers: {}
  signs: { sum: "+", difference: "−", equal: "=", product: "×", quotient: "÷", parity: [E, O] }
  # A clue reads the cell across it, and the rest is singles, so a walk that
  # pencils in only as it needs writes notes into under half the cells, and
  # below Tricky is shorter than one that pencils every candidate in first.
  hintNotes: implicit
  # The two small sizes at every tier, the three large ones at Normal alone,
  # which keeps the list short.
  boards: [5x5, 6x6, 7x7, 8x8, 9x9]
  boardTiers:
    7x7: [Normal, Normal]
    8x8: [Normal, Normal]
    9x9: [Normal, Normal]
  # A 3x3 has four corners, and two tiers it cannot tell apart: over 3,000
  # boards each, none needed Normal (Easy sufficed) and none the top tier
  # (Tricky did).
  bounds:
    tiers:
      Normal: { longer: { min: 4 } }
      Unreasonable: { longer: { min: 4 } }
  hintMarks:
    ring: the cell the step fills in with a number.
    strike: the pencil marks the step crosses out.
    outline: >-
      what the step reasons from: "this cell", whose pencil marks it crosses
      out, the cells a clue constrains (the diagonal pair it sits between, or
      all four around an E or O), the number just placed, the cells of a set,
      or "the middle cell" a step weighs and the cells it reads.
    stripes: >-
      the row or column the sentence names: "in this row". Or the several it
      names together, such as "these 2 columns", where one number fits only
      the outlined cells.
# Upstream mathrax.c's: at every corner the first kind its cascade finds the
# answer makes there, of those switched on; the givens hidden first, then
# the clues of every kind in one order.
deal:
  answer: a Latin square
  given: every cell's number, then each hidden while the board still finishes
  clues: every corner's clue, of the first kind on that it makes, then each hidden while the board still finishes
  tier: one of the tiers
  sample: { latin: true }
  hide: { given: { first: true }, sum, difference, equal, product, quotient, parity }
  oneKind:
    kinds: [sum, difference, equal, product, quotient, parity]
    pick: first
settings:
  clueTypes:
    kind: set
    after: tier
    members:
      - letter: A
        kind: sum
        kw: addition-clues
        name: Addition clues
        doc: Allows clues with the addition operation to appear.
        word: addition
      - letter: S
        kind: difference
        kw: subtraction-clues
        name: Subtraction clues
        doc: >-
          Allows clues with the subtraction operation to appear. Note that clues
          with a difference of zero are covered by Equality clues instead.
        word: subtraction
      - letter: M
        kind: product
        kw: multiplication-clues
        name: Multiplication clues
        doc: Allows clues with the multiplication operation to appear.
        word: multiplication
      - letter: D
        kind: quotient
        kw: division-clues
        name: Division clues
        doc: >-
          Allows clues with the division operation to appear. Note that clues
          with a ratio of one are covered by Equality clues instead.
        word: division
      - letter: E
        kind: equal
        kw: equality-clues
        name: Equality clues
        doc: Allows clues with equality signs to appear.
        word: equality
      - letter: O
        kind: parity
        kw: even-odd-clues
        name: Even/odd clues
        doc: Allows Even clues and Odd clues to appear.
        word: even-odd
# Upstream's: the givens a digit each between runs of cells without one,
# then a comma and a code a corner, `S0` the = clue's, `E` and `O` the
# parities'.
id:
  - { digits: given }
  - codes: { A: sum, S: difference, S0: "equal 0", M: product, D: quotient, E: "parity 0", O: "parity 1" }
    before: ","
    always: true
tierLetters: entr
tiers: [Easy, Normal, Tricky, Unreasonable]
# The clue readings, cell by cell and each cell's corners in turn: M is what
# every clue at the cell's corners allows it, and a cell with none is a
# contradiction. The Easy and Normal readings go on to the corners only where
# M is at most one value; a firing is one clue's strikes at one cell.
names:
  dup: "a placed number's row and column"
  single: "the only number left in a cell"
  regionsFull: "every other number already placed"
  hiddenSingle: "the only cell left for a number"
  set: "numbers already accounted for"
  wing: "a wing"
  clue: "what a clue allows"
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  - id: clueEasy
    tier: Easy
    rung: clue
    for: >-
      c in cells,
      M = cand(c) - set(d over j in corners(c) where constrainsEasy(j, c),
      d in cand(c) where not allowsEasy(j, c, d)) where |M| < 2,
      k in corners(c)
    conclude: "|M| > 0 and (forall d in cand(c) where not allowsEasy(k, c, d): strike(c, d))"
    # The hint names the clue, read out as what it asks of the cell it strikes
    # from and the cell across it, by the number written across it where one
    # is: what a player can check is a written number, not a note. The three
    # clue techniques say the same.
    says: &clueSays
      terms:
        k: k
        at: c
        sum: "clue(sum, k)"
        difference: "clue(difference, k)"
        product: "clue(product, k)"
        quotient: "clue(quotient, k)"
        parity: "clue(parity, k)"
        placed: "known(across(k, c))"
        v: "value(across(k, c))"
      marks:
        outline: "{x in cells(k) where clue(parity, k) != none or x = c or x = across(k, c)}"
      wordings:
        - when: "clue(parity, k) = 0"
          look: "{outline: The E clue} means all four numbers around it are even"
        - when: "clue(parity, k) = 1"
          look: "{outline: The O clue} means all four numbers around it are odd"
        - when: "clue(sum, k) != none"
          look: "{if placed: {outline: The {numeral sum}+ clue} means {ring at: this {noun}} and the {v} across it add to {numeral sum} | Nothing open across {outline: the {numeral sum}+ clue} adds with {struckOr} to make {numeral sum}}"
        - when: "clue(equal, k) != none"
          look: "{if placed: {outline: The = clue} means {ring at: this {noun}} and the {v} across it are equal | Nothing open across {outline: the = clue} matches {struckOr}}"
        - when: "clue(difference, k) != none"
          look: "{if placed: {outline: The {numeral difference}− clue} means {ring at: this {noun}} and the {v} across it differ by {numeral difference} | Nothing open across {outline: the {numeral difference}− clue} is {numeral difference} away from {struckOr}}"
        - when: "clue(product, k) != none"
          look: "{if placed: {outline: The {numeral product}× clue} means {ring at: this {noun}} and the {v} across it multiply to {numeral product} | Nothing open across {outline: the {numeral product}× clue} multiplies with {struckOr} to make {numeral product}}"
        - when: "clue(quotient, k) != none"
          look: "{if placed: {outline: The {numeral quotient}÷ clue} means {ring at: this {noun}} and the {v} across it divide to give {numeral quotient} | Nothing open across {outline: the {numeral quotient}÷ clue} divides with {struckOr} to give {numeral quotient}}"
  - { use: latin.hiddenSingle, tier: Easy, rung: hiddenSingle }
  - { use: latin.single, tier: Easy, rung: single }
  - id: clue
    tier: Normal
    rung: clue
    for: >-
      c in cells,
      M = cand(c) - set(d over j in corners(c) where constrains(j),
      d in cand(c) where not allows(j, c, d)) where |M| < 2,
      k in corners(c)
    conclude: "|M| > 0 and (forall d in cand(c) where not allows(k, c, d): strike(c, d))"
    says: *clueSays
  - { use: latin.set, tier: Normal, rung: set }
  - id: clueTricky
    tier: Tricky
    rung: clue
    for: >-
      c in cells,
      M = cand(c) - set(d over j in corners(c) where constrains(j),
      d in cand(c) where not allows(j, c, d)),
      k in corners(c)
    conclude: "|M| > 0 and (forall d in cand(c) where not allows(k, c, d): strike(c, d))"
    says: *clueSays
  - { use: latin.fish, tier: Tricky, rung: set }
  - { use: latin.wing, tier: Tricky, rung: wing }
