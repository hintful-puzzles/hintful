# yaml-language-server: $schema=../../describe/description.schema.json

game: solo
catalog:
  name: Solo
  aliases: [Sudoku, Number Place]
  description: Number placement puzzle
  objective: Fill the grid so every row, column and block has one of each digit.
  collection: original
  family: latin
  similar: Sudoku, Diagonal (X) Sudoku, Hexdoku, Jigsaw Sudoku, Killer Sudoku, Mega Sudoku
help:
  rules: |-
    Fill every square with a number so that each number appears once in
    every row, every column and every block marked by thick lines. The game
    mode gives the blocks' shape:

    {{rulesets}}

    Settings add rules, which a board's name says:

    {{modifiers}}
  controls: |-
    To place a number, click in a square to select it, then type the
    number on the keyboard. To erase a number, click to select a square
    and then press Backspace.

    Right-click in a square and then type a number to add or remove the
    number as a pencil mark, indicating numbers that you think
    *might* go in that square. {{sticky-pencil}}

    You can also use the arrow keys to move the selected square around.
    Press Enter to toggle between entering numbers and entering pencil
    marks, and Backspace or Space to clear a square. On grids of more than
    9 numbers, the numbers past 9 are typed as letters.

    {{mark-all}} Once every empty square has marks, the press crosses out
    of each the numbers already placed in its row, column and block, and in
    its diagonal or cage where the board has them. On a grid of 22 numbers
    or more, M is the letter for 22, so there only the button fills the
    marks.
  hints: |-
    **Hint** explains the next step rather than simply making it. It works
    from your own numbers and pencil marks, so it carries on from wherever
    you are; if a number you've entered is wrong, or a cell's pencil marks
    have crossed out its answer, it asks you to fix the highlighted
    mistakes first. It pencils in only as it needs to: a cell with no marks
    counts as holding every number its row, column and block (and, in X
    mode, diagonal, and in Killer mode, cage) don't already hold, and the
    hint writes a cell's marks only when its next step crosses one out or
    reasons from them. Much of a puzzle then needs no marks at all. If you
    would rather it filled in every cell's marks first (the same as
    pressing **Fill marks**), set **Hints pencil in** to **Every candidate first** in
    the preferences.

    {{hint-marks}}

    A few ideas are worth learning by name:

    * **Only one place.** When every other cell of a row, column or block
      rules a number out, it goes in the one cell left.
    * **Confined to an overlap.** When every cell of a row that can still
      take a 1 lies in one block, that block's 1 must be in the row, so the
      1 goes from the rest of the block (and the same the other way round).
    * **Already accounted for.** When some cells of a block can hold only
      certain numbers between them, and there are as many of those numbers
      as cells, those numbers go from every other cell of the block.
    * In Killer mode, **the region total**: every row, column and block
      adds up to the same total (45 on a 9×9 grid), so once its whole cages
      and placed digits are counted, what's left over belongs to the cells
      that remain.

    {{wing:cell}}

    If you've turned on the preference that removes a number from the
    pencil marks it rules out when you place it, the hint leaves that
    tidying to the placement rather than spelling it out as a step of its
    own. On an Unreasonable board, deduction can run out before the grid is
    full; the hint says so rather than guessing.

produces: latin
words:
  cell: cell
  alongside: in a line or block with
# The blocks `across` blocks across the board and `down` down it: each
# `down` squares wide and `across` tall, as upstream solo.c's c and r.
sizes:
  across: { min: 2, max: 31 }
  down: { min: 1, max: 15 }
space:
  grid: { w: "across * down", h: "across * down" }
  regions: { block: "blocks(down, across)" }
  # In the order the techniques scan them.
  units: [block, rows, cols]
answer:
  value: { sort: cell, domain: "range(1, across * down)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, across * down)" }
shape:
  - "latin(value, units)"
freedom: { kind: fill }
play:
  numbers: {}
  hintNotes: implicit
  # The 6x6 board at its first three tiers and the 9x9 at all six, then
  # one board for each of X and Killer; the 9x9 Jigsaw at all six.
  boards: [2x3, 3x3, 9j]
  default: 3x3
  boardTiers:
    2x3: [Easy, Tricky]
  variants:
    - { board: 3x3, with: [X], tier: Normal }
    - { board: 3x3, with: [Killer], tier: Easy }
  # A grid of 4 numbers or fewer has only Easy boards: upstream's generator
  # drew none above it in 250,000 2x2 boards, and a 4 Jigsaw none above
  # Tricky in 220,000 (measured 2026-10-05 and 06).
  bounds:
    longer: { max: 31 }
    tiers:
      Normal: { longer: { min: 5 } }
      Tricky: { longer: { min: 5 } }
      Hard: { longer: { min: 5 } }
      Extreme: { longer: { min: 5 } }
      Unreasonable: { longer: { min: 5 } }
  hintMarks:
    ring: the cell the step fills in with a number.
    strike: the pencil marks the step crosses out.
    outline: >-
      the cells the reason rests on: "this cell", whose pencil marks the
      step crosses out; a number just placed, whose copies are being crossed
      out around it; the other cells of a block, row or column that between
      them already account for some numbers; the cells a killer sum is left
      to; the only cells that several rows or columns leave for one number;
      or "the middle cell" a step weighs and the cells it reads.
    stripes: >-
      the row, column, block, diagonal or killer cage the sentence names, or
      the several rows or columns it names together: "in this block", "this
      killer cage", "these 2 columns".
deal:
  blocks: cut by the sizes, or where they are one square wide connected blocks as large as a row that tile the board
  cage: the cells in dominoes and then cages of three, at random
  answer: searched under the blocks and the cages
  total: a cage's sum
  given: every square's number, then each hidden with the others of its orbit while the board still finishes; under Killer, every one
  tier: one of the tiers
  divide:
    - { partition: block, equal: w }
    - { partition: cage, pairs: 0.75, most: 3 }
  sample: { search: true }
  hide: given
  hideWhole: { given: { with: Killer } }
  symmetric: symmetry
# Upstream solo.c's order: the blocks, `x`, `k`, the symmetry's code, the tier.
settings:
  blocks:
    kind: blocks
    letter: j
    columns:
      kw: columns-of-sub-blocks
      name: Columns of sub-blocks
      doc: >-
        How many blocks the grid has across and down. Their product is the
        width and height of the grid, and the largest number in it: 3 and 3
        make the usual 9×9 grid of 3×3 blocks, while 2 and 3 make a 6×6 grid
        of blocks 3 wide and 2 high. The grid can hold at most 31 numbers.
    rows:
      kw: rows-of-sub-blocks
      name: Rows of sub-blocks
    rulesets:
      Standard: The blocks are rectangles.
      Jigsaw: The blocks are irregular shapes.
  X:
    kind: flag
    gives: variation
    letter: x
    kw: x
    name: '"X" (require every number in each main diagonal)'
    words: X
    rule: the two long diagonals must also hold every number once.
    note: The grid needs at least 4 numbers.
    bounds: { longer: { min: 4 } }
  Killer:
    kind: flag
    gives: variation
    letter: k
    kw: killer
    name: Killer (digit sums)
    words: Killer
    rule: instead of given numbers, cages are labeled with the sum of their numbers, which may not repeat within a cage.
    note: Killer grids hold at most 9 numbers, and at least 3.
    # A 2 Jigsaw has no Killer board: none in 4,850,000 drawn by upstream's
    # generator (measured 2026-10-06).
    bounds: { longer: { min: 3, max: 9 } }
  symmetry:
    kind: choice
    kw: symmetry
    name: Symmetry
    default: 1
    doc: >-
      The symmetry of the pattern of given numbers: None, 2-way rotation,
      4-way rotation, 2-way mirror, 2-way diagonal mirror, 4-way mirror,
      4-way diagonal mirror or 8-way mirror. A rotation keeps the pattern
      the same when the grid is turned a half (2-way) or a quarter (4-way)
      turn; a mirror keeps it the same when reflected across the middle
      line, or the diagonal for a diagonal mirror, and the 4- and 8-way
      ones combine several of these. Killer puzzles have no given numbers,
      so it makes no difference there.
    choices:
      - { name: None, words: no symmetry, code: a, symmetry: none }
      - { name: 2-way rotation, code: r2, symmetry: halfTurn }
      - { name: 4-way rotation, code: r4, symmetry: quarterTurn }
      - { name: 2-way mirror, code: m2, symmetry: mirrorLeftRight }
      - { name: 2-way diagonal mirror, code: md2, symmetry: mirrorDiagonal }
      - { name: 4-way mirror, code: m4, symmetry: mirrorBothWays }
      - { name: 4-way diagonal mirror, code: md4, symmetry: mirrorBothDiagonals }
      - { name: 8-way mirror, code: m8, symmetry: mirrorEightWays }
# Upstream's: the givens, then a Jigsaw board's blocks, then a Killer
# board's cages and each cage's sum at its first cell, each behind a comma.
id:
  - digits: given
    apart: _
  - { blocks: block, before: ",", counts: false }
  - { blocks: cage, before: ",", counts: false }
  - digits: total
    apart: _
    before: ","
tierLetters: tbiaeu
variations:
  # Blocks one square wide are dealt.
  Jigsaw:
    replace:
      space:
        regions: { block: dealt }
  # The diagonals are units, after the rest.
  X:
    add:
      space: { diagonals: true, units: [diagonals] }
  Killer:
    add:
      space:
        regions: { cage: dealt }
      # No number repeats within a cage.
      shape:
        - "forall r in cage: distinct(value(c) over c in cells(r))"
      # Every cage shows its total.
      clues:
        total:
          at: cage
          complete: true
          value: "range(1, 45)"
          means: "sum(c in cells(at) of value(c)) = v"
      techniques:
        # A placed number leaves the rest of its cage.
        - kind: peer.placed
          as: cageCull
          tier: Easy
          rung: dup
          with:
            peer: "p in cells where p != c and cage(p) = cage(c)"
        # A cage with one open cell holds what its total leaves there. A
        # cage with no total is one the answer's search has not dealt it
        # yet.
        - kind: sum.last
          as: cageSingle
          tier: Single
          with:
            group: >-
              r in cage where clue(total, r) != none,
              K = {c in cells(r) where not known(c)}, t = owed(r)
            set: K
            total: t
          says:
            terms: { r: r, t: t }
            marks: { stripes: "cells(r)" }
            look: "{stripes: This cage}'s other cells leave {numeral t}"
            move: "{ring: its last cell} must be {t}"
        # A row, column or block, the rows first and the blocks last, holds
        # every value once, so its open cells outside every cage whose open
        # cells lie within it, L, make the rest of its sum: one of them
        # alone holds it. Where L lies in one cage, the cage's other open
        # cells, R, make what is left of its total: one of them alone holds
        # that. L in the order of its cages. A sum of nothing or less left
        # is a contradiction.
        - id: regionRule
          tier: Region
          rung: cageSingle
          for: >-
            u in rows + cols + block
            where not (exists r in cage: clue(total, r) = none),
            W = {r in cage where inside(r, u)},
            L = set(c over r in cage where r not in W, c in cells(r)
            where not known(c) and c in cells(u))
            where |L| > 0 and |L| < w,
            s = sum(d in domain of d) - sum(c in cells(u) where known(c) of value(c))
            - sum(r in W of owed(r)),
            R = {c in cells(cage(first(L))) where not known(c) and c not in L},
            t = owed(cage(first(L))) - s
          conclude: >-
            s > 0
            and (|L| != 1 or (s <= w and s in cand(first(L)) and place(first(L), s)))
            and (|L| = 1 or |R| != 1 or (exists c in L: cage(c) != cage(first(L)))
            or (t >= 1 and t <= w and t in cand(first(R)) and place(first(R), t)))
          # The unit, the cages inside it, and what they leave its other
          # open cells; and where those are in one cage, what that leaves
          # the rest of the cage.
          says:
            terms: { s: s, t: t, alone: "|L| = 1" }
            marks:
              stripes: "cells(u)"
              outline: "set(c over r in W, c in cells(r)) + L"
            wordings:
              - when: alone
                look: >-
                  {stripes: This {unit}}'s whole cages and numbers leave
                  {numeral s} for its one other open cell
                move: "{ring} must be {s}"
              - look: >-
                  {stripes: This {unit}} leaves {numeral s} to part of a cage,
                  so {numeral t} to the rest of it
                move: "{ring} must be {t}"
        # Cage by cage, the bounds of what the cage's total leaves. One
        # cage a firing.
        - kind: sum.bounds
          as: cageMinMax
          tier: MinMax
          with:
            group: >-
              r in cage where clue(total, r) != none,
              K = {c in cells(r) where not known(c)}, t = owed(r) where t != 0
            set: K
            total: t
          says:
            terms: { t: t }
            marks: { stripes: "cells(r)" }
            look: >-
              {stripes: This cage}'s open cells make {numeral t}; the
              others leave no room for {struckOr}
        # The same reading of each partial cage the region rule works out,
        # unit by unit: the open cells it leaves the unit, L (i = 0), and
        # where they lie in one cage, that cage's other open cells, R
        # (i = 1), K either. One partial cage a firing. It grades as the
        # cages' reading, and runs where the region rule is in reach.
        - kind: sum.bounds
          as: partMinMax
          tier: MinMax
          rung: cageMinMax
          from: Region
          with:
            group: >-
              u in rows + cols + block
              where not (exists r in cage: clue(total, r) = none),
              W = {r in cage where inside(r, u)},
              L = set(c over r in cage where r not in W, c in cells(r)
              where not known(c) and c in cells(u))
              where |L| > 1 and |L| < w,
              s = sum(d in domain of d) - sum(c in cells(u) where known(c) of value(c))
              - sum(r in W of owed(r)) where s > 0,
              R = {c in cells(cage(first(L))) where not known(c) and c not in L},
              t = owed(cage(first(L))) - s,
              i in range(0, 1),
              K = {c in L + R where (i = 0) = (c in L)},
              v = s * (1 - i) + t * i
              where |K| > 1 and v != 0
              and (i = 0 or (forall c in L: cage(c) = cage(first(L))))
            set: K
            total: v
          says: &partSays
            terms: { s: s, v: v, rest: "i = 1" }
            marks:
              stripes: "cells(u)"
              outline: K
            wordings:
              - when: rest
                look: >-
                  {stripes: This {unit}} leaves {numeral s} to part of a cage,
                  so {numeral v} to {outline: the rest of it}, no room for
                  {struckOr}
              - look: >-
                  {stripes: This {unit}}'s whole cages and numbers leave
                  {numeral v} to {outline: the outlined cells}, no room for
                  {struckOr}
                long: >-
                  it says what the unit's total is spent on as well as what
                  it rules out, and a number struck on a 9x9 leaves up to
                  eight to name
        # Cage by cage, of two to four open cells, or none, which is a cage
        # filled short of its total. One cage a firing.
        - kind: sum.sets
          as: cageSums
          tier: Sums
          with:
            group: >-
              r in cage where clue(total, r) != none,
              K = {c in cells(r) where not known(c)}, t = owed(r)
              where t != 0 and |K| != 1 and |K| <= 4
            set: K
            total: t
          says:
            terms: { t: t }
            marks: { stripes: "cells(r)" }
            look: >-
              No set of different numbers that makes {numeral t} in
              {stripes: this cage}'s open cells has {struckOr}
        # The same reading of each partial cage of two to four cells, as
        # `partMinMax` binds them. With no set of values left, the marks
        # are inconsistent.
        - kind: sum.sets
          as: partSums
          tier: Sums
          rung: cageSums
          from: Region
          with:
            group: >-
              u in rows + cols + block
              where not (exists r in cage: clue(total, r) = none),
              W = {r in cage where inside(r, u)},
              L = set(c over r in cage where r not in W, c in cells(r)
              where not known(c) and c in cells(u))
              where |L| > 1 and |L| < w,
              s = sum(d in domain of d) - sum(c in cells(u) where known(c) of value(c))
              - sum(r in W of owed(r)) where s > 0,
              R = {c in cells(cage(first(L))) where not known(c) and c not in L},
              t = owed(cage(first(L))) - s,
              i in range(0, 1),
              K = {c in L + R where (i = 0) = (c in L)},
              v = s * (1 - i) + t * i
              where |K| > 1 and |K| <= 4 and v != 0
              and (i = 0 or (forall c in L: cage(c) = cage(first(L))))
            set: K
            total: v
          says: *partSays
define:
  # What a cage's total leaves once its filled cells are taken out.
  owed(r): "clue(total, r) - sum(c in cells(r) where known(c) of value(c))"
  # A cage with an open cell, every one of them in unit u.
  inside(r, u): >-
    (exists c in cells(r): not known(c))
    and (forall c in cells(r) where not known(c): c in cells(u))
tiers: [Easy, Normal, Tricky, Hard, Extreme, Unreasonable]
# Killer's cage readings grade on a scale of their own, as upstream's do: a
# board's grade is a tier on each.
scales:
  killer: [Single, MinMax, Sums, Region]
names:
  dup: "a placed number's line and block"
  single: "the only number left in a cell"
  regionsFull: "every other number already placed"
  hiddenSingle: "the only cell left for a number"
  intersect: "a number confined to an overlap"
  set: "numbers already accounted for"
  setRows: "a number confined to as many columns"
  setColumns: "a number confined to as many rows"
  wing: "a wing"
  cageSingle: "a cage's last cell"
  cageMinMax: "the limits of a cage's total"
  cageSums: "the sums that fit a cage"
# The walk's words for how far a placed number reaches: its row, column and
# block, with X on its diagonals, and with Killer on its cage.
steps:
  clean:
    ring: cell
    terms: { X: flag, Killer: flag }
    wordings:
      - when: "X and Killer"
        move: "any number already in its cell's row, column, block, diagonal or cage"
      - when: X
        move: "any number already in its cell's row, column, block or diagonal"
      - when: Killer
        move: "any number already in its cell's row, column, block or cage"
      - move: "any number already in its cell's row, column or block"
  note:
    ring: cell
    terms: { X: flag, Killer: flag, vs: values, unruled: flag }
    wordings:
      - when: unruled
        look: "No number in {ring}'s row, column or block rules one out yet"
        move: "pencil in every one"
      - when: "X and Killer"
        look: >-
          Only {vs} {vs: isn't | aren't} already in {ring}'s row, column,
          block, diagonal or cage
        move: "pencil {vs: it | them} in"
      - when: X
        look: "Only {vs} {vs: isn't | aren't} already in {ring}'s row, column, block or diagonal"
        move: "pencil {vs: it | them} in"
      - when: Killer
        look: "Only {vs} {vs: isn't | aren't} already in {ring}'s row, column, block or cage"
        move: "pencil {vs: it | them} in"
      - look: "Only {vs} {vs: isn't | aren't} already in {ring}'s row, column or block"
        move: "pencil {vs: it | them} in"
  cull:
    ring: cell
    terms: { X: flag, Killer: flag, n: number }
    wordings:
      - when: "X and Killer"
        move: "row, column, block, diagonal or cage"
      - when: X
        move: "row, column, block or diagonal"
      - when: Killer
        move: "row, column, block or cage"
      - move: "row, column or block"
  regionsFull:
    ring: cell
    terms: { X: flag, Killer: flag, n: number }
    wordings:
      - when: "X and Killer"
        look: >-
          Every other number is already in {ring}'s row, column, block,
          diagonal or cage
        move: "it can only be {n}"
      - when: X
        look: "Every other number is already in {ring}'s row, column, block or diagonal"
        move: "it can only be {n}"
      - when: Killer
        look: "Every other number is already in {ring}'s row, column, block or cage"
        move: "it can only be {n}"
      - look: "Every other number is already in {ring}'s row, column or block"
        move: "it can only be {n}"
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  # A value with one place left in a block goes there.
  - kind: one.place
    as: blockSingle
    tier: Easy
    rung: hiddenSingle
    with:
      group: >-
        u in block, placed = set(value(c) over c in cells(u) where known(c)),
        d in domain - placed
      set: cells(u)
      value: d
    says:
      terms: { d: d }
      marks: { stripes: "cells(u)" }
      look: "No other cell in {stripes: this {unit}} can be {d}"
      move: "{ring} must be {d}"
  - { use: latin.hiddenSingle, tier: Normal, rung: hiddenSingle }
  - { use: latin.single, tier: Normal, rung: single }
  # A value whose places left in a row, column or diagonal all lie in one
  # block is struck from the rest of the block; failing that, one whose
  # places left in the block all lie in the line is struck from the rest of
  # the line.
  - id: intersect
    tier: Tricky
    for: >-
      L in rows + cols + diagonals,
      b in block where (exists c in cells(L): block(c) = b),
      d in domain where not (exists c in cells(L): value(c) = d)
      and not (exists c in cells(b): value(c) = d),
      first = ((forall c in cells(L) where d in cand(c): block(c) = b)
      and (exists c in cells(b) where c not in cells(L): d in cand(c)))
    conclude: >-
      (first implies (forall c in cells(b) where c not in cells(L) and d in cand(c): strike(c, d)))
      and (first or ((forall c in cells(b) where d in cand(c): c in cells(L))
      implies (forall c in cells(L) where block(c) != b and d in cand(c): strike(c, d))))
    # The region that confines the value is striped, and the other named.
    says:
      terms: { d: d, first: first, row: "L in rows", col: "L in cols" }
      marks:
        stripes: "{c in cells(L) where first} + {c in cells(b) where not first}"
      look: >-
        Every cell of {stripes: this {unit}} that can still take {d} lies in
        one {if first: block | {if row: row | {if col: column | diagonal}}}
  - { use: latin.set, tier: Hard, rung: set }
  # One value d: the rows lacking it that have no place for it in a set T of
  # the columns lacking it are as many as those columns' others, X0 - T, so
  # they hold d in those columns, and the other rows cannot. More rows than
  # columns is a contradiction. The empty T comes first, and on it every row
  # is checked for a place left for d. `latin.fish` with the rows and the
  # columns swapped, as upstream's matrix has them.
  - id: digitSet
    tier: Extreme
    rung: [setRows, setColumns]
    for: >-
      d in domain,
      Y0 = {L in rows where not (exists c in cells(L): value(c) = d)},
      X0 = range(0, w - 1) - set(x(c) over c in cells where value(c) = d),
      T in subsets(X0) where |T| = 0 or (2 <= |T| and |T| <= |Y0| - 2),
      Y = {L in Y0 where not (exists c in cells(L): x(c) in T and d in cand(c))} where |Y| >= |Y0| - |T|
    conclude: >-
      (|T| > 0 or (forall L in rows: exists c in cells(L): d in cand(c)))
      and |Y| = |Y0| - |T|
      and (forall L in Y0 - Y, c in cells(L) where x(c) in X0 - T and d in cand(c): strike(c, d))
    # Either view gives the strikes, as `latin.fish`'s: the rows Y hold d
    # only in the columns X0 - T, and the columns T only in the other rows.
    # A step names the one over fewer lines.
    says:
      terms: { d: d }
      marks: {}
      arms:
        setRows:
          when: "|Y| <= |T|"
          terms: { two: "|Y| = 2", lines: "|Y|" }
          marks:
            stripes: "set(c over L in Y, c in cells(L))"
            outline: "set(c over L in Y, c in cells(L) where x(c) in X0 - T and d in cand(c))"
          look: >-
            {stripes: These {numeral lines} rows} fit {d} only in {outline},
            taking {if two: both | all {numeral lines}} columns' {d}
        setColumns:
          when: "|Y| > |T|"
          terms: { two: "|T| = 2", lines: "|T|" }
          marks:
            stripes: "{c in cells where x(c) in T}"
            outline: "set(c over L in Y0 - Y, c in cells(L) where x(c) in T and d in cand(c))"
          look: >-
            {stripes: These {numeral lines} columns} fit {d} only in {outline},
            taking {if two: both | all {numeral lines}} rows' {d}
  - { use: latin.wing, tier: Extreme, rung: wing }
