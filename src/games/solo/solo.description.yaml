# yaml-language-server: $schema=../../describe/description.schema.json

# Solo's help page, its rules and its techniques, which `npm run describe`
# compiles to solo.compiled.ts. A block is c rows tall and r columns wide, as the game's rectangularBlocks
# builds it; the sizes are the game's c and r.
game: solo
help:
  rules: |-
    Fill every square with a number so that each number appears once in
    every row, every column and every block marked by thick lines. The game
    mode gives the blocks' shape:

    {{rulesets}}

    Settings add rules, which a board's name says:

    {{modifiers}}
  controls: |-
    To place a number, click in a square to select it, then type the
    number on the keyboard. To erase a number, click to select a square
    and then press Backspace.

    Right-click in a square and then type a number to add or remove the
    number as a pencil mark, indicating numbers that you think
    *might* go in that square. {{sticky-pencil}}

    You can also use the arrow keys to move the selected square around.
    Press Enter to toggle between entering numbers and entering pencil
    marks, and Backspace or Space to clear a square. On grids of more than
    9 numbers, the numbers past 9 are typed as letters.

    {{mark-all}} Once every empty square has marks, the press crosses out
    of each the numbers already placed in its row, column and block, and in
    its diagonal or cage where the board has them. On a grid of 22 numbers
    or more, M is the letter for 22, so there only the button fills the
    marks.
  hints: |-
    **Hint** explains the next step rather than simply making it. It works
    from your own numbers and pencil marks, so it carries on from wherever
    you are; if a number you've entered is wrong, or a cell's pencil marks
    have crossed out its answer, it asks you to fix the highlighted
    mistakes first. It pencils in only as it needs to: a cell with no marks
    counts as holding every number its row, column and block (and, in X
    mode, diagonal, and in Killer mode, cage) don't already hold, and the
    hint writes a cell's marks only when its next step crosses one out or
    reasons from them. Much of a puzzle then needs no marks at all. If you
    would rather it filled in every cell's marks first (the same as
    pressing **Fill marks**), set **Hints pencil in** to **Every candidate first** in
    the preferences.

    {{hint-marks}}

    A few ideas are worth learning by name:

    * **Only one place.** When every other cell of a row, column or block
      rules a number out, it goes in the one cell left.
    * **Confined to an overlap.** When every cell of a row that can still
      take a 1 lies in one block, that block's 1 must be in the row, so the
      1 goes from the rest of the block (and the same the other way round).
    * **Already accounted for.** When some cells of a block can hold only
      certain numbers between them, and there are as many of those numbers
      as cells, those numbers go from every other cell of the block.
    * In Killer mode, **the region total**: every row, column and block
      adds up to the same total (45 on a 9×9 grid), so once its whole cages
      and placed digits are counted, what's left over belongs to the cells
      that remain.

    {{wing:cell}}

    If you've turned on the preference that removes a number from the
    pencil marks it rules out when you place it, the hint leaves that
    tidying to the placement rather than spelling it out as a step of its
    own. On an Unreasonable board, deduction can run out before the grid is
    full; the hint says so rather than guessing.

produces: latin
words:
  cell: cell
  alongside: in a line or block with
sizes:
  c: { min: 2, max: 5 }
  r: { min: 1, max: 5 }
space:
  grid: { w: "c * r", h: "c * r" }
  regions: { box: "blocks(r, c)" }
  # In the order the techniques scan them.
  units: [box, rows, cols]
answer:
  value: { sort: cell, domain: "range(1, c * r)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, c * r)" }
shape:
  - "latin(value, units)"
freedom: { kind: fill }
deal:
  symmetry: of the givens
  tier: one of the tiers
variations:
  # The game deals a jigsaw board at r = 1.
  Jigsaw:
    replace:
      space:
        regions: { box: dealt }
  # The diagonals are units, after the rest.
  X:
    add:
      space: { diagonals: true, units: [diagonals] }
  Killer:
    add:
      space:
        regions: { cage: dealt }
      # No number repeats within a cage.
      shape:
        - "forall r in cage: distinct(value(c) over c in cells(r))"
      # Every cage shows its total.
      clues:
        total:
          at: cage
          complete: true
          value: "range(1, 45)"
          means: "sum(c in cells(at) of value(c)) = v"
define:
  # What a cage's total leaves once its filled cells are taken out.
  owed(r): "clue(total, r) - sum(c in cells(r) where known(c) of value(c))"
  # A cage with an open cell, every one of them in unit u.
  inside(r, u): >-
    (exists c in cells(r): not known(c))
    and (forall c in cells(r) where not known(c): c in cells(u))
tiers: [Easy, Normal, Tricky, Hard, Extreme, Unreasonable]
# Killer's cage readings grade on a scale of their own, as upstream's do: a
# board's grade is a tier on each.
scales:
  killer: [Single, MinMax, Sums, Region]
names:
  dup: "a placed number's line and block"
  single: "the only number left in a cell"
  regionsFull: "every other number already placed"
  hiddenSingle: "the only cell left for a number"
  intersect: "a number confined to an overlap"
  set: "numbers already accounted for"
  wing: "a wing"
  cageSingle: "a cage's last cell"
  cageMinMax: "the limits of a cage's total"
  cageSums: "the sums that fit a cage"
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  # A value with one place left in a box goes there.
  - kind: one.place
    as: boxSingle
    tier: Easy
    rung: hiddenSingle
    with:
      group: >-
        u in box, placed = set(value(c) over c in cells(u) where known(c)),
        d in domain - placed
      set: cells(u)
      value: d
  # A cage with one open cell holds what its total leaves there.
  - kind: sum.last
    as: cageSingle
    tier: Single
    with:
      group: "r in cage, K = {c in cells(r) where not known(c)}, t = owed(r)"
      set: K
      total: t
    # The hint names the cage and the sum its open cell makes.
    says:
      terms: { r: r, c: c, t: t }
      marks: {}
  # A row, column or box, the rows first and the boxes last, holds every
  # value once, so its open cells outside every cage whose open cells lie
  # within it, L, make the rest of its sum: one of them alone holds it. Where
  # L lies in one cage, the cage's other open cells, R, make what is left of
  # its total: one of them alone holds that. L in the order of its cages. A
  # sum of nothing or less left is a contradiction.
  - id: regionRule
    tier: Region
    rung: cageSingle
    for: >-
      u in rows + cols + box,
      W = {r in cage where inside(r, u)},
      L = set(c over r in cage where r not in W, c in cells(r)
      where not known(c) and c in cells(u))
      where |L| > 0 and |L| < w,
      s = sum(d in domain of d) - sum(c in cells(u) where known(c) of value(c))
      - sum(r in W of owed(r)),
      R = {c in cells(cage(first(L))) where not known(c) and c not in L},
      t = owed(cage(first(L))) - s
    conclude: >-
      s > 0
      and (|L| != 1 or (s <= w and s in cand(first(L)) and place(first(L), s)))
      and (|L| = 1 or |R| != 1 or (exists c in L: cage(c) != cage(first(L)))
      or (t >= 1 and t <= w and t in cand(first(R)) and place(first(R), t)))
    # The hint names the unit, the cages counted inside it, what it leaves
    # and its sum, and what that leaves the rest of their cage.
    says:
      terms: { u: u, W: W, L: L, s: s, t: t }
      marks: {}
  # Cage by cage, the bounds of what the cage's total leaves. One cage a
  # firing.
  - kind: sum.bounds
    as: cageMinMax
    tier: MinMax
    with:
      group: "r in cage, K = {c in cells(r) where not known(c)}, t = owed(r) where t != 0"
      set: K
      total: t
    # The hint names the cage, its open cells and what they make.
    says:
      terms: { r: r, K: K, t: t }
      marks: {}
  # The same reading of each partial cage the region rule works out, unit by
  # unit: the open cells it leaves the unit, L (i = 0), and where they lie in
  # one cage, that cage's other open cells, R (i = 1), K either. One partial
  # cage a firing. It grades as the cages' reading, and runs where the region
  # rule is in reach.
  - kind: sum.bounds
    as: partMinMax
    tier: MinMax
    rung: cageMinMax
    from: Region
    with:
      group: >-
        u in rows + cols + box,
        W = {r in cage where inside(r, u)},
        L = set(c over r in cage where r not in W, c in cells(r)
        where not known(c) and c in cells(u))
        where |L| > 1 and |L| < w,
        s = sum(d in domain of d) - sum(c in cells(u) where known(c) of value(c))
        - sum(r in W of owed(r)) where s > 0,
        R = {c in cells(cage(first(L))) where not known(c) and c not in L},
        t = owed(cage(first(L))) - s,
        i in range(0, 1),
        K = {c in L + R where (i = 0) = (c in L)},
        v = s * (1 - i) + t * i
        where |K| > 1 and v != 0
        and (i = 0 or (forall c in L: cage(c) = cage(first(L))))
      set: K
      total: v
    # The hint names the unit, the cages counted inside it, what it leaves
    # and its sum, the rest of their cage and its sum, and which it reads.
    says:
      terms: { u: u, W: W, L: L, s: s, R: R, t: t, i: i }
      marks: {}
  # Cage by cage, of two to four open cells, or none, which is a cage filled
  # short of its total. One cage a firing.
  - kind: sum.sets
    as: cageSums
    tier: Sums
    with:
      group: >-
        r in cage, K = {c in cells(r) where not known(c)}, t = owed(r)
        where t != 0 and |K| != 1 and |K| <= 4
      set: K
      total: t
    # The hint names the cage, its open cells and what they make.
    says:
      terms: { r: r, K: K, t: t }
      marks: {}
  # The same reading of each partial cage of two to four cells, as
  # `partMinMax` binds them. With no set of values left, the marks are
  # inconsistent.
  - kind: sum.sets
    as: partSums
    tier: Sums
    rung: cageSums
    from: Region
    with:
      group: >-
        u in rows + cols + box,
        W = {r in cage where inside(r, u)},
        L = set(c over r in cage where r not in W, c in cells(r)
        where not known(c) and c in cells(u))
        where |L| > 1 and |L| < w,
        s = sum(d in domain of d) - sum(c in cells(u) where known(c) of value(c))
        - sum(r in W of owed(r)) where s > 0,
        R = {c in cells(cage(first(L))) where not known(c) and c not in L},
        t = owed(cage(first(L))) - s,
        i in range(0, 1),
        K = {c in L + R where (i = 0) = (c in L)},
        v = s * (1 - i) + t * i
        where |K| > 1 and |K| <= 4 and v != 0
        and (i = 0 or (forall c in L: cage(c) = cage(first(L))))
      set: K
      total: v
    # As `partMinMax` says.
    says:
      terms: { u: u, W: W, L: L, s: s, R: R, t: t, i: i }
      marks: {}
  - { use: latin.hiddenSingle, tier: Normal, rung: hiddenSingle }
  - { use: latin.single, tier: Normal, rung: single }
  # A value whose places left in a row, column or diagonal all lie in one
  # box is struck from the rest of the box; failing that, one whose places
  # left in the box all lie in the line is struck from the rest of the line.
  - id: intersect
    tier: Tricky
    for: >-
      L in rows + cols + diagonals,
      b in box where (exists c in cells(L): box(c) = b),
      d in domain where not (exists c in cells(L): value(c) = d)
      and not (exists c in cells(b): value(c) = d),
      first = ((forall c in cells(L) where d in cand(c): box(c) = b)
      and (exists c in cells(b) where c not in cells(L): d in cand(c)))
    conclude: >-
      (first implies (forall c in cells(b) where c not in cells(L) and d in cand(c): strike(c, d)))
      and (first or ((forall c in cells(b) where d in cand(c): c in cells(L))
      implies (forall c in cells(L) where box(c) != b and d in cand(c): strike(c, d))))
    # The hint names the value, the line and the box, and which of the two
    # confines it.
    says:
      terms: { L: L, b: b, d: d, first: first }
      marks: {}
  - { use: latin.set, tier: Hard, rung: set }
  # One value d: the rows lacking it that have no place for it in a set T of
  # the columns lacking it are as many as those columns' others, X0 - T, so
  # they hold d in those columns, and the other rows cannot. More rows than
  # columns is a contradiction. The empty T comes first, and on it every row
  # is checked for a place left for d. `latin.fish` with the rows and the
  # columns swapped, as upstream's matrix has them.
  - id: digitSet
    tier: Extreme
    rung: set
    for: >-
      d in domain,
      Y0 = {L in rows where not (exists c in cells(L): value(c) = d)},
      X0 = range(0, w - 1) - set(x(c) over c in cells where value(c) = d),
      T in subsets(X0) where |T| = 0 or (2 <= |T| and |T| <= |Y0| - 2),
      Y = {L in Y0 where not (exists c in cells(L): x(c) in T and d in cand(c))} where |Y| >= |Y0| - |T|
    conclude: >-
      (|T| > 0 or (forall L in rows: exists c in cells(L): d in cand(c)))
      and |Y| = |Y0| - |T|
      and (forall L in Y0 - Y, c in cells(L) where x(c) in X0 - T and d in cand(c): strike(c, d))
    # The hint names the value and the lines it is confined in, either way.
    says:
      terms: { d: d, Y0: Y0, X0: X0, T: T, Y: Y }
      marks: {}
  - { use: latin.wing, tier: Extreme, rung: wing }
# Solo's own sentences, spoken through the hint's voice (`hint.ts`); the Latin
# library's (a lone note, a hidden single, a set across lines, a wing, a
# placement's cull and the opening clean) stay every candidate game's. A value
# prints as the board draws it (1 to 9, then a, b, …), so a total or a sum,
# which the board draws as no value, is said `{numeral …}`. The region a
# sentence is about (`axis`: a row, column, block or diagonal) and a killer
# cage are striped whole, the cells it reasons from are outlined, and the cell
# it decides is ringed.
phrases:
  # The region a sentence names, starting a sentence and inside one.
  UnitRef: "{stripes region: This {axis}}"
  unitRef: "{stripes region: this {axis}}"
  # The region rule, as far as the cage its leftover cells all lie in: the
  # region's whole cages and digits leave `rest` for those cells.
  outsideRest: >-
    {UnitRef}'s whole cages and digits leave {numeral rest} for
    {outline inside: this killer cage's cells in the {axis}}
  # Why a sum's open cells must make `clue`, by where the sum comes from: a
  # cage's own total, a region's, or a region's left to a cage.
  cageSum: >-
    {if byCage: {stripes cage: This killer cage's open cells} make {numeral clue} |
    {if byRegion: {UnitRef}'s whole cages and digits leave
    {outline open: the outlined cell | the outlined cells} {numeral clue} |
    {outsideRest}, so {numeral clue} for {outline open: its other cells}}}
steps:
  # Every cell of the striped region that can take `n` lies in one `target`.
  # Its move is where the walk strikes from.
  intersect:
    ring: cell
    terms: { axis: unit, target: unit, n: number }
    marks: { stripes: [region] }
    look: "In {unitRef}, every cell that can still take {n} lies in one {target}"
    move: "from the rest of the {target}"
  # Other cells inside one region already account for `vs`.
  set:
    ring: cell
    terms: { axis: unit, vs: values }
    marks: { stripes: [region], outline: [set] }
    look: "{outline set: Other cells} in {unitRef} already account for {vs}"
  # A sum with one open cell left: it holds `n`. `fresh` where the sum is a
  # cage's own and no cell of the cage is placed yet.
  cageSingle:
    ring: cell
    terms:
      axis: unit
      n: number
      total: number
      placed: number
      rest: number
      byCage: flag
      byRegion: flag
      fresh: flag
    marks: { stripes: [cage, region], outline: [inside] }
    wordings:
      - when: "byCage and fresh"
        look: "{stripes cage: this killer cage} has only {ring: this cell}"
        move: "it must be its total, {n}"
      - when: byCage
        look: >-
          {stripes cage: this killer cage} must total {numeral total} and its
          other cells already make {numeral placed}
        move: "{ring: its last cell} must be {n}"
      # The one sentence that states the region rule in full, the 45 and
      # all: the residual is the digit, so it says the number once, as what
      # is left over, and has the room.
      - when: byRegion
        look: >-
          {unitRef} must total {numeral total}; the cages and digits inside it
          account for all but {n}
        move: "{ring: its one open cell} must be {n}"
      - look: "{outsideRest}"
        move: "{ring: its last cell} must be {n}"
  # Even the extremes a sum's other cells can reach leave no room for `vs`.
  cageMinMax:
    ring: cell
    terms:
      axis: unit
      vs: values
      clue: number
      rest: number
      byCage: flag
      byRegion: flag
      fresh: flag
    marks: { stripes: [cage, region], outline: [inside, open] }
    wordings:
      - when: "byCage and fresh"
        look: >-
          {stripes cage: This killer cage} must total {numeral clue}; its other
          cells leave no room for {either vs}
      - look: "{cageSum} between them"
  # No way to make a sum uses `vs` in the struck cell.
  cageSums:
    ring: cell
    terms:
      axis: unit
      vs: values
      clue: number
      rest: number
      byCage: flag
      byRegion: flag
      fresh: flag
    marks: { stripes: [cage, region], outline: [inside, open] }
    wordings:
      - when: "byCage and fresh"
        look: >-
          No way to make {stripes cage: this killer cage} total {numeral clue}
          uses {either vs} in {ring: this cell}
      - look: "{cageSum}; no such sum has {either vs}"
