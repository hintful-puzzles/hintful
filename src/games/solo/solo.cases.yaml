ids:
  # Boards upstream's generator wrote, one a mode, read and written back.
  - {id: "3x3:d1b4c6_3_7_2a1g2_6a7b6b5_3a6g7a8_2b4b6a6_4g2a5_6_7_4c9b4d", writesBack: true}
  - {id: "3x3x:9h5c1b6d2a4c7_9a5e6_2e5_4e2a9_7c6a7d5b8c9h8", writesBack: true}
  - id: "9j:e5i4_3b2_6_7a3b5c5_3e1b2b7e9_8c9b8a7_2_4b6_7i4e,_afb__b__aa___ba___b_a___aa__b___c_b_ciaade____ba____bdbbea_a__bf_"
    writesBack: true
  - id: "3x3k:zzzc,__aa____aa____a_b__a_a_aaa__a_____aa___a_a____ca__ba__aaa_________a_____aa__a_aa____ab__a_b_a___ba_a_,5_5_12a13a9_9_16b9a13d9_13_8a7_20e12b11a5_13_17a13a7a5b4a8a14_12a13a15b14b15a12a12b18_4_8b15f10a"
    writesBack: true
  # The givens: a separator with no number before it, a run of blanks
  # straight after a number, a number outside 1 to 9, and the grid cut short
  # or run on. Two runs of blanks in a row read as one, as upstream reads
  # them.
  - {id: "3x3:_zzz1_2", refused: '/"_"/'}
  - {id: "3x3:zzz1_a2", refused: '/"a"/'}
  - {id: "3x3:zzza1_0", refused: DESC_OUT_OF_RANGE}
  - {id: "3x3:zzza1_10", refused: DESC_OUT_OF_RANGE}
  - {id: "3x3:zzza1", refused: DESC_TOO_SHORT}
  - {id: "3x3:zzzd", refused: DESC_TOO_LONG}
  - {id: "3x3:zzza1_2_", refused: DESC_TOO_LONG}
  # A Killer board with no symmetry, and the same with a second sum in the
  # cage holding the first 8, or the first cage's sum left out.
  - id: "3x3ka:zzzc,___a__a__a_________________aaa_a__aa__________a____aaaaaba_aba__aaa_aa_a__a_aaaba_a_aa_a__a_a___aaa__,15_14_8_8a5_12_11d19c5_10_7_11_8_12a14_11f10c12_4a15b9a12a6_17a17a9_10a13a14a12e14a8a6_10a11f11a15a"
    writesBack: true
  - id: "3x3ka:zzzc,___a__a__a_________________aaa_a__aa__________a____aaaaaba_aba__aaa_aa_a__a_aaaba_a_aa_a__a_a___aaa__,15_14_8_8_8_5_12_11d19c5_10_7_11_8_12a14_11f10c12_4a15b9a12a6_17a17a9_10a13a14a12e14a8a6_10a11f11a15a"
    refused: DESC_MALFORMED
  - id: "3x3ka:zzzc,___a__a__a_________________aaa_a__aa__________a____aaaaaba_aba__aaa_aa_a__a_aaaba_a_aa_a__a_a___aaa__,a14_8_8a5_12_11d19c5_10_7_11_8_12a14_11f10c12_4a15b9a12a6_17a17a9_10a13a14a12e14a8a6_10a11f11a15a"
    refused: DESC_MALFORMED
  # The cages' first `a`, joining the top row's fourth and fifth cells,
  # written `__`: each is a cage of one cell.
  - id: "3x3ka:zzzc,_______a__a_________________aaa_a__aa__________a____aaaaaba_aba__aaa_aa_a__a_aaaba_a_aa_a__a_a___aaa__,15_14_8_8a5_12_11d19c5_10_7_11_8_12a14_11f10c12_4a15b9a12a6_17a17a9_10a13a14a12e14a8a6_10a11f11a15a"
    refused: DESC_MALFORMED
  # A Killer board with its givens alone.
  - {id: "3x3ka:zzzc", refused: DESC_TOO_SHORT}
  # A 6 by 6 board upstream dealt, its opening `2_5` written `25`, and with a
  # comma after its givens.
  - {id: "2x3:2_5d1c4d3_2b6_2d2c3d1_5", writesBack: true}
  - {id: "2x3:25d1c4d3_2b6_2d2c3d1_5", refused: DESC_OUT_OF_RANGE}
  - {id: "2x3:2_5d1c4d3_2b6_2d2c3d1_5,", refused: DESC_TOO_LONG}
  # A Jigsaw whose top row's first four cells are a block, the next two a
  # second and the last three a third.
  - id: "9jda:6c5a2d7_2b1e3f5d3_7a8g7a4_3d1f5e1b3_7d9a6c2,cacababaea______bdab_abdb_cdbba__a_d_bcaadbdba__a__dcbca"
    writesBack: true
  # A Jigsaw board's blocks missing, cut short, or run on.
  - id: "9j:e5i4_3b2_6_7a3b5c5_3e1b2b7e9_8c9b8a7_2_4b6_7i4e"
    refused: DESC_TOO_SHORT
  - id: "9j:e5i4_3b2_6_7a3b5c5_3e1b2b7e9_8c9b8a7_2_4b6_7i4e,_afb__b__aa___ba___b_a___aa__b___c_b_ciaade____ba____bdbbea_a__bf"
    refused: DESC_TOO_SHORT
  - id: "9j:e5i4_3b2_6_7a3b5c5_3e1b2b7e9_8c9b8a7_2_4b6_7i4e,_afb__b__aa___ba___b_a___aa__b___c_b_ciaade____ba____bdbbea_a__bf__"
    refused: DESC_TOO_LONG
  - id: "9j:e5i4_3b2_6_7a3b5c5_3e1b2b7e9_8c9b8a7_2_4b6_7i4e,_afb__b__aa___ba___b_a___aa__b___c_b_ciaade____ba____bdbbea_a__bf_,"
    refused: DESC_TOO_LONG

params:
  # Upstream's: the blocks' sizes, `j` for Jigsaw, `x` and `k`, the
  # symmetry where it is not the 2-way rotation, then the tier.
  - {read: "3x3", full: "3x3dt", brief: "3x3"}
  - {read: "9j", full: "9jdt", brief: "9j"}
  - {read: "3x3x", full: "3x3xdt", brief: "3x3x"}
  - {read: "3x3k", full: "3x3kdt", brief: "3x3k"}
  - {read: "3x3ada", full: "3x3ada", brief: "3x3"}
  - {read: "3x3md4", full: "3x3md4dt"}
  - {read: "3x3r2", full: "3x3dt"}
  # A Jigsaw written as a rectangle's sizes, as upstream reads it.
  - {read: "3x3j", full: "9jdt"}
  # A symmetry no encoder writes.
  - {read: "3x3m3", refused: '/"m"/'}
  - {read: "3x3r7", refused: '/"r"/'}
  - {read: "3x3md8", refused: '/"m"/'}
  - {read: "3x3a5", refused: '/"5"/'}
  # Blocks one wide that are not a Jigsaw, more than 31 numbers, and a
  # Killer past 9.
  - {read: "1x3", refused: "Columns of sub-blocks must be at least 2."}
  - {read: "6x6", refused: "Width and height must both be at most 31."}
  - {read: "4x3k", refused: "Killer (digit sums): width and height must both be at most 9."}
  # A grid of 4 numbers has Easy boards alone.
  - {read: "2x2dt", refused: false}
  - {read: "2x2db", refused: "No 4x4 puzzle is Normal."}
  - {read: "4jdb", refused: "No 4x4 puzzle is Normal."}
  - {read: "2x2kdb", refused: "No 4x4 puzzle is Normal."}
  - {read: "3x3", label: "Standard: 3x3 Easy"}
  - {read: "9jdb", label: "Jigsaw: 9x9 Normal"}
  - {read: "3x3xdb", label: "Standard: 3x3 Normal, X"}
  - {read: "3x3ada", label: "Standard: 3x3 Hard, no symmetry"}

positions:
  # The blocks' walls, and the givens.
  - id: "2x2:a3e2_3e4a"
    text: |
      +---+---+---+---+
      | .   3 | .   . |
      +       +       +
      | .   . | .   2 |
      +---+---+---+---+
      | 3   . | .   . |
      +       +       +
      | .   . | 4   . |
      +---+---+---+---+
  # A Killer board: the blocks walled, and each cage's sum after the row of
  # its first square.
  - id: "2x2k:p,__a_a___aac__a_a,5_9_6c4a5a8_3d"
    text: |
      +---+---+---+---+
      | .   . | .   . | 5 9 6
      +       +       +
      | .   . | .   . | 4
      +---+---+---+---+
      | .   . | .   . | 5 8 3
      +       +       +
      | .   . | .   . |
      +---+---+---+---+
  # The board solved.
  - id: "3x3:d1b4c6_3_7_2a1g2_6a7b6b5_3a6g7a8_2b4b6a6_4g2a5_6_7_4c9b4d"
    solve: true
    status: solved
  - id: "3x3k:zzzc,__aa____aa____a_b__a_a_aaa__a_____aa___a_a____ca__ba__aaa_________a_____aa__a_aa____ab__a_b_a___ba_a_,5_5_12a13a9_9_16b9a13d9_13_8a7_20e12b11a5_13_17a13a7a5b4a8a14_12a13a15b14b15a12a12b18_4_8b15f10a"
    solve: true
    status: solved
  # Killer: two 2s in the cage of 8 break the cage alone, its sum still
  # open; and a 4 and a 3 in the cage of 6 overshoot its sum.
  - id: "2x2k:p,__a_a___aac__a_a,5_9_6c4a5a8_3d"
    moves: [{set: [10, 2]}, {set: [13, 2]}]
    breaks: [Killer.shape.0]
  - id: "2x2k:p,__a_a___aac__a_a,5_9_6c4a5a8_3d"
    moves: [{set: [2, 4]}, {set: [3, 3]}]
    breaks: [clue.total]
  # Two 1s in the top-left block, in neither one row nor one column, break
  # it; and two on the long diagonal of a board without X break nothing.
  - id: "2x2:a3e2_3e4a"
    moves: [{set: [0, 1]}, {set: [5, 1]}]
    breaks: [shape.0]
  - id: "2x2:a3e2_3e4a"
    moves: [{set: [0, 1]}, {set: [10, 1]}]
    breaks: []
  # Two 1s in the top row break it.
  - id: "2x2:a3e2_3e4a"
    moves: [{set: [0, 1]}, {set: [2, 1]}]
    breaks: [shape.0]

input:
  # A number typed into the square the cursor is on, and cleared by 0, as
  # by Backspace.
  - id: "2x2:a3e2_3e4a"
    events:
      - {key: down}
      - {key: "1", holds: {values.4: 1}}
      - {key: "0", holds: {values.4: 0}}
