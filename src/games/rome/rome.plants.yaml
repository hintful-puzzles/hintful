# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # A placed arrow struck from its neighbors rather than its area.
  cull:
    for: c in cells where known(c), n = value(c), p in adj4(c)
  # An arrow struck for pointing at any placed square.
  loop:
    for: >-
      c in cells where not known(c), d in cand(c), q = step(c, d) where q !=
      none and known(q)
  # An area of three read as holding every arrow.
  onlyHome:
    for: >-
      r in area where |cells(r)| = 3, d in range(1, 4) where not (exists c in
      cells(r): value(c) = d), k = count(c in cells(r) where not known(c) and d in
      cand(c)) where k < 2
  # Two squares of two arrows each read as a pair whatever the arrows.
  pair:
    for: >-
      r in area, a in cells(r) where not known(a) and |cand(a)| = 2, b in
      before(a, cells(r)) where not known(b) and |cand(b)| = 2
  # The one way into the group read as one way in, whatever else leads there.
  reach:
    for: >-
      H = home, p in cells where not known(p), d in cand(p) where step(p, d) in H
  # A square left three arrows read as left two.
  opposite:
    for: c in cells where not known(c) and |cand(c)| = 3
