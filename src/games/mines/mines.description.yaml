# yaml-language-server: $schema=../../describe/description.schema.json

game: mines
help:
  rules: |-
    Try to expose every square in the grid that is not one of the hidden
    mines, without opening any square that is a mine.

    Every opened square is marked with the number of mines in the
    surrounding 8 squares, if there are any; if not, all the surrounding
    squares are automatically opened.

    The first square you open is guaranteed to be safe, and you are
    guaranteed to be able to solve the whole grid by deduction rather than
    guesswork.
  controls: |-
    {{controls}}

    **Check & save** checks your flags against the mines, as it checks your
    answers in every other puzzle, and highlights a flag on a square with no
    mine under it.
  sections:
    - heading: The first square, and guessing
      body: |-
        The mines are laid out around the first square you open. If you undo
        that first move, the board is not laid out any more: whichever square
        you open next is safe in the same way, and gets a board of its own.

        If a grid seems to need a guess, look again: there is a deduction to
        find, perhaps one about the total number of mines. Every report since
        the game was written in 2005 of a grid with two solutions, or one that
        needed a guess at a safe square, has turned out to be a deduction
        missed rather than a fault in how the grid was made.
  hints: |-
    **Hint** explains the next step rather than simply making it. Each step flags squares that must be mines or opens squares that must be safe. It waits until no flag is wrong, as **Check & save** does. The hint reasons only from the numbers you have opened, never from your flags, since a flag may be a lucky guess until the numbers prove a mine under it: a mine it mentions is one the numbers prove, and flagged by an earlier step if you had not flagged it already. An *unopened* square, in its words, is one that is neither opened nor proved.

    {{hint-marks}}

    A few ideas are worth learning by name:

    * **A number that is full** already touches all its mines, so its other unopened squares are safe; **a number with just enough room** has exactly as many unopened squares as mines still to place, so they are all mines.
    * **Two numbers that share squares.** If one needs more mines than the shared squares can give it, because the other number allows only so many there, its own squares must hold the rest.
    * **A number inside another.** When every unopened square around one number also touches a second, the second's other squares hold exactly the difference between what the two need.
    * **Counting the mines left.** Near the end, numbers whose squares do not overlap may account for every mine still to find, so every other unopened square is safe.

    The first step of a new board opens a square in the middle: no mine is ever laid in the first square you open or beside it.
name: Mines
family: shading
sizes:
  w: { min: 3, max: 9999 }
  h: { min: 3, max: 9999 }
  # The mines the board holds.
  mines: { min: 0, max: 99999 }
space:
  grid: { w: "w", h: "h" }
  units: []
answer:
  # 1 is a mine, 2 a safe square.
  value: { sort: cell, domain: "range(1, 2)" }
define:
  # The squares of S nothing has decided yet.
  open(S): "{d in S where not known(d)}"
  # A number's squares nothing has decided yet.
  unopened(c): open(adj8(c))
  # The mines the number at c still needs among them.
  need(c): "clue(count, c) - count(d in adj8(c) where value(d) = 1)"
  # Whether two numbers' undecided squares meet, which takes them within two
  # squares of each other.
  meet(a, b): >-
    abs(x(a) - x(b)) <= 2 and abs(y(a) - y(b)) <= 2
    and (exists d in unopened(a): d in unopened(b))
  # The mines still to find.
  left: "mines - count(c in cells where value(c) = 1)"
  # The undecided squares outside X.
  outside(X): "{c in cells where not known(c) and c not in X}"
rules:
  total: "count(c in cells where value(c) = 1) = mines"
clues:
  # An opened square's number: it is safe, and it touches that many mines.
  count:
    at: cell
    value: "range(0, 8)"
    means: "value(at) = 2 and count(d in adj8(at) where value(d) = 1) = v"
freedom: { kind: query }
deal:
  answer: >-
    the mines, laid out at the first square opened, none on it or beside it,
    so that the techniques finish the board from there
tiers: [Normal]
techniques:
  # One number with no mines left to find has its unopened squares safe;
  # one needing as many as it has unopened, mines. Its words are the
  # `satisfied` and `full` steps'.
  - kind: count.both
    as: alone
    tier: Normal
    with:
      group: "k in clues(count), c = at(k)"
      set: adj8(c)
      need: need(c)
      rest: 2
      fill: 1
    says: false
  # Two numbers whose undecided squares meet, compared: the first's own
  # squares are mines where it needs as many more as it has, and the second's
  # own squares are then safe. Its words are the pair steps' (`split`,
  # `same`, `more`).
  - kind: count.compare
    as: pair
    tier: Normal
    with:
      group: >-
        k in clues(count), a = at(k) where |unopened(a)| > 0,
        b in within(a, 2) where b != a and clue(count, b) != none and meet(a, b)
      openA: unopened(a)
      openB: unopened(b)
      least: need(a)
      most: need(b)
      fill: 1
      rest: 2
  # A number, i, whose undecided squares all touch another, o: o's squares
  # beyond i's, R, hold exactly the difference, r, and read as a number of
  # their own beside a third, b, as two numbers are paired. Either may need
  # more; heavy says R does.
  - id: region
    tier: Normal
    for: >-
      k in clues(count), o = at(k) where |unopened(o)| > 0,
      i in within(o, 2) where i != o and clue(count, i) != none and |unopened(i)| > 0
      and unopened(i) subset unopened(o) and |unopened(i)| < |unopened(o)|,
      b in within(o, 3) where b != o and b != i and clue(count, b) != none,
      R = unopened(o) - unopened(i), B = unopened(b) where (exists d in R: d in B),
      r = need(o) - need(i), nb = need(b), heavy = (r - nb >= |R - B|)
      where (heavy or nb - r >= |B - R|) and |R - B| + |B - R| > 0
    conclude: >-
      (heavy implies (r - nb = |R - B| and (forall d in R - B: place(d, 1))
        and (forall d in B - R: place(d, 2))))
      and (heavy or (nb - r = |B - R| and (forall d in B - R: place(d, 1))
        and (forall d in R - B: place(d, 2))))
  # Two such regions read against each other as two numbers are: R, o's
  # squares beyond i's, holding r, and S, p's beyond q's, holding s. Where R
  # needs at least as many more as it has squares beyond S, those are mines
  # and S's beyond R are safe. Their squares meet only where o and p are
  # within two squares.
  - kind: count.compare
    as: regions
    tier: Normal
    with:
      group: >-
        k in clues(count), o = at(k) where |unopened(o)| > 0,
        i in within(o, 2) where i != o and clue(count, i) != none and |unopened(i)| > 0
        and unopened(i) subset unopened(o) and |unopened(i)| < |unopened(o)|,
        R = unopened(o) - unopened(i), r = need(o) - need(i),
        p in within(o, 2) where p != o and clue(count, p) != none and |unopened(p)| > 0,
        q in within(p, 2) where q != p and clue(count, q) != none and |unopened(q)| > 0
        and unopened(q) subset unopened(p) and |unopened(q)| < |unopened(p)|,
        S = unopened(p) - unopened(q) where (exists d in R: d in S)
      openA: R
      openB: S
      least: r
      most: need(p) - need(q)
      fill: 1
      rest: 2
  # Counting the mines left: numbers whose undecided squares, X, do not
  # meet hold n mines between them, of the L the board still hides. Where n
  # is all of them, the undecided squares outside X are safe; where those
  # are as many as the rest, they are mines. The fewest numbers first, and
  # none at all first of every. Read only once ten numbers or fewer have an
  # undecided square, as upstream's search over sets was.
  #
  # L, and u, the undecided squares, are read once, before the numbers are
  # chosen, to choose them by; the conclusion reads both again, since a
  # solve makes each firing's facts before the next binding.
  - id: count
    tier: Normal
    for: >-
      C = {k in clues(count) where exists d in adj8(at(k)): not known(d)}
      where |C| <= 10,
      L = left, u = count(c in cells where not known(c)),
      size in range(0, 5), T in subsets(C) where |T| = size
      and (forall x in T, y in T where x != y: not meet(at(x), at(y))),
      n = sum(x in T of need(at(x))), X = set(d over x in T, d in unopened(at(x)))
      where u > |X| and (n = L or L - n = u - |X|)
    conclude: >-
      (n = left implies (forall d in outside(X): place(d, 2)))
      and ((n != left and left - n = |outside(X)|)
        implies (forall d in outside(X): place(d, 1)))
# A number is named by its value, and two of one value in a sentence by where
# they sit ("the upper 1"), so "the outlined 1" always means one square: a
# number term `c`, `o` or `i` is the number's square, which the hint's voice
# prints that way, and a count is said `{numeral …}`.
phrases:
  # What a step concludes of the squares it rings: the ringed squares are
  # safe, or each is a mine.
  safe: "{ring: this square | the ringed squares} must be safe"
  mines: "{ring: this square | each ringed one} must be a mine"
  # The squares two numbers share: striped where both sides are numbers,
  # else named, the stripes being a region's.
  shared: >-
    {if both: {stripes shared: {if sharedOne: the striped square | the striped squares}} | the shared squares}
  # A region, the squares of number `o` beyond those of number `i`: striped
  # where it is the one region the sentence marks, named through its two
  # numbers otherwise.
  regionName: >-
    {if striped: {stripes region: {if one: the striped square | the striped squares}} |
    {outline outer: the {o}'s} squares beyond {outline inner: the {i}'s}}
  regionOf: >-
    {if striped: {stripes region: {if one: the striped square's | the striped squares'}} |
    {outline outer: the {o}'s} other squares'}
  # The squares the counted numbers' mines lie in.
  counted: "{stripes counted: {if one: the striped square | the striped squares}}"
steps:
  # No board yet: the mines are laid out round the first square opened.
  firstClick:
    ring: cell
    look: "no mine is ever laid in the first square you open or beside it"
    follows: "{ring} can't hold one"
    move: "open it to begin"
  # A number, `v` its value, already touching all its mines.
  satisfied:
    ring: cell
    terms: { c: number, v: number }
    marks: { outline: [clue, found] }
    move: "{safe}"
    wordings:
      - when: "v = 0"
        look: "{outline clue: the {c}} has no mine around it"
      - when: "v = 1"
        look: "{outline clue: the {c}} already touches {outline found: its mine (outlined)}"
      - when: "v = 2"
        look: "{outline clue: the {c}} already touches {outline found: both its mines (outlined)}"
      - look: "{outline clue: the {c}} already touches {outline found: all {numeral v} of its mines (outlined)}"
  # A number with exactly as many unopened squares, `n`, as mines still to
  # place; `more` where it touches mines already, which "still needs" counts
  # without outlining them.
  full:
    ring: cell
    terms: { c: number, n: number, more: flag }
    marks: { outline: [clue] }
    move: "{mines}"
    wordings:
      - when: more
        look: >-
          {outline clue: the {c}} still needs {numeral n} {n: mine | mines} and has just
          {numeral n} unopened {n: square | squares} left
      - look: "{outline clue: the {c}} has exactly {numeral n} unopened {n: square | squares} around it"
  # Two numbers, or regions read as numbers, whose squares meet. Each side is
  # a clause: a number or a region, saying what it needs, what it allows,
  # its mines, its own squares or how its squares lie inside the other's.
  #
  # Both keep squares of their own: the heavy side needs more than the light
  # side allows, `n`, in the shared squares, so its own are mines.
  split:
    ring: cell
    terms:
      heavy: &needs { clause: [numberNeeds, regionNeeds] }
      light: { clause: [numberAllows, regionAllows] }
      n: number
      both: flag
      sharedOne: flag
    marks: &sharedMark { stripes: [shared] }
    look: "{heavy}; {light} at most {numeral n} in {shared}"
    move: "{mines}"
  # The leg after `split`'s mines: the light side's are all shared.
  splitThen:
    ring: cell
    terms: { light: &theMines { clause: [numberMines, regionMines] }, both: flag, sharedOne: flag }
    marks: *sharedMark
    look: "that puts {light} in {shared}"
    move: "{safe}"
  # `split`, said for its safe squares alone, its mines flagged already.
  splitSafe:
    ring: cell
    terms: { heavy: *needs, light: *theMines, both: flag, sharedOne: flag }
    marks: *sharedMark
    look: "{heavy}, which leaves {light} in {shared}"
    move: "{safe}"
  # The inner side's squares all lie inside the outer's, and both need `n`:
  # the outer's own squares are safe.
  same:
    ring: cell
    terms:
      inner: &own { clause: [numberOwn, regionOwn] }
      outer: { clause: [numberAround, regionAround] }
      n: number
    look: "{inner} {outer}, and both need {numeral n} {n: mine | mines}"
    move: "{safe}"
  # The inner side's squares, which hold at most `n`, all lie inside the
  # outer's, which needs more: the outer's own squares are mines.
  more:
    ring: cell
    terms: { outer: *needs, inner: *own, n: number }
    look: "{outer}, but at most {numeral n} fits in {inner}"
    move: "{mines}"
  # Said before a pair whose side is a region: number `i`'s unopened squares
  # all touch number `o`, whose others hold exactly `n`; `striped` where
  # they are the region the sentence marks.
  regionBefore:
    ring: cell
    terms: { o: number, i: number, n: number, striped: flag }
    marks: { outline: [outer, inner], stripes: [region] }
    look: >-
      {outline inner: the {i}'s} unopened squares all touch {outline outer: the {o}}, whose
      {if striped: {stripes region: others (striped)} | others} hold exactly {numeral n} {n: mine | mines}
  # A number as a side: `c` needing `n`, or `n` more where it touches mines
  # already (`more`).
  numberNeeds:
    ring: cell
    terms: { c: number, n: number, more: flag }
    marks: &clueMark { outline: [clue] }
    move: "{outline clue: the {c}} needs {if more: {numeral n} more | {numeral n} {n: mine | mines}}"
  numberAllows:
    ring: cell
    terms: { c: number }
    marks: *clueMark
    move: "{outline clue: the {c}} allows"
  numberMines:
    ring: cell
    terms: { c: number, n: number }
    marks: *clueMark
    wordings:
      - when: "n = 1"
        move: "{outline clue: the {c}'s} mine"
      - move: "all {numeral n} of {outline clue: the {c}'s} mines"
  # Its squares, striped where they are all shared and nothing else is.
  numberOwn:
    ring: cell
    terms: { c: number, striped: flag, sharedOne: flag }
    marks: { outline: [clue], stripes: [shared] }
    move: >-
      {outline clue: the {c}'s} {if striped: {stripes shared: {if sharedOne: square | squares}} | unopened squares}
  # How the inner side's squares lie inside this, the outer side's: `lone`
  # where the inner side is one square, which only a striped region can be,
  # so never beside a striped outer side.
  numberAround:
    ring: cell
    terms: { c: number, lone: flag }
    marks: *clueMark
    move: "{if lone: touches | all touch} {outline clue: the {c}} too"
  # A region as a side (`regionName`), holding exactly `n`; `one` where it
  # is striped and one square.
  regionNeeds:
    ring: cell
    terms: &regionTerms { o: number, i: number, n: number, striped: flag, one: flag }
    marks: &regionMarks { outline: [outer, inner], stripes: [region] }
    move: "{regionName} {if one: holds | hold} exactly {numeral n} {n: mine | mines}"
  regionAllows:
    ring: cell
    terms: *regionTerms
    marks: *regionMarks
    move: "{regionName} {if one: allows | allow}"
  regionMines:
    ring: cell
    terms: *regionTerms
    marks: *regionMarks
    wordings:
      - when: "n = 1"
        move: "{regionOf} mine"
      - move: "all {numeral n} of {regionOf} mines"
  regionOwn:
    ring: cell
    terms: *regionTerms
    marks: *regionMarks
    move: "{regionName}"
  regionAround:
    ring: cell
    terms: { o: number, i: number, n: number, striped: flag, one: flag, lone: flag }
    marks: *regionMarks
    move: >-
      {if striped: are all among {regionName} | {if lone: touches | all touch} {regionName} too}
  # Every mine is found, `total` of them.
  allFound:
    ring: cell
    terms: { total: number }
    look: "all {numeral total} mines are found"
    move: "{safe}"
  # As many mines left as unopened squares, `left`.
  allMines:
    ring: cell
    terms: { left: number }
    look: >-
      {numeral left} {left: mine is | mines are} left and just {numeral left} unopened {left: square | squares}
    move: "{mines}"
  # The outlined numbers need every mine left, `left`, among squares none of
  # them share (`one` where they are one square): everything else is safe.
  outsideSafe:
    ring: cell
    terms: { left: number, one: flag }
    marks: &countMarks { outline: [numbers], stripes: [counted] }
    move: "{safe}"
    wordings:
      - when: "|outlineNumbers| = 1"
        look: >-
          {numeral left} {left: mine is | mines are} left, and {outline numbers: the outlined number}
          needs {left: it | all {numeral left}} in {counted}
      - look: >-
          {numeral left} {left: mine is | mines are} left, and {outline numbers: the outlined numbers}
          need {left: it | all {numeral left}} in {counted}, which none of them share
        long: &countLong >-
          the numbers' needs add up to the mines left only because none of
          their squares are shared, which the premise has to say
  # They need just `need` of them: everything else is a mine.
  outsideMines:
    ring: cell
    terms: { left: number, need: number, one: flag }
    marks: *countMarks
    move: "{mines}"
    wordings:
      - when: "|outlineNumbers| = 1"
        look: >-
          {numeral left} {left: mine is | mines are} left, and {outline numbers: the outlined number}
          needs just {numeral need} in {counted}
      - look: >-
          {numeral left} {left: mine is | mines are} left, and {outline numbers: the outlined numbers}
          need just {numeral need} in {counted}, which none of them share
        long: *countLong
