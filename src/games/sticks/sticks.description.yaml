# yaml-language-server: $schema=../../describe/description.schema.json

game: sticks
catalog:
  name: Sticks
  aliases: [Tatebo-Yokobo]
  description: Line-drawing puzzle
  objective: Fill in the grid with horizontal and vertical line segments.
  collection: unreleased
  family: lines
  similar: Tatebo-Yokobo (タテボーヨコボー)
help:
  rules: |-
    You are given a grid with several blocks. Fill every blank square with a line, which connects two square edges and goes horizontally or vertically through the center of the square. The lines must follow these rules:

    1. A number overlapping a line indicates the length of that line.
    2. A line can't overlap more than one number.
    3. Numbers in blocks indicate the amount of lines connected to the square.
  controls: |-
    {{controls}}

    Hold Shift or Ctrl while moving the cursor to draw a line through the square it leaves and the square it enters (Shift across the way it moves, Ctrl along it), or both to clear them.
  sections:
    - heading: When a line connects to a block
      body: |-
        A line is connected to a block when it *runs into* it: a horizontal line
        in the square to its left or right, or a vertical line in the square above or
        below. A line lying alongside a block — a vertical line beside it, or a
        horizontal line above it — does not connect to it, and can never come to.
        That is why a block can run out of usable sides long before its number is
        met.
  origins: |-
    This puzzle type was invented by [Nikoli](https://www.nikoli.co.jp/), and is known as *Tatebo-Yokobo*.

    More information: https://www.janko.at/Raetsel/Tateboo-Yokoboo/index.htm
  hints: |-
    **Hint** explains the next step rather than simply making it. It reasons
    only from the numbers and the lines you have placed, so it carries on from
    wherever you are, as long as none of your lines is wrong; if one is, it
    asks you to fix the highlighted mistakes first.

    {{hint-marks}}

    Every step rules one direction out and so leaves the other. The hint
    names the square by its number when it has one ("this 2 must be
    vertical"), and a block's number as "the 2 block". The reasons it
    gives are the rules: a line that would grow too long for its number, one
    that would leave a number too little room to reach its length, one that
    would join two numbers into a single line, one that would run into a
    block that already has all its lines, and one that would close off a
    side a block still needs, which the hint calls an *open side*. When
    one number rules out several squares, the hint walks through them one at
    a time as a single step.

    On an Unreasonable board there comes a point where no square has a
    direction that breaks a rule at once. The hint then says that nothing
    further follows by deduction instead of choosing for you. Save your
    position and try a line in a square beside a number: if it is wrong, a
    few forced squares later some number has no way left to be met. The hint
    carries on from whatever you decide.
produces: links
sizes:
  # Unbounded but by the time a board takes to deal.
  w: { min: 2 }
  h: { min: 2 }
space:
  grid: { w: "w", h: "h" }
  units: []
answer:
  # 1 is a line across, 2 a line up and down, and 3 a block, which holds no
  # line.
  value: { sort: cell, domain: "{d in range(1, 3) where (d = 3) = (clue(block, c) >= 0)}" }
define:
  # The line through c across, or up and down: the squares of its row or
  # column round c holding a line the same way, none where c's line runs the
  # other way.
  horiz(c): "stretch(row(c), c, {x in cells(row(c)) where value(x) = 1})"
  vert(c): "stretch(col(c), c, {x in cells(col(c)) where value(x) = 2})"
  # The line through c.
  stick(c): "horiz(c) + vert(c)"
  numbered(x): "clue(length, x) >= 0"
  # The numbered squares on the line a square is part of.
  joined(k): "{j in stick(k) where numbered(j)}"
  # Whether the line in square p, beside block b, runs into it.
  meets(p, b): "(value(p) = 1 and y(p) = y(b)) or (value(p) = 2 and x(p) = x(b))"
  # A square of no block whose line is still open.
  blank(c): "not known(c) and clue(block, c) < 0"
  # Whether square x of line L could still hold numbered square k's line
  # running along L, the way d: it is no block, holds no line the other way,
  # and with that line its line would carry no number but k's.
  free(x, k, L, d): >-
    clue(block, x) < 0 and (not known(x) or value(x) = d)
    and (forall y in stretch(L, x, {z in cells(L) where value(z) = d or z = x}):
    y = k or not numbered(y))
  # The most squares numbered square k's line can still reach, the way its
  # line runs.
  reach(k): >-
    |stretch(row(k), k, {x in cells(row(k)) where free(x, k, row(k), 1)})|
    + |stretch(col(k), k, {x in cells(col(k)) where free(x, k, col(k), 2)})|
  # Whether square x holds a line the way d along line L that joins no
  # number but k's. `room(k)` is the run of such squares through k: on a
  # whole board its line where that carries one number, and on a board being
  # filled the most it can still take. `reach` reads the same through the
  # marks, which the rules cannot.
  alone(x, k, L, d): >-
    value(x) = d and (forall y in stretch(L, x, {z in cells(L) where value(z) = d or z = x}):
    y = k or not numbered(y))
  room(k): >-
    |stretch(row(k), k, {x in cells(row(k)) where alone(x, k, row(k), 1)})|
    + |stretch(col(k), k, {x in cells(col(k)) where alone(x, k, col(k), 2)})|
  # How many of block b's sides a line could still run into it from.
  sides(b): "count(p in adj4(b) where clue(block, p) < 0 and (not known(p) or meets(p, b)))"
shape:
  # A line overlaps one number at most.
  - "forall c in cells: count(k in stick(c) where numbered(k)) <= 1"
clues:
  # A block, which holds no line.
  block:
    at: cell
    value: "range(0, 0)"
    means: "value(at) = 3"
  # A number on a line: its length. Its line is one of `horiz` and `vert`,
  # the other empty, so their sizes add up to the line's, each bounded on a
  # board being filled. The second half follows from the first where each
  # line carries one number, and breaks once another number or a block has
  # walled the line in short.
  length:
    at: cell
    value: "range(1, max(L in {row(at), col(at)} of |cells(L)|))"
    means: "|horiz(at)| + |vert(at)| = v and room(at) >= v"
  # A number on a block: how many lines run into it.
  joins:
    at: cell
    value: "range(0, 4)"
    means: "value(at) = 3 and count(p in adj4(at) where meets(p, at)) = v"
freedom: { kind: fill }
play:
  values:
    2: { does: place a vertical line in it, key: "1", glyph: " | ", paint: down }
    1: { does: place a horizontal line in it, key: ["2", "0"], glyph: " - ", paint: across }
  given:
    3: { glyph: "###", paint: wall }
  # A click goes round empty and the two lines, the left button vertical
  # first and the right horizontal.
  primary: 2
  secondary: 1
  click: cycle
  # The values are lines, which a drag draws the way it runs.
  straight: true
  # A number on a line sees along it as far as its line runs, which no block
  # of squares bounds.
  plain: [length]
  # Upstream's 7x7, a smaller one, and an upright 8x10 in place of
  # upstream's 10x10, whose Unreasonable deal is the slower past a second.
  boards: [5x5, 7x7, 8x10]
  default: 7x7
  # Every 2x2 board with one answer is finished by the ladder.
  bounds:
    tiers:
      Unreasonable: { area: { min: 5 } }
  hintMarks:
    ring: the square the step decides, with the line it must hold.
    outline: >-
      what the step reasons from: the number or block it is about, and the
      line or the sides that number would break.
deal:
  block: a share of the squares, at random, symmetric as asked
  answer: a line a square, at random
  length: a number on each line, at a random square of it, or as many hidden as the board stays at its tier
  joins: a number on each block, or as many hidden as the board stays at its tier
  tier: one of the tiers
  # The blocks first, at the share and the symmetry the params give
  # (upstream's set_blacks), then a line at random in every other square.
  sample:
    first: { value: 3, share: blocks, symmetry: symmetry }
    scatter: { value: 1, share: 0.5, each: true }
    rest: 2
  # A number on each line, at one of its squares, and the numbers of both
  # kinds hidden in one random order (upstream's single shuffle).
  oneIn: { length: "stick(at)" }
  hide: [length, joins]
  # An Unreasonable board is stripped from every number, as upstream's one
  # strip is: from Easy boards a 7x7 took up to 1.6 s, and from every number
  # 0.4 s (2026-11-22).
  stripFrom: everyClue
settings:
  blocks:
    kind: number
    letter: b
    kw: percentage-of-black-squares
    name: "%age of blocks"
    min: 5
    max: 100
    default: 20
    words: "{n}% blocks"
    doc: Rough percentage of blocks in the grid, from 5 to 100.
  symmetry:
    kind: choice
    letter: s
    kw: symmetry
    name: Symmetry
    default: 2
    doc: >-
      The pattern the blocks follow. <em>None</em> places them freely.
      <em>2-way mirror</em> makes the bottom half a mirror image of the top
      half, and <em>2-way rotational</em> makes the grid look the same
      turned upside down. <em>4-way mirror</em> mirrors top to bottom and
      left to right, and <em>4-way rotational</em> makes the grid look the
      same after a quarter turn, which needs a square grid.
    choices:
      - { name: None, words: no symmetry, symmetry: none }
      - { name: 2-way mirror, symmetry: mirrorTopBottom }
      - { name: 2-way rotational, symmetry: halfTurn }
      - { name: 4-way mirror, symmetry: mirrorBothWays }
      - name: 4-way rotational
        symmetry: quarterTurn
        bounds: { square: true }
# Upstream's game ID: `B` a block, with its number straight after, a number
# on a line after `_` where the square before was written, and a letter a
# run of squares with none.
id:
  - digits: length
    apart: _
    letters: { B: block }
    after: { B: joins }
tiers: [Easy, Unreasonable]
# Every step tries a line one way in a square (`hor`: across) and finds it
# breaks a rule, so the line runs the other way.
kindWords:
  flipTerms: { hor: "a = 2", own: "numbered(c)" }
  flipCell: "{here}"
  flipped: "{if hor: horizontal | vertical}"
phrases:
  # The line a step tries, and the square it tries it in, named by its number
  # where it has one.
  tried: "a {if hor: vertical | horizontal} line"
  here: "{ring: {if own: this {each} | this square}}"
names:
  overConnected: "a block with all its lines"
  twoClues: "a line joining two numbers"
  tooLong: "a line too long for its number"
  starved: "a block needing its open sides"
  unreachable: "a number with no room to reach"
techniques:
  # Each technique supposes a line in a square and finds a number it would
  # break at once, so the square's line runs the other way.
  #
  # A block's number of lines already run into it leaves no room for one
  # more. One with more makes the marks inconsistent.
  - kind: fit.flip
    as: overConnected
    tier: Easy
    with:
      group: "b in cells, n = clue(joins, b) where n >= 0"
      holds: "count(p in adj4(b) where meets(p, b)) <= n"
      scope: "adj4(b)"
    # The hint names the block and outlines the lines that would run into it
    # with the square's supposed line among them.
    says:
      terms: { clue: b, value: n }
      marks: { reads: "{b}" }
      fact:
        marks: { outline: "with place(c, a): {p in adj4(b) where meets(p, b)}" }
        # A black 0 has no line yet for a later leg to name, and nothing
        # runs into it yet, so "another" would be false exactly where the rule
        # is starkest (docs/hints.md § "Sanity-read at the degenerate extremes").
        wordings:
          - when: "n = 0"
            look: "{outline clue: the {value} block} takes no lines, and {tried} on {here} would run into it"
            again: "{tried} would run into {outline clue: the {value} block}"
          - look: "{outline clue: the {value} block} has {outline: its {value: 1 line | {value} lines}}, and {tried} on {here} would add another"
            again: "{outline clue: the {value} block} already has {outline: its {value: 1 line | {value} lines}}, and {tried} would add another"
  # A line would carry two numbers. Before a line too long, which such a
  # line usually is too, since joining the numbers is the rule it breaks.
  - kind: fit.flip
    as: twoClues
    tier: Easy
    with:
      group: "k in cells where numbered(k)"
      holds: "count(j in stick(k) where numbered(j)) <= 1"
      scope: "cells(row(k)) + cells(col(k))"
    # The hint names the numbers the supposed line would join, and outlines it.
    says:
      terms: { clue: k }
      marks: { reads: "{k}" }
      fact:
        terms:
          clues: "with place(c, a): joined(k)"
          run: "with place(c, a): stick(k)"
          n: "with place(c, a): |joined(k)|"
          first: "with place(c, a): clue(length, nth(joined(k), 0))"
          second: "with place(c, a): clue(length, nth(joined(k), 1))"
        marks: { outline: "with place(c, a): stick(k)" }
        # One number per line is the rule, and the help teaches it
        # (docs/hints.md § "Rules belong in the help").
        again: "{tried} would join {outline clues: the same numbers} into one line, {outline run}"
        wordings:
          - when: "with place(c, a): |joined(k)| != 2"
            look: "{tried} on {here} would put {outline clues: {n} numbers} on one line, {outline run}"
          - when: "with place(c, a): clue(length, nth(joined(k), 0)) = clue(length, nth(joined(k), 1))"
            look: "{tried} on {here} would join {outline clues: two {first}s} along {outline run}"
          - look: "{tried} on {here} would join {outline clues: the {first} and the {second}} along {outline run}"
  # A number's line would run longer than it.
  - kind: fit.flip
    as: tooLong
    tier: Easy
    with:
      group: "k in cells, v = clue(length, k) where v >= 0"
      holds: "|stick(k)| <= v"
      scope: "cells(row(k)) + cells(col(k))"
    # The hint names the number and outlines the line it would run to.
    says:
      terms: { clue: k, value: v }
      marks: { reads: "{k}" }
      fact:
        terms:
          size: "with place(c, a): |stick(k)|"
          run: "with place(c, a): stick(k)"
        marks: { outline: "with place(c, a): stick(k)" }
        look: "{tried} on {here} would run {outline clue: the {value}}'s line to {outline run: {size} squares}, too long for it"
        again: "{tried} would run {outline clue: the {value}}'s line to {outline run: {size} squares}"
  # A block would be left fewer sides a line could run into it from than its
  # number.
  - kind: fit.flip
    as: starved
    tier: Easy
    with:
      group: "b in cells, n = clue(joins, b) where n >= 0"
      holds: "sides(b) >= n"
      scope: "adj4(b)"
    # The hint names the block and outlines the sides a line could still reach
    # it from.
    says:
      terms: { clue: b, value: n }
      marks:
        reads: "{b}"
        outline: "{p in adj4(b) where clue(block, p) < 0 and (not known(p) or meets(p, b))}"
      fact:
        again: "{tried} would close a side {outline clue: the {value} block} needs, like {outline: the outlined one | the outlined ones}"
        wordings:
          - when: "n = 1"
            look: "{outline clue: the {value} block} has one open side, and {tried} on {here} would close it"
          - when: "n = 2"
            look: "{outline clue: the {value} block} needs {outline: both outlined sides}, and {tried} on {here} shuts one"
          - look: "{outline clue: the {value} block} needs {outline: {value} outlined sides}, and {tried} on {here} shuts one"
  # A number's line would be left no room to reach its length.
  - kind: fit.flip
    as: unreachable
    tier: Easy
    with:
      group: "k in cells, v = clue(length, k) where v >= 0"
      holds: "not known(k) or reach(k) >= v"
      scope: "cells(row(k)) + cells(col(k))"
    # The hint names the number and outlines the squares its line could still
    # reach, with the square's supposed line.
    says:
      terms: { clue: k, value: v }
      marks: { reads: "{k}" }
      fact:
        terms:
          max: "with place(c, a): reach(k)"
        # Leads with the clue, not with the ruled-out move: the signal a player
        # has to learn to look for here is a number running out of room, which
        # they will not spot from the square being acted on.
        look: "{outline clue: the {value}} needs more room, and {tried} on {here} would leave it {outline: {max: 1 square | {max} squares}}"
        again: "{tried} would leave {outline clue: the {value}} only {outline: {max: 1 square | {max} squares}}"
        marks:
          outline: >-
            with place(c, a):
            stretch(row(k), k, {x in cells(row(k)) where free(x, k, row(k), 1)})
            + stretch(col(k), k, {x in cells(col(k)) where free(x, k, col(k), 2)})
