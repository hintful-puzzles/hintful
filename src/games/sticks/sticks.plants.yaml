# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # The line a square is left with read as the one that breaks the
  # block. Unsound only where the checker reads the supposition: ignoring it,
  # no consistent marks hold more lines into a block than its number.
  overConnected:
    conclude: >-
      forall c in adj4(b) where blank(c), a in cand(c) where (with place(c, 3 -
      a): count(p in adj4(b) where meets(p, b)) > n): place(c, 3 - a)
  # A line's own number read as a second.
  twoClues:
    conclude: >-
      forall c in cells(row(k)) + cells(col(k)) where blank(c), a in cand(c)
      where (with place(c, a): count(j in stick(k) where numbered(j)) >= 1):
      place(c, 3 - a)
  # A line reaching its number's length read as too long.
  tooLong:
    conclude: >-
      forall c in cells(row(k)) + cells(col(k)) where blank(c), a in cand(c)
      where (with place(c, a): |stick(k)| >= v): place(c, 3 - a)
  # A block left just as many open sides as its number read as starved.
  starved:
    conclude: >-
      forall c in adj4(b) where blank(c), a in cand(c) where (with place(c, a):
      sides(b) <= n): place(c, 3 - a)
  # A line left just room enough read as left too little.
  unreachable:
    conclude: >-
      forall c in cells(row(k)) + cells(col(k)) where blank(c), a in cand(c)
      where (with place(c, a): known(k) and reach(k) <= v): place(c, 3 - a)
