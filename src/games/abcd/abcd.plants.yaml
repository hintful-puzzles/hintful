# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # A placed letter struck from the squares diagonally beside it too: the
  # boundary of the rule, sharper than the kind's plant.
  placed:
    for: c in cells where known(c), n = value(c), p in adj8(c) where not known(p)
  # A line one letter short of its number read as holding them all.
  satisfied:
    for: >-
      q in clues(count), L = at(q), d = per(q), v = v(q) where holds(L, d) + 1
      >= v
    conclude: "forall c in cells(L) where not known(c): strike(c, d)"
  # A stretch of even length read as having one shape too.
  runs:
    conclude: "forall c in O where index(c, stretch(L, c, O)) mod 2 = 0: place(c, d)"
  # A placed letter struck from the squares two steps from it.
  placedDiagonal:
    for: >-
      c in cells where known(c), n = value(c), q in adj4(c), p in adj4(q) where p
      != c and not known(p)
