# yaml-language-server: $schema=../../describe/description.schema.json

game: abcd
catalog:
  name: ABCD
  description: Letter placement puzzle
  objective: Place letters according to the numbers. Identical letters cannot touch.
  collection: unreleased
  family: numbers
  similar: ABC-Kombi
help:
  rules: |-
    You're given an empty grid, and several rows of numbers on the side. You have to write a letter in every empty cell, following these rules:

    1. The numbers on the edge indicate how many instances of a specific letter appear in that row or column.
    2. Identical letters cannot be horizontally or vertically adjacent.

    One setting adds to the second rule, and a board's name in the Type menu says when it is on:

    {{modifiers}}
  controls: |-
    Left-click to select a cell, then type a letter on your keyboard to enter it. Press Backspace or Space to clear a cell.

    Right-click a cell, then type a letter to add a pencil mark. Pencil marks can be used for any purpose. {{sticky-pencil}}

    You can also use the arrow keys to move the selected cell around. Press Enter to toggle between entering letters and entering pencil marks.

    {{mark-all}} Once every empty cell has marks, the press crosses out a letter where a neighboring cell already holds it.
  origins: |-
    The inventor of this type is unknown. This puzzle is also known under the names *ABCD Puzzle*, *ABC-Kombi* or *ABCD-Rätsel*.

    More information: https://www.janko.at/Raetsel/Abc-Kombi/index.htm
  hints: |-
    **Hint** explains the next step rather than simply making it. It starts by filling in every cell's pencil marks (the same as pressing **Fill marks**), then works from your own marks, so as long as none of them has crossed out a cell's answer it carries on from wherever you are. If you would rather it leave a cell unmarked until a step needs it, set **Hints pencil in** to **Only as needed** in the preferences: a cell with no marks then counts as holding every letter not already beside it.

    {{hint-marks}}

    Most steps are the plain rules at work: a cell with only one pencil mark left, a letter crossed out beside the same letter, or a row that already holds as many of a letter as its number says. One idea goes further. Since no two of the same letter may touch, a stretch of empty cells can hold at most every other cell's worth: 3 in a stretch of 5, 1 in a stretch of 2. When the stretches of a row that can take a letter hold at most exactly as many as the row still needs, every stretch must be full, and a full stretch of odd length has only one shape: that letter in its first cell, its last, and every other cell between.

    On an Unreasonable board there comes a point where none of these settles
    another cell, and the hint says that nothing further follows by deduction
    instead of choosing for you. On some boards that is the very first step.
    Save your position, try a letter, and it carries on from whatever you enter.
produces: numbers
words:
  cell: cell
sizes:
  # Unbounded but by the time a board takes to deal.
  w: { min: 2 }
  h: { min: 2 }
  # The letters, A to the n-th.
  n: { min: 3, max: 9 }
space:
  grid: { w: "w", h: "h" }
  # A letter repeats in a row or column, as often as its number says.
  units: []
answer:
  # Letter A is 1.
  value: { sort: cell, domain: "range(1, n)" }
marks:
  cand: { sort: cell, notation: "set of range(1, n)" }
define:
  # How many of letter d line L holds.
  holds(L, d): "count(c in cells(L) where value(c) = d)"
  # The squares of the set O at an even place in their stretch along line
  # L: as many of a letter as O holds with no two touching.
  most(L, O): "count(c in O where index(c, stretch(L, c, O)) mod 2 = 0)"
shape:
  - "forall c in cells, p in adj4(c): value(p) != value(c)"
clues:
  # A number on the edge: how many of one letter a row or column holds.
  count:
    at: line
    per: value
    value: "range(0, |cells(at)|)"
    means: "holds(at, per) = v"
freedom: { kind: fill }
play:
  numbers: { letters: true }
  cornerCrosses: noDiagonal
  boards: [4x4n4, 5x5n4, 5x7n4, 6x8n4, 6x9n3]
  default: 5x5n4
  variants:
    - { board: 5x5n4, with: [removeClues], tier: Easy }
    - { board: 6x6n5, with: [noDiagonal], tier: Easy }
  hintMarks:
    ring: the cell the step fills in with a letter.
    strike: the pencil marks the step crosses out.
    outline: >-
      the particular cells the reason rests on: "this cell", whose pencil
      marks it crosses out, the letters a row already holds, the cells that
      can still take a letter, or the letter just placed. The number the
      sentence reads ("its one A", "needs 2 more Bs") is drawn in the hint
      color among the clues.
    stripes: 'the row or column the step reasons from: "this row", "this column".'
deal:
  answer: a letter a square, at random, none beside its twin
  count: every number, or as many hidden as the answer stays unique without
  tier: one of the tiers
  sample: { build: true }
  hide: { count: { when: removeClues } }
settings:
  n:
    kind: number
    gives: size
    letter: n
    kw: letters
    name: Letters
    doc: The amount of different letters that can appear in the puzzle. Without diagonal touching there must be at least 5.
    min: 3
    max: 9
    default: 4
    words: "{n} letters"
    # Under 5, diagonal mode can't avoid the no-touch rule in practice.
    least: { noDiagonal: 5 }
  noDiagonal:
    kind: flag
    gives: variation
    letter: D
    kw: no-diagonal-touching
    name: No diagonal touching
    words: no diagonal
    rule: identical letters cannot be diagonally adjacent either.
    note: Counter-intuitively this <em>raises</em> the size limit described above rather than lowering it, the extra restriction gives you more to reason from, so larger boards still work out to a single solution.
  removeClues:
    kind: flag
    letter: R
    kw: remove-clues
    name: Remove clues
    doc: When enabled, some of the number clues are hidden, as many as can go while the puzzle still has one solution at its difficulty. An Easy puzzle stays one the rules alone finish, with less to read them from.
    words: { on: clues hidden, off: every clue showing }
    # Every clue showing, a board of nine squares or fewer is never
    # Unreasonable (upstream abcd.c's `validate_params`).
    offBounds: { tiers: { Unreasonable: { area: { min: 10 } } } }
id:
  - numbers: count
    hidden: "-"
    closed: true
variations:
  noDiagonal:
    add:
      shape:
        - "forall c in cells, p in adj8(c): value(p) != value(c)"
      techniques:
        # A placed letter leaves the squares diagonally beside it.
        - kind: peer.placed
          as: placedDiagonal
          tier: Easy
          with:
            peer: "p in adj8(c) where p not in adj4(c) and not known(p)"
tiers: [Easy, Unreasonable]
names:
  dup: "a placed letter's neighbors"
  single: "the only letter left in a square"
  regionsFull: "every other letter beside it"
  satisfied: "a line with enough of a letter"
  packed: "stretches with no room to spare"
techniques:
  # A placed letter leaves the squares beside it.
  - kind: peer.placed
    as: placed
    tier: Easy
    with:
      peer: "p in adj4(c) where not known(p)"
  # A line holding as many of a letter as its number says has no room for
  # another. One holding more makes the marks inconsistent. The number it
  # reads is outlined in the margin, the letters it holds on the board.
  - id: satisfied
    tier: Easy
    for: "q in clues(count), L = at(q), d = per(q), v = v(q) where holds(L, d) >= v"
    conclude: "holds(L, d) = v and (forall c in cells(L) where not known(c): strike(c, d))"
    # One step strikes the letter from the whole line.
    says:
      shown: value
      terms: { L: L, d: d, v: v, q: q }
      marks:
        stripes: "cells(L)"
        outline: "{c in cells(L) where known(c) and value(c) = d}"
      wordings:
        - when: "v = 0"
          look: "{stripes: this {unit}} must hold {outline q: no {d}}"
        - when: "v = 1"
          look: "{stripes: this {unit}} already holds {outline q: its one} {outline: {d}}"
        - when: "v = 2"
          look: "{stripes: this {unit}} already holds {outline q: both its} {outline: {d}s}"
        - look: "{stripes: this {unit}} already holds {outline q: all {numeral v} of its} {outline: {d}s}"
  # A square down to one letter holds it. One with none left makes the marks
  # inconsistent.
  - kind: one.cell
    as: single
    tier: Easy
  # The open squares of a line that can take a letter fall into stretches,
  # and a stretch of k holds at most every other square's worth, (k + 1) / 2:
  # its squares at an even place. Where the stretches hold just as many as
  # the line still needs, every stretch is full, and one of odd length has
  # only one shape, the letter in its even places.
  - id: runs
    tier: Easy
    rung: packed
    for: >-
      q in clues(count), L = at(q), d = per(q), v = v(q) where v > holds(L, d),
      O = {c in cells(L) where not known(c) and d in cand(c)}
      where most(L, O) = v - holds(L, d)
    conclude: >-
      forall c in O where |stretch(L, c, O)| mod 2 = 1 and index(c, stretch(L, c, O)) mod 2 = 0:
      place(c, d)
    # What the line still needs (`need`; `more` where it holds some), the
    # squares that can still take the letter outlined. Where there are just
    # as many of them as it needs, each must; otherwise they fit only that
    # many apart, each stretch full. A later square of the firing points
    # back at the line, still striped.
    says:
      shown: legs
      terms:
        L: L
        d: d
        q: q
        need: "v - holds(L, d)"
        one: "v - holds(L, d) = 1"
        more: "holds(L, d) > 0"
      marks:
        stripes: "cells(L)"
        outline: "O"
      again: "{stripes: the same striped {unit}}"
      later: "{ring} must be {d} too"
      move: "{ring} must be {d}"
      wordings:
        - when: "|O| = 1"
          look: "{stripes: this {unit}} needs {outline q: {needs}} and no other {noun} in it can take one"
        - when: "|O| = v - holds(L, d)"
          look: "{stripes: this {unit}} needs {outline q: {needs}} and only {outline: the outlined {noun} | the outlined {nouns}} can take one"
        - look: >-
            {stripes: this {unit}} needs {outline q: {needs}}, and {outline: the outlined {noun} | the outlined {nouns}}
            fit only {numeral need} apart
          follows: "each stretch is full"
# The candidate walk's own steps (a note, the opening clean, a cell every
# other letter is beside, a placement's cull), said as ABCD's. The no-touch
# rule is the one thing the two modes say differently, so a sentence saying
# where a letter keeps its twin out of reads `noDiagonal`. A number term is a
# letter; a count of letters is `{numeral …}`.
phrases:
  around: "{if noDiagonal: touching {ring}, even at a corner | beside, above or below {ring}}"
  # What a line still needs of letter `d`: "one A", "2 more As".
  needs: "{if one: one {if more: more {d} | {d}} | {numeral need} {if more: more {d}s | {d}s}}"
steps:
  # A note-less cell's candidates, written because a deduction rests on them;
  # `unruled` where nothing next to it rules any out yet.
  clean:
    ring: cell
    terms: { noDiagonal: flag }
    move: "any letter already {if noDiagonal: touching its cell, even at a corner | beside, above or below its cell}"
  note:
    ring: cell
    terms: { noDiagonal: flag, unruled: flag, vs: values }
    wordings:
      - when: unruled
        look: "No letter stands next to {ring} yet"
        move: "pencil in every one"
      - look: "Only {vs} {vs: isn't | aren't} already {around}"
        move: "pencil {vs: it | them} in"
  # A note-less cell every other letter is ruled out of.
  regionsFull:
    ring: cell
    terms: { noDiagonal: flag, n: number }
    look: "Every other letter is already {around}"
    move: "it can only be {n}"
  # Where a letter just placed rules itself out, after "its" (the
  # `peer.placed` kind's sentence).
  cull:
    ring: cell
    terms: { noDiagonal: flag, n: number }
    move: "{if noDiagonal: eight neighbors | four neighbors}"
