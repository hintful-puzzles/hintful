# yaml-language-server: $schema=../../describe/description.schema.json

game: inertia
help:
  rules: |-
    Slide the ball around the grid picking up the gems. Every time the
    ball moves, it will keep sliding until it either hits a wall, or
    stops on a stop square (the broken circles). Try to collect every
    gem without running into any of the mines.

    If you hit a mine and explode, you can Undo and continue playing; the
    game will track how many times you died.
  controls: |-
    Use the numeric keypad to slide the ball horizontally, vertically or
    diagonally. Alternatively, click on the grid to make the ball move
    towards where you clicked.

    You can also press on the ball itself and drag out the way you want it
    to go: an arrow on the ball shows the direction, and letting go sends
    it. Let go on the ball to call the slide off. This works with a finger
    as well.

    The arrow keys slide the ball horizontally and vertically, and the
    digit keys work like the numeric keypad even without one: 8 is up, 9
    up and right, 6 right, and so on round.
  hints: |-
    **Hint** shows the next slide rather than simply making it. Nothing in
    Inertia is forced by logic, so the hint goes for the gem the fewest
    slides away that the ball can take without leaving any other gem out of
    reach, and tells you what each slide does on the way.

    {{hint-marks}}

    The thing the hint keeps reminding you of is the rule that catches
    everyone out: **you don't choose where you stop.** A slide that collects
    says what brings the ball to a halt — a wall, or a stop square. When a
    slide could grab the outlined gem but would leave the ball somewhere it
    can never reach other gems from, the hint says so and goes another way.
    When the ball has only one way to go, because walls block the rest or
    every other way runs onto a mine, it says that too.

    Using the hint is not the same as using *Show solution…*: only the
    solution marks the game as auto-solved.

    The hint refuses when there is nothing it can do from here: if the ball
    is dead, or has already left a gem where it can never be reached, it
    asks you to undo back to a position where it can, and circles the gems
    it can no longer reach. When every gem can still be reached but no route
    collects them all, it says that no solution can be found from this
    position, and circles nothing.

    **Check & save** asks the hint the same thing, and won't save a position
    it would ask you to undo from.
name: Inertia
family: position
sizes:
  # The game deals six squares at the least; 99 stands for no bound.
  w: { min: 2, max: 99 }
  h: { min: 2, max: 99 }
space:
  grid: { w: "w", h: "h" }
  units: []
position:
  # What each square is: 0 blank, 1 a gem, 2 a mine, 3 a stop square, 4 a
  # wall. Only a gem changes, to blank, as the ball passes over it.
  kind: { domain: "{0, 1, 2, 3, 4}" }
  # 1 on the square the ball is on.
  ball: { domain: "{0, 1}", once: "1" }
freedom: { kind: transition }
define:
  # The ball is on a mine.
  dead: "exists c in cells: ball(c) = 1 and kind(c) = 2"
  # A slide along the squares R stops on its square c: a mine or a stop
  # square catches it, or the square beyond is a wall or off the board.
  halts(R, c): >-
    kind(c) = 2 or kind(c) = 3 or index(c, R) + 1 = |R|
    or kind(nth(R, index(c, R) + 1)) = 4
  # Where the ball setting off from b through its neighbor n stops.
  end(b, n): "first(set(c over R = ray(b, n), c in R where halts(R, c)))"
  # The square a step from b toward c, where n is c's neighbor on the far side
  # from b.
  toward(b, c, n): "cell(x(b) + x(c) - x(n), y(b) + y(c) - y(n))"
  # The ball can come to rest on c: it is there, or some slide that ends
  # there safely sets off from a square it can come to rest on.
  rests(c): >-
    ball(c) = 1 or (kind(c) != 2 and exists n in adj8(c), b in ray(c, n)
    where rests(b) and kind(toward(b, c, n)) != 4: end(b, toward(b, c, n)) = c)
  # Some slide from a square the ball can come to rest on passes over g,
  # whether or not it then ends on a mine.
  swept(g): >-
    exists n in adj8(g), b in ray(g, n) where rests(b) and kind(toward(b, g, n)) != 4,
    s = toward(b, g, n), R = ray(b, s): index(g, R) <= index(end(b, s), R)
moves:
  # The ball on b sets off through its neighbor n, which is no wall, and
  # collects every gem on its way to where it stops.
  slide:
    for: "b in cells where ball(b) = 1, n in adj8(b) where kind(n) != 4"
    set:
      - for: >-
          t = end(b, n), R = ray(b, n),
          c in R where index(c, R) <= index(t, R) and kind(c) = 1
        kind: "0"
      - for: "c = b"
        ball: "0"
      - for: "c = end(b, n)"
        ball: "1"
finish:
  - "forall c in cells: kind(c) != 1"
lose:
  - "dead"
deadEnds:
  # No slide the ball can ever make passes over the gem, so it is never
  # collected.
  stranded: "not dead and exists g in cells where kind(g) = 1: not swept(g)"
deal:
  start: >-
    about a fifth each of walls, stop squares and mines, as many gems as
    mines, each where the ball can collect it and come back, and the ball on
    a stop square
