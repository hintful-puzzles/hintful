# yaml-language-server: $schema=../../describe/description.schema.json

game: map
help:
  rules: |-
    Color the map with four colors, so that no two adjacent regions
    have the same color. (Regions touching at only one corner do not
    count as adjacent.) There is a unique coloring consistent with the
    colored regions you are already given.
  controls: |-
    Drag from a colored region to a blank one to color the latter the
    same color as the former. Drag from outside the grid into a region
    to erase its color. (You cannot change the colors of the regions
    you are given at the start of the game.)

    Or tap a region to select it and press one of the four color buttons
    below the grid, which is the same thing without the drag — each
    button is painted in the color it fills with, and the digit on it is
    the key that does the same from the keyboard. The Clear button
    empties the selected region.

    Right-drag from a colored region to a blank one to add dots marking
    the latter region as *possibly* the same color as the
    former, or to remove those dots again. Pressing the Marks button
    below the grid makes ordinary drags — and the color buttons — leave
    those dots instead of coloring, until you press it again. A
    right-click without a drag does the same as the Marks button and
    selects the region, as it does in the other note-taking puzzles.
    {{sticky-pencil}}

    {{mark-all}} Here that dots all four colors into every blank region
    that has no dots yet. Once every blank region has dots, the press
    removes from each the dots of colors its neighbors already show.

    A region's dots are the colors it might still be, so Check treats a
    set of dots that leaves out the region's real color as a mistake,
    just as it does a wrong color. A region with no dots is simply
    unmarked.

    The selected region is outlined in green inside its border; while
    the buttons leave dots, a small green triangle also sits in its
    top-left corner.

    The keyboard can also be used. Move the cursor with the arrow keys,
    then press a color's digit to fill the region the cursor is on, or
    Backspace to empty it. Enter picks up the color under the cursor and
    a second Enter drops it where you have moved to; pressing Enter twice
    without moving erases instead, on a region you have colored. Space drops what you are carrying as a
    dot rather than as a color.
  hints: |-
    **Hint** explains the next step rather than simply making it. It reads
    dots the same way Check does: what a blank region can be comes from its
    dots, or from all four colors when it has none, less the colors its
    neighbors already show. It places dots itself only when a deduction
    rules out a color no neighbor shows, so a map you have never dotted
    stays undotted until a step needs it. If you would rather the hint
    start from a fully dotted map, set **Hints pencil in** to **Every
    candidate first** in the preferences: it then begins by pressing **Fill
    all pencil marks** twice, just as you would.

    {{hint-marks}}

    The hint names colors by their words, pink, yellow, teal and violet. On
    a dark board the pink is drawn as a maroon and the yellow as a brown,
    and the hint calls them that. A step ends by saying what to do: color
    the region, dot the colors it can still be, or remove the dots it can't.

    The ideas it teaches, from the plainest up:

    * **Three neighbors' colors.** A region that touches three colors must
      be the fourth.
    * **A pair.** Two touching regions that can only be the same two colors
      must use both between them, so any region touching both can be
      neither.
    * **Every color of one region.** On Tricky boards, take a region that
      can only be yellow or pink, with one neighbor dotted yellow and teal
      and another dotted pink and teal. If the middle region is yellow, the
      first neighbor is left teal; if pink, the second is. Either way one of
      them is teal, so a region touching both can't be. If the middle region
      could be teal as well, the same holds for a region touching all three.

    Every hint is a deduction you could have made from what is on the board.
    On an **Unreasonable** board there may come a point where no deduction is
    left and the only way on is to try something and see whether it works —
    that is what [the difficulty name means](features#difficulty). The
    hint says so rather than guessing for you: save your position, try it,
    and undo if it breaks.

    A hint is refused while a color or a set of dots on the board
    contradicts the solution; those regions light up instead, exactly as
    they do for **Check & save**.
name: Map
family: coloring
sizes:
  # The regions, which are the board's cells: the squares the map is drawn
  # on only deal which region borders which.
  n: { min: 5, max: 99999 }
space:
  # A region's neighbors are the regions it shares a border with, which the
  # map deals: no rectangle says them.
  cells: "n"
  units: []
  relations:
    borders: dealt
answer:
  # The four colors.
  value: { sort: cell, domain: "range(1, 4)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, 4)" }
shape:
  - "forall a in cells, b in borders(a): value(b) != value(a)"
freedom: { kind: fill }
deal:
  borders: the map, regions grown from scattered squares, and which border which
  givens: which regions show their color, fewer at higher tiers
  tier: one of the tiers
tiers: [Easy, Normal, Tricky, Unreasonable]
techniques:
  # A colored region's color leaves every region it borders.
  - id: placed
    on: place
    tier: Easy
    for: "c in cells where known(c), k in borders(c) where not known(k)"
    conclude: "strike(k, value(c))"
  # A region down to one color is that color. One with none left makes the
  # marks inconsistent.
  - id: lone
    tier: Easy
    for: "c in cells where not known(c) and |cand(c)| < 2"
    conclude: "|cand(c)| = 1 and place(c, first(cand(c)))"
    says:
      terms: { c: c }
      marks: {}
  # Two bordering regions down to the same two colors use both, so a region
  # bordering both is neither. One pair a firing.
  - id: pair
    tier: Normal
    for: >-
      a in cells where not known(a) and |cand(a)| = 2,
      b in borders(a) where index(b, cells) > index(a, cells) and not known(b)
      and cand(b) = cand(a)
    conclude: >-
      forall k in borders(a) where k in borders(b) and not known(k),
      d in cand(a): strike(k, d)
    says:
      terms: { a: a, b: b, colors: cand(a) }
      marks: {}
  # Every color but x the middle region m can be leaves x alone in a region
  # it borders that is down to that color and x, so a region t bordering one
  # such end for each cannot be x; where m could be x itself, t borders m
  # too. E is the ends, the first of each kind that borders t.
  - id: weigh
    tier: Tricky
    for: >-
      m in cells where not known(m),
      x in domain,
      R = cand(m) - {x} where |R| >= 1
      and (forall a in R: exists k in borders(m): not known(k) and cand(k) = {a, x}),
      t in cells where t != m and not known(t) and x in cand(t)
      and (x not in cand(m) or t in borders(m))
      and (forall a in R: exists k in borders(m): not known(k) and cand(k) = {a, x}
      and k != t and k in borders(t)),
      E = set(first({k in borders(m) where not known(k) and cand(k) = {a, x}
      and k != t and k in borders(t)}) over a in R)
    conclude: "strike(t, x)"
    says:
      terms: { m: m, x: x, E: E, self: "x in cand(m)" }
      marks: {}
