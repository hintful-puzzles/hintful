# yaml-language-server: $schema=../../describe/description.schema.json

game: magnets
help:
  rules: |-
    Each tile covers two squares. Fill each one with either a magnet
    (consisting of a + and − pole) or a neutral tile (green).

    The clues are the numbers round the grid. The number of + poles in
    each row and column must match the clues along the top and left; the
    number of − poles must match the clues along the bottom and right. Two + poles may not be
    orthogonally adjacent to each other, and similarly two − poles.
  controls: |-
    {{controls}}

    A tile marked ? that lies along a row or column brings exactly one +
    and one − to that line, whichever way round it turns out, so it
    counts toward both of the line's numbers.

    {{done-clues}} The keyboard's cursor can step off the grid onto the
    clues, where Enter does the same.
  hints: |-
    **Hint** explains the next step rather than simply making it. It reasons
    only from the numbers, the tiles you have filled in and your ? marks, so
    it carries on from wherever you are, as long as none of those is wrong;
    if one is, it asks you to fix the highlighted mistakes first.

    {{hint-marks}}

    When a step says a tile must be a magnet but not which way round, it
    asks you for a ? mark: right-click the tile until the ? shows. Since a ?
    tile lying along a line brings one + and one − to it, the hint counts it
    toward both of the line's numbers.

    A few ideas are worth learning by name:

    * **Like poles repel.** A pole can't go beside the same pole, so a tile
      whose two ends both touch a + can't be a magnet at all.
    * **A full line.** Once a row has all its +s, no tile lying along it can
      be a magnet, and no other square in it can be +.
    * **No room to spare.** When a line's numbers need a + or − in every one
      of its empty squares, every tile there is a magnet; when they leave
      room for just one more neutral square, every tile lying along it is.
    * **The odd gap.** When a line's empty squares must all hold poles, they
      alternate. If the line needs one more + than −, the extra + comes from
      its one odd-length gap, which must start with +.
produces: numbers
sizes:
  # A line's count is one character of the game ID's alphabet.
  w: { min: 2, max: 61 }
  h: { min: 2, max: 61 }
space:
  grid: { w: "w", h: "h" }
  # The tiles are a dealt partition, each part one tile: two squares side by
  # side, or one square no tile covers.
  regions: { tile: dealt }
  units: []
answer:
  # 1 is a + pole, 2 a neutral square and 3 a − pole, so the other end of a
  # tile holds 4 less the value. A square no tile covers is neutral.
  value:
    sort: cell
    domain: "{d in range(1, 3) where d = 2 or |cells(tile(c))| = 2}"
marks:
  # A tile marked ? is a magnet either way round: neither end is neutral,
  # which the candidates say.
  cand: { sort: cell, notation: "set of range(1, 3)" }
  # A play aid with no meaning for the answer.
  done: { sort: slot, notation: "bool" }
define:
  # The other squares of c's tile.
  others(c): "{p in cells(tile(c)) where p != c}"
  # How many of value d line L holds.
  holds(L, d): "count(c in cells(L) where value(c) = d)"
  # Whether c is an open end of a magnet lying along line L, either way
  # round: neither it nor the tile's other end can be neutral.
  inMagnet(L, c): >-
    not known(c) and 2 not in cand(c)
    and (exists p in others(c): p in cells(L) and not known(p) and 2 not in cand(p))
shape:
  # A tile is two squares at most.
  - "forall c in cells: |cells(tile(c))| <= 2"
  # A tile is a magnet, + at one end and − at the other, or neutral.
  - "forall c in cells, p in others(c): value(p) = 4 - value(c)"
  # Like poles do not touch.
  - "forall c in cells where value(c) != 2, p in adj4(c): value(p) != value(c)"
clues:
  # A number round the grid: how many + poles (1) or − poles (3) a row or
  # column holds. Where a line has both, the game deals its neutral squares'
  # count (2) too, the squares the poles leave.
  count:
    at: line
    per: value
    value: "range(0, |cells(at)|)"
    means: "holds(at, per) = v"
freedom: { kind: fill }
deal:
  tiles: a random tiling, each tile two squares, one square left over where the area is odd
  answer: a few neutral tiles, then a magnet wherever one fits
  count: every number, or as many hidden as the answer stays unique at its tier
  tier: one of the tiers
tiers: [Easy, Normal]
names:
  single: "a square with one choice left"
  count: "a line's counts"
  oddGap: "the odd gap"
  marked: "magnets already counted in a line"
  oneNeutral: "room for just one more neutral"
  everyTile: "a pole needed from every tile"
  onlyEnd: "the only end that can give a pole"
techniques:
  # The other end of a placed tile holds the opposite.
  - id: pair
    on: place
    tier: Easy
    for: "c in cells where known(c), p in others(c) where not known(p)"
    conclude: "place(p, 4 - value(c))"
  # A placed pole leaves the squares beside it.
  - kind: peer.placed
    as: repel
    tier: Easy
    with:
      peer: "p in adj4(c) where n != 2"
  # A value struck from one end of a tile leaves the other end's opposite.
  - id: tile
    on: strike
    tier: Easy
    for: "c in cells, p in others(c)"
    conclude: "forall d in range(1, 3) where d not in cand(c): strike(p, 4 - d)"
  # A square down to one value holds it. One with none left, placed or not,
  # makes the marks inconsistent.
  - kind: one.cell
    as: single
    tier: Easy
    with:
      square: "true"
      move: "(known(c) or place(c, first(U)))"
    says:
      terms: { c: c }
      marks: { reads: "cells(tile(c))" }
  # Upstream scans the columns, then the rows, reading each count of a line
  # in turn. A line holding all of a value its count asks has no room for
  # another; one with just as many open squares able to take it as it still
  # needs takes it in every one. A line holding more, or with too little
  # room, makes the marks inconsistent.
  - kind: count.value
    as: count
    tier: Easy
    with:
      group: "L in cols + rows, d in range(1, 3), v = clue(count, L, d) where v >= 0"
      set: cells(L)
      value: d
      need: v - holds(L, d)
    says:
      terms: { L: L, d: d }
      marks: { reads: "cells(L)" }
      arms:
        # The line holds all of the value its count asks.
        full:
          when: "holds(L, d) = v"
          terms: {}
          marks: {}
        # The line needs as many more as it has squares able to take them.
        exact:
          when: "holds(L, d) < v"
          terms: {}
          marks: {}
  # Where a line's neutral squares are all placed, its open squares are
  # poles, alternating along each stretch, so an even stretch holds as many
  # + as −. A line needing one more of a pole than of the other has it from
  # its odd stretches; where there is one, it starts with that pole.
  - id: oddGap
    tier: Easy
    for: >-
      L in cols + rows, n = clue(count, L, 2) where n >= 0 and holds(L, 2) = n,
      d in range(1, 3) where d != 2 and clue(count, L, d) >= 0 and clue(count, L, 4 - d) >= 0
      and clue(count, L, d) - holds(L, d) = clue(count, L, 4 - d) - holds(L, 4 - d) + 1,
      O = {c in cells(L) where not known(c)},
      S = {c in O where index(c, stretch(L, c, O)) = 0 and |stretch(L, c, O)| mod 2 = 1}
      where |S| = 1
    conclude: "place(first(S), d)"
    says:
      terms: { L: L, d: d }
      marks: { reads: "cells(L)" }
  # A magnet lying along a line brings it one + and one −, whichever way
  # round, so where the line's magnets, both ends of each in M, make up its
  # count of a pole, no other open square of it holds that pole.
  - id: marked
    tier: Normal
    for: >-
      L in cols + rows, M = {c in cells(L) where inMagnet(L, c)} where |M| > 0,
      d in range(1, 3) where d != 2, v = clue(count, L, d)
      where v >= 0 and 2 * (v - holds(L, d)) = |M|
    conclude: "forall c in cells(L) where not known(c) and c not in M: strike(c, d)"
    says:
      terms: { L: L }
      marks: { reads: "cells(L)" }
  # An open tile lying along a line, neutral, would bring it two neutral
  # squares, so a line with room for one more has none.
  - id: oneNeutral
    tier: Normal
    for: "L in cols + rows, n = clue(count, L, 2) where n >= 0 and holds(L, 2) + 1 = n"
    conclude: >-
      forall c in cells(L) where not known(c),
      p in others(c) where p in cells(L) and not known(p):
      strike(c, 2)
    says:
      terms: { L: L }
      marks: { reads: "cells(L)" }
  # A tile brings a line at most one of a pole, so a line needing as many of
  # one as it has open tiles has a pole from each, and none is neutral.
  - id: everyTile
    tier: Normal
    for: >-
      L in cols + rows, d in range(1, 3) where d != 2, v = clue(count, L, d) where v >= 0,
      T = set(tile(c) over c in cells(L) where not known(c))
      where |T| > 0 and v - holds(L, d) = |T|
    conclude: "forall c in cells(L) where not known(c): strike(c, 2)"
    says:
      terms: { L: L, d: d }
      marks: { reads: "cells(L)" }
  # A line needing as many of a pole as it has tiles able to bring one has
  # it from each, so a tile with one end able to holds it there.
  - id: onlyEnd
    tier: Normal
    for: >-
      L in cols + rows, d in range(1, 3) where d != 2, v = clue(count, L, d) where v >= 0,
      O = {c in cells(L) where not known(c) and d in cand(c)},
      T = set(tile(c) over c in O)
      where |T| > 0 and v - holds(L, d) = |T|
    conclude: "forall c in O where not (exists p in others(c): p in O): place(c, d)"
    says:
      terms: { L: L, d: d }
      marks: { reads: "cells(L)" }
# What the hint says. A step is the board as its reading finds it, not a
# firing's formula: the game reads why a pole cannot go where (a pole beside
# it, a line whose count is met, the other end of the tile) off the squares and
# numbers the player sees (`reading.ts`), and supplies each reason as flags and
# the squares and clue digits it names. A line is "this row" or "this column"
# (`axis`, and `across` for the other way) and never a number, since the board
# draws none.
phrases:
  # The pole a step is about (`plus`), and the other one.
  pole: "{if plus: + | −}"
  other: "{if plus: − | +}"
  # A line, striped where it is the one the sentence hatches.
  lineName: "{if hatched: {stripes line: {axis}} | {axis}}"
  # Why the pole cannot go at an end: a like pole beside it (`touch`), or its
  # line's count met (`marked`: only by counting the marked magnets along it).
  because: >-
    {if touch: beside {outline touched: another {pole}} | as its {lineName}
    {if marked: has | already has} {outline clue: all its {pole}s}}
  # The count of the pole a line still needs, `n` of them (`one`: one).
  needs: "{outline clue: {if one: one more {pole} | {n} more {pole}s}}"
  # What the pole would do at the line's other open squares, each ruled out by
  # name: `tiles0`, `tiles1` (the squares are not tiles; one tile), a touch
  # (`touchOwn`: the square's own, `touchPartner`: its other end's, both said
  # as one) and a count met (`fullOwn`, `fullPartner`, `fullMany`: of several
  # squares).
  touches: >-
    {if touchOwn: {if touchPartner: make {outline touchAt: like poles} touch |
    touch {outline touchAt: a {pole}}} | put a {other} beside {outline touchAt:
    a {other}}}
  exceeds: >-
    {if fullOwn: {if fullPartner: exceed {outline fullClues: a clue} | exceed
    {outline fullClues: {if fullMany: a clue | its clue}}} | exceed {outline
    fullClues: a clue}}
  wouldBreak: >-
    a {pole} {outline ruled: {if tiles0: in an outlined square | {if tiles1: in
    the outlined tile | in an outlined tile}}} would {if touchAny: {if fullAny:
    {touches} or {exceeds} | {touches}} | {exceeds}}
steps:
  # A marked magnet whose pole `plus` cannot go at this end, so the end takes
  # the other pole; `hatched` says the sentence's own line is the one met.
  magnetHere:
    ring: square
    terms: { plus: flag, touch: flag, hatched: flag, axis: unit, marked: flag }
    marks: { outline: [magnet, touched, clue], stripes: [line] }
    look: "{outline magnet: This magnet}'s {ring: ringed end} can't be {pole}, {because}"
    move: "it must be {other}"
  # The same, the pole ruled out at the other end of the tile.
  magnetThere:
    ring: square
    terms: { plus: flag, touch: flag, hatched: flag, axis: unit, marked: flag }
    marks: { outline: [magnet, touched, clue], stripes: [line] }
    look: "{outline magnet: This magnet's other end} can't be {pole}, {because}"
    move: "{ring: the ringed end} must be {pole}"
  # Both ends touch the same pole. A tile is a magnet or neutral, so "it can't
  # be a magnet" would only restate that it is neutral.
  bothEndsTouch:
    ring: square
    terms: { plus: flag }
    marks: { outline: [touched] }
    look: "Both ends of {ring: this tile} touch {outline touched: a {pole}}"
    move: "it must be neutral"
  # The tile lies along a line whose count of the pole is met.
  alongFull:
    ring: square
    terms: { plus: flag, hatched: flag, axis: unit }
    marks: { outline: [clue], stripes: [line] }
    look: "{ring: This tile} lies along a {lineName} with {outline clue: all its {pole}s}"
    move: "it must be neutral"
  # Each end is in its own line of one axis, both counts met.
  bothInFull:
    ring: square
    terms: { plus: flag, axis: unit }
    marks: { outline: [clue] }
    look: "Both ends of {ring: this tile} are in {axis}s with {outline clue: all their {pole}s}"
    move: "it must be neutral"
  # Neither end can take the pole, for a different reason at each: `fullBoth`,
  # a count met at each end (in lines of one axis, or of two); else a pole
  # touched at one end and, at the other, another pole (`bTouch`) or a count
  # met.
  neitherEnd:
    ring: square
    terms:
      plus: flag
      fullBoth: flag
      sameAxis: flag
      bTouch: flag
      hatched: flag
      axis: unit
      across: unit
    marks: { outline: [touched, otherTouched, clue, otherClue], stripes: [line] }
    move: "it must be neutral"
    wordings:
      - when: "fullBoth and sameAxis"
        look: >-
          No {pole} fits in {ring: this tile}: it would exceed {outline clue: its
          {axis}'s clue} at both ends
      - when: "fullBoth"
        look: >-
          No {pole} fits in {ring: this tile}: it would exceed {outline clue: its
          {axis}'s clue} at one end and {outline otherClue: its {across}'s} at the
          other
      - look: >-
          No {pole} fits in {ring: this tile}: it would touch {outline touched: a
          {pole}} at one end and {if bTouch: touch {outline otherTouched: a {pole}}
          | exceed its {lineName}'s {outline clue: clue}} at the other
  # One end can take neither pole: `kindTouch`, a pole touched of each kind;
  # `kindFull`, both counts met (`sameAxis`: in lines of one axis); else one
  # pole touched and the other pole's count met (`plus`: the pole the count
  # is met of).
  oneEndNeither:
    ring: square
    terms:
      plus: flag
      kindTouch: flag
      kindFull: flag
      sameAxis: flag
      hatched: flag
      axis: unit
      across: unit
    marks: { outline: [plusAt, minusAt, touched, clue, otherClue], stripes: [line] }
    move: "it must be neutral"
    wordings:
      - when: "kindTouch"
        look: >-
          One end of {ring: this tile} can't be + or −: it touches both {outline plusAt:
          a +} and {outline minusAt: a −}
      - when: "kindFull and sameAxis"
        look: >-
          One end of {ring: this tile} can't be + or −: a + or − would exceed its
          {lineName}'s {outline clue: clues}
      - when: "kindFull"
        look: >-
          One end of {ring: this tile} can't be + or −: a + would exceed its
          {lineName}'s {outline clue: clue}, and a − {outline otherClue: its
          {across}'s}
      - look: >-
          One end of {ring: this tile} can't be + or −: it touches {outline touched: a
          {other}}, and a {pole} would exceed its {lineName}'s {outline clue: clue}
  # Every empty square of the line needs a pole. `k` is how many of the line's
  # clue digits are outlined.
  polesEverywhere:
    ring: square
    terms: { axis: unit, k: number }
    marks: { outline: [clue], stripes: [line] }
    look: >-
      {stripes line: this {axis}}'s {outline clue: clue | clues} {k: needs | need}
      a + or − in every one of its empty squares
    move: "{ring: each ringed tile} must be a magnet"
  # The line has room for one more neutral square, so none of its tiles lying
  # along it can be neutral. `one`: there is one such tile.
  oneNeutralLeft:
    ring: square
    terms: { axis: unit, k: number, one: flag }
    marks: { outline: [clue], stripes: [line] }
    look: >-
      {stripes line: this {axis}}'s {outline clue: clue | clues} {k: leaves |
      leave} room for just one more neutral square
    move: >-
      {ring: {if one: the ringed tile | each ringed tile}} lying along it must be a
      magnet
  # The line needs as many more of a pole as it has undecided tiles.
  tilesNeeded:
    ring: square
    terms: { plus: flag, axis: unit, n: number }
    marks: { outline: [clue], stripes: [line] }
    wordings:
      - when: "n = 1"
        look: >-
          {stripes line: this {axis}} needs {outline clue: one more {pole}} and has
          only {ring: this undecided tile}
        move: "it must be a magnet"
      - look: >-
          {stripes line: this {axis}} needs {outline clue: {n} more {pole}s} and has
          only {n} undecided tiles
        move: "{ring: each ringed tile} must be a magnet"
  # The line needs `n` more of a pole and has exactly `n` squares that can
  # still take one. Where `rest`, each of its other open squares is ruled out by
  # name (`wouldBreak`).
  lineExact:
    ring: square
    long: >-
      The count premise and why every other empty square of the line can't
      take the pole are two premises, already cut to one clause per kind of
      reason (owner, 2026-10-18). Naming the ruled-out squares and the poles
      they would touch by their marks, not "elsewhere", costs the room on a
      line needing several poles (name-every-reference-by-its-mark).
    terms:
      plus: flag
      axis: unit
      n: number
      one: flag
      several: flag
      rest: flag
      tiles0: flag
      tiles1: flag
      touchAny: flag
      touchOwn: flag
      touchPartner: flag
      fullAny: flag
      fullOwn: flag
      fullPartner: flag
      fullMany: flag
    marks: { outline: [clue, ruled, touchAt, fullClues], stripes: [line] }
    wordings:
      - when: "rest"
        look: "{stripes line: this {axis}} needs {needs}; {wouldBreak}"
        move: >-
          {ring: this square | these {live} squares} must be {pole}{if several: s
          | }
      - when: "one"
        look: >-
          {stripes line: this {axis}} needs {outline clue: one more {pole}} and only
          {ring: this square} can take one
        move: "it must be {pole}"
      - look: >-
          {stripes line: this {axis}} needs {outline clue: {n} more {pole}s} and only
          {ring: these {n} squares} can take one
        move: "they must be {pole}s"
  # Every empty square of the line is neutral: its counts leave no room for
  # another pole.
  noPolesLeft:
    ring: square
    terms: { axis: unit, k: number }
    marks: { outline: [clue], stripes: [line] }
    look: >-
      {stripes line: this {axis}}'s {outline clue: clue | clues} {k: leaves |
      leave} no room for another + or −
    move: "{ring: all its empty squares} must be neutral"
  # The line needs `n` more neutral squares and exactly `n` are not in
  # marked magnets.
  neutralExact:
    ring: square
    terms: { axis: unit, n: number }
    marks: { outline: [clue, marked], stripes: [line] }
    wordings:
      - when: "n = 1"
        look: >-
          {stripes line: this {axis}} needs {outline clue: 1 more neutral square};
          only {ring: the ringed one} isn't in {outline marked: a marked magnet
          (outlined)}
        move: "it must be neutral"
      - look: >-
          {stripes line: this {axis}} needs {outline clue: {n} more neutral
          squares}; only {ring: these {n}} aren't in {outline marked: marked
          magnets (outlined)}
        move: "they must be neutral"
  # Every empty square of the line holds a pole, alternating, with one more
  # of a pole than of the other: only the one odd-length gap can supply it.
  oddGap:
    ring: square
    terms: { plus: flag, axis: unit }
    marks: { outline: [clue], stripes: [line] }
    look: >-
      {stripes line: this {axis}}'s empty squares take alternating poles,
      {outline clue: one more {pole} than {other}}
    move: "{ring: this odd-length gap} must start with {pole}"
  # The line needs a pole from each tile that can still give one, so each
  # tile crossing it gives it at its one square there.
  onlyEndCrosses:
    ring: square
    long: &onlyEnd >-
      Where a tile lies along the line, its count premise carries three: the
      line's count of tiles, why each other square of it cannot take the pole,
      and why the tile's far end cannot. The owner's 2026-09-22 playtest found
      the second missing, and a step that rests on a fact has to say it.
    terms:
      plus: flag
      axis: unit
      n: number
      one: flag
      several: flag
      rest: flag
      tiles0: flag
      tiles1: flag
      touchAny: flag
      touchOwn: flag
      touchPartner: flag
      fullAny: flag
      fullOwn: flag
      fullPartner: flag
      fullMany: flag
    marks: { outline: [clue, ruled, touchAt, fullClues], stripes: [line] }
    look: >-
      {stripes line: this {axis}} needs {needs} from {if one: only {ring: this
      tile} | just {n} tiles}{if rest: ; {wouldBreak} | }
    move: >-
      {ring: this square | these {live} squares} must be {pole}{if several: s | }
  # The same where the tile lies along the line: the count picks the tile, then
  # its far end is ruled out (`endTouch`: a like pole beside it; `endPartnerTouch`:
  # the opposite pole beside its other end; else a count met, of one clue
  # (`endOne`) or of several) to pick the end.
  onlyEndAlong:
    ring: square
    long: *onlyEnd
    terms:
      plus: flag
      axis: unit
      n: number
      one: flag
      rest: flag
      tiles0: flag
      tiles1: flag
      touchAny: flag
      touchOwn: flag
      touchPartner: flag
      fullAny: flag
      fullOwn: flag
      fullPartner: flag
      fullMany: flag
      endTouch: flag
      endPartnerTouch: flag
      endOne: flag
    marks:
      outline: [clue, ruled, touchAt, fullClues, far, endAt, endClue]
      stripes: [line]
    look: >-
      {stripes line: this {axis}} needs {needs} from {if one: only {ring: this
      tile} | just {n} tiles}{if rest: ; {wouldBreak} | }. A {pole} at {outline
      far: its far end} would {if endTouch: touch {outline endAt: a {pole}} | {if
      endPartnerTouch: put a {other} beside {outline endAt: a {other}} | exceed
      {outline endClue: {if endOne: its clue | a clue}}}}
    move: "it must go in {ring: the ringed square}"
