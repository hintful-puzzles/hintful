# Clusters' cases, which the engine's tests read
# (src/engine/testing/game-cases.ts): a position for every kind of step its
# hint takes, upstream's dots read as the right pieces, the sizes each tier
# refuses, the dots drawn, and the count's wordings no walk reaches.

