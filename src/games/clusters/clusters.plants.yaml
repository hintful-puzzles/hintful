# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # A dot asked for the room a tile without one needs.
  broken:
    conclude: r >= 2 and (dot(c) = 0 or same(c) <= 1)
  # A tile without a dot refuted with room for two of its color.
  refute:
    for: >-
      x in cells where not known(x), d in domain, n in {x} + adj4(x) where n = x
      or known(n), e in domain where (n = x and e = d) or (n != x and e =
      value(n)), r = room(n, e, x) where ((n = x or e != d) and (r < 1 or
      (dot(n) = 0 and r < 3))) or (n != x and e = d and dot(n) = 1 and same(n)
      >= 1)
