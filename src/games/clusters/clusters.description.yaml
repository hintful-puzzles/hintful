# yaml-language-server: $schema=../../describe/description.schema.json

game: clusters
help:
  rules: |-
    You're given a grid, with several dotted pieces on lighter squares. Your objective is to fill every empty space with one of two pieces, a {{pair:0}} or a {{pair:1}}, while following these rules:

    1. Tiles which are adjacent to 1 other tile of the same kind are denoted with a dot. All of these tiles are given.
    2. All other tiles must be adjacent to 2 or more tiles of the same kind.
  controls: |-
    {{controls}}

    Drag from a square to fill every square you pass over with the piece the press gave the first one. Hold Shift while moving the cursor to put a {{pair:1}} in the squares it passes over, Ctrl to put a {{pair:0}} in them, or both to clear them.
  origins: |-
    This puzzle type was invented by Inaba Naoki under the name *クラスター*, or literally *Kurasuta*, which Google Translate names 'Cluster'. The original puzzles are available here: http://www.inabapuzzle.com/honkaku/kura.html
  hints: |-
    **Hint** explains the next step rather than simply making it. Each step decides the piece in one square, by showing that the other piece would break a rule. It reasons from the dots and the squares you have filled, so it carries on from wherever you are.

    {{hint-marks}}

    On Normal boards a step reads two tiles' counts together, over the squares both touch. A dot that needs one more of its kind, where the other tile's count leaves at least one of the shared squares that kind, has its last one there, so its other empty neighbors take the other kind. A tile that needs more of its kind than the other tile's count allows among the shared squares takes its kind on its other neighbors. The hint outlines both tiles.

    On Unreasonable boards there may come a point where no deduction is left and the only way on is to try a piece and see whether it works. The hint says so rather than guessing for you: save your position, try it, and undo if it breaks.

    The rules a step shows breaking are the ones the puzzle states: a dot touches exactly one square of its own kind, and every other square touches at least two. A square whose neighbors all hold the other piece, or that can only ever match one of them, can't hold that piece.

    If a square you filled holds the wrong piece, the hint asks you to fix the highlighted mistakes first, and the square's background turns red, as it does for **Check & save**, whether or not it breaks a rule yet. The red frame is a different mark: it is drawn as you play, round a square or dot whose rule is broken, and that one may itself be right.
  parameters:
    after: |-
      Normal needs a board with room for the deeper reasoning, so it is not offered on very small grids.
name: Clusters
family: shading
sizes:
  # Fewer than 10,000 squares, and at least two.
  w: { min: 1, max: 9999 }
  h: { min: 1, max: 9999 }
space:
  grid: { w: "w", h: "h" }
  units: []
answer:
  # 1 is the first of the pair, 2 the second.
  value: { sort: cell, domain: "range(1, 2)" }
define:
  # The other color.
  flip(d): "3 - d"
  # 1 where c holds a dot, 0 where it does not.
  dot(c): "count(k in {c} where clue(dot, k) != none)"
  # The squares beside c that hold d or may yet, x left out.
  room(c, d, x): "count(m in adj4(c) where m != x and (not known(m) or value(m) = d))"
  # The squares beside tile c of its own color.
  same(c): "count(m in adj4(c) where value(m) = value(c))"
  # The empty squares beside c.
  open(c): "{m in adj4(c) where not known(m)}"
  # The squares of its color tile c still needs beside it: one for a dot,
  # two for any other tile, less those it has. Below none where it has more.
  lo(c): "2 - dot(c) - same(c)"
  # The most of its empty neighbors tile c may color its own: a dot no more
  # than it needs, any other tile all of them.
  hi(c): "dot(c) * lo(c) + (1 - dot(c)) * |open(c)|"
clues:
  # A dot: its color, and exactly one square beside it of the same.
  dot: { at: cell, value: "range(1, 2)", means: "value(at) = v and count(m in adj4(at) where value(m) = v) = 1" }
shape:
  # Every tile without a dot touches at least two of its own color.
  - "forall c in cells where clue(dot, c) = none: count(m in adj4(c) where value(m) = value(c)) >= 2"
freedom: { kind: fill }
deal:
  dot: which squares carry a dot, and their colors
  tier: one of the tiers
tiers: [Easy, Normal, Unreasonable]
techniques:
  # A tile that can no longer have its own color beside it as its rule says
  # makes the marks inconsistent: one with no room left for it, one without a
  # dot with room for only one, a dot with two already.
  - id: broken
    tier: Easy
    for: "c in cells where known(c), r = room(c, value(c), c)"
    conclude: "r >= 1 and (dot(c) = 1 or r >= 2) and (dot(c) = 0 or same(c) <= 1)"
  # A square where color d would break a rule at once, at n, the square
  # itself or a tile beside it of color e: n left too little room beside it
  # for its own color, or a dot of color d that already has its one. The
  # square takes the other color.
  - id: refute
    tier: Easy
    for: >-
      x in cells where not known(x), d in domain,
      n in {x} + adj4(x) where n = x or known(n),
      e in domain where (n = x and e = d) or (n != x and e = value(n)),
      r = room(n, e, x)
      where ((n = x or e != d) and (r < 1 or (dot(n) = 0 and r < 2)))
      or (n != x and e = d and dot(n) = 1 and same(n) >= 1)
    conclude: "place(x, flip(d))"
    # The hint names the color the square must be and the one that breaks, and
    # how: at the square itself or at the tile beside it (outlined), by having
    # no room or too little, or by a dot that has its one. It reads the squares
    # round the square and round that tile.
    says:
      terms: { fill: flip(d), refuted: d }
      marks: { outline: "{n}", reads: "{x} + adj4(x) + {n} + adj4(n)" }
      # Where a second mark is on the board, "this square" is tied to it by
      # geometry ("its outlined neighbor"), never by color: a sentence naming
      # a hue is wrong where the scheme flips or the reader is color-blind.
      # The two arms that break the square itself have no second mark.
      arms:
        selfSurrounded:
          when: "n = x and r < 1"
          look: "Every neighbor of {ring} holds a {piece fill}. Holding a {piece refuted}, it could never touch another {piece refuted}"
          move: "it must hold a {piece fill}"
        selfReach:
          when: "n = x"
          # An empty square is never a dot. Count- and edge-neutral: at a
          # corner the board edge does part of the hemming, and "at most one"
          # stays honest when one open neighbor remains.
          look: "If {ring} held a {piece refuted}, at most one neighbor could ever match it, but it needs two"
          move: "it must hold a {piece fill}"
        nearSurrounded:
          when: "e != d and r < 1"
          look: "A {piece refuted} in {ring} would seal {outline: its outlined {piece fill} neighbor} off from other {piece fill}s"
          move: "{ring} must hold a {piece fill}"
        nearReach:
          when: "e != d"
          look: "If {ring} held a {piece refuted}, {outline: its outlined {piece fill} neighbor} couldn't touch two {piece fill}s"
          move: "{ring} must hold a {piece fill}"
        dotOvercount:
          when: "true"
          # "its one" carries the rule (a dot touches exactly one piece of its
          # kind), and the rule itself is the help's to state.
          look: "{outline: the outlined dotted {piece refuted}} beside {ring} already touches its one {piece refuted}"
          move: "{ring} must hold a {piece fill}"
  # Two tiles over the empty squares both touch, S: b's count says at least
  # so many of them take a's color, and that is all a may take, so a's other
  # empty neighbors take the other color.
  - id: countFull
    tier: Normal
    for: >-
      a in cells where known(a) and hi(a) > 0,
      b in within(a, 2) where b != a and known(b),
      S = {u in open(a) where u in adj4(b)}, R = {u in open(a) where u not in adj4(b)},
      bo = count(u in open(b) where u not in adj4(a))
      where |S| > 0 and |R| > 0
      and ((value(b) = value(a) and lo(b) - bo >= hi(a))
      or (value(b) != value(a) and |S| - hi(b) >= hi(a)))
    conclude: "forall u in R: place(u, flip(value(a)))"
    # The hint names both tiles, each by its color and whether it is a dot, and
    # outlines them; every square it colors is a step of its own. It reads the
    # squares round both tiles and round each square it colors.
    says:
      shown: each
      terms: { fill: flip(value(a)), a: a, aValue: value(a), aDot: dot(a), b: b, bValue: value(b), bDot: dot(b) }
      marks: { outline: "{a} + {b}", reads: "{a} + adj4(a) + {b} + adj4(b) + set(m over u in R, m in {u} + adj4(u))" }
      # The squares the two tiles share are "also touch"; the tiles are told
      # apart by piece and dot, or, where those agree, by order ("the other").
      wordings:
        - when: "aValue = bValue and aDot = bDot"
          look: "{outline a: the outlined {aDot: dotted {piece aValue} | {piece aValue}}}'s last {piece aValue} must also touch {outline b: the other outlined {aDot: dotted {piece aValue} | {piece aValue}}}"
          move: "{ring} must hold a {piece fill}"
        - look: "{outline a: the outlined {aDot: dotted {piece aValue} | {piece aValue}}}'s last {piece aValue} must also touch {outline b: the outlined {bDot: dotted {piece bValue} | {piece bValue}}}"
          move: "{ring} must hold a {piece fill}"
  # Two tiles over the empty squares both touch, S: b's count says at most
  # `most` of them take a's color, fewer than all, and a needs every other
  # empty neighbor of its color too.
  - id: countShort
    tier: Normal
    for: >-
      a in cells where known(a) and lo(a) > 0,
      b in within(a, 2) where b != a and known(b),
      S = {u in open(a) where u in adj4(b)}, R = {u in open(a) where u not in adj4(b)},
      bo = count(u in open(b) where u not in adj4(a)),
      alike = count(k in {b} where value(k) = value(a)),
      most = alike * hi(b) + (1 - alike) * (|S| - lo(b) + bo)
      where |S| > 0 and |R| > 0 and most < |S| and lo(a) - most >= |R|
    conclude: "forall u in R: place(u, value(a))"
    # As the other, and how many of the shared squares may take the first
    # tile's color.
    says:
      shown: each
      terms: { fill: value(a), a: a, aValue: value(a), aDot: dot(a), b: b, bValue: value(b), bDot: dot(b), most: most }
      marks: { outline: "{a} + {b}", reads: "{a} + adj4(a) + {b} + adj4(b) + set(m over u in R, m in {u} + adj4(u))" }
      wordings:
        - when: "most = 0 and aValue = bValue and aDot = bDot"
          look: "{outline b: one outlined {bDot: dotted {piece bValue} | {piece bValue}}} allows no {piece aValue} beside {outline a: the other outlined {aDot: dotted {piece aValue} | {piece aValue}}}"
          move: "{ring} must hold a {piece fill}"
        - when: "most = 0"
          look: "{outline b: the outlined {bDot: dotted {piece bValue} | {piece bValue}}} allows no {piece aValue} beside {outline a: the outlined {aDot: dotted {piece aValue} | {piece aValue}}}"
          move: "{ring} must hold a {piece fill}"
        - when: "aValue = bValue and aDot = bDot"
          look: "{outline b: one outlined {bDot: dotted {piece bValue} | {piece bValue}}} allows at most {spelled most} {most: {piece aValue} | {piece aValue}s} beside {outline a: the other outlined {aDot: dotted {piece aValue} | {piece aValue}}}"
          move: "{ring} must hold a {piece fill}"
        - look: "{outline b: the outlined {bDot: dotted {piece bValue} | {piece bValue}}} allows at most {spelled most} {most: {piece aValue} | {piece aValue}s} beside {outline a: the outlined {aDot: dotted {piece aValue} | {piece aValue}}}"
          move: "{ring} must hold a {piece fill}"
