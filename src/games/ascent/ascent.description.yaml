# yaml-language-server: $schema=../../describe/description.schema.json

game: ascent
produces: numbers
sizes:
  # The board as stored: a hexagonal one sheared, padded with walls, and an
  # Edges one ringed by its arrows. Unbounded but by the time a board takes
  # to deal.
  w: { min: 1 }
  h: { min: 1 }
  # Which squares are neighbors: 0 the four beside, 1 the six of a
  # hexagonal board, 2 the eight around.
  moves: { min: 0, max: 2 }
  # The last number of the path, as many as the squares on it.
  top: { min: 1 }
space:
  grid: { w: "w", h: "h" }
  units: []
answer:
  # A square's number on the path, from 1 to the last, top. A wall or an
  # arrow holds top + 1: it is on no path.
  value:
    sort: cell
    wide: true
    domain: "{d in range(1, top + 1) where (d <= top and open(c)) or (d = top + 1 and not open(c))}"
define:
  # Whether square c is on the path: neither a wall nor an arrow.
  open(c): "clue(wall, c) = none and clue(arrow, c) = none"
  # The squares beside c as the board's ruleset has them. A hexagonal board
  # is stored sheared, so the two diagonal steps that run with the shear
  # are no neighbors.
  nbr(c): >-
    {p in adj8(c) where moves = 2 or (moves = 0 and p in adj4(c))
    or (moves = 1 and x(p) - x(c) != y(p) - y(c))}
  # Whether squares a and b are measured side by side: on a board of four
  # ways, or of six where the offsets run with the shear, which takes two
  # steps a square.
  sideways(a, b): "moves = 0 or (moves = 1 and (x(a) - x(b)) * (y(a) - y(b)) > 0)"
  # Whether squares a and b are at most d steps apart, whatever lies
  # between: the two offsets summed side by side, each alone corner to
  # corner.
  near(a, b, d): >-
    (sideways(a, b) and abs(x(a) - x(b)) + abs(y(a) - y(b)) <= d)
    or (not sideways(a, b) and abs(x(a) - x(b)) <= d and abs(y(a) - y(b)) <= d)
  # Whether some square holds number n.
  held(n): "count(x in cells where value(x) = n) > 0"
  # How far below and above number n the nearest held numbers are, or the
  # path's ends where none is.
  gapBelow(n): "min(j in range(1, n) where j = n or held(n - j) of j)"
  gapAbove(n): "min(j in range(1, top + 1 - n) where j = top + 1 - n or held(n + j) of j)"
  # Whether square a, an Edges board's arrow, points along a line that
  # passes square p: its row from the left or right side, its column from
  # the top or bottom, or a diagonal from a corner.
  online(a, p): >-
    (y(a) > 0 and y(a) < h - 1 and y(p) = y(a))
    or ((y(a) = 0 or y(a) = h - 1) and x(a) > 0 and x(a) < w - 1 and x(p) = x(a))
    or ((y(a) = 0 or y(a) = h - 1) and (x(a) = 0 or x(a) = w - 1)
    and abs(x(p) - x(a)) = abs(y(p) - y(a)))
shape:
  # Every number of the path but the last has the next beside it.
  - "forall c in cells where value(c) < top: exists p in nbr(c): value(p) = value(c) + 1"
  # No number is on the path twice.
  - "forall c in cells where value(c) <= top: count(x in cells where value(x) = value(c)) = 1"
rules:
  # The path runs through every square but the walls and the arrows.
  dealt: "top = count(x in cells where open(x))"
clues:
  # A number given on the path.
  number:
    at: cell
    value: "range(1, w * h)"
    means: "value(at) = v"
  # A square the path does not enter.
  wall:
    at: cell
    value: "range(0, 0)"
    means: "value(at) = top + 1"
freedom: { kind: fill }
deal:
  answer: a path through every open square, each number beside the next
  number: as many hidden as the board stays at its tier
  tier: one of the tiers
variations:
  # Arrows round the board each point along a row, column or diagonal that
  # holds their number.
  Edges:
    add:
      clues:
        arrow:
          at: cell
          value: "range(1, w * h)"
          means: >-
            value(at) = top + 1
            and (exists p in cells where open(p) and online(at, p): value(p) = v)
      techniques:
        # A number is on its arrow's line.
        - id: onLine
          tier: Easy
          for: "a in cells, n = clue(arrow, a) where n != none"
          conclude: "forall p in cells where n in cand(p) and not online(a, p): strike(p, n)"
        # The overlap reading, from Normal on an Edges board.
        - id: overlapEdges
          tier: Normal
          for: "n in range(1, top) where not held(n)"
          conclude: >-
            forall c in cells where n in cand(c)
            and ((n > 1 and not (exists p in nbr(c): n - 1 in cand(p)))
            or (n < top and not (exists p in nbr(c): n + 1 in cand(p)))):
            strike(c, n)
tiers: [Easy, Normal, Tricky, Hard]
names:
  onlySquare: "the only square left for a number"
  nextTo: "a placed number's neighbors on the path"
  reach: "how far a missing number can stray"
  deadEnd: "a square the path can only end in"
  overlap: "a square beside neither neighbor"
  onlyNumberNear: "the only number left beside its neighbor"
  onlyNumber: "the only number left in a square"
  onLine: "a number on its arrow's line"
  overlapEdges: "a square beside neither neighbor"
techniques:
  # A placed number is on no other square.
  - kind: peer.placed
    as: once
    tier: Easy
    with:
      peer: "p in cells where open(c) and p != c and not known(p)"
  # A number with one square left goes there. One with none makes the marks
  # inconsistent.
  - kind: one.place
    as: onlySquare
    tier: Easy
    with:
      group: "n in range(1, top) where not held(n)"
      set: cells
      value: n
  # The numbers just before and after a placed one are beside it.
  - id: nextTo
    tier: Easy
    for: >-
      c in cells where known(c) and open(c),
      m in {value(c) - 1, value(c) + 1} where m >= 1 and m <= top and not held(m)
    conclude: "forall p in cells where m in cand(p) and not near(p, c, 1): strike(p, m)"
  # A number missing from the board is within as many steps of a placed
  # one as they are apart, out to the next placed number either way.
  - id: reach
    tier: Normal
    for: >-
      c in cells where known(c) and open(c), n = value(c),
      m in range(n - gapBelow(n) + 1, n + gapAbove(n) - 1) where m != n
    conclude: "forall p in cells where m in cand(p) and not near(p, c, abs(m - n)): strike(p, m)"
  # A square the path can enter from one neighbor only is an end of the
  # path. A neighbor is closed to it when it is a wall or an arrow, or holds
  # a number whose numbers before and after are both placed. Where only one
  # of 1 and the last can still go there, it does.
  - id: deadEnd
    tier: Normal
    for: >-
      c in cells where not known(c) and open(c)
      and count(p in nbr(c) where open(p) and (not known(p)
      or (value(p) > 1 and not held(value(p) - 1))
      or (value(p) < top and not held(value(p) + 1)))) = 1,
      n in {1, top} where not held(n) and n in cand(c)
      and not (exists e in {1, top} where e != n and not held(e): e in cand(c))
    conclude: "place(c, n)"
  # A missing number has a square beside it that may hold the number before
  # and one that may hold the number after, so a square with neither is
  # struck.
  - id: overlap
    tier: Normal
    from: Hard
    for: "n in range(1, top) where not held(n)"
    conclude: >-
      forall c in cells where n in cand(c)
      and ((n > 1 and not (exists p in nbr(c): n - 1 in cand(p)))
      or (n < top and not (exists p in nbr(c): n + 1 in cand(p)))):
      strike(c, n)
  # A square with one number left that is the next or the one before a
  # placed number holds it.
  - id: onlyNumberNear
    tier: Tricky
    until: Hard
    for: >-
      c in cells where not known(c) and open(c) and |cand(c)| = 1,
      n = first(cand(c)) where (n > 1 and held(n - 1)) or (n < top and held(n + 1))
    conclude: "place(c, n)"
  # A square with one number left holds it. One with none makes the marks
  # inconsistent.
  - kind: one.cell
    as: onlyNumber
    tier: Hard
    with:
      square: "not known(c) and open(c)"
# Ascent's sentences, spoken through the hint's voice (`hint.ts`). A number
# term is a number as the board shows it, counting from 1. A step rings the
# square it fills, or a whole run's route; a placed number it names, an arrow
# it reads and a square it reasons from are outlined, and the line an arrow
# points along, a run's reach and the squares no other run reaches are
# striped. The words are the help page's: a step is one move to a
# neighboring square, a run the missing numbers between two placed ones, and
# a square a dead end when the path can reach it from one neighbor only.
phrases:
  # How near a placed number must be, `d` places from it in the sequence.
  near1: "{d1: next to | within {d1} steps of} {outline at1: {m1}}"
  near2: "{d2: next to | within {d2} steps of} {outline at2: {m2}}"
  # Two placed numbers both farther than a step: "within 2 steps of 23 and
  # 4 of 29".
  nearFar: "within {d1} steps of {outline at1: {m1}} and {d2} of {outline at2: {m2}}"
  # The placed numbers a number must sit next to: one, or both either side.
  beside: "next to {if pair: both {outline at1: {m1}} and {outline at2: {m2}} | {outline at1: {m1}}}"
  # The number's own arrow, its line striped: "its column".
  its: "{outline arrow: its} {stripes line: {shape}}"
  # Where a run reaches the square: through empty squares, or by a straight
  # count of steps.
  reaches: >-
    {if byRoute: steps to {ring: the ringed square} by {stripes reach: the striped squares}
    | can reach {ring: the ringed square} ({stripes reach: its area, striped})}
  # How the missing numbers a pointers step lists stand to the square.
  pointed: "{if loose: could go | point}"
steps:
  # A run of missing numbers, named by the placed numbers at its ends: the
  # numbers in between follow from them, so naming those too is only noise
  # (owner, 2026-09-27). Either end may be absent, at an end of the path, and
  # is then 0.
  run:
    ring: square
    terms: { lo: number, hi: number }
    marks: { outline: [ends] }
    wordings:
      - when: "lo = 0"
        move: "{outline ends: the run before {hi}}"
      - when: "hi = 0"
        move: "{outline ends: the run after {lo}}"
      - move: "{outline ends: the run between {lo} and {hi}}"
  # The same, where the run is one number named for itself: "Only 3, between
  # 2 and 4, …".
  span:
    ring: square
    terms: { lo: number, hi: number }
    marks: { outline: [ends] }
    wordings:
      - when: "lo = 0"
        move: "{outline ends: before {hi}}"
      - when: "hi = 0"
        move: "{outline ends: after {lo}}"
      - move: "{outline ends: between {lo} and {hi}}"
  # A number must sit next to its placed neighbors in the sequence (`m1` at
  # `at1`, and `m2` at `at2` where both are placed: `pair`); `arrow` and
  # `line` are its arrow's, where that is needed to single the square out.
  touch:
    ring: square
    terms: { n: number, m1: number, m2: number, pair: flag, shape: [row, column, diagonal] }
    marks: { outline: [at1, at2, arrow], stripes: [line] }
    move: "it must be {n}"
    wordings:
      - when: "|outlineArrow| = 0 and |outlineAt1| = 0"
        look: "{ring: the ringed square} is the last empty one"
      - when: "|outlineArrow| = 0"
        look: "{n} must sit {beside}, and {ring: the ringed square} is the only empty one that does"
      - when: "|outlineAt1| = 0"
        look: "{n} must be on {its}, and {ring: the ringed square} is its only empty one"
      - look: "{n} must sit {beside}, on {its}. Only {ring: this square} does"
  # A number must be within reach of each placed number either side, `d1`
  # and `d2` places away (the second where both are placed).
  reach:
    ring: square
    terms:
      n: number
      m1: number
      d1: number
      m2: number
      d2: number
      shape: [row, column, diagonal]
    marks: { outline: [at1, at2, arrow], stripes: [line] }
    move: "it must be {n}"
    wordings:
      - when: "|outlineArrow| = 0 and |outlineAt2| = 0"
        look: "{n} must be {near1}, and only {ring: this empty square} is"
      - when: "|outlineArrow| = 0 and d1 > 1 and d2 > 1"
        look: "{n} must be {nearFar}, and only {ring: this empty square} is"
      - when: "|outlineArrow| = 0"
        look: "{n} must be {near1} and {near2}, and only {ring: this empty square} is"
      - when: "|outlineAt2| = 0"
        look: "{n} must be {near1}, on {its}. Only {ring: this square} is"
      - when: "d1 > 1 and d2 > 1"
        look: "{n} must be {nearFar}, on {its}. Only {ring: this square} is"
      - look: "{n} must be {near1} and {near2}, on {its}. Only {ring: this square} is"
  # The path can reach the square from one neighbor only (`open`), so it ends
  # there; `other` is the path's other end, and `why` it cannot be here: 0
  # placed, 1 out of reach (`last` where that is the path's last number), 2
  # its arrow pointing elsewhere.
  deadEnd:
    ring: square
    terms: { n: number, other: number, why: number, last: flag }
    marks: { outline: [open] }
    look: "Only {outline open: the outlined square} leads into {ring: the ringed one}"
    follows: "the path must end on it"
    wordings:
      - when: "why = 0"
        move: "with {other} placed, it must be {n}"
      - when: "why = 1"
        move: "with the path's {if last: last | first} number out of reach, it must be {n}"
        long: &deadEndLong >-
          it gives two reasons, each needed: the dead end makes the square an
          end of the path, and the other end ruled out says which end
      - move: "with {other}'s arrow pointing elsewhere, it must be {n}"
        long: *deadEndLong
  # Why no other run fills a square: none comes within two steps of it, none
  # can reach it (several come close, too many to name at a glance), the one
  # that comes close is too far, or it is one number that must touch both
  # its ends and misses `need`.
  noneClose:
    ring: square
    move: "no other run comes close to {ring: this square}"
  noneReach:
    ring: square
    move: "no other run can reach {ring: this square}"
  runFar:
    ring: square
    terms: { run: { clause: [run] } }
    move: "{run} is too far from {ring: this square}"
  oneMisses:
    ring: square
    terms: { run: { clause: [run] }, need: values }
    move: "{run} can't fill {ring: this square}, which doesn't touch {either need}"
  # No other run can fill the square (`others`), and the step counts to the
  # run's own ends rule out the rest of it: none (`n` is its run's only
  # number), one (`d1` steps from `m1`, ruling out the numbers to `side`), or
  # both.
  fill:
    ring: square
    terms:
      n: number
      others: { clause: [noneClose, noneReach, runFar, oneMisses] }
      counts: number
      m1: number
      d1: number
      m2: number
      d2: number
      side: [lower, higher]
    marks: { outline: [c1, c2] }
    move: "it must be {n}"
    wordings:
      - when: "counts = 0"
        look: "{others}"
      - when: "counts = 1"
        look: "{others}, and {d1} steps from {outline c1: {m1}} leaves nothing {side}"
      - look: >-
          {others}, and {d1} steps from {outline c1: {m1}} and {d2} from {outline c2: {m2}}
          leave no other number
  # Of all the runs, only `run` reaches the square (its reach striped), and
  # of its numbers only `n` does; `byRoute` where reach is counted through
  # empty squares.
  onlyRun:
    ring: square
    terms: { n: number, run: { clause: [run] }, byRoute: flag }
    marks: { stripes: [reach] }
    look: "Only {run} {reaches}, and {fit: of its numbers only {n} can | only its {n} can}"
    move: "it must be {n}"
  # The same, where `n` is its run's only number.
  onlyOne:
    ring: square
    terms: { n: number, span: { clause: [span] }, byRoute: flag }
    marks: { stripes: [reach] }
    look: "Only {n}, {span}, {reaches}"
    move: "it must be {n}"
  # The run must step through the outlined squares, one square per number,
  # and `n` has only this square on any such route.
  route:
    ring: square
    terms: { n: number, run: { clause: [run] } }
    marks: { outline: [through] }
    look: "{run} must step through {outline through: the outlined squares}"
    move: "{n} can only go in {ring: the ringed square}"
  # What a number must be near, in Edges mode: `d` steps of each of
  # `targets`, a placed number or the line of a missing one.
  near:
    ring: square
    terms: { d: number, targets: { clauses: [nearPlaced, nearLine] } }
    move: "{d: a step | {d} steps} of {targets}"
  nearPlaced:
    ring: square
    terms: { m: number }
    marks: { outline: [at] }
    move: "{outline at: {m}}"
  nearLine:
    ring: square
    terms: { m: number, shape: [row, column, diagonal] }
    marks: { outline: [arrow], stripes: [line] }
    move: "{outline arrow: {m}'s} {stripes line: {shape}}"
  # Edges: `n` is on its arrow's line (outlined; none where it has no arrow)
  # and within reach of each of `near`, and only this square is.
  lines:
    ring: square
    terms: { n: number, shape: [row, column, diagonal], near: { clauses: [near] } }
    marks: { outline: [arrow] }
    move: "it must be {n}"
    wordings:
      - when: "|outlineArrow| = 0"
        look: "{n} has no arrow, but must be within {near}. Only {ring: this square} is"
      - look: "{n} must be on {outline arrow: its {shape}}, within {near}. Only {ring: this square} is"
  # A missing number pointing at the square, by its outlined arrow, or one
  # with no arrow, which could go anywhere.
  pointer:
    ring: square
    terms: { m: number }
    marks: { outline: [arrow] }
    move: "{outline arrow: {m}}"
  loose:
    ring: square
    terms: { m: number }
    move: "{m} (no arrow)"
  # A missing number named plainly, where the sentence named its arrow
  # before.
  named:
    ring: square
    terms: { m: number }
    move: "{m}"
  # Why a rival is ruled out: too far from what it must be near. The first
  # of a list says it whole, the others leave it implied.
  tooFar:
    ring: square
    terms: { who: { clause: [named, pointer, loose] }, to: { clause: [nearPlaced, nearLine] } }
    move: "{who} is too far from {to}"
  alsoFar:
    ring: square
    terms: { who: { clause: [named, pointer, loose] }, to: { clause: [nearPlaced, nearLine] } }
    move: "{who} from {to}"
  # Edges: of the missing numbers, only `n` and the rivals can stand here
  # (their arrows point here, or they have none: `loose`), and each rival is
  # too far from what it must be near. `form` is how much the sentence can
  # name at a glance: 0 every number and each rival's reason; 1 each rival
  # with its reason, the number left to the conclusion; 2 every number, the
  # reasons drawn (`lines` and `placed`) and pointed at together.
  pointers:
    ring: square
    terms:
      n: number
      rivals: number
      form: number
      loose: flag
      all: { clauses: [pointer, loose] }
      why: { clauses: [tooFar, alsoFar] }
    marks: { outline: [own, placed], stripes: [lines] }
    move: "it must be {n}"
    wordings:
      - when: "rivals = 0 and |outlineOwn| > 0"
        look: "Of the missing numbers, only {outline own: {n}'s arrow} points {ring: here (ringed)}"
      - when: "rivals = 0"
        look: "No missing number's arrow points {ring: here (ringed)}, and only {n} has none"
      - when: "form = 0"
        look: "Of the missing numbers, only {all} {pointed} {ring: here (ringed)}. {why}"
      - when: "form = 1 and |outlineOwn| > 0"
        look: "Of the missing numbers {if loose: that could go | pointing} {ring: here (ringed)}, {why}"
        move: "it must be {outline own: {n}}"
      - when: "form = 1"
        look: "Of the missing numbers {if loose: that could go | pointing} {ring: here (ringed)}, {why}"
      # "All but one": the conclusion names the number left, so saying it
      # here too would name it twice.
      - when: "|outlinePlaced| = 0"
        look: >-
          Of the missing numbers, only {all} {pointed} {ring: here (ringed)},
          and {stripes lines: the striped lines} leave only one
        long: >-
          it names every missing number that could stand on the square, so the
          player can check each is ruled out; where three or more rivals point
          there, no form that names them all fits
      - look: >-
          Of the missing numbers, only {all} {pointed} {ring: here (ringed)},
          and {stripes lines: the striped lines} and {outline placed: outlined numbers} leave only one
        long: >-
          it names every missing number that could stand on the square, so the
          player can check each is ruled out; where three or more rivals point
          there, no form that names them all fits
  # The whole run has one route, drawn as a line: through the empty squares
  # at all, or through every striped square no other run can reach
  # (`must`). In Edges mode, `arrows` are the run's numbers' arrows where
  # they are what leave only that route; with `must`, the hint drops them
  # where the sentence would not fit at a glance.
  wholeRun:
    ring: path
    terms: { run: { clause: [run] } }
    marks: { outline: [arrows], stripes: [must] }
    wordings:
      - when: "|stripesMust| = 0 and |outlineArrows| > 0"
        look: "With each number on {outline arrows: its arrow's} line, {run} has only one route"
        move: "it must take {ring: the drawn route}"
      - when: "|stripesMust| = 0"
        look: "{run} has only one route through the empty squares"
        move: "it must go along {ring: the drawn route}"
      - when: "|outlineArrows| > 0"
        look: "No other run reaches {stripes must: the striped squares}"
        move: "{run} must take them, on {ring: the drawn route} {outline arrows: its arrows} allow"
      - look: "No other run reaches {stripes must: the striped squares}"
        move: "{run} must take them all, along {ring: the drawn route}"
  # Only one route for the run leaves `other`, the run beside it, a way
  # through what is left.
  roomRun:
    ring: path
    terms: { run: { clause: [run] }, other: { clause: [run] } }
    look: "Only one route for {run} lets {other} through"
    move: "it must take {ring: the drawn route}"
help:
  rules: |-
    Place each number once, so they form a path from 1 to the highest, each in a square neighboring the one before. Some are given. Which squares are neighbors depends on the game mode:

    {{rulesets}}

    {{choice:ruleset:2}} may add a rule:

    {{modifiers}}
  controls: |-
    There are three ways to enter a number:

    1. Click a number to highlight it, then click (or drag to) an adjacent cell to place the next number in the sequence. If the number just before it is placed and the one after is not, that is the one after; the other way round, the one before; and if neither is placed yet, the one after. Then click the highlighted number again to offer the one before instead, and once more to deselect it; or, once a number is placed beside it, click that square again for the one before, and once more to empty it. The arrow keys and Enter can be used to emulate mouse clicks, and Space or Backspace at the cursor does what a right-click does. Once the numbers after the one you place are already on the board, the highlight moves on to the end of that run; the **Skip past already-placed numbers when advancing** preference turns that off.

    2. Click an empty cell, then type a multi-digit number, on the keyboard or the on-screen keypad. To confirm a number, either press Enter, an arrow key, or click any cell; **Clear** or Backspace rubs out the last digit. Set the **Numpad inputs** preference to **Move cursor** to have the numeric keypad move the cursor instead of typing, its 7, 9, 1 and 3 diagonally.

    3. On an Edges board, click and drag from an edge number, then release in an empty grid cell in the same row, column or diagonal.

    To remove numbers, right-click or right-drag a number (on a touch screen, a long press, or hold and then drag).

    Between two neighboring numbers in sequence, an arrow points from the lower to the higher, and 1 is ringed, so the path's direction can be read without comparing numbers.

    It's also possible to draw a path while the numbers inside the path are still unknown. Left-click and drag across cells to draw a line, starting from an empty cell (a drag starting from a number places numbers instead). Right-click or right-drag to clear the line going through a cell.

    If a path has only a single number, the endpoints will display one or two smaller numbers, which represent the numbers which are valid for this cell.

    Where a cell has exactly two candidate numbers like that, right-clicking (on a touch screen, a long press) cycles through them instead of clearing — empty, then the lower number, then the higher, then empty again — so an either-or square can be tried both ways without typing.
  origins: |-
    {{choice:ruleset:2}} mode is the puzzle invented by Gyora Benedek, known as *Hidato* (or the non-trademarked name *Hidoku*). {{choice:ruleset:0}} mode is the puzzle known as *Numbrix*, created by Marilyn vos Savant. A {{choice:ruleset:2}} board with Edges is an implementation of *1to25* invented by Jeff Widderich.

    More information: http://www.janko.at/Raetsel/Hidoku/index.htm
  hints: |-
    **Hint** explains the next step rather than simply making it. A step places one number, or one whole run where that run has only one route, and it reasons only from the numbers on the board and, on an Edges board, the arrows, so it carries on from wherever you are, as long as none of your numbers is wrong; if one is, it asks you to fix the highlighted mistakes first. Lines you have drawn are yours: the hint neither reads them nor draws any.

    {{hint-marks}}

    When a step places the first number of a run and the rest of that run follows just as simply, the hint carries on through the run as one hint, a number at a time, each with its reason. And when the run has **only one route** between its two ends, the hint shows the whole run at once: every square it fills is ringed, with the run's line drawn inside the rings. Often a run is forced onto its route because some squares can be reached by no other run: those have to be on this run's route, or they would be left empty, so the hint stripes them. And sometimes a run could take several routes, but every one except one would cut a neighboring run off from its own ends: then the run must take the one that leaves room. On an Edges board, the arrows often leave a run only one route: when they are the reason, the hint says so and outlines them.

    A *step* is one move to a neighboring square, so two numbers can be no more steps apart than they are apart in the sequence. That one idea gives most of the hint's reasons:

    * **Next to its neighbors.** A number must sit next to the numbers just before and after it, so when only one empty square touches both, or the one that is placed, it goes there.
    * **Within reach.** A number must be within as many steps of the nearest placed numbers below and above it as they are apart in the sequence: 10 is within 2 steps of 8 and within 3 of 13. When only one empty square is in reach of both, the number goes there. On an Edges board it must also be on its arrow's line.
    * **Only one run can reach it.** A *run* is the missing numbers between two placed ones, like 14 and 15 between 13 and 16; the hint calls it "the run between 13 and 16". A run can only use squares close enough to both its ends: here, the steps to 13 and the steps to 16 add up to at most 3. So each run has an area it can reach, and an empty square inside only one run's area belongs to that run. Often only one other run comes close, and the hint names it and why it falls short ("the run between 41 and 43 can't, as this square doesn't touch 41"); when several do, it says that none of them reaches the square, and a look at the runs nearby shows why. Which number of the run it is follows the same way: only one is close enough to both ends ("3 steps from 67 and 2 from 72 leave no other number"). When there are no counts to give, as for a run of a single number, the hint stripes the squares the run can reach and outlines its ends instead. The hint only names numbers you can see on the board, and the one it is placing.
    * **A dead end.** A square the path can enter from only one neighbor must be an end of the path, so it holds 1 or the highest number. A neighbor is closed to the path when it is a wall, an arrow, or a number already joined to both of its neighbors in the sequence.
    * On an Edges board: **where the lines cross.** Every missing number already has a line, its arrow's, and it must be within a step of the line of the numbers just before and after it, within 2 steps of the lines of those two away, and so on. So 12, on its column, must be within a step of 11's row and 13's row: where those cross its column, often only one square remains. The hint outlines the arrows it reads and stripes the lines of the other numbers.
    * On an Edges board at Tricky or Hard: **only one arrow still fits.** Only the missing numbers whose arrows point at a square can go there. When all but one of them are too far from a line or a number they must be near, the square is the last one's. The hint outlines every arrow pointing there and stripes the lines that rule the others out.
    * On harder boards, and on an Edges board: **stepping through empty squares.** A missing run of numbers has to step from one placed number to the next through empty squares, one square per number, so walls and filled squares in the way stretch the distance. Sometimes only one square works for a number on any such route.
