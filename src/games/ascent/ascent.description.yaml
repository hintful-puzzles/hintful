# yaml-language-server: $schema=../../describe/description.schema.json

game: ascent
name: Ascent
family: numbers
sizes:
  # The board as stored: a hexagonal one sheared, padded with walls, and an
  # Edges one ringed by its arrows. Unbounded but by the time a board takes
  # to deal.
  w: { min: 1, max: 99999 }
  h: { min: 1, max: 99999 }
  # Which squares are neighbors: 0 the four beside, 1 the six of a
  # hexagonal board, 2 the eight around.
  moves: { min: 0, max: 2 }
  # The last number of the path, as many as the squares on it.
  top: { min: 1, max: 99999 }
space:
  grid: { w: "w", h: "h" }
  units: []
answer:
  # A square's number on the path, from 1 to the last, top. A wall or an
  # arrow holds top + 1: it is on no path.
  value:
    sort: cell
    wide: true
    domain: "{d in range(1, top + 1) where (d <= top and open(c)) or (d = top + 1 and not open(c))}"
define:
  # Whether square c is on the path: neither a wall nor an arrow.
  open(c): "clue(wall, c) = none and clue(arrow, c) = none"
  # The squares beside c as the board's ruleset has them. A hexagonal board
  # is stored sheared, so the two diagonal steps that run with the shear
  # are no neighbors.
  nbr(c): >-
    {p in adj8(c) where moves = 2 or (moves = 0 and p in adj4(c))
    or (moves = 1 and x(p) - x(c) != y(p) - y(c))}
  # Whether squares a and b are measured side by side: on a board of four
  # ways, or of six where the offsets run with the shear, which takes two
  # steps a square.
  sideways(a, b): "moves = 0 or (moves = 1 and (x(a) - x(b)) * (y(a) - y(b)) > 0)"
  # Whether squares a and b are at most d steps apart, whatever lies
  # between: the two offsets summed side by side, each alone corner to
  # corner.
  near(a, b, d): >-
    (sideways(a, b) and abs(x(a) - x(b)) + abs(y(a) - y(b)) <= d)
    or (not sideways(a, b) and abs(x(a) - x(b)) <= d and abs(y(a) - y(b)) <= d)
  # Whether some square holds number n.
  held(n): "count(x in cells where value(x) = n) > 0"
  # How far below and above number n the nearest held numbers are, or the
  # path's ends where none is.
  gapBelow(n): "min(j in range(1, n) where j = n or held(n - j) of j)"
  gapAbove(n): "min(j in range(1, top + 1 - n) where j = top + 1 - n or held(n + j) of j)"
  # Whether square a, an Edges board's arrow, points along a line that
  # passes square p: its row from the left or right side, its column from
  # the top or bottom, or a diagonal from a corner.
  online(a, p): >-
    (y(a) > 0 and y(a) < h - 1 and y(p) = y(a))
    or ((y(a) = 0 or y(a) = h - 1) and x(a) > 0 and x(a) < w - 1 and x(p) = x(a))
    or ((y(a) = 0 or y(a) = h - 1) and (x(a) = 0 or x(a) = w - 1)
    and abs(x(p) - x(a)) = abs(y(p) - y(a)))
shape:
  # Every number of the path but the last has the next beside it.
  - "forall c in cells where value(c) < top: exists p in nbr(c): value(p) = value(c) + 1"
  # No number is on the path twice.
  - "forall c in cells where value(c) <= top: count(x in cells where value(x) = value(c)) = 1"
rules:
  # The path runs through every square but the walls and the arrows.
  dealt: "top = count(x in cells where open(x))"
clues:
  # A number given on the path.
  number:
    at: cell
    value: "range(1, w * h)"
    means: "value(at) = v"
  # A square the path does not enter.
  wall:
    at: cell
    value: "range(0, 0)"
    means: "value(at) = top + 1"
freedom: { kind: fill }
deal:
  answer: a path through every open square, each number beside the next
  number: as many hidden as the board stays at its tier
  tier: one of the tiers
variations:
  # Arrows round the board each point along a row, column or diagonal that
  # holds their number.
  Edges:
    add:
      clues:
        arrow:
          at: cell
          value: "range(1, w * h)"
          means: >-
            value(at) = top + 1
            and (exists p in cells where open(p) and online(at, p): value(p) = v)
      techniques:
        # A number is on its arrow's line.
        - id: onLine
          tier: Easy
          for: "a in cells, n = clue(arrow, a) where n != none"
          conclude: "forall p in cells where n in cand(p) and not online(a, p): strike(p, n)"
        # The overlap reading, from Normal on an Edges board.
        - id: overlapEdges
          tier: Normal
          for: "n in range(1, top) where not held(n)"
          conclude: >-
            forall c in cells where n in cand(c)
            and ((n > 1 and not (exists p in nbr(c): n - 1 in cand(p)))
            or (n < top and not (exists p in nbr(c): n + 1 in cand(p)))):
            strike(c, n)
tiers: [Easy, Normal, Tricky, Hard]
techniques:
  # A placed number is on no other square.
  - id: once
    on: place
    tier: Easy
    for: "c in cells where known(c) and open(c), p in cells where p != c and not known(p)"
    conclude: "strike(p, value(c))"
  # A number with one square left goes there. One with none makes the marks
  # inconsistent.
  - id: onlySquare
    tier: Easy
    for: >-
      n in range(1, top) where not held(n),
      S = {c in cells where not known(c) and n in cand(c)} where |S| < 2
    conclude: "|S| = 1 and place(first(S), n)"
  # The numbers just before and after a placed one are beside it.
  - id: nextTo
    tier: Easy
    for: >-
      c in cells where known(c) and open(c),
      m in {value(c) - 1, value(c) + 1} where m >= 1 and m <= top and not held(m)
    conclude: "forall p in cells where m in cand(p) and not near(p, c, 1): strike(p, m)"
  # A number missing from the board is within as many steps of a placed
  # one as they are apart, out to the next placed number either way.
  - id: reach
    tier: Normal
    for: >-
      c in cells where known(c) and open(c), n = value(c),
      m in range(n - gapBelow(n) + 1, n + gapAbove(n) - 1) where m != n
    conclude: "forall p in cells where m in cand(p) and not near(p, c, abs(m - n)): strike(p, m)"
  # A square the path can enter from one neighbor only is an end of the
  # path. A neighbor is closed to it when it is a wall or an arrow, or holds
  # a number whose numbers before and after are both placed. Where only one
  # of 1 and the last can still go there, it does.
  - id: deadEnd
    tier: Normal
    for: >-
      c in cells where not known(c) and open(c)
      and count(p in nbr(c) where open(p) and (not known(p)
      or (value(p) > 1 and not held(value(p) - 1))
      or (value(p) < top and not held(value(p) + 1)))) = 1,
      n in {1, top} where not held(n) and n in cand(c)
      and not (exists e in {1, top} where e != n and not held(e): e in cand(c))
    conclude: "place(c, n)"
  # A missing number has a square beside it that may hold the number before
  # and one that may hold the number after, so a square with neither is
  # struck.
  - id: overlap
    tier: Normal
    from: Hard
    for: "n in range(1, top) where not held(n)"
    conclude: >-
      forall c in cells where n in cand(c)
      and ((n > 1 and not (exists p in nbr(c): n - 1 in cand(p)))
      or (n < top and not (exists p in nbr(c): n + 1 in cand(p)))):
      strike(c, n)
  # A square with one number left that is the next or the one before a
  # placed number holds it.
  - id: onlyNumberNear
    tier: Tricky
    until: Hard
    for: >-
      c in cells where not known(c) and open(c) and |cand(c)| = 1,
      n = first(cand(c)) where (n > 1 and held(n - 1)) or (n < top and held(n + 1))
    conclude: "place(c, n)"
  # A square with one number left holds it. One with none makes the marks
  # inconsistent.
  - id: onlyNumber
    tier: Hard
    for: "c in cells where not known(c) and open(c) and |cand(c)| < 2"
    conclude: "|cand(c)| = 1 and place(c, first(cand(c)))"
help:
  rules: |-
    Place each number once, so they form a path from 1 to the highest, each in a square neighboring the one before. Some are given. Which squares are neighbors depends on the game mode:

    {{rulesets}}

    {{choice:ruleset:2}} may add a rule:

    {{modifiers}}
  controls: |-
    There are three ways to enter a number:

    1. Click a number to highlight it, then click (or drag to) an adjacent cell to place the next number in the sequence. If the number just before it is placed and the one after is not, that is the one after; the other way round, the one before; and if neither is placed yet, the one after. Then click the highlighted number again to offer the one before instead, and once more to deselect it; or, once a number is placed beside it, click that square again for the one before, and once more to empty it. The arrow keys and Enter can be used to emulate mouse clicks, and Space or Backspace at the cursor does what a right-click does. Once the numbers after the one you place are already on the board, the highlight moves on to the end of that run; the **Skip past already-placed numbers when advancing** preference turns that off.

    2. Click an empty cell, then type a multi-digit number, on the keyboard or the on-screen keypad. To confirm a number, either press Enter, an arrow key, or click any cell; **Clear** or Backspace rubs out the last digit. Set the **Numpad inputs** preference to **Move cursor** to have the numeric keypad move the cursor instead of typing, its 7, 9, 1 and 3 diagonally.

    3. On an Edges board, click and drag from an edge number, then release in an empty grid cell in the same row, column or diagonal.

    To remove numbers, right-click or right-drag a number (on a touch screen, a long press, or hold and then drag).

    It's also possible to draw a path while the numbers inside the path are still unknown. Left-click and drag across cells to draw a line, starting from an empty cell (a drag starting from a number places numbers instead). Right-click or right-drag to clear the line going through a cell.

    If a path has only a single number, the endpoints will display one or two smaller numbers, which represent the numbers which are valid for this cell.

    Where a cell has exactly two candidate numbers like that, right-clicking (on a touch screen, a long press) cycles through them instead of clearing — empty, then the lower number, then the higher, then empty again — so an either-or square can be tried both ways without typing.
  origins: |-
    {{choice:ruleset:2}} mode is the puzzle invented by Gyora Benedek, known as *Hidato* (or the non-trademarked name *Hidoku*). {{choice:ruleset:0}} mode is the puzzle known as *Numbrix*, created by Marilyn vos Savant. A {{choice:ruleset:2}} board with Edges is an implementation of *1to25* invented by Jeff Widderich.

    More information: http://www.janko.at/Raetsel/Hidoku/index.htm
  hints: |-
    **Hint** explains the next step rather than simply making it. A step places one number, or one whole run where that run has only one route, and it reasons only from the numbers on the board and, on an Edges board, the arrows, so it carries on from wherever you are, as long as none of your numbers is wrong; if one is, it asks you to fix the highlighted mistakes first. Lines you have drawn are yours: the hint neither reads them nor draws any.

    {{hint-marks}}

    When a step places the first number of a run and the rest of that run follows just as simply, the hint carries on through the run as one hint, a number at a time, each with its reason. And when the run has **only one route** between its two ends, the hint shows the whole run at once: every square it fills is ringed, with the run's line drawn inside the rings. Often a run is forced onto its route because some squares can be reached by no other run: those have to be on this run's route, or they would be left empty, so the hint stripes them. And sometimes a run could take several routes, but every one except one would cut a neighboring run off from its own ends: then the run must take the one that leaves room. On an Edges board, the arrows often leave a run only one route: when they are the reason, the hint says so and outlines them.

    A *step* is one move to a neighboring square, so two numbers can be no more steps apart than they are apart in the sequence. That one idea gives most of the hint's reasons:

    * **Next to its neighbors.** A number must sit next to the numbers just before and after it, so when only one empty square touches both, or the one that is placed, it goes there.
    * **Within reach.** A number must be within as many steps of the nearest placed numbers below and above it as they are apart in the sequence: 10 is within 2 steps of 8 and within 3 of 13. When only one empty square is in reach of both, the number goes there. On an Edges board it must also be on its arrow's line.
    * **Only one run can reach it.** A *run* is the missing numbers between two placed ones, like 14 and 15 between 13 and 16; the hint calls it "the run between 13 and 16". A run can only use squares close enough to both its ends: here, the steps to 13 and the steps to 16 add up to at most 3. So each run has an area it can reach, and an empty square inside only one run's area belongs to that run. Often only one other run comes close, and the hint names it and why it falls short ("the run between 41 and 43 can't, as this square doesn't touch 41"); when several do, it says that none of them reaches the square, and a look at the runs nearby shows why. Which number of the run it is follows the same way: only one is close enough to both ends ("3 steps from 67 and 2 from 72 leave no other number"). When there are no counts to give, as for a run of a single number, the hint stripes the squares the run can reach and outlines its ends instead. The hint only names numbers you can see on the board, and the one it is placing.
    * **A dead end.** A square the path can enter from only one neighbor must be an end of the path, so it holds 1 or the highest number. A neighbor is closed to the path when it is a wall, an arrow, or a number already joined to both of its neighbors in the sequence.
    * On an Edges board: **where the lines cross.** Every missing number already has a line, its arrow's, and it must be within a step of the line of the numbers just before and after it, within 2 steps of the lines of those two away, and so on. So 12, on its column, must be within a step of 11's row and 13's row: where those cross its column, often only one square remains. The hint outlines the arrows it reads and stripes the lines of the other numbers.
    * On an Edges board at Tricky or Hard: **only one arrow still fits.** Only the missing numbers whose arrows point at a square can go there. When all but one of them are too far from a line or a number they must be near, the square is the last one's. The hint outlines every arrow pointing there and stripes the lines that rule the others out.
    * On harder boards, and on an Edges board: **stepping through empty squares.** A missing run of numbers has to step from one placed number to the next through empty squares, one square per number, so walls and filled squares in the way stretch the distance. Sometimes only one square works for a number on any such route.
