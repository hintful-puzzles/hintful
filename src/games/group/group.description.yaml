# yaml-language-server: $schema=../../describe/description.schema.json

# Group's rules, its own techniques, and the game's help page. `npm run
# describe` compiles the techniques to group.compiled.ts, which solver.ts runs.
game: group
help:
  rules: |-
    Fill the grid with the letters along its top and left. With row *a*,
    column *b* read as *a·b*:

    - **Latin square**: every row and column holds each letter once.
    - **Identity**: one letter leaves every letter unchanged.
    - **Inverses**: each letter has a partner it makes the identity with.
    - **Associativity**: (*a·b*)·*c* and *a*·(*b·c*) are the same letter.

    A board's name says when this setting is on:

    {{modifiers}}
  controls: |-
    To place a letter, click in a square to select it, then type the
    letter on the keyboard. To erase a letter, click to select a square
    and then press Backspace.

    Right-click in a square and then type a letter to add or remove the
    letter as a pencil mark, indicating letters that you think
    *might* go in that square.

    You can rearrange the order of elements in the rows and columns by
    dragging the column or row headings back and forth. (The rows and
    columns will stay in sync with each other.) Also,
    left-clicking *between* two row or column headings will add or
    remove a thick line between those two rows and the corresponding pair
    of columns (which is useful if you're considering a subgroup and its
    cosets).

    You can also use the arrow keys to move the selected square around.
    Press Enter to toggle between entering letters and entering pencil
    marks, and Backspace or Space to clear a square.

    {{mark-all}} In Group, M is a letter you type on a grid of 13 letters
    or more, so there only the button fills the marks.
    Once every empty square has marks, the press crosses out of each the
    letters already placed in its row and column.

    From the keyboard, Shift and Left or Right moves the selected square's
    column one place along the order, and Shift and Up or Down moves its row;
    the rows and columns stay in sync either way. Press | to add or remove
    the thick line after the selected column, and - for the line below the
    selected row.
  sections:
    - heading: The four conditions in full
      body: |-
        A grid that meets them is the
        [Cayley table](http://en.wikipedia.org/wiki/Cayley_table)
        of a
        [group](http://en.wikipedia.org/wiki/Group_(mathematics)), but the
        game needs no more of the mathematics than this:

        - **Latin square**. Every row and column must contain
          exactly one of each letter.
        - **Identity**. There must be some letter *e* such
          that, for all *a*, the letter in row *e* column *a* and
          the one in row *a* column *e* are both *a*. In the
          default mode, this letter is always *e* and its row and column
          are filled in for you; by reconfiguring the game using the Type menu,
          you can select a mode in which you have to work out which letter is
          the identity.
        - **Inverses**. For every letter *a*, there must be
          some letter *b* (which may sometimes be the same letter
          as *a*) such that the letters in row *a* column *b* and
          in row *b* column *a* are both the identity letter (as
          defined above).
        - **Associativity**. For every combination of
          letters *a*, *b*, and *c*, denote the letter in
          row *a* column *b* by *d*, and the one in row *b*
          column *c* by *e*. Then the letters in row *d*
          column *c* and in row *a* column *e* must be the same.
  hints: |-
    **Hint** explains the next step rather than simply making it. It works
    from your own letters and pencil marks, so it carries on from wherever
    you are; if a letter you've placed is wrong, or a cell's pencil marks
    have crossed out its answer, it asks you to fix the highlighted
    mistakes first. It pencils in only as it needs to: a cell
    with no marks counts as holding every element its row and column don't
    already hold, and the hint writes a cell's marks only when its next
    step crosses one out or reasons from them. If you would rather it
    filled in every cell's marks first (the same as pressing **Fill marks**), set
    **Hints pencil in** to **Every candidate first** in the preferences.

    {{hint-marks}}

    The hint writes products the way the grid shows them: *a·b* is the
    letter in row *a*, column *b*. The step that belongs to Group alone is
    associativity: once the
    grid shows *a·b*, *b·c* and one of (*a·b*)·*c* and *a*·(*b·c*), the
    other must be the same letter. When you have to find the identity
    yourself, a product like *a·b* = *a* shows that *b* is the identity,
    and a product that changes a letter rules its partner out as the
    identity; the hint then crosses out that element's *identity marks*,
    the pencil mark in each cell of its row and column that would have
    made it the identity there.

    {{wing}}

    Rearranging the rows and columns doesn't disturb a hint: its marks
    follow the elements to wherever you've dragged them. On an Unreasonable
    board, deduction can run out before the grid is full; the hint says so
    rather than guessing.
name: Group
family: latin
sizes:
  order: { min: 3, max: 26 }
space:
  grid: { w: "order", h: "order" }
  units: [rows, cols]
answer:
  value: { sort: cell, domain: "range(1, order)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, order)" }
define:
  # Row a, column b holds the product a·b, the elements numbered from 1.
  mul(a, b): "cell(b - 1, a - 1)"
  # The two factors of a cell's product: its row's element and its column's.
  left(c): "y(c) + 1"
  right(c): "x(c) + 1"
shape:
  - "latin(value, lines)"
rules:
  # A Latin square whose product is associative is a group's table: the
  # identity and the inverses follow.
  associative: >-
    forall a in domain, b in domain, c in domain:
    value(mul(value(mul(a, b)), c)) = value(mul(a, value(mul(b, c))))
freedom: { kind: fill }
deal:
  givens: how many
  tier: one of the tiers
tiers: [Trivial, Normal, Hard, Extreme, Unreasonable]
techniques:
  - { use: latin.placed, tier: Trivial, rung: dup }
  - { use: latin.hiddenSingle, tier: Trivial, rung: hiddenSingle }
  - { use: latin.single, tier: Trivial, rung: single }
  # Placed a·b, b·c and one of (a·b)·c and a·(b·c), the other is the same
  # element, where its cell can still hold it: a, b and c in order, the first
  # changing slowest. A cell that cannot is passed over, not a contradiction,
  # as in upstream's shipped build (its `return -1` is STANDALONE_SOLVER's).
  - id: associativity
    tier: Normal
    rung: associativity
    for: >-
      a in domain, b in domain, p = mul(a, b) where known(p),
      c in domain, q = mul(b, c) where known(q),
      l = mul(value(p), c), r = mul(a, value(q)) where known(l) != known(r)
    conclude: >-
      ((known(l) and value(l) in cand(r)) implies place(r, value(l)))
      and ((known(r) and value(r) in cand(l)) implies place(l, value(r)))
  # The first placed product, in reading order, that is one of its own
  # factors shows the other factor is the identity, e, so e's row and column
  # are the elements in order: for each j, j·e and then e·j. A cell that can
  # no longer hold its element makes the marks inconsistent.
  - id: identity
    tier: Normal
    rung: identityFill
    for: >-
      w0 = first({c in cells where known(c) and (value(c) = left(c) or value(c) = right(c))})
      where w0 != none,
      e in domain where (value(w0) = left(w0) and e = right(w0))
      or (value(w0) != left(w0) and e = left(w0))
    conclude: >-
      forall j in domain, c in {mul(j, e), mul(e, j)} where not known(c):
      j in cand(c) and place(c, j)
  # A placed product of a with some j that is not j shows a is not the
  # identity, so no j·a or a·j can be j. The witness, o, is the least such j.
  - id: notIdentity
    tier: Hard
    rung: identityElim
    for: >-
      a in domain,
      o = min(j in domain where (known(mul(j, a)) and value(mul(j, a)) != j)
      or (known(mul(a, j)) and value(mul(a, j)) != j))
      where o != none
    conclude: "forall j in domain: strike(mul(j, a), j) and (j = a or strike(mul(a, j), j))"
  - { use: latin.set, tier: Hard, rung: set }
  - { use: latin.fish, tier: Extreme, rung: set }
  - { use: latin.wing, tier: Extreme, rung: wing }
