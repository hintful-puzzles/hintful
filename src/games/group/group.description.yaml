# Measured 2026-10-05 by running the generator with nothing to stop it, a
# quarter of a million tries a cell and more: no board of a size below each
# bound needs the tier. A 4x4 and a 5x5 hiding the identity deal a Tricky
# board at once, where upstream dealt the tier below; a 6x6 at Hard with its
# identity shown gave none in 290,000 tries, which says only that its boards
# are rare, so it is dealt.
settings:
  identity:
    kind: choice
    gives: size
    after: tier
    choices:
      - name: Identity shown
        code: ""
        rule: The identity is *e*, and its row and column are filled in.
        letters: eabcdfghijklmnopqrstuvwxyz
        bounds:
          tiers:
            Normal: { shorter: { min: 5 } }
            Tricky: { shorter: { min: 6 } }
            Hard: { shorter: { min: 6 } }
            Unreasonable: { shorter: { min: 5 } }
      # Two rows and columns blank, which no Latin deduction tells apart, so
      # no board is Easy, and none of three.
      - name: Identity hidden
        code: i
        rule: You work out which letter is the identity.
        letters: abcdefghijklmnopqrstuvwxyz
        least: 4
        tiers: [Normal, Tricky, Hard, Unreasonable]
        bounds:
          tiers:
            Hard: { shorter: { min: 6 } }
            Unreasonable: { shorter: { min: 5 } }
id:
  - digits: given
    apart: _
tierLetters: tnhxu
tiers: [Easy, Normal, Tricky, Hard, Unreasonable]
names:
  dup: "a placed element's row and column"
  single: "the only element left in a cell"
  regionsFull: "every other element already placed"
  hiddenSingle: "the only cell left for an element"
  set: "elements already accounted for"
  wing: "a wing"
  associativity: "associativity"
  identityFill: "finding the identity"
  identityElim: "an element that isn't the identity"
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  - { use: latin.hiddenSingle, tier: Easy, rung: hiddenSingle }
  - { use: latin.single, tier: Easy, rung: single }
  # Placed a·b, b·c and one of (a·b)·c and a·(b·c), the other is the same
  # element, where its cell can still hold it: a, b and c in order, the first
  # changing slowest. A cell that cannot is passed over, not a contradiction,
  # as in upstream's shipped build (its `return -1` is STANDALONE_SOLVER's).
  - id: associativity
    tier: Normal
    rung: associativity
    for: >-
      a in domain, b in domain, p = mul(a, b) where known(p),
      c in domain, q = mul(b, c) where known(q),
      l = mul(value(p), c), r = mul(a, value(q)) where known(l) != known(r)
    conclude: >-
      ((known(l) and value(l) in cand(r)) implies place(r, value(l)))
      and ((known(r) and value(r) in cand(l)) implies place(l, value(r)))
    # The hint names the three factors and the products' cells. Of the two
    # bracketings, the filled one is the premise and the other is placed.
    says:
      terms: { A: a, B: b, C: c, p: p, q: q, AB: "value(p)", BC: "value(q)" }
      marks: {}
      fact:
        terms: { third: "first({x in {l, r} where known(x)})", V: "value(first({x in {l, r} where known(x)}))" }
        marks: {}
        wordings:
          - when: "known(l)"
            look: "In any group, ({A}·{B})·{C} = {A}·({B}·{C}), and {outline p: {A}·{B} = {AB}}, {outline q: {B}·{C} = {BC}} and {outline third: ({A}·{B})·{C} = {V}}"
            move: "{ring: {A}·({B}·{C})} must also be {V}"
          - look: "In any group, ({A}·{B})·{C} = {A}·({B}·{C}), and {outline p: {A}·{B} = {AB}}, {outline q: {B}·{C} = {BC}} and {outline third: {A}·({B}·{C}) = {V}}"
            move: "{ring: ({A}·{B})·{C}} must also be {V}"
  # The first placed product, in reading order, that is one of its own
  # factors shows the other factor is the identity, e, so e's row and column
  # are the elements in order: for each j, j·e and then e·j. A cell that can
  # no longer hold its element makes the marks inconsistent.
  - id: identity
    tier: Normal
    rung: identityFill
    for: >-
      w0 = first({c in cells where known(c) and (value(c) = left(c) or value(c) = right(c))})
      where w0 != none,
      e in domain where (value(w0) = left(w0) and e = right(w0))
      or (value(w0) != left(w0) and e = left(w0))
    conclude: >-
      forall j in domain, c in {mul(j, e), mul(e, j)} where not known(c):
      j in cand(c) and place(c, j)
    # The hint names the revealing product and the identity, and says each
    # element of its row and column that follows. A later leg adds only its
    # own cell, to the product the first showed. "The product" opens the
    # sentence because a sentence capitalizes its first letter, which would
    # turn an element's letter into another symbol.
    says:
      terms: { w0: w0, e: e, A: "left(w0)", B: "right(w0)" }
      marks: {}
      fact:
        terms: { V: j }
        marks: {}
        wordings:
          - when: "value(w0) = left(w0)"
            look: "The product {outline w0: {A}·{B} = {A}} shows {B} is the identity"
            follows: "row {B} and column {B} are just the element labels"
            move: "{ring: this {noun}} must be {V}"
            again: "the identity {outline w0: the outlined product} shows"
          - look: "The product {outline w0: {A}·{B} = {B}} shows {A} is the identity"
            follows: "row {A} and column {A} are just the element labels"
            move: "{ring: this {noun}} must be {V}"
            again: "the identity {outline w0: the outlined product} shows"
  # A placed product of a with some j that is not j shows a is not the
  # identity, so no j·a or a·j can be j. The witness, o, is the least such j.
  - id: notIdentity
    tier: Tricky
    rung: identityElim
    for: >-
      a in domain,
      o = min(j in domain where (known(mul(j, a)) and value(mul(j, a)) != j)
      or (known(mul(a, j)) and value(mul(a, j)) != j))
      where o != none
    conclude: "forall j in domain: strike(mul(j, a), j) and (j = a or strike(mul(a, j), j))"
    # The hint names the element and the least witness, and the first cell
    # of o·a and a·o that shows it. The step is one rung, so the two
    # products are wordings, not arms. The sentence opens on "The product",
    # not the equation, so that its capital does not change an element's
    # letter.
    says:
      terms:
        A: a
        O: o
        shown: "first({x in {mul(o, a), mul(a, o)} where known(x) and value(x) != o})"
        product: "value(first({x in {mul(o, a), mul(a, o)} where known(x) and value(x) != o}))"
      marks: {}
      wordings:
        - when: "first({x in {mul(o, a), mul(a, o)} where known(x) and value(x) != o}) = mul(o, a)"
          look: "The product {outline shown: {O}·{A} = {product}}, not {O} as it would be if {A} were the identity"
        - look: "The product {outline shown: {A}·{O} = {product}}, not {O} as it would be if {A} were the identity"
  - { use: latin.set, tier: Tricky, rung: set }
  - { use: latin.fish, tier: Hard, rung: set }
  - { use: latin.wing, tier: Hard, rung: wing }
