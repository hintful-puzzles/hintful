# yaml-language-server: $schema=../../describe/description.schema.json

game: twiddle
help:
  rules: |-
    Rotate square sections of the grid to arrange the squares into
    numerical order starting from the top left. The game mode says what
    the squares carry:

    {{rulesets}}

    A setting adds a rule, which a board's name says:

    {{modifiers}}
  controls: |-
    {{controls}}

    A block is the square section that turns, 2×2 in the basic game. A dot marks
    the center of every block it can turn about: for a 2×2 block, the corner point
    between its four squares; for a 3×3 block, its middle square. A click
    anywhere on a square turns the block, among those holding that square, whose
    center is nearest the click. With a mouse, that block is outlined before you
    click; the keyboard's cursor outlines its block the same way.

    The keys A, B, C and D turn the block in the top-left,
    top-right, bottom-left and bottom-right corner anticlockwise, and
    the capital letter (with Shift) turns it clockwise. On the numeric keypad, 7,
    9, 1 and 3 turn the corner blocks, and 8, 2, 4, 6 and 5 turn the block
    exactly halfway along an edge, or in the very center, where the grid
    has one.
  hints: |-
    **Hint** shows the next turn rather than simply making it. Nothing in
    Twiddle is forced by logic, so the hint plans a way to finish from wherever
    you are and says what each turn is for.

    {{hint-marks}}

    The plan puts the tiles in place in reading order, keeping every finished
    tile where it is, and each step opens by naming the tile it is working on,
    *"Working on tile 3:"*. A tile is *in place* on its own square and, when
    orientation matters, the right way up.

    While a block clear of the finished tiles can reach the tile, the hint turns
    that block to *carry it toward its place*, or to *put it in place*. At the end
    of a row, and in the last rows, every block covers a finished tile, so the
    tile goes in by a run of turns that moves finished tiles out and brings them
    all back. The hint gives a run one turn at a time and says which part of a
    technique each turn is, striping the finished tiles a turn lifts out or
    brings back.

    ### The techniques

    - **A tuck**: turn a block that holds finished tiles, which lifts them out of
      the way; turn another block, which moves the tile into the space; turn the
      first block back. The finished tiles return, and the tile comes in with
      them. This is how the end of a row is filled.
    - **A cycle**: turn a block, turn a second block that overlaps it, turn the
      first block back, turn the second block back. A tile that only one of the
      two turns moved is put back by that block's turn back, so only tiles
      carried from one block into the other end up somewhere new. Where the two
      blocks share one square, exactly three tiles go round.
    - **Lining up**: before a cycle or a tuck, turn a block to bring the tiles
      it should work on into its blocks; after it, turn that block back. Every
      tile the lining up moved returns, except those the cycle moved on.
    - **Small cycles**: with 4×4 blocks no two blocks share only one square, so
      the cycle is built from two smaller cycles in place of two turns: the first
      small cycle, the second, the first undone, the second undone.
    - **A swap**: with 2×2 blocks, or any odd size, one turn and then a cycle
      inside the same block leaves two tiles exchanged, which no cycle on its own
      can do.
    - **A twist** (when orientation matters): move the same tiles the same way
      twice by two routes, the second played backwards. The tiles end where they
      started, turned round.

    A 3×3 (or any odd) block turns about a center square, so a tile always stays
    on squares of its own checkerboard color.

    Follow it or go your own way: when you make a different turn, the next hint
    plans again from there. If you stop partway through a run, the next hint
    reads the turns left as a technique of their own and puts the moved tiles
    back as it goes on.
name: Twiddle
family: tiles in order
sizes:
  # The game bounds neither side above; 99 stands for no bound.
  w: { min: 2, max: 99 }
  h: { min: 2, max: 99 }
  # The side of the block a move turns.
  n: { min: 2, max: 99 }
space:
  grid: { w: "w", h: "h" }
  units: []
position:
  # The number each square's tile shows: 1 to w * h, once each.
  value: { domain: "range(1, w * h)", arranged: "1" }
freedom: { kind: permute }
define:
  # Whether square c is in the block whose top-left square is b.
  inBlock(c, b): "x(c) >= x(b) and x(c) < x(b) + n and y(c) >= y(b) and y(c) < y(b) + n"
  # The square whose tile a quarter turn of the block at b brings to c,
  # anticlockwise and clockwise.
  acw(c, b): "cell(x(b) + n - 1 - (y(c) - y(b)), y(b) + x(c) - x(b))"
  cw(c, b): "cell(x(b) + y(c) - y(b), y(b) + n - 1 - (x(c) - x(b)))"
  # A square's color on the checkerboard.
  shade(c): "(x(c) + y(c)) mod 2"
  # The finished board holds the numbers in reading order, so the tiles of
  # one number cover a run of its squares, from the lo-th to before the hi-th:
  # how many squares of shade k the run covers.
  homes(lo, hi, k): >-
    count(i in cells where index(i, cells) >= lo and index(i, cells) < hi
    and shade(i) = k)
  # Where the run of number v starts, and where it ends.
  below(v): "count(d in cells where value(d) < v)"
  upTo(v): "count(d in cells where value(d) <= v)"
moves:
  # Turn the block whose top-left square is b a quarter turn anticlockwise.
  anticlockwise:
    for: "b in cells where x(b) <= w - n and y(b) <= h - n"
    set:
      - for: "c in cells where inBlock(c, b)"
        value: "value(acw(c, b))"
  # And clockwise.
  clockwise:
    for: "b in cells where x(b) <= w - n and y(b) <= h - n"
    set:
      - for: "c in cells where inBlock(c, b)"
        value: "value(cw(c, b))"
finish:
  - "forall c in cells where index(c, cells) > 0: value(nth(cells, index(c, cells) - 1)) <= value(c)"
deadEnds:
  # A block of odd side turns about a square, so each tile stays on its
  # color: the tiles of each number must cover as many squares of each color
  # as they do on the finished board.
  colorOdd: >-
    n mod 2 = 1 and exists c in cells, v = value(c), lo = below(v), hi = upTo(v),
    k in {0, 1}:
    count(d in cells where value(d) = v and shade(d) = k) != homes(lo, hi, k)
  # Where no two tiles share a number, a quarter turn is the block's cycles
  # of four tiles, an even permutation unless n is two more than a multiple
  # of four.
  parity: >-
    n mod 4 != 2 and distinct(value(c) over c in cells)
    and count(a in cells, b in cells where index(a, cells) < index(b, cells)
    and value(a) > value(b)) mod 2 = 1
variations:
  Rows only:
    replace:
      position:
        # The squares of a row all carry the row's number.
        value: { domain: "range(1, h)", arranged: "w" }
  orientable:
    add:
      position:
        # How far each tile is turned anticlockwise from upright, in quarter
        # turns.
        turn: { domain: "range(0, 3)" }
      moves:
        anticlockwise:
          set:
            - for: "c in cells where inBlock(c, b)"
              turn: "(turn(acw(c, b)) + 1) mod 4"
        clockwise:
          set:
            - for: "c in cells where inBlock(c, b)"
              turn: "(turn(cw(c, b)) + 3) mod 4"
      finish:
        - "forall c in cells: turn(c) = 0"
      deadEnds:
        # A block of even side turns about a corner, so a tile changes color
        # with every quarter turn it makes, and its color and its turns
        # together keep their parity.
        colorTurned: >-
          n mod 2 = 0 and exists c in cells, v = value(c), lo = below(v), hi = upTo(v),
          k in {0, 1}:
          count(d in cells where value(d) = v and (shade(d) + turn(d)) mod 2 = k)
          != homes(lo, hi, k)
        # A block of even side turns a multiple of four tiles at once.
        turnSum: "n mod 2 = 0 and sum(c in cells of turn(c)) mod 4 != 0"
deal:
  start: m random turns from the finished board, or a long shuffle at m = 0
