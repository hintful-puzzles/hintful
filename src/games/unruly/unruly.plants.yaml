# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # A window with one square of a piece read as two.
  threes:
    for: >-
      L in lines, i in range(0, |cells(L)| - 3), W = window(L, i), x in W where
      not known(x), d in domain where (exists c in W where c != x: value(c) = d)
  # A line's empty squares filled with the other piece while it lacks one d.
  lastGap:
    for: >-
      L in lines, n = |cells(L)| / 2, d in domain where count(c in cells(L)
      where value(c) = d) = n - 1 and count(c in cells(L) where value(c) =
      flip(d)) = n - 1
  quota:
    for: >-
      L in lines, n = |cells(L)| / 2, d in domain where count(c in cells(L)
      where value(c) = d) >= n - 1 and count(c in cells(L) where value(c) =
      flip(d)) < n
  # The last d's window allowed to hold a d already.
  lastOne:
    for: >-
      L in lines, n = |cells(L)| / 2, d in domain where count(c in cells(L)
      where value(c) = d) = n - 1 and count(c in cells(L) where value(c) =
      flip(d)) <= n - 2, i in range(0, |cells(L)| - 3), W = window(L, i) where
      count(c in W where not known(c)) >= 2
  # The second line's d not asked to sit where the first's do.
  unique:
    for: >-
      A in lines, n = |cells(A)| / 2, d in domain where count(c in cells(A)
      where value(c) = d) = n, B in lines where B != A and (A in rows) = (B in
      rows) and count(c in cells(B) where value(c) = d) = n - 1, j in range(0,
      |cells(A)| - 1) where value(sq(A, j)) = d and not known(sq(B, j))
