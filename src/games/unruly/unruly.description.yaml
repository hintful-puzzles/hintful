# yaml-language-server: $schema=../../describe/description.schema.json

game: unruly
help:
  rules: |-
    Fill every square with a {{pair:0}} or a {{pair:1}} so that:

    - no three consecutive squares, horizontally or vertically, hold
      the same piece
    - each row and column contains the same number of each.

    Given pieces sit on a lighter square and cannot be changed.

    One setting adds a rule, and a board's name in the Type menu says when
    it is on:

    {{modifiers}}
  controls: |-
    {{controls}}

    Clicking a filled square again moves it on round {{pair:0}}, {{pair:1}} and
    empty, and a right-click goes round the other way. You can also press 1 for
    a {{pair:0}}, and 0 or 2 for a {{pair:1}}.
  hints: |-
    **Hint** explains the next step rather than simply making it. It reasons
    only from the squares already filled, so it carries on from wherever you
    are, as long as none of them is wrong; if one is, it asks you to fix the
    highlighted mistakes first.

    {{hint-marks}}

    The hint uses four ideas:

    * **No three in a row.** Where two of three squares in a line already hold
      the same piece, the third must hold the other one.
    * **A full quota.** A row or column that already holds all its {{pair:0}}s
      must hold {{pair:1}}s everywhere else, and the other way round.
    * **The last one has few places to go.** When a row or column needs just
      one more of a piece, and every place but the outlined squares would force
      three of the other piece together, the rest of the line holds the other
      piece.
    * **No two lines alike**, when *Unique rows and columns* is switched on
      in ‘Custom type…’. When the outlined row already holds all its {{pair:0}}s,
      and the striped row holds all but one of its own in the same places,
      putting the last one where the outlined row has its remaining {{pair:0}}
      would make the two rows identical, so that square must hold a {{pair:1}}
      (and the same with the pieces swapped, or with columns).

    When one idea settles several squares at once, the hint rings them all
    in one step.
catalog:
  name: Unruly
  description: Two-piece grid puzzle
  objective: Fill the grid with blocks and discs, avoiding runs of three.
  collection: original
  family: shading
  similar: Tohu-Wa-Vohu, Binairo, Tic-Tac-Logic
produces: shading
words:
  cell: cell
sizes:
  w: { min: 6, step: 2 }
  h: { min: 6, step: 2 }
space:
  grid: { w: "w", h: "h" }
  # Rows and columns are lines, but a value repeats in them.
  units: []
answer:
  # 1 is the first of the pair, 2 the second.
  value: { sort: cell, domain: "range(1, 2)" }
define:
  # The other piece.
  flip(d): "3 - d"
  # Three cells in a row of a line, from its i-th.
  window(L, i): "{sq(L, i), sq(L, i + 1), sq(L, i + 2)}"
  # A line's i-th square.
  sq(L, i): "nth(cells(L), i)"
  # How many of a line's squares hold d.
  holds(L, d): "count(c in cells(L) where value(c) = d)"
  # The squares of a set not yet filled.
  open(S): "{c in S where not known(c)}"
shape:
  - >-
    forall L in lines, i in range(0, |cells(L)| - 3):
    not (value(sq(L, i)) = value(sq(L, i + 1)) and value(sq(L, i + 1)) = value(sq(L, i + 2)))
  - "forall L in lines, d in domain: 2 * count(c in cells(L) where value(c) = d) = |cells(L)|"
# A piece the board is dealt holding.
given: [value]
freedom: { kind: fill }
play:
  values:
    1: { does: put a block in it, key: "1", glyph: " 1 ", paint: block }
    2: { does: put a disc in it, key: ["0", "2"], glyph: " 0 ", paint: disc }
  primary: 1
  secondary: 2
  # A click goes round empty, the button's piece and the other one.
  click: cycle
  # Upstream's 6x6 and 8x8, and its 10x10 and 14x14 made upright boards of
  # about their area.
  boards: [6x6, 8x8, 8x12, 12x16]
  default: 8x8
  # The smallest board stops a tier short, which is the line the unique
  # board takes in a section of twelve.
  boardTiers: { 6x6: [Easy, Normal] }
  variants: [{ board: 8x8, with: [unique], tier: Normal }]
  hintMarks:
    ring: >-
      the square to fill. It is drawn empty: the sentence says whether it must
      hold a block or a disc.
    outline: >-
      the squares whose pieces the step reasons from: the pair that would make
      three, the full quota, the only places the last one can go, or the row a
      match would copy.
    stripes: the row or column the sentence calls "this row" or "this column".
deal:
  answer: >-
    built a square at a time: a random piece on a random empty square, then
    every square the ladder decides from them
  given: >-
    every square's piece, then each hidden in a random order while the board
    still finishes at the tier
  tier: one of the tiers, the board finished at it and not at the tier below
  sample: { build: true }
  hide: given
settings:
  unique:
    kind: flag
    gives: variation
    letter: u
    kw: unique-rows-and-columns
    name: Unique rows and columns
    words: unique
    rule: no two rows may be the same, and no two columns.
    note: >-
      There are only so many different rows of a given width, so this limits
      how tall the grid can be for its width, and the other way round: a grid
      6 squares wide can be at most 14 high, and one 8 wide at most 34.
    # OEIS A177790: how many different lines of 2i squares the shape allows,
    # as far as a 32-bit integer holds. A board 2i wide has at most that
    # many rows, and the other way round.
    most:
      [
        1, 2, 6, 14, 34, 84, 208, 518, 1296, 3254, 8196, 20700, 52404, 132942,
        337878, 860142, 2192902, 5598144, 14308378, 36610970, 93770358,
        240390602, 616787116, 1583765724,
      ]
# Upstream's game ID: the givens as dot runs, a block's letter uppercase.
id:
  - dots: given
    cases: [2, 1]
tierLetters: ten
variations:
  unique:
    add:
      shape:
        - >-
          forall A in lines, B in lines where B != A and (A in rows) = (B in rows):
          exists i in range(0, |cells(A)| - 1): value(sq(A, i)) != value(sq(B, i))
      techniques:
        # A line holding all its d, and a parallel line holding all but one of
        # its own where the first has them: putting its last d where the first
        # has its remaining one would make the two the same, so that square is
        # the other piece.
        - id: unique
          tier: Normal
          for: >-
            A in lines, n = |cells(A)| / 2,
            d in domain where count(c in cells(A) where value(c) = d) = n,
            B in lines where B != A and (A in rows) = (B in rows)
            and count(c in cells(B) where value(c) = d) = n - 1
            and (forall j in range(0, |cells(A)| - 1) where value(sq(B, j)) = d: value(sq(A, j)) = d),
            j in range(0, |cells(A)| - 1) where value(sq(A, j)) = d and not known(sq(B, j))
          conclude: "place(sq(B, j), flip(d))"
          says:
            terms: { horizontal: "A in rows", fill: flip(d), kept: d }
            marks: { stripes: "cells(B)", reads: "cells(B)", outline: "cells(A)" }
            look: "{stripes}'s {piece kept}s all sit where {outline: the outlined {if horizontal: row | column}}'s do"
            follows: "a {piece kept} in {ring: this cell} would copy it"
            move: "it must hold a {piece fill}"
tiers: [Easy, Normal, Tricky]
# A line's quota of each piece, half its squares: the group a count kind
# reads, d the piece it counts.
kindWords:
  group: "L in lines, d in domain"
  set: "cells(L)"
  need: "|cells(L)| / 2 - holds(L, d)"
  restMove: "place(c, flip(d))"
  marks:
    stripes: "cells(L)"
    reads: "cells(L)"
    outline: "{c in cells(L) where value(c) = d}"
  unit: "this {if horizontal: row | column}"
  has: "{outline: all its {piece full}s (outlined)}"
  items: "{piece full}s"
  restWord: "must hold a {piece fill}"
  terms: { horizontal: "L in rows", full: d, fill: flip(d) }
names:
  threes: "avoiding three in a row"
  lastGap: "a line with one square left"
  quota: "a full quota"
  unique: "no two lines alike"
  lastOne: "where the last one can go"
techniques:
  # Two of three squares in a row of a line hold one piece, so the third holds
  # the other.
  - id: threes
    tier: Easy
    for: >-
      L in lines, i in range(0, |cells(L)| - 3), W = window(L, i),
      x in W where not known(x),
      d in domain where (forall c in W where c != x: value(c) = d)
    conclude: "place(x, flip(d))"
    says:
      terms: { held: d, fill: flip(d) }
      marks: { outline: "{c in W where c != x}" }
      look: "{outline: the outlined cell | the outlined cells} already hold {piece held}s"
      follows: "{ring: this cell} would make three in a row"
      move: "it must hold a {piece fill}"
  # A line holding all its d and all but one of the other piece: its one empty
  # square holds the other piece.
  - kind: count.met
    as: lastGap
    tier: Easy
    with:
      group: "L in lines, d in domain where holds(L, flip(d)) = |cells(L)| / 2 - 1"
  # A line holding all its d: every empty square holds the other piece.
  - kind: count.met
    as: quota
    tier: Normal
  # A line with one d left to place and at least two of the other piece: three
  # squares in a row holding no d, two of them empty, would be three of the
  # other piece unless the last d goes among them, so it does, and every
  # empty square of the line outside them holds the other piece.
  - id: lastOne
    tier: Tricky
    for: >-
      L in lines, n = |cells(L)| / 2,
      d in domain where count(c in cells(L) where value(c) = d) = n - 1
      and count(c in cells(L) where value(c) = flip(d)) <= n - 2,
      i in range(0, |cells(L)| - 3), W = window(L, i)
      where (forall c in W: value(c) != d) and count(c in W where not known(c)) >= 2
    conclude: "forall c in cells(L) where not known(c) and c not in W: place(c, flip(d))"
    says:
      terms: { horizontal: "L in rows", fill: flip(d), kept: d }
      marks: { stripes: "cells(L)", reads: "cells(L)", outline: "W" }
      look: "The last {piece kept} in {stripes} fits only in {outline: an outlined cell} without making three {piece fill}s"
      move: "{ring: this cell} must hold a {piece fill}"
