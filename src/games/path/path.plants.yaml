# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # A square one edge short of its lines read as taking every edge left.
  forced:
    for: >-
      c in cells, n = takes(c) - lines(c), U = ways(c) where n > 0 and |U| <= n
      + 1
    conclude: "forall y in U: place(edge(c, y), 1)"
  # What a line breaks read with the edge crossed out rather than lined.
  lineBreaks:
    for: >-
      e in edges, a = end1(e), b = end2(e) where live(a, b) and (with place(e,
      2): shortNear(a, b, b))
  # A pair that breaks nothing read as one that does.
  pairBreaks:
    for: >-
      c in cells where takes(c) - lines(c) = 2, U = ways(c) where |U| = 3, k in
      U, I = U - {k}, i = nth(I, 0), j = nth(I, 1) where not known(edge(c, k))
      and not known(edge(c, i)) and not known(edge(c, j)) and not bothBreak(c,
      i, j)
  # The edges every pair left holds crossed out rather than lined.
  weighed:
    conclude: "|N| > 0 and (forall y in P: place(edge(c, y), 2))"
