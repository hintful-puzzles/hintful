# yaml-language-server: $schema=../../describe/description.schema.json

game: path
help:
  rules: |-
    Draw lines through the middles of the squares, never diagonally, using
    every square. Lines may not cross or branch, so a square without a
    number takes one line in and one out. No line crosses a wall, a thick
    bar between squares. What the numbers ask depends on the game mode:

    {{rulesets}}
  controls: |-
    Drag from square to square to draw a line along the edges you pass. To
    change your mind mid-stroke, draw back along its end: the squares you
    retrace are taken back. Brushing any other part of the stroke does
    nothing, and it carries on once you return to where it reached, so a long
    line can be drawn in one stroke. Undo takes a stroke back. A drag from the
    loose end of a line you have drawn carries it on, or, back along it, takes
    it up. A line stops where it would give a square more lines than it takes,
    where you have crossed the edge out, or at a wall. You can also click near
    the edge between two squares to draw or remove a line there.

    A stroke that starts on a number, or anywhere along a line but its ends,
    picks the line up there and draws it again from there on: once it turns
    off the old line, the old line ahead is taken up, as far as it went, and
    your stroke is drawn in its place. A stroke that only follows the old line
    changes nothing. In {{choice:ruleset:0}} the line ahead runs toward the
    higher numbers, so a stroke from the 2, or from between the 2 and the 3,
    keeps the line back to the 1. Where the numbers do not say which way is
    ahead, it is the way your stroke sets off along the line. A number that
    still has room for a line keeps the one it has when your stroke sets off
    a new way: the stroke is its other line. In
    {{choice:ruleset:1}} a stroke from a number replaces the number's whole
    line, and one from the middle of a line replaces the side away from the
    number it reaches.

    Right-click an edge to cross it out, to mark that you are sure no line goes
    there, and keep the button down and drag to cross out every edge you pass.
    Right-click it again to clear the cross. A wall cannot be crossed out or
    cleared. You never need to cross anything out to finish.

    The keyboard can also be used. The arrow keys move a cursor. Press Enter to
    start a line, move the cursor along the way you want it (moving back along
    it takes a step back), and press Enter again to draw it; Space, Escape,
    Backspace or Delete abandons it instead.
    Holding Ctrl while pressing an arrow key draws or removes the line in that
    direction and moves along it, holding Ctrl and Shift together does the same
    without moving, and holding Shift alone crosses out or clears the edge in
    that direction.

    In {{choice:ruleset:0}}, the color runs along the line from the 1 to the
    highest number: each stretch of line between two numbers takes a color of its
    own, in order round the color wheel, and each number is ringed in the color
    of the stretch that leaves it, the highest in that of the stretch that
    reaches it. A number's disc fills once the line reaches the numbers either
    side of it.

    In {{choice:ruleset:1}}, each pair of numbers has a color, ringing both its
    numbers, and a line takes that color once it reaches one of them. Colors
    repeat on a board with more pairs than colors, and the numbers tell those
    pairs apart. A pair's two discs fill with its color once a line joins them.

    In both, a line that reaches no number yet has no color. A line turns red
    when it breaks the rules already: when it closes into a loop, or joins two
    numbers that may not meet. In {{choice:ruleset:0}} that is two that are not
    one apart, such as a line from the 3 that reaches the 5 before the 4, and in
    {{choice:ruleset:1}} two different numbers.
  sections:
    - heading: When it is solved
      body: |-
        The puzzle is solved when every square has its lines and they join the
        numbers as the mode asks. Every puzzle has exactly one solution, and none
        needs a guess.
  origins: |-
    {{choice:ruleset:0}} is the puzzle LinkedIn publishes daily as *Zip*.
    {{choice:ruleset:1}} is Nikoli's *Numberlink*, also published as *Arukone*,
    and played by many as *Flow Free*. Simon Tatham wrote a generator for it but
    never a game; this one fills every square, as Flow Free does.
  hints: |-
    **Hint** explains the next step rather than simply making it. It reasons only
    from the numbers, the walls and the lines and crosses you have drawn, so it
    carries on from wherever you are, as long as none of those is wrong; if one
    is, it asks you to fix the highlighted mistakes first.

    {{hint-marks}}

    An edge beside a square that already has all its lines can never take
    another, and neither can an edge whose line would join two numbers that may
    not meet, whether the numbers sit beside it or lines lead to them from it.
    In {{choice:ruleset:0}}, neither can an edge whose line would close a loop.
    The hint counts all of these as closed without asking you to cross them out,
    and most steps are then one rule at work: a square with only as many open
    edges left as it still needs lines takes a line on each of them.

    On Normal boards a step sometimes looks at what a line would do, drawing it
    thin. A line breaks the board if it leaves a square a dead end or cut off,
    closes a loop, or joins two numbers that may not meet. An edge whose line
    would break the board is crossed out. A square that needs two more lines and
    has three open edges left takes the third if lines on the other two would
    break the board.

    On Tricky boards a square that needs two more lines and has all four edges
    open has to be weighed whole. If lines on any two of three of its edges would
    break the board, the fourth takes a line; and an edge whose line would break
    the board beside any of the square's other edges is crossed out. Each way is
    looked at on the board as it stands, so nothing needs following further.
name: Path
family: lines
sizes:
  w: { min: 3, max: 133 }
  h: { min: 3, max: 133 }
  # How far apart two numbers a line joins are: 0 in Pairs, where a line
  # joins like numbers, and 1 in Path, where it runs from each number to the
  # next.
  step: { min: 0, max: 1 }
space:
  grid: { w: "w", h: "h" }
  edges: true
  units: []
answer:
  # The edge between two squares side by side: 1 a line, 2 none.
  value:
    sort: edge
    domain: "range(1, 2)"
define:
  numbered(c): "clue(number, c) != none"
  # The lines square c takes: two through a square without a number; one
  # from a Pairs number, and in Path from the 1 and the highest number.
  takes(c): >-
    2 - count(k in {c} where numbered(k) and (step = 0 or clue(number, k) = 1
    or count(x in cells where clue(number, x) = clue(number, k) + 1) = 0))
  # The lines square c has.
  lines(c): "count(y in adj4(c) where value(edge(c, y)) = 1)"
  # Whether square c takes another line.
  spare(c): "lines(c) < takes(c)"
  # Two numbers a line may join: alike in Pairs, one apart in Path.
  fits(p, q): "abs(clue(number, p) - clue(number, q)) = step"
  # The squares the lines join to square c.
  piece(c): "through(c, {e in edges where value(e) = 1})"
  # The numbers nearest square c along its piece of line: c's own where it
  # has one, and otherwise those the lines reach first from c's stretch of
  # squares without a number. One, at either end of a piece holding a number.
  nearest(c): >-
    {x in {c} where numbered(x)}
    + set(x over t in through(c, {e in edges where value(e) = 1
    and not numbered(end1(e)) and not numbered(end2(e))}),
    x in adj4(t) where not numbered(t) and numbered(x) and value(edge(t, x)) = 1)
  # Whether a line between a and b, each an end of its piece, joins numbers
  # that may meet.
  meets(a, b): "forall p in nearest(a), q in nearest(b): fits(p, q)"
  # Whether the edge between a and b may still take a line: neither has all
  # its lines, and a line there would join no two numbers that may not
  # meet, nor in Path close a loop. A player sees each at a glance, so such
  # an edge counts as closed, and no technique crosses it out.
  live(a, b): >-
    not known(edge(a, b)) and spare(a) and spare(b) and meets(a, b)
    and (step = 0 or b not in piece(a))
  # The edges square c may still take a line on.
  ways(c): "{y in adj4(c) where live(c, y)}"
  # Whether square c is left short of the lines it takes: too few edges
  # left for them.
  stuck(c): >-
    spare(c) and not (exists y in adj4(c) where live(c, y):
    lines(c) + 1 = takes(c) or (exists z in before(y, adj4(c)): live(c, z)))
  # Whether a square near the piece through a, where lines were just tried
  # on the edges of a, b and d, is left short: a square whose lines the
  # trial changed, an end of the piece, or one beside either.
  shortNear(a, b, d): >-
    exists t in piece(a) where t = a or t = b or t = d or spare(t):
    stuck(t) or (exists s in adj4(t): stuck(s))
  # Whether lines on both edges between square c and squares i and j, two
  # of its own, would break the board at once: close a loop, join two
  # numbers that may not meet, or leave a square short.
  bothBreak(c, i, j): >-
    j in piece(i) or (not numbered(c) and not meets(i, j))
    or (with place(edge(c, i), 1): with place(edge(c, j), 1): shortNear(c, i, j))
shape:
  # Every square has the lines it takes.
  - "forall c in cells: lines(c) = takes(c)"
  # A stretch of squares without a number runs between two numbers: no loop
  # holds none.
  - "forall c in cells where not numbered(c): |nearest(c)| = 2"
rules:
  # The numbers run from 1 with no gap, each on two squares in Pairs and on
  # one in Path, the highest at least 2.
  numbers: >-
    (step = 0 or exists x in cells: clue(number, x) = 2)
    and (forall x in cells where numbered(x):
    count(y in cells where clue(number, y) = clue(number, x)) = 2 - step
    and (clue(number, x) = 1 or exists y in cells: clue(number, y) = clue(number, x) - 1))
clues:
  # A square's number: each line from it leads to a number it may meet.
  number:
    at: cell
    value: "range(1, w * h)"
    means: >-
      forall y in adj4(at) where value(edge(at, y)) = 1,
      q in nearest(y) where q != at: fits(at, q)
  # A wall between two squares, which no line crosses.
  wall: { at: edge, value: "range(1, 1)", means: "value(at) = 2" }
freedom: { kind: fill }
deal:
  answer: >-
    Pairs: paths laid at random, cut where the ladder stops short and joined
    where it still finishes at the tier; Path: one path through every square
  number: each path's two ends in Pairs; in Path the ends and as many squares along it as the tier needs
  wall: in Path, edges off the path the board needs at its tier
  step: the ruleset
  tier: one of the tiers
tiers: [Easy, Normal, Tricky, Unreasonable]
techniques:
  # A square with only as many edges left as it still needs lines takes a
  # line on each. One with more lines than it takes, or fewer edges left
  # than it needs, makes the marks inconsistent, and so does one whose two
  # last edges would close a loop or join two numbers that may not meet.
  - id: forced
    tier: Easy
    for: >-
      c in cells, n = takes(c) - lines(c), U = ways(c)
      where n < 0 or (n > 0 and |U| <= n)
    conclude: >-
      n >= 0 and |U| = n
      and (forall i in U, j in before(i, U): j not in piece(i)
      and (numbered(c) or meets(i, j)))
      and (forall y in U: place(edge(c, y), 1))
    says:
      terms: { c: c, n: n }
      marks: {}
  # A line on an edge would break the board at once: close a loop, or leave
  # a square short. The edge is crossed out.
  - id: lineBreaks
    tier: Normal
    for: >-
      e in edges, a = end1(e), b = end2(e) where live(a, b)
      and (b in piece(a) or (with place(e, 1): shortNear(a, b, b)))
    conclude: "place(e, 2)"
    says:
      terms: { e: e }
      marks: {}
  # A square that takes two more lines from three edges left, where lines
  # on two of them would break the board: the third takes a line.
  - id: pairBreaks
    tier: Normal
    for: >-
      c in cells where takes(c) - lines(c) = 2, U = ways(c) where |U| = 3,
      k in U, I = U - {k}, i = nth(I, 0), j = nth(I, 1)
      where bothBreak(c, i, j)
    conclude: "place(edge(c, k), 1)"
    says:
      terms: { c: c, i: i, j: j }
      marks: {}
  # A square that takes two more lines from four edges left, weighed whole:
  # of its six pairs of edges, those that would not break the board are
  # left. N is the edges some pair left holds. An edge every pair left
  # holds, so that every pair without it breaks, takes a line; where none
  # is, an edge no pair left holds is crossed out. With no pair left the
  # marks are inconsistent. Each pair is tried once: A holds the edges whose
  # pair with U's first breaks, and B, for each pair of the last three that
  # breaks, the third.
  - id: weighed
    tier: Tricky
    for: >-
      c in cells where takes(c) - lines(c) = 2, U = ways(c) where |U| = 4,
      A = set(j over i in U, j in U
      where index(i, U) = 0 and index(j, U) > 0 and bothBreak(c, i, j)),
      B = set(first(U - {nth(U, 0), i, j}) over i in U, j in U
      where index(i, U) > 0 and index(i, U) < index(j, U) and bothBreak(c, i, j)),
      N = {y in U where (index(y, U) = 0 and |A| < 3)
      or (index(y, U) > 0 and (y not in A
      or (exists m in U where index(m, U) > 0 and m != y: m not in B)))},
      P = {y in N where (index(y, U) = 0 and |B| = 3)
      or (index(y, U) > 0 and y in B
      and (forall m in U where index(m, U) > 0 and m != y: m in A))},
      X = U - N
      where |N| = 0 or |P| > 0 or |X| > 0
    conclude: >-
      |N| > 0 and (forall y in P: place(edge(c, y), 1))
      and (|P| = 0 implies forall y in X: place(edge(c, y), 2))
    says:
      terms: { c: c, U: U, P: P, X: X }
      marks: {}
