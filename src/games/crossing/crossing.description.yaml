# yaml-language-server: $schema=../../describe/description.schema.json

game: crossing
help:
  rules: |-
    You're given a grid with several blocked squares, and a list of numbers. Your objective is to fill every empty square with a digit, so each number appears once in the grid when reading from left-to-right or from top-to-bottom.
  controls: |-
    Left-click to select a cell, then type a number on your keyboard to enter it. Press Backspace, Space or 0 to clear a cell.

    Right-click a cell, then type a number to add a pencil mark. A cell's pencil marks are the digits it can still take, so **Check & save** flags a set of marks that leaves out the cell's answer, and the hint reads them the same way. {{sticky-pencil}}

    You can also use the arrow keys to move the selected cell around. Press Enter to toggle between entering numbers and entering pencil marks.

    ### Typing a whole number

    After you enter a digit, the selection moves on to the next square of the run you're filling, so a complete number can be typed without selecting each square in turn. The selection stops at the end of the run.

    The direction is set by the arrow key you last used, and by the square you select: a square that belongs to only one run snaps to it, and clicking an already-selected square that lies on both an across and a down run swaps between them. Clearing a square or adding a pencil mark doesn't move the selection.

    ### Placing numbers from the list

    The number list is an input surface, not just a reference. Click a number to pick it up and every run that can still take it is previewed; click one of those runs to write the whole number in at once. If a square is already selected, clicking a number that fits one of its runs places it straight away.

    Across and down runs are drawn in two different colors, and each number in the list is written in the color of the run a click would send it to — so the list always tells you where the number is going. Numbers already written into the grid stay distinguishable from ones that simply don't fit the square you have selected.

    A square selected for pencil marks colors its two runs in the same way. The list stays plain then, because a click on a number picks it up rather than placing it.

    Both the auto-advance and the two clue-list aids — highlighting the runs through the selected cell, and coloring the list by where each number could go — can be switched off in the game's preferences.
  origins: |-
    This is an implementation of *Nansuke*, which was invented by Nikoli. It's sometimes known as *Number Skeleton*.

    More information: https://www.nikoli.co.jp/en/puzzles/nansuke/
  hints: |-
    **Hint** explains the next step rather than simply making it. It reasons from the digits you have entered and from your pencil marks, which it reads as the only digits a square can still take. So it carries on from wherever you are, as long as none of them is wrong; if one is, it asks you to fix the highlighted mistakes first.

    {{hint-marks}}

    A number *still fits* a run, in the hint's words, when it is the run's length, is not already written in elsewhere, and agrees with every square of the run: the digit you entered, or else its pencil marks.

    When the hint needs to narrow a square down before it can say more, it writes the digits that square can still take into its pencil marks ("so note them"), or crosses out the ones it can't ("must go"), as steps of their own. It writes only the marks its next digit rests on.

    A few ideas are worth learning by name:

    * **Only one number fits.** A run whose length only one listed number shares, or whose other numbers of that length are all used, must be that number.
    * **Only one run fits.** The same question asked of a number: where can it still go? If every other run of its length is full, or holds a digit or pencil marks it disagrees with, it goes in the one run left, even when that run could take other numbers too. The hint outlines the squares that rule it out elsewhere.
    * **Every fitting number agrees.** If every number that still fits a run has the same digit in one of its squares, that square is that digit.
    * **Crossing runs.** The across number allows some digits in a square and the down number allows others; when they share just one, that is the square's digit.

    On an Unreasonable board there comes a point where none of these settles
    another square, and the hint says that nothing further follows by deduction
    instead of choosing for you. Save your position and try a digit in a square
    with few left. The hint carries on from whatever you enter.
name: Crossing
family: numbers
sizes:
  # One side at least 4; unbounded but by the time a board takes to deal.
  w: { min: 1, max: 99999 }
  h: { min: 1, max: 99999 }
space:
  grid: { w: "w", h: "h" }
  # A digit may repeat anywhere: the numbers say what a run holds.
  units: []
answer:
  # A digit, and 10 in a square that holds none: a wall, or a square no run
  # passes through.
  value: { sort: cell, domain: "{d in range(1, 10) where (d = 10) = (clue(blank, c) >= 0)}" }
define:
  # Every square a digit goes in.
  open: "{c in cells where clue(blank, c) < 0}"
  # The run along line L through square c: the open squares in a row there.
  run(L, c): "stretch(L, c, open)"
  # Whether c is the first square of a run along L, which is two squares or
  # more. A run is named by its first square and its line.
  head(L, c): "clue(blank, c) < 0 and |run(L, c)| >= 2 and first(run(L, c)) = c"
  # The digit number k puts in square x of run R.
  digit(k, x, R): "nth(digits(k), index(x, R))"
  # Whether run R reads number k.
  reads(k, R): "|digits(k)| = |R| and (forall x in R: value(x) = digit(k, x, R))"
  # Whether number k is written in a run: one whose first square holds its
  # first digit, which is read first, since it rules out all but a few.
  written(k): "exists c in cells where value(c) = nth(digits(k), 0), L in {row(c), col(c)} where head(L, c): reads(k, run(L, c))"
  # Whether number k still fits run R: as long, and each digit one its square
  # can still hold.
  fits(k, R): "|digits(k)| = |R| and (forall x in R: digit(k, x, R) in cand(x))"
  # Whether number k still fits run R, in the hint's words: fits it, and is
  # written nowhere. Fitting is read first: most numbers fail it on their
  # length, and whether one is written is read again after each placement.
  free(k, R): "fits(k, R) and not written(k)"
shape:
  # Every run reads a number.
  - "forall L in lines, c in cells(L) where head(L, c): exists k in clues(numbers): reads(k, run(L, c))"
  # The list names each number once.
  - "forall k in clues(numbers), j in clues(numbers) where j != k: digits(j) != digits(k)"
clues:
  # A wall, or an open square no run passes through, which holds no digit.
  blank:
    at: cell
    value: "range(0, 0)"
    means: "value(at) = 10"
  # A number of the list: its digits, first to last. Each is read in exactly
  # one run.
  numbers:
    at: board
    fields:
      digits: { list: true, value: "range(1, 9)" }
    means: "count(L in lines, c in cells(L) where head(L, c) and reads(k, run(L, c))) = 1"
freedom: { kind: fill }
deal:
  blank: walls grown at random, symmetric as asked, until no two by two block is open and the open squares are joined; a board with a square no run passes through is dealt again
  answer: a digit a square, at random
  numbers: every run's, sorted by length and then by digit; a board two runs read alike on is dealt again
  tier: one of the tiers
tiers: [Easy, Unreasonable]
techniques:
  # A run that only one number still fits is that number. One no number fits
  # makes the marks inconsistent.
  - id: onlyNumber
    tier: Easy
    for: >-
      L in lines, c in cells(L) where head(L, c), R = run(L, c)
      where (exists x in R: not known(x)),
      K = {k in clues(numbers) where free(k, R)} where |K| < 2
    conclude: "|K| = 1 and (forall x in R where not known(x): place(x, digit(first(K), x, R)))"
  # A number that still fits only one run goes there, whatever else the run
  # could take.
  - id: onlyRun
    tier: Easy
    for: >-
      k in clues(numbers) where not written(k)
      and count(M in lines, b in cells(M) where head(M, b) and fits(k, run(M, b))) = 1,
      L in lines, c in cells(L) where head(L, c) and fits(k, run(L, c)), R = run(L, c)
    conclude: "forall x in R where not known(x): place(x, digit(k, x, R))"
  # Every number that still fits a run puts the same digit in one of its
  # squares.
  - id: sharedDigit
    tier: Easy
    for: >-
      L in lines, c in cells(L) where head(L, c), R = run(L, c)
      where (exists x in R: not known(x)),
      K = {k in clues(numbers) where free(k, R)} where |K| > 0,
      x in R where not known(x), D = set(digit(k, x, R) over k in K) where |D| = 1
    conclude: "place(x, first(D))"
  # The numbers still fitting a square's across run and those fitting its down
  # run share one digit there.
  - id: crossRuns
    tier: Easy
    for: >-
      x in cells where clue(blank, x) < 0 and not known(x),
      A = run(row(x), x), B = run(col(x), x) where |A| >= 2 and |B| >= 2,
      KA = {k in clues(numbers) where free(k, A)},
      KB = {k in clues(numbers) where free(k, B)},
      D = {d in set(digit(k, x, A) over k in KA) where exists k in KB: digit(k, x, B) = d}
      where |D| = 1
    conclude: "place(x, first(D))"
  # A square of a run holds only a digit some number still fitting the run
  # puts there.
  - id: narrow
    tier: Easy
    for: >-
      L in lines, c in cells(L) where head(L, c), R = run(L, c)
      where (exists x in R: not known(x)),
      K = {k in clues(numbers) where free(k, R)},
      x in R where not known(x)
    conclude: "forall d in cand(x) where not (exists k in K: digit(k, x, R) = d): strike(x, d)"
  # A square down to one digit needs no technique of its own: every number
  # still fitting its run puts that digit there, and a square with none left
  # leaves its run no number.
  #
  # A run whose squares are all filled reads a number. One that reads none
  # makes the marks inconsistent.
  - id: misread
    tier: Easy
    for: "L in lines, c in cells(L) where head(L, c), R = run(L, c) where forall x in R: known(x)"
    conclude: "exists k in clues(numbers): reads(k, R)"
  # A number read in two runs makes the marks inconsistent.
  - id: twice
    tier: Easy
    for: "k in clues(numbers)"
    conclude: "count(L in lines, c in cells(L) where head(L, c) and reads(k, run(L, c))) < 2"
