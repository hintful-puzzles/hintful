# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # A number two runs still fit read as going in either.
  onlyRun:
    for: >-
      k in clues(numbers) where not written(k) and count(M in lines, b in
      cells(M) where head(M, b) and fits(k, run(M, b))) <= 2, L in lines, c in
      cells(L) where head(L, c) and fits(k, run(L, c)), R = run(L, c)
  # A square two digits still fit read as taking the first.
  sharedDigit:
    for: >-
      L in lines, c in cells(L) where head(L, c), R = run(L, c) where (exists x
      in R: not known(x)), K = {k in clues(numbers) where free(k, R)} where |K|
      > 0, x in R where not known(x), D = set(digit(k, x, R) over k in K) where
      |D| <= 2
  # A crossing read as the digit the other run does not allow.
  crossRuns:
    for: >-
      x in cells where clue(blank, x) < 0 and not known(x), A = run(row(x), x),
      B = run(col(x), x) where |A| >= 2 and |B| >= 2, KA = {k in clues(numbers)
      where free(k, A)}, KB = {k in clues(numbers) where free(k, B)}, D = {d in
      set(digit(k, x, A) over k in KA) where not (exists k in KB: digit(k, x, B)
      = d)} where |D| = 1
  # A run's first fitting number left out of what it allows.
  narrow:
    conclude: >-
      forall d in cand(x) where not (exists k in K - {first(K)}: digit(k, x, R)
      = d): strike(x, d)
  # A full run of two read as reading no number.
  misread:
    conclude: "exists k in clues(numbers): reads(k, R) and |R| >= 3"
  # A number read once read as read too often.
  twice:
    conclude: >-
      count(L in lines, c in cells(L) where head(L, c) and reads(k, run(L, c)))
      < 1
