# Pattern's cases, which the engine's tests read
# (src/engine/testing/game-cases.ts): upstream's IDs read as their lists
# and given squares and written back, the tier a pasted board opens at, the
# sizes with no Unreasonable board, the text, and the four ways a step is
# told.

values:
  shaded: 1
  clear: 2

tiers:
  # A line one square wide says square by square what it holds, and up to
  # 3x3 a second picture fits wherever the lines stop short: every picture
  # of each size is tried. The counts are those the lines do not finish,
  # recorded from the engine.
  absent:
    - {cell: 2x2du, exhaustive: true, unfinished: 2}
    - {cell: 2x3du, exhaustive: true, unfinished: 12}
    - {cell: 3x2du, exhaustive: true, unfinished: 12}
    - {cell: 3x3du, exhaustive: true, unfinished: 128}
    - {cell: 1x5du, exhaustive: true, unfinished: 0}
    - {cell: 1x7du, exhaustive: true, unfinished: 0}
    - {cell: 7x1du, exhaustive: true, unfinished: 0}
  # Off the menu: the smallest sizes Unreasonable is dealt at, and a board
  # a square wide.
  dealt: [2x4du, 3x4du, 6x6du, 5x5de, 1x5de]

ids:
  # Each line's list, the columns first; the board numbers the rows first.
  - id: "5x5:4/2.2/2/1/2/2/2/1/3.1/4"
    opens: 5x5de
    writesBack: true
    holds:
      dealt.runs.lists: [[2], [2], [1], [3, 1], [4], [4], [2, 2], [2], [1], [2]]
  # A board that needs search opens at Unreasonable, whatever tier it says.
  - id: "5x5:1.1/3/3/3/2/3/3/3/2/1.1"
    opens: 5x5du
    writesBack: true
  - {id: "5x5de:1.1/3/3/3/2/3/3/3/2/1.1", opens: 5x5du}
  # Given squares, which only upstream's own pictures carry: `a` places a
  # clear square at once, `B` skips one and places a shaded one, and the
  # last letter lands on the end.
  - id: "2x2:1/1/1/1,aBb"
    opens: 2x2de
    writesBack: true
    holds:
      dealt.given.at: [0, 2]
      dealt.given.v: [clear, shaded]
      fixed: [1, 0, 1, 0]
  # The second column's run of 2 shades a square of the first row, which
  # has no runs: refused, and written back all the same.
  - {id: "2x2:1/2//1,Bc", writesBack: true, refused: DESC_CONTRADICTORY}
  # A run is at least one square and at most its line; a desc says each
  # line once, and its given squares fill the board exactly.
  - {id: "2x2:/1//1", opens: 2x2de}
  - {id: "2x2:/1//1x", refused: '/\.$/'}
  - {id: "2x2:/1//1/", refused: '/\.$/'}
  - {id: "2x2:/0//1", refused: '/\.$/'}
  - {id: "2x2:/3//1", refused: '/\.$/'}
  - {id: "2x2:/1//1,bd", refused: '/\.$/'}
  - {id: "2x2:/1//1,b", refused: '/\.$/'}
  - {id: "5x5:1/2/3", refused: '/\.$/'}
  # Runs that overfill their line have no answer; four 1s have two.
  - {id: "2x2:/1.1//1", refused: DESC_CONTRADICTORY}
  - {id: "2x2:2/2//", refused: DESC_CONTRADICTORY}
  - {id: "2x2:1/1/1/1", refused: DESC_NOT_UNIQUE}

params:
  # No height, or no tier, as upstream wrote them.
  - {read: "20x15", full: "20x15de"}
  - {read: "10", full: "10x10de"}

positions:
  # The columns' lists above, the rows' after.
  - id: "2x2:/1//1"
    text: "       1\n+---+---+\n| . | . |\n+---+---+\n| . | . | 1\n+---+---+\n"
  # The ninth row first, the first any run's overlap reaches; then the
  # fifth column, through a square that step shaded. Each of the four ways
  # a step is told.
  - id: "10x10:8/6.1/4.1.1.1/4.1/4.3/2/2/2.2/2.1.2/1.2/3.2/3.2/5/5/2.2/5/1.2/3.1/6/8"
    steps:
      - rung: line.overlap
        set: [84, shaded, 85, shaded]
        says: "This row's run of 6 can slide only 4 squares, so these squares must be shaded."
      - set: [24, shaded, 34, shaded]
      - step: 7
        rung: line.overlap
        set: [2, shaded, 12, shaded, 22, shaded, 32, shaded]
        says: "This column's run of 4 has nowhere to slide, so these squares must be shaded."
      - {step: 8, says: "/, given the outlined squares, /"}
      - step: 19
        rung: line.unreachable
        set: [5, clear, 15, clear, 25, clear]
        says: "No run of this column can reach the ringed squares, so those squares must be clear."
