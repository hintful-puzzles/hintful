# yaml-language-server: $schema=../../describe/description.schema.json

game: pattern
catalog:
  name: Pattern
  aliases: [Nonogram, Picross, Griddlers, Paint by Numbers]
  description: Pattern puzzle
  objective: Fill in the pattern in the grid, given only the lengths of runs of black squares.
  collection: original
  family: shading
  similar: Nonograms, Picross®
help:
  rules: |-
    Shade some of the squares in the grid, so that the numbers in each row
    and column match the lengths of its consecutive runs of shaded squares.
  controls: |-
    {{controls}}

    A square you know is not shaded can be marked clear: it takes a color
    of its own, with a faint cross. A gray square with nothing in it is one
    you have not decided yet.

    Drag across several squares to make them all what the first one became.
    Hold Shift while moving the cursor to mark clear every undecided square
    it leaves and enters, or Ctrl to mark those squares clear even where
    they are shaded.
  hints: |-
    **Hint** explains the next step rather than simply making it. Each step
    works along one row or column at a time, from its numbers and the
    squares you have already marked shaded or clear, so it carries on
    from wherever you are, as long as none of those is wrong; if one is, it
    asks you to fix the highlighted mistakes first.

    {{hint-marks}}

    A few ideas are worth learning by name:

    * **Overlap.** A run that can slide only a few squares along its line
      always covers the squares in the middle of its range, so they must be
      shaded. A run with nowhere to slide covers all of them.
    * **Out of reach.** A square no run can reach in its line must be clear.
      A line with no clues has no runs, so all of it is clear.
    * **Every fit agrees.** Try every way a line's runs can fit around what
      is already marked: a square that comes out the same in all of them is
      settled.

    On an Unreasonable board there comes a point where no row or column
    settles another square on its own, and the hint says that nothing further
    follows by deduction instead of choosing for you. Save your position,
    try a square, and it carries on from whatever you mark.
produces: shading
sizes:
  # Unbounded but by the time a board takes to deal.
  w: { min: 1 }
  h: { min: 1 }
space:
  grid: { w: "w", h: "h" }
  # A row or column keeps no value to itself: its numbers say how it runs.
  units: []
answer:
  # 1 is shaded, 2 clear.
  value: { sort: cell, domain: "range(1, 2)" }
define:
  # The other value.
  flip(d): "3 - d"
  # The shaded squares of the filling f of line L run as R says.
  fits(f, L, R): "run_lengths(L, {x in cells(L) where f(x) = 1}) = R"
  # Where square x sits along line L, from its start.
  pos(L, x): "index(x, cells(L))"
  # The earliest and latest place run k of line L's runs R starts in any
  # fit round what the line holds: a hint's words read them.
  lo(L, R, k): "least_start(L, R, k, 1)"
  hi(L, R, k): "greatest_start(L, R, k, 1)"
  # Whether run k covers square x in every fit, between its latest start
  # and its earliest end.
  covers(L, R, k, x): "pos(L, x) >= hi(L, R, k) and pos(L, x) < lo(L, R, k) + nth(R, k)"
  # Whether some run reaches square x in some fit.
  reached(L, R, x): >-
    exists k in range(0, |R| - 1):
    pos(L, x) >= lo(L, R, k) and pos(L, x) < hi(L, R, k) + nth(R, k)
  # The runs that cover every square of S in every fit: one at most, since
  # two runs never share a square.
  covering(L, R, S): "{k in range(0, |R| - 1) where forall x in S: covers(L, R, k, x)}"
clues:
  # A row's or column's numbers: the lengths of its runs of shaded squares,
  # in order.
  runs:
    at: line
    list: true
    value: "range(1, |cells(at)|)"
    means: "run_lengths(at, {c in cells(at) where value(c) = 1}) = v"
    complete: true
  # A square dealt shaded or clear, which only upstream's own pictures
  # carry.
  given:
    at: cell
    value: "range(1, 2)"
    means: "value(at) = v"
freedom: { kind: fill }
play:
  values:
    1: { does: shade it, key: S, glyph: "###", paint: shade }
    2: { does: mark it clear, key: X, glyph: " x ", paint: clear }
  primary: 1
  secondary: 2
  # The answer is the shaded squares alone: an open square is clear.
  blank: 2
  click: cycle
  stroke: sweep
  dealt: given
  # Upstream's sizes, and its 15x15 first.
  boards: [10x10, 10x15, 15x15, 20x25, 30x30]
  default: 15x15
  # A line one square wide says square by square what it holds, and up to
  # 3x3 every picture has been tried: neither has an Unreasonable board.
  bounds:
    tiers: { Unreasonable: { shorter: { min: 2 }, longer: { min: 4 } } }
  hintMarks:
    ring: the squares the step decides; the sentence says whether they must be shaded or clear.
    outline: the squares already marked shaded or clear that hold a run in place.
    stripes: the row or column the sentence names, running on through its numbers.
deal:
  answer: a picture, random noise smoothed and cut at its median, no row or column all one value
  runs: every line's
  tier: one of the tiers, a picture its tier does not finish drawn again
  never: given
  # Upstream's pattern.c `generate`: noise smoothed by one averaging pass,
  # shaded at and above its median; a line across a side over two squares
  # never all one value.
  sample:
    picture: { value: 1, rest: 2 }
# Upstream's game ID: each line's numbers, the columns first, `.` between
# two and `/` between lines; then, where a square is dealt, `,` and the
# dealt squares as dot runs, a shaded one's letter uppercase.
id:
  - lists: runs
    order: columns
  - dots: given
    cases: [2, 1]
    before: ","
tiers: [Easy, Unreasonable]
names:
  line: "every way a line's runs fit"
techniques:
  # A line's squares that every way its runs can fit, round what the line
  # holds, gives one value: each unbroken stretch of the open ones holds it.
  # A line its runs cannot fit makes the marks inconsistent.
  - id: line
    tier: Easy
    for: >-
      L in lines, R = clue(runs, L), d in domain,
      O = {x in cells(L) where not known(x)
      and not (exists fill f of cells(L) from cand where f(x) = flip(d): fits(f, L, R))},
      c in O where index(c, stretch(L, c, O)) = 0
    conclude: >-
      (exists fill f of cells(L) from cand where f(c) = d: fits(f, L, R))
      and (forall x in stretch(L, c, O): place(x, d))
    # A firing is told one of four ways, by what its squares are on the
    # line: a run's overlap, out of every run's reach, a line with no runs,
    # or none of those, which is every fit agreeing. Every square a firing
    # decides holds its value in every fit, so placing them leaves the fits,
    # and the starts, as they were. The stripes run on through the line's
    # numbers, so "its runs" points at them.
    says:
      marks: { stripes: "cells(L)", reads: "cells(L)" }
      arms:
        lineEmpty:
          when: "|R| = 0"
          look: "{stripes: this {unit}} has no clues"
          move: "{ring} must be {unshaded}"
        overlap:
          when: "d = 1 and |covering(L, R, stretch(L, c, O))| > 0"
          terms:
            run: "sum(k in covering(L, R, stretch(L, c, O)) of nth(R, k))"
            slack: "sum(k in covering(L, R, stretch(L, c, O)) of hi(L, R, k) - lo(L, R, k))"
          # The squares already marked between the run's earliest start
          # and its latest end, which hold it where it is.
          marks:
            outline: >-
              {x in cells(L) where known(x) and x not in stretch(L, c, O)
              and (exists k in covering(L, R, stretch(L, c, O)):
              pos(L, x) >= lo(L, R, k) and pos(L, x) < hi(L, R, k) + nth(R, k))}
          move: "{ring} must be {shaded}"
          wordings:
            - when: "slack = 0 and |outline| = 0"
              look: "{stripes: this {unit}}'s run of {run} has nowhere to slide"
            - when: "slack = 0"
              look: "{stripes: this {unit}}'s run of {run} has nowhere to slide, given {outline}"
            - when: "|outline| = 0"
              look: "{stripes: this {unit}}'s run of {run} can slide only {slack} {slack: square | squares}"
            - look: "{stripes: this {unit}}'s run of {run} can slide only {slack} {slack: square | squares}, given {outline}"
        unreachable:
          when: "d = 2 and (forall x in stretch(L, c, O): not reached(L, R, x))"
          look: "No run of {stripes: this {unit}} can reach {ring: the ringed square | the ringed squares}"
          move: "{ring: that square | those squares} must be {unshaded}"
        intersection:
          when: "true"
          wordings:
            - when: "d = 1"
              look: "Every way {stripes: this {unit}}'s runs can fit covers {ring: the ringed square | the ringed squares}"
              move: "{ring: that square | those squares} must be {shaded}"
            - look: "Every way {stripes: this {unit}}'s runs can fit leaves out {ring: the ringed square | the ringed squares}"
              move: "{ring: that square | those squares} must be {unshaded}"
