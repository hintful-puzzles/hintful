# yaml-language-server: $schema=../../describe/description.schema.json

game: norinori
catalog:
  name: Norinori
  aliases: []
  description: Domino shading puzzle
  objective: >-
    Shade two squares in every region so that the shaded squares form dominoes
    that never touch along a side.
  collection: own
  family: shading
help:
  rules: |-
    You have a grid of squares divided into regions by heavy lines. Shade squares so that every region holds exactly two shaded squares, and every shaded square touches exactly one other along a side. The shaded squares therefore come in dominoes, pairs side by side, and no two dominoes touch along a side, though they may touch at a corner. A domino may cross from one region into another.

    Every puzzle has exactly one solution, and none needs a guess.
  controls: |-
    {{controls}}

    You need not mark anything clear to finish: the puzzle is solved as soon as the shaded squares are all in place. A shaded square turns red when it touches two others or has no square left to pair with, and the shaded squares of a region turn red when it holds more than two; the crosses of a region turn red when they leave it no room for two.

    A domino rules out the open squares beside it, and a region's second shaded square rules out the rest of the region. {{rules-out}}
  origins: |-
    Norinori is a Nikoli puzzle.
  hints: |-
    **Hint** explains the next step rather than simply making it. Each step decides one or more squares from the regions and from the squares you have already marked, so it carries on from wherever you are.

    {{hint-marks}}

    A hint calls a square *open* while you have marked it neither shaded nor clear. Its steps, easiest first:

    - Two shaded squares side by side are a domino, so every open square beside it is clear. A shaded square with only one open square beside it, and no shaded one, is paired with that square. An open square beside two shaded squares, or with no square beside it that could pair with it, is clear.
    - A region with its two shaded squares has the rest clear, and a region with exactly as many open squares as it still needs shaded has them all shaded. A shaded square whose open neighbors all lie in one region that needs only one more shaded square takes that one, so the region's other open squares are clear.
    - On Normal boards, a region is read for where its shaded squares can go as parts of dominoes: each needs a partner, and none may touch a third. A square without which the rest of the region could not hold them is shaded, and one with which it could not is clear.
    - On Tricky boards, a square is tried shaded: where it would complete a domino or its region, the squares beside it, or the rest of its region, would be clear. If that would leave a region without room for the shaded squares it needs, the square is clear.

    If a square you marked is wrong, the hint asks you to fix the highlighted mistakes first.
produces: shading
sizes:
  w: { min: 4, max: 20 }
  h: { min: 4, max: 20 }
space:
  grid: { w: "w", h: "h" }
  # The regions are a dealt partition rather than units: a region holds two
  # shaded squares, not every value once.
  regions: { region: dealt }
  units: []
answer:
  # 1 is a shaded square, 2 a clear one.
  value: { sort: cell, domain: "range(1, 2)" }
define:
  # The shaded squares the squares S still need, as a region of them.
  need(S): "2 - count(c in S where value(c) = 1)"
  # The squares of S that are not decided yet.
  open(S): "{c in S where not known(c)}"
  # 1 where x is one of the squares S, 0 where it is not.
  own(x, S): "count(c in {x} where c in S)"
  # The shaded squares beside c.
  lit(c): "count(d in adj4(c) where value(d) = 1)"
  # The open squares beside c.
  free(c): "{d in adj4(c) where not known(d)}"
  # Whether n of the open squares S, the rest of S clear, can be shaded so
  # that no shaded square, of S or beside it, is beside two others, and each
  # of S's has a square left to pair with: one of S's shaded beside it, a
  # shaded one, or an open one outside S. A shaded square is 1 and a clear
  # one 2, so n shaded squares sum to 2|S| - n.
  fits(S, n): >-
    exists fill f of S where sum(x in S of f(x)) = 2 * |S| - n
    and (forall x in S where f(x) = 1:
    count(y in adj4(x) where (y in S and f(y) = 1) or (y not in S and value(y) = 1)) <= 1
    and (exists y in adj4(x): (y in S and f(y) = 1) or (y not in S and value(y) != 2))
    and (forall z in adj4(x) where z not in S and value(z) = 1:
    lit(z) + count(y in adj4(z) where y in S and f(y) = 1) <= 1)): true
  # The shaded squares beside the open squares S and not of them: what a
  # filling of S must keep each shaded square of it beside at most one of.
  walls(S): "{z in set(q over d in S, q in adj4(d)) where z not in S and value(z) = 1}"
  # The most shaded squares, up to n, that fit in the open squares S.
  most(S, n): "max(j in range(0, n) where fits(S, j))"
  # The open squares a shaded square tried at x leaves clear at once: those
  # beside x and its partner where x would complete a domino, and the rest of
  # x's region where x would complete it.
  ruled(x): >-
    {p in adj4(x) + set(q over d in adj4(x), q in adj4(d)) + cells(region(x))
    where not known(p) and p != x and (
    (lit(x) = 1 and (p in adj4(x) or (exists d in adj4(x): value(d) = 1 and p in adj4(d))))
    or (region(p) = region(x) and need(cells(region(x))) = 1))}
shape:
  - "forall r in region: count(c in cells(r) where value(c) = 1) = 2"
  - "forall c in cells where value(c) = 1: lit(c) = 1"
freedom: { kind: fill }
play:
  values:
    1: { does: shade it, key: S, glyph: "###", paint: domino }
    2: { does: cross it out, key: X, glyph: " x ", paint: cross }
  primary: 1
  secondary: 2
  # The answer is the shaded squares alone: an open square is clear.
  blank: 2
  # A click goes round empty, the button's mark and the other one.
  click: cycle
  stroke: sweep
  # Four sizes at three tiers, half of them rectangles, fill a section's
  # twelve lines. A 10x10 board deals in a median of 0.5 s at worst and a
  # 12x12 one, left as a Custom size, in 1 to 2 s (2026-11-16).
  boards: [6x6, 6x8, 8x10, 10x10]
  hintMarks:
    ring: the squares the step decides. The sentence says what they must be.
    stripes: >-
      the region the step is about, or the open squares beside a shaded
      square.
    outline: >-
      what else it reasons from: shaded squares, or the squares a tried one
      would leave clear.
deal:
  answer: dominoes at random, none touching another along a side, packed densely
  region: >-
    a region grown round each shaded square, joined in twos, some dominoes
    dealt as regions of their own, then mended until the board finishes at the
    tier
  tier: one of the tiers, the board finished at it and not at the tier below
  sample: { dominoes: { value: 1 }, rest: 2 }
  grow:
    partition: region
    holds: 2
    # A region of two is both its shaded squares at a glance, and a mend left
    # to make them deals boards that are little else.
    smallest: 3
    # An Easy board's steps read one region or one domino at a time, so it
    # needs the most closed dominoes to start from; a harder tier's steps
    # reach further from fewer. Uncapped, a 6x6 Easy board came with five of
    # its seven regions closed and one of seventeen squares.
    closed: { oneIn: [2, 3, 4], atMostOneIn: 3 }
# The regions as the walls between them.
id:
  - walls: region
tierLetters: ent
tiers: [Easy, Normal, Tricky]
# What a shaded square rules out at a glance: the squares beside a domino it
# completes, and the rest of the region it fills.
rulesOut:
  name: Cross out the squares a domino rules out
  placing: 1
  techniques: [domino, fullRegion]
kindWords:
  rest: 2
  fill: 1
  unit: this region
  has: its two {shaded} squares
  restWord: "must be {unshaded}"
  items: "{shaded} {n: square | squares}"
  fillWord: "must be {shaded}"
names:
  domino: "a finished domino"
  partner: "a shaded square's only partner"
  between: "a square that would touch two"
  alone: "a square with nothing to pair with"
  claimed: "a partner confined to one region"
  fullRegion: "a full region"
  exactRegion: "a region needing every open square"
  neededRegion: "a square a region needs"
  blocked: "a square blocking a region's pair"
  crowded: "a square that would crowd a region"
techniques:
  # Two shaded squares side by side are a domino, and nothing else beside
  # either is shaded. A shaded square beside two others makes the marks
  # inconsistent.
  - id: domino
    tier: Easy
    for: >-
      c in cells where value(c) = 1 and lit(c) >= 1,
      D = {c} + {d in adj4(c) where value(d) = 1},
      O = {e in set(q over d in D, q in adj4(d)) where not known(e)}
      where |O| > 0 or (exists d in D: lit(d) > 1)
    conclude: "(forall d in D: lit(d) = 1) and forall e in O: place(e, 2)"
    says:
      marks: { outline: D, reads: "D + O" }
      look: "{outline: these two {shaded} squares} make a domino, and no other {shaded} square may touch it"
      move: "{ring} must be {unshaded}"
  # A shaded square with no shaded neighbor and one open one is paired with
  # it.
  - kind: one.cell
    as: partner
    tier: Easy
    with:
      square: "value(c) = 1 and lit(c) = 0"
      options: free(c)
      move: "forall d in U: place(d, 1)"
    says:
      marks: { outline: "{c}", reads: "{c} + adj4(c)" }
      look: "{outline: this {shaded} square} has no {shaded} neighbor and only one open one"
      move: "{ring: the ringed square} must be {shaded}"
  # An open square beside two shaded squares would touch both.
  - id: between
    tier: Easy
    for: "x in cells where not known(x) and lit(x) >= 2, k = lit(x)"
    conclude: "place(x, 2)"
    says:
      terms: { k: k }
      marks: { outline: "{d in adj4(x) where value(d) = 1}", reads: "{x} + adj4(x)" }
      look: "{ring} would touch {outline: {k} {shaded} squares} if it were {shaded}"
      move: "it must be {unshaded}"
  # An open square with no square beside it that is not clear has nothing to
  # pair with.
  - id: alone
    tier: Easy
    for: "x in cells where not known(x) and (forall d in adj4(x): value(d) = 2)"
    conclude: "place(x, 2)"
    says:
      marks: { reads: "{x} + adj4(x)" }
      look: "{ring} has no neighbor that could pair with it"
      move: "it must be {unshaded}"
  # A shaded square with no partner yet pairs with one of its open
  # neighbors. Where they all lie in one region that needs one more shaded
  # square, that one is there, and the region's other open squares are
  # clear. Where that region needs none, the marks are inconsistent.
  - id: claimed
    tier: Easy
    for: >-
      s in cells where value(s) = 1 and lit(s) = 0, P = free(s) where |P| > 0,
      g in region where (forall d in P: region(d) = g),
      n = need(cells(g)), O = {c in open(cells(g)) where c not in P}
      where n <= 0 or (n = 1 and |O| > 0)
    conclude: "n = 1 and forall c in O: place(c, 2)"
    says:
      marks: { outline: "{s}", stripes: "cells(g)", reads: "{s} + P + cells(g)" }
      look: "{outline: this {shaded} square} must pair inside {stripes: this region}, which needs one more {shaded} square"
      move: "{ring} must be {unshaded}"
  # A region that has its two shaded squares holds no more. One with more
  # makes the marks inconsistent.
  - kind: count.met
    as: fullRegion
    tier: Easy
    with:
      group: "r in region"
      set: "cells(r)"
  # A region with exactly as many open squares as it still needs shaded has
  # them all shaded. One with fewer makes the marks inconsistent.
  - kind: count.exact
    as: exactRegion
    tier: Easy
    with:
      group: "r in region"
      set: "cells(r)"
      terms: { placed: "n < 2" }
  # A region whose other open squares cannot take the shaded squares it needs
  # without one touching two others: the square left out is shaded.
  - kind: room.needed
    as: neededRegion
    tier: Normal
    with:
      group: "r in region"
      set: "cells(r)"
      items: "{shaded} {n: square in a domino | squares as dominoes}"
      given: "|outline| > 0"
      marks: { stripes: "cells(r)", outline: "walls(E)", reads: "cells(r) + set(d over q in E, d in adj4(q))" }
      terms: { placed: "n < 2" }
  # A region that needs both its shaded squares, whose other open squares
  # could not take the second were one of them shaded: that one is clear.
  # (With one left to place, the rest are clear whatever it is, so this reads
  # nothing there.)
  - id: blocked
    tier: Normal
    for: >-
      r in region, O = open(cells(r)) where need(cells(r)) = 2,
      x in O, E = O - {x} where (with place(x, 1): not fits(E, 1))
    conclude: "place(x, 2)"
    says:
      marks: { stripes: "cells(r)", outline: "walls(E)", reads: "cells(r) + set(d over c in O, d in adj4(c))" }
      move: "{ring: this square} must be {unshaded}"
      wordings:
        - when: "|outline| > 0"
          long: &noRoom >-
            A region left without room names three things: the square left out
            or tried, the region, and the outlined shaded squares that close its
            room, with the rule ("as dominoes") that says why. The conclusion
            says "this square" and not "it", as "it" would follow the region.
          look: "with {ring} {shaded}, {stripes: this region} has no room for its second {shaded} square in a domino, given {outline}"
        - look: "with {ring} {shaded}, {stripes: this region} has no room for its second {shaded} square in a domino"
  # A shaded square tried at x would leave clear the squares `ruled` names,
  # leaving a region it reaches without room for the shaded squares it
  # needs: x is clear. Stated, not placed as `room.crowded`: the room runs
  # out beside the tried square's domino rather than over what it rules out,
  # which the kind's look would name wrongly.
  - id: crowded
    tier: Tricky
    for: >-
      x in cells where not known(x), R = ruled(x),
      g in region where g = region(x) or (exists p in R + adj4(x): region(p) = g),
      S = cells(g), n = need(S) - own(x, S), E = {c in open(S) where c != x and c not in R}
      where n > 0 and (with place(x, 1): not fits(E, n)), Q = {c in open(S) where c in R}
    conclude: "place(x, 2)"
    says:
      terms: { n: n, mine: "x in S" }
      # The outline is what the room is short beside: the tried square's
      # partner, whose domino clears the squares round it, and the shaded
      # squares beside what is left.
      marks:
        stripes: S
        outline: "walls(E) + {d in adj4(x) where value(d) = 1}"
        reads: "Q + S + R + {x} + adj4(x)"
      move: "{ring: this square} must be {unshaded}"
      wordings:
        - when: "|outline| > 0"
          long: *noRoom
          look: "with {ring} {shaded}, {stripes: this region} has no room for {if mine: {n} more | {n}} {shaded} {n: square in a domino | squares as dominoes}, given {outline}"
        - look: "with {ring} {shaded}, {stripes: this region} has no room for {if mine: {n} more | {n}} {shaded} {n: square in a domino | squares as dominoes}"
