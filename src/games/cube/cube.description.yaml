# yaml-language-server: $schema=../../describe/description.schema.json

game: cube
help:
  rules: |-
    Roll the cube around the grid, picking up the {{pair:0}} squares on its
    faces. Try to get all the {{pair:0}} squares on to the object at the same
    time, in as few moves as possible.
  controls: |-
    Use the arrow keys to roll the cube, or 8, 2, 4 and 6 on the numeric
    keypad, or click the mouse where you want it to roll towards. After every roll, the grid square and cube
    face that you brought into contact swap their colors, so that a
    plain cube face can pick up a {{pair:0}} square, but a {{pair:0}} face rolled
    on to a plain square puts it down again.

    On the triangular grids a triangle has one flat side, above or below it, and two sloping ones. Up or Down, whichever points at the flat side, rolls the solid across it, and Left and Right roll it across the sloping sides. The diagonal keys of the numeric keypad (7, 9, 1 and 3) make the same three rolls: the two that lean toward the flat side both cross it, and each of the other two crosses the sloping side it leans toward.

    When you have mastered the cube, use the Type menu to select other
    regular solids!
  hints: |-
    **Hint** shows the next roll rather than making it. No roll in Cube is
    forced, so the hint plans a line of rolls that gathers every
    {{pair:0}} square onto the solid, and shows it one roll at a time. Each
    run of rolls ends by picking a square up, and the rolls on the way say
    which square that is. On the cube and the tetrahedron the line is a
    shortest one; on the octahedron and the icosahedron it is a good one,
    not always the shortest.

    {{hint-marks}}

    Two things catch everyone out, and the hint says them where they come
    up. A square is picked up only by a plain face, so rolling straight on
    to a {{pair:0}} square can land a {{pair:0}} face on it and pick nothing
    up: then the hint goes round to come at it another way. And a
    {{pair:0}} face rolled on to a plain square leaves its paint there.
    Late in the game, with most faces {{pair:0}}, that is often the only
    way on: the hint says when no square can be picked up without putting
    some paint down first, and when the paint it leaves is picked up again
    by another face. That is how paint moves from one face to another.

    A {{pair:0}} face rolled on to a {{pair:0}} square changes nothing, so
    the hint's line may cross {{pair:0}} squares on its way.

    On a custom grid much larger than the ones on the Type menu, the search
    can run out before it finds a line, and the hint says so.

    *Show solution…* plans the same way, but all the way to the end, and
    rolls the solid along the whole line from wherever it stands, one roll
    after another. As with the hint, the line is a shortest one on the cube
    and the tetrahedron, and need not be on the other two solids. One
    undo takes the whole line back. If the search runs out before the end,
    it says so and leaves the board as it was.
  parameters:
    after: |-
      A grid of squares wider than it is tall, or taller than it is wide, is
      dealt whichever way round [fits your screen](features#board-shape). A
      grid of triangles is always dealt the way you chose it: its two numbers
      swapped give the same patch upside down, not on its side.
name: Cube
family: position
sizes:
  # The arena's squares, or triangles, and the solid's faces: 4, 6, 8 or 20.
  squares: { min: 1, max: 9999 }
  nfaces: { min: 4, max: 20 }
space:
  # Squares for the cube and triangles for the other three solids, in the
  # order the arena lists them: no rectangle, so where a roll goes is the
  # table the arena deals.
  cells: "squares"
  faces: "nfaces"
  units: []
  tables:
    # The square the solid on s lands on, rolled over its edge toward r: 0
    # left, 1 right, 2 up, 3 down, a triangle's slanted edges read as one of
    # these; none off the arena.
    dest: { of: [cell, num], to: cell }
    # The face whose paint face f carries after that roll. The solid sits on
    # every square of a shape in one pose, so a roll moves paint between the
    # places of its faces, and which face is where is no part of the
    # position.
    source: { of: [cell, num, face], to: face }
    # The face resting on the square.
    down: { of: [], to: face }
position:
  # 1 on a painted square.
  blue: { domain: "{0, 1}" }
  # 1 on the square the solid stands on.
  at: { domain: "{0, 1}", once: "1" }
  # 1 on a painted face.
  paint: { domain: "{0, 1}", over: faces }
freedom: { kind: transition }
define:
  # Every face carries paint.
  painted: "forall f in faces: paint(f) = 1"
moves:
  # The solid on s rolls toward r. Each face's paint goes with it, and the
  # face that comes down swaps paint with the square it lands on, unless
  # every face is painted already: a finished solid rolls freely.
  roll:
    for: "s in cells where at(s) = 1, r in {0, 1, 2, 3} where dest(s, r) != none"
    set:
      - for: "c = s"
        at: "0"
      - for: "c = dest(s, r)"
        at: "1"
      - for: "f in faces where f != down or painted"
        paint: "paint(source(s, r, f))"
      - for: "f = down where not painted"
        paint: "blue(dest(s, r))"
      - for: "c = dest(s, r) where not painted"
        blue: "paint(source(s, r, down))"
finish:
  - "painted"
deadEnds:
  # A roll moves paint between a square and a face and never makes or loses
  # any, so a board with too little paint to cover the solid never finishes.
  short: "count(c in cells where blue(c) = 1) + count(f in faces where paint(f) = 1) < |faces|"
deal:
  start: >-
    as many painted squares as the solid has faces, spread evenly over the
    classes of square its faces can rest on, and the solid on a plain square
    with no face painted
