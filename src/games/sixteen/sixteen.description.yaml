# yaml-language-server: $schema=../../describe/description.schema.json

game: sixteen
help:
  rules: |-
    Slide the grid squares around so that the numbers end up in
    consecutive order from the top left corner.
  controls: |-
    Click on the arrows at the edges of the grid to move a row or column
    left, right, up or down. The square that falls off the end of the
    row comes back on the other end.

    Right-click an arrow to slide the line the opposite way. You can also
    drag a square along its row or column: when you let go, the line
    slides by as many squares as you dragged it.

    On the keyboard, the arrow keys move a cursor round the board. On one
    of the edge arrows, Enter presses it and Space presses it in reverse.
    On a square, Ctrl and an arrow key slides that square's line, and the
    cursor goes with the square; Shift and an arrow key slides the line
    under a cursor that stays put. Enter or Space on a square locks the
    cursor into one of those two ways, so the plain arrow keys slide until
    you press it again.
  hints: |-
    **Hint** shows the next move rather than simply making it. Nothing in
    Sixteen is forced by logic, so the hint searches for a way to finish
    from where you are and tells you what each move is for.

    {{hint-marks}}

    Everything a step marks is part of the move it asks for, so the hint calls
    the square it lands on "the ringed square".

    Each step opens by naming the tile it is working on — *"Working on tile
    5:"* — and ends by saying whether the move takes it to *its final spot*
    or is only *setting up* for a later one.

    The search looks only so far ahead. When it cannot find a way to finish
    from your position, the hint says so rather than guessing: play a few
    moves of your own and ask again, or use *Show solution…*.
name: Sixteen
family: tiles in order
sizes:
  # The game bounds neither side above; 99 stands for no bound.
  w: { min: 2, max: 99 }
  h: { min: 2, max: 99 }
space:
  grid: { w: "w", h: "h" }
  units: []
position:
  # The tile on each square, numbered from 1 in the order they finish.
  value: { domain: "range(1, w * h)", arranged: "1" }
freedom: { kind: permute }
moves:
  # Slide a line on by k squares, as far as its square t is from its first:
  # the tiles pushed off one end come back on at the other.
  slide:
    for: "L in lines, t in cells(L) where index(t, cells(L)) > 0, k = index(t, cells(L))"
    set:
      - for: "c in cells(L)"
        value: "value(nth(cells(L), (index(c, cells(L)) - k + |cells(L)|) mod |cells(L)|))"
finish:
  - "forall c in cells: value(c) = index(c, cells) + 1"
deadEnds:
  # With both sides odd, a slide moves an odd number of tiles round, which
  # is an even permutation, so a board an odd permutation away from finished
  # stays one. With an even side some slide is odd, and nothing is claimed.
  parity: >-
    w mod 2 = 1 and h mod 2 = 1
    and count(a in cells, b in cells where index(a, cells) < index(b, cells)
    and value(a) > value(b)) mod 2 = 1
steps:
  # One slide of a tile's journey toward home: the aim names the tile, the
  # move where this slide sends it, and the end says why: "its final spot"
  # where the journey ends in the tile's solved cell (`home`), else that it is
  # setting up. Where it goes is a square marked on the board, never a row or
  # column number the board does not draw; where the next slide carries the
  # same tile on across, both landings are marked (`onward`), this slide's the
  # nearer. A later leg (`continues`) repeats neither the setup nor the why:
  # its first leg is still on screen. Everything is what the step decides, so
  # all of it is ringed, the arrow to click beside the tile's line included.
  step:
    ring: [tile, target, onward]
    terms: { tile: number, home: flag, continues: flag }
    wordings:
      - when: "continues and |ringOnward| = 0"
        aim: &tile "{ring tile: tile {tile}}"
        move: "move it on to {ring target: the ringed square}"
      - when: "continues"
        aim: *tile
        move: "move it on to {ring target: the nearer ringed square}, then {ring onward: the other ringed square}"
      - when: "home and |ringOnward| = 0"
        aim: *tile
        move: "move it to {ring target: the ringed square}, its final spot"
      - when: "home"
        aim: *tile
        move: "move it to {ring target: the nearer ringed square}, then {ring onward: the other ringed square}, its final spot"
      - when: "|ringOnward| = 0"
        aim: *tile
        move: "move it to {ring target: the ringed square} (setting up)"
      - aim: *tile
        move: "move it to {ring target: the nearer ringed square}, then {ring onward: the other ringed square} (setting up)"
deal:
  start: >-
    at m = 0, a random arrangement the slides can finish; otherwise m random
    slides from the finished board
