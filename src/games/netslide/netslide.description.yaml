# yaml-language-server: $schema=../../describe/description.schema.json

game: netslide
help:
  rules: |-
    Slide the grid squares around so that they all join up into a single
    connected network with no loops.

    Squares connected to the *source*, the solid box the power comes from,
    are lit up. Aim to light up every square. No connection may
    cross a barrier, a heavy gray line between squares.

    The game mode says where the network may run:

    {{rulesets}}
  controls: |-
    Click on the arrows at the edges of the grid to move a row or column
    left, right, up or down. The square that falls off the end of the
    row comes back on the other end.

    Right-click an arrow to slide the line the opposite way.

    On the keyboard, the arrow keys move a cursor round the arrows at the
    edges, skipping the source's row and column, and Enter or Space presses
    the arrow under it.
  sections:
    - heading: The source and the barriers
      body: |-
        The source never moves — the row and the column it sits in cannot be
        slid, which is why no arrows are drawn beside them. So a square sharing
        the source's row can only be shifted by sliding its column, and vice
        versa, and the network has to be built up around the source where it
        stands.

        On harder levels, there are fewer barriers, which makes it harder
        rather than easier!
  hints: |-
    **Hint** shows the next slide rather than simply making it. Nothing in
    Netslide is forced by logic, so the hint searches for a way to finish
    from where you are, one slide at a time, and tells you what each slide
    is for.

    {{hint-marks}}

    A step ends by saying whether the piece arrives *where it belongs* (or
    *beside the source*), or is only *setting up*.

    The search looks only so far ahead. When it cannot find a way to finish
    from your position, the hint says so rather than guessing: play a few
    slides of your own and ask again, or use *Show solution…*.

name: Netslide
family: position
sizes:
  # A board of any size its desc gives; 99 stands for no bound.
  w: { min: 1, max: 99 }
  h: { min: 1, max: 99 }
space:
  grid: { w: "w", h: "h" }
  units: []
  tables:
    # The square across side k of c, k a side's bit (1 right, 2 up, 4 left,
    # 8 down): round the edge, and none where a barrier stands. A board that
    # does not wrap has a barrier all round it, so the rules are the same.
    beyond: { of: [cell, num], to: cell }
position:
  # Each tile's wires: the bits of the sides it has an arm on.
  tile: { domain: "range(0, 15)" }
freedom: { kind: permute }
define:
  # The tile power flows from, whose row and column never slide.
  source: "cell(w / 2, h / 2)"
  # Tile c has an arm on side k.
  arm(c, k): "(tile(c) / k) mod 2 = 1"
  # The side facing side k across an edge: right and left, up and down.
  facing(k): "(4 * k) mod 15"
  # Tile c is powered: it is the source, or meets a powered tile arm to arm
  # with no barrier between them.
  powered(c): >-
    c = source or exists k in {1, 2, 4, 8}, n = beyond(c, k)
    where n != none and arm(c, k) and arm(n, facing(k)): powered(n)
  # How many arms tile c has.
  arms(c): "count(k in {1, 2, 4, 8} where arm(c, k))"
views:
  # The tiles the status line counts as active.
  - powered
moves:
  # Slide a line other than the source's one square either way, as far as its
  # square t is from its first: 1 on, or one less than its length, which is
  # one back. The tile pushed off one end comes back on at the other.
  slide:
    for: >-
      L in lines where source not in cells(L),
      t in cells(L) where index(t, cells(L)) = 1 or index(t, cells(L)) = |cells(L)| - 1,
      k = index(t, cells(L))
    set:
      - for: "c in cells(L)"
        tile: "tile(nth(cells(L), (index(c, cells(L)) - k + |cells(L)|) mod |cells(L)|))"
finish:
  - "forall c in cells: powered(c)"
deadEnds:
  # A tile with no arm joins nothing, and a slide never changes a tile.
  bare: "|cells| > 1 and exists c in cells: tile(c) = 0"
  # Joining every tile into one network takes one join fewer than the tiles,
  # each using up an arm on both its tiles, and a slide changes no arm.
  short: "sum(c in cells of arms(c)) < 2 * (|cells| - 1)"
deal:
  start: >-
    a spanning tree grown from the source, barriers drawn on the walls it
    leaves as the barrier probability says, then shuffled by slides
