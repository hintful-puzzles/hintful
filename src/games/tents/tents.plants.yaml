# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # A square beside one tree read as beside none.
  noTree:
    for: S = {c in cells where blank(c) and |trees(c)| < 2} where |S| > 0
  # A square beside a tree with its tent read as grass whatever else is
  # beside it.
  treesDone:
    for: >-
      q in clues(tree) where has(q), S = {c in adj4(at(q)) where blank(c)} where
      |S| > 0
  # A tent read as touching the squares two along its row too.
  nextToTent:
    conclude: >-
      forall c in cells where blank(c) and abs(x(c) - x(t)) <= 2 and abs(y(c) -
      y(t)) <= 1: place(c, 2)
  # A tent linked to no tree read as no room for the tree's own.
  treeSingle:
    for: >-
      q in clues(tree) where not has(q), R = {x in adj4(at(q)) where blank(x)}
      where |R| = 1
  # An open square beside the tree read as no room for its tent.
  treeLink:
    for: >-
      q in clues(tree) where not has(q), R = {x in adj4(at(q)) where value(x) =
      1 and link(x) = none} where |R| = 1, x = nth(R, 0) where value(x) = 1
  # A tree with three squares left read as two round a corner.
  treeDiagonal:
    for: >-
      q in clues(tree) where not has(q), R = room(q) where |R| = 3, a = nth(R,
      0), b = nth(R, 1) where x(a) != x(b) and y(a) != y(b), z = cell(x(a) +
      x(b) - x(at(q)), y(a) + y(b) - y(at(q))) where blank(z)
  # A line read as needing one tent more than its count.
  lineCount:
    for: >-
      L in lines, k = need(L) + 1, O = open(L) where |O| > 0, T = {x in O where
      fits(O, k, x, 1)}, G = {x in O where fits(O, k, x, 2)} where (exists x in
      O: x not in T or x not in G)
  # A line read as needing one tent more than its count.
  lineNeighbors:
    for: >-
      L in lines, k = need(L) + 1, O = open(L) where |O| > 0 and k > 0, N =
      set(z over y in O, z in adj8(y) where blank(z) and z not in cells(L))
      where |N| > 0, U = set(z over fill f of O from cand where spread(f, O, k),
      z in N where (forall y in O where y in adj8(z): f(y) = 2)) where (exists z
      in N: z not in U)
