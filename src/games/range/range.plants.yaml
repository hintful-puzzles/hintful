# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # A shaded square's diagonal neighbors read as beside it.
  besideShaded:
    conclude: "forall c in adj8(t) where not known(c): place(c, 2)"
  # A view's room read as one square shorter than its count leaves it.
  capped:
    for: >-
      k in cells, n = clue(number, k) where n > 0, W = sees(k), a in adj4(k), R
      = ray(k, a), s = seen(R) where far(R, s, n - W + s - 1, open(R)) = s
  # A view made to reach one square further than its count needs.
  reach:
    conclude: >-
      M >= n and (forall p in R where index(p, R) < n - M + f + 1: place(p, 2))
  # Every square not shaded read as one the rest need.
  cut:
    for: U = unshaded, K = U, c in K where not known(c)
