# yaml-language-server: $schema=../../describe/description.schema.json

game: range
catalog:
  name: Range
  aliases: [Kurodoko]
  description: Visible-distance puzzle
  objective: Place black squares to limit the visible distance from each numbered cell.
  collection: original
  family: shading
  similar: Kurodoko (黒どこ), Kuromasu
help:
  rules: |-
    Shade some squares, so as to meet the following conditions. Every
    square not shaded is clear.

    - No two shaded squares are orthogonally adjacent.
    - No group of clear squares is separated from the rest of the grid by
      shaded squares.
    - Each numbered square can see precisely that many clear squares in
      total by looking in all four orthogonal directions, counting itself.
      Shaded squares block the view.
  controls: |-
    {{controls}}

    A cross is your own note that a square is clear. Clicking again moves on
    round the same three states: a left-click turns a shaded square into
    a cross and a cross back into an empty square, and a right-click turns a
    cross shaded and a shaded square empty.

    Hold Shift while moving the cursor to put a cross in every empty square
    it passes over.
  sections:
    - heading: What a number sees
      body: |-
        Since shaded squares block the view, a 2 clue, for example, must be
        adjacent to three shaded squares or grid edges, and in the fourth
        direction there must be one clear square and then a shaded one beyond
        it.

        The numbered squares sit on a lighter square. They are always clear, and
        cannot be changed.
  hints: |-
    **Hint** explains the next step rather than simply making it. It reasons
    only from the numbers, your shaded squares and your crosses, so it
    carries on from wherever you are, as long as none of those is wrong; if
    one is, it asks you to fix the highlighted mistakes first. When a sentence
    says a square "must be clear" it means you can mark it with a cross.

    {{hint-marks}}

    The ideas it teaches:

    * **Shaded squares never touch**, so every square beside a shaded
      square is clear.
    * **A clue that sees enough** stops at the first square past what it sees,
      so that square must be shaded. Likewise, a square that would let a clue
      see too far must be shaded.
    * **A clue that needs to see further** than its other directions allow
      must see along the rest of the way, so those squares are clear.
    * **Clear stays connected.** A square that would cut some of the clear
      squares around it off from the rest, if it were shaded, must stay clear.

    On an Unreasonable board there comes a point where none of these settles
    a square. The hint then says that nothing further follows by deduction
    instead of choosing for you. Save your position and try a square beside a
    number that is close to its count, shaded or with a cross: if it is
    wrong, a few forced squares later some number can no longer see enough, or
    sees too much, and shows in red. The hint carries on from whatever you
    decide.
produces: shading
sizes:
  # A number is at most the width and the height less one, which the desc
  # keeps below 128.
  w: { min: 1, max: 127 }
  h: { min: 1, max: 127 }
space:
  grid: { w: "w", h: "h" }
  units: []
answer:
  # 1 is a shaded square, 2 a clear one, which a numbered square is.
  value:
    sort: cell
    domain: "{d in range(1, 2) where d = 2 or clue(number, c) < 0}"
define:
  # The squares not shaded, which are one group.
  unshaded: "{c in cells where value(c) != 1}"
  # How far along R, a number's arm, its view is known to run: the squares
  # before the first one not clear.
  seen(R): "min(i in range(0, |R|) where i = |R| or value(nth(R, i)) != 2)"
  # The squares along R before the first shaded one.
  open(R): "min(i in range(0, |R|) where i = |R| or value(nth(R, i)) = 1)"
  # The furthest a view along R that is known to run s squares can run, at
  # most m and short of the shaded square at z: as far as a square past it
  # that may be shaded, or the edge.
  far(R, s, m, z): >-
    max(i in range(s, |R|) where i = s
    or (i <= m and i <= z and (i = |R| or value(nth(R, i)) != 2)))
  # The squares a number at k sees, itself among them.
  sees(k): "1 + sum(a in adj4(k) of seen(ray(k, a)))"
shape:
  # No two shaded squares touch.
  - "forall c in cells where value(c) = 1: forall p in adj4(c): value(p) = 2"
  # The clear squares are one group.
  - "connected(unshaded)"
clues:
  # A number on a clear square, which sees as many clear squares along its
  # row and its column, itself among them.
  number:
    at: cell
    value: "range(1, |cells(row(at))| + |cells(col(at))| - 1)"
    means: "value(at) = 2 and sees(at) = v"
freedom: { kind: fill }
play:
  values:
    1: { does: shade it, key: S, glyph: "###", paint: shade }
    2: { does: cross it out, key: X, glyph: " x ", paint: cross }
  primary: 1
  secondary: 2
  # The answer is the shaded squares alone: an open square is clear.
  blank: 2
  # A click goes round empty, the button's mark and the other one.
  click: cycle
  stroke: sweep
  # A number sees along its row and its column as far as the shaded squares
  # let it, which is no block of squares.
  plain: [number]
  # Upstream's four sizes, each at both tiers.
  boards: [6x9, 8x12, 9x13, 11x16]
  # A number is at most the width and the height less one, which upstream's
  # desc keeps below 128. On a strip a shaded square anywhere but an end cuts
  # the clear squares in two, so the rules settle every strip that has one
  # answer.
  bounds:
    sum: { max: 128 }
    longer: { min: 3 }
    tiers: { Unreasonable: { shorter: { min: 2 } } }
  hintMarks:
    ring: the square the step decides.
    outline: >-
      what the step reasons from: the squares a number already sees, the
      squares around one that shading it would cut off, or a shaded square
      beside it. The number the step counts from is outlined apart, in the
      color of the words that name it.
    stripes: >-
      the run a number has to see along, from the number as far as the ringed
      square.
deal:
  answer: squares shaded at random, none side by side, while the clear squares stay one group
  number: on every clear square, then as many hidden as the board stays at its tier
  tier: one of the tiers
  # A third of the squares tried in a random order, each shaded where it
  # touches no shaded square and leaves the clear squares one group:
  # upstream's range.c.
  sample:
    scatter: { value: 1, share: 0.3333333333, apart: adj4, tried: true, joinedRest: true }
    rest: 2
  hide: number
  # The numbers shown are symmetric under a half turn, as upstream deals
  # them: a number whose partner square is shaded goes first, and each other
  # goes with its partner.
  symmetric: halfTurn
# Upstream's game ID: a number a shown clue, `_` between two side by side,
# and a letter a run of squares without one.
id:
  - digits: number
    apart: "_"
tierLetters: eu
tiers: [Easy, Unreasonable]
names:
  besideShaded: "shaded squares never touching"
  capped: "a clue that sees enough"
  reach: "a clue that must see further"
  cut: "keeping clear squares joined"
techniques:
  # A shaded square's neighbors are clear, and one shaded beside it breaks
  # the rules.
  - kind: peer.touch
    as: besideShaded
    tier: Easy
    with:
      adj: adj4
      fill: 1
      rest: 2
      piece: "{shaded} square"
      pieces: "{shaded} squares"
      restWord: "must be {unshaded}"
    says: { shown: each }
  # A number's view along one arm runs at least as far as it is known to and
  # at most as far as the other arms, as short as they can be, leave it
  # room for. Where the two meet, the square past the view is shaded. A
  # number that already sees more than its count breaks the rules.
  - id: capped
    tier: Easy
    for: >-
      k in cells, n = clue(number, k) where n > 0, W = sees(k),
      a in adj4(k), R = ray(k, a), s = seen(R)
      where far(R, s, n - W + s, open(R)) = s
    conclude: "W <= n and (s = |R| or place(nth(R, s), 1))"
    # The hint names the number and outlines what it sees, itself among it.
    says:
      shown: each
      terms: { clue: k, value: n }
      marks: { outline: "{k} + set(p over b in adj4(k), B = ray(k, b), p in B where index(p, B) < seen(B))" }
      # A number is "this 5" rather than "clue 5": it lies inside its own line
      # of sight, and that can hold a second number of the same value. At the
      # small counts "all 2 of" reads wrong, so 1 and 2 are said apart.
      arms:
        satisfied:
          when: "W = n"
          move: "{ring: the ringed square just past {value: it | them}} must be {shaded}"
          wordings:
            - when: "n = 1"
              look: "{outline clue: this {value}} already sees {outline: its one {unshaded} square (outlined)}"
            - when: "n = 2"
              look: "{outline clue: this {value}} already sees {outline: both of its {unshaded} squares (outlined)}"
            - look: "{outline clue: this {value}} already sees {outline: all {value} of its {unshaded} squares (outlined)}"
        overrun:
          when: "W != n"
          look: "if {ring}, just past {outline: the outlined square | the outlined squares}, were {unshaded}, {outline clue: this {value}} would see more than {value}"
          move: "it must be {shaded}"
  # With every other arm of a number's view as long as it can be, the view
  # along this one must still run far enough to make up the count, so the
  # squares that far are clear. A number that cannot see its count however
  # its arms run breaks the rules.
  - id: reach
    tier: Easy
    for: >-
      k in cells, n = clue(number, k) where n > 0, W = sees(k),
      M = 1 + sum(b in adj4(k), B = ray(k, b), t = seen(B) of far(B, t, n - W + t, open(B))),
      a in adj4(k), R = ray(k, a), s = seen(R), f = far(R, s, n - W + s, open(R))
    conclude: "M >= n and (forall p in R where index(p, R) < n - M + f: place(p, 2))"
    # The hint outlines what the number sees along its other arms, and for each
    # square what it would see past it once the squares up to it are clear;
    # and stripes the run from the number to that square: the run its view must
    # take.
    says:
      shown: each
      terms: { clue: k, value: n }
      marks:
        outline: "set(p over b in adj4(k), B = ray(k, b), p in B where b != a and index(p, B) < seen(B))"
      # The solver forces the run because the number's other directions, even
      # at their longest, leave it short without the squares up to the target;
      # the bare wording, whose other directions see nothing yet, says so.
      fact:
        wordings:
          # Something is outlined: a square the other arms see, or the clear
          # one just past the target.
          - when: >-
              count(b in adj4(k) where b != a and seen(ray(k, b)) > 0) > 0
              or (index(p, R) + 1 < |R| and value(nth(R, index(p, R) + 1)) = 2)
            look: "{outline clue: this {value}} needs more than {outline: the outlined square | the outlined squares}"
            follows: "it must see along {stripes: the striped run}"
            move: "{ring: the ringed square} must be {unshaded}"
          - look: "{outline clue: this {value}} can't see {value} without seeing along {stripes: the striped run} to {ring: the ringed square}"
            move: "that square must be {unshaded}"
        marks:
          outline: >-
            {q in R where index(q, R) > index(p, R)
            and (forall r in R where index(r, R) > index(p, R) and index(r, R) <= index(q, R):
            value(r) = 2)}
          stripes: "{k} + {q in R where index(q, R) < index(p, R)}"
  # A square without which the squares not shaded would not be one group is
  # clear: shaded, it would cut some of them off from the rest.
  - kind: connect.cut
    as: cut
    tier: Easy
    with:
      set: unshaded
      rest: 2
      tried: "making {ring} {shaded}"
      restWord: "must stay {unshaded}"
    says: { shown: each }
