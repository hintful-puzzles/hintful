# yaml-language-server: $schema=../../describe/description.schema.json

# Keen's help page, its rules, and the techniques `npm run describe`
# compiles to keen.compiled.ts, which solver.ts runs.
game: keen
help:
  rules: |-
    Fill in the grid with digits from 1 to the grid size, so that every
    digit appears exactly once in each row and column.

    Thick lines divide the grid into *cages*, each with a clue. A clue's
    number is what the cage's digits make by its sign: added (+) or
    multiplied (×), or, in a cage of two cells, the larger less the smaller
    (−) or divided by the smaller (÷). A digit may appear twice in a cage, as
    long as its row and column allow it.
  controls: |-
    To place a number, click in a square to select it, then type the
    number on the keyboard. To erase a number, click to select a square
    and then press Backspace.

    Right-click in a square and then type a number to add or remove the
    number as a pencil mark, indicating numbers that you think
    *might* go in that square. {{sticky-pencil}}

    You can also use the arrow keys to move the selected square around.
    Press Enter to toggle between entering numbers and entering pencil
    marks, and Backspace or Space to clear a square.

    {{mark-all}} Once every empty square has marks, the press crosses out
    of each the numbers already placed in its row and column.
  hints: |-
    **Hint** explains the next step rather than simply making it. It starts
    by filling in every cell's pencil marks (the same as pressing **Fill marks**) and
    crossing out the numbers already standing in each row and column, then
    works from your own marks, so it carries on from wherever you are. If a
    number you've placed is wrong, or a cell's pencil marks have crossed
    out its answer, it asks you to fix the highlighted mistakes first. If
    you would rather it left a cell unmarked until a step needs it, set
    **Hints pencil in** to **Only as needed** in the preferences: a cell
    with no marks then counts as holding every number not already in its
    row and column.

    {{hint-marks}}

    A cage's clue is read out as what its cells must do: "sum to 9",
    "differ by 3", "multiply to 72", "have a ratio of 2". The cage steps
    work cell by cell: a number goes when no way of filling the cage puts it
    in this cell, and when every way of filling a cage puts, say, a 4 in one
    row, no other cell of that row can be 4.

    {{wing}}

    If you've turned on the preference that removes a number from pencil
    marks in its row and column when you place it, the hint leaves that
    tidying to the placement rather than spelling it out as a step of its
    own. On an Unreasonable board, deduction can run out before the grid is
    full; the hint says so rather than guessing.

name: Keen
family: latin
sizes:
  w: { min: 3, max: 9 }
space:
  grid: { w: "w", h: "w" }
  regions: { cage: dealt }
  units: [rows, cols]
answer:
  value: { sort: cell, domain: "range(1, w)" }
marks:
  cand: { sort: cell, notation: "set of range(1, w)" }
define:
  # The larger and the smaller value of a cage of two.
  larger(r): "max(c in cells(r) of value(c))"
  smaller(r): "min(c in cells(r) of value(c))"
  # Two cells of a filling of K that share a line hold different values.
  apart(f, K): >-
    forall x in K, y in before(x, K) where row(x) = row(y) or col(x) = col(y):
    f(x) != f(y)
  # A filling of a cage's cells makes its clue, whichever sign it has.
  makes(f, r): >-
    (clue(sum, r) = none or sum(x in cells(r) of f(x)) = clue(sum, r))
    and (clue(product, r) = none or prod(x in cells(r) of f(x)) = clue(product, r))
    and (clue(difference, r) = none
    or max(x in cells(r) of f(x)) - min(x in cells(r) of f(x)) = clue(difference, r))
    and (clue(quotient, r) = none
    or max(x in cells(r) of f(x)) = clue(quotient, r) * min(x in cells(r) of f(x)))
shape:
  - "latin(value, lines)"
# A cage's sign is its clue's kind. The values are those its cells could
# make, as the game reads a board: a difference and a quotient only of two.
clues:
  sum:
    at: cage
    value: "range(1, |cells(at)| * w)"
    means: "sum(c in cells(at) of value(c)) = v"
  product:
    at: cage
    value: "range(1, prod(c in cells(at) of w))"
    means: "prod(c in cells(at) of value(c)) = v"
  difference:
    at: cage
    value: "range(1, w - 1)"
    means: "larger(at) - smaller(at) = v"
  quotient:
    at: cage
    value: "range(2, w)"
    means: "larger(at) = v * smaller(at)"
freedom: { kind: fill }
deal:
  cages: the partition, connected cages of at most six cells, and each cage's sign and value
  tier: one of the tiers
tiers: [Easy, Normal, Hard, Extreme, Unreasonable]
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  # Cage by cage: a value no filling of the cage from its candidates that
  # makes its clue puts anywhere in it is struck from each of its cells. One
  # cage a firing. Normal's reading strikes all this does, so upstream reads
  # it only where the cap is Easy.
  - id: cageEasy
    tier: Easy
    until: Normal
    rung: cage
    for: >-
      r in cage, K = cells(r),
      D = set(f(x) over fill f of K from cand where apart(f, K) and makes(f, r), x in K)
    conclude: "forall c in K, d in cand(c) where d not in D: strike(c, d)"
  - { use: latin.hiddenSingle, tier: Easy, rung: hiddenSingle }
  - { use: latin.single, tier: Easy, rung: single }
  # Cage by cage: a value no filling of the cage that makes its clue puts in
  # a cell is struck from it. One cage a firing.
  - id: cage
    tier: Normal
    rung: cage
    for: "r in cage, K = cells(r)"
    conclude: >-
      forall c in K, d in cand(c) where not (exists fill f of K from cand
      where apart(f, K) and makes(f, r) and f(c) = d: true): strike(c, d)
  # Cage by cage, and line by line, the columns before the rows: a value
  # every filling of the cage that makes its clue puts in its part of the
  # line is struck from the rest of the line. One line a firing.
  - id: cageLine
    tier: Hard
    rung: cageLine
    for: "r in cage, K = cells(r), L in cols + rows"
    conclude: >-
      forall d in domain where (forall fill f of K from cand
      where apart(f, K) and makes(f, r): exists x in cells(L): x in K and f(x) = d),
      c in cells(L) where c not in K: strike(c, d)
  - { use: latin.set, tier: Hard, rung: set }
  - { use: latin.fish, tier: Extreme, rung: set }
  - { use: latin.wing, tier: Extreme, rung: wing }
