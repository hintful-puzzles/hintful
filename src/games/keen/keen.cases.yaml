        - {type: pencilStrike, marks: [{x: 0, y: 3, n: 1}]}
        - {type: pencilStrike, marks: [{x: 3, y: 0, n: 1}]}
        - {type: pencilStrike, marks: [{x: 3, y: 2, n: 1}, {x: 3, y: 2, n: 2}]}
