# Keen's cases, which the engine's tests read
# (src/engine/testing/game-cases.ts): a position for every rung its hint
# takes, upstream's IDs read and written back, its params, and the cage
# clues printed, broken and marked done.

hint:
  params:
    - {w: 4, h: 4, diff: 0}
    - {w: 6, h: 6, diff: 1}
    - {w: 6, h: 6, diff: 2}
    - {w: 6, h: 6, diff: 3}
    - {w: 4, h: 4, diff: 3}
  unreached:
    note: >-
      spoken under the reading that pencils in only as needed, and Keen's hint starts on the one that pencils every candidate in first (play.hintNotes)
    regionsFull: >-
      spoken under the reading that pencils in only as needed: where every candidate is penciled in first, a cell whose line holds every other number is a single
  pins:
    # Held on 60 of 4905 positions walked.
    populate: "4de:aa_3a_a_c_a__b,m6m8a7a8s1m6"
    # Held on 1275 of 4905 positions walked.
    clean:
      id: "6dh:_a_b__b_3a_3a_cab_9a4_3a_3a__,m9s1s2d2d2a9s2m6s4d3a9s1d2a14a7m6m12"
      moves:
        - {type: pencilAll}
        - {type: pencilStrike, marks: [{x: 0, y: 0, n: 1}, {x: 0, y: 0, n: 2}, {x: 0, y: 0, n: 4}, {x: 0, y: 0, n: 5}, {x: 0, y: 0, n: 6}]}
        - {type: set, x: 0, y: 0, n: 3, pencil: false, autoElim: false}
    # Held on 4708 of 4905 positions walked.
    dup: "4de:aa_3a_a_c_a__b,m6m8a7a8s1m6"
    # Held on 4905 of 4905 positions walked.
    single:
      id: "6dh:_a_b__b_3a_3a_cab_9a4_3a_3a__,m9s1s2d2d2a9s2m6s4d3a9s1d2a14a7m6m12"
      moves:
        - {type: pencilAll}
        - {type: pencilStrike, marks: [{x: 0, y: 0, n: 1}, {x: 0, y: 0, n: 2}, {x: 0, y: 0, n: 4}, {x: 0, y: 0, n: 5}, {x: 0, y: 0, n: 6}]}
    # Held on 3809 of 4905 positions walked.
    hiddenSingle:
      id: "4de:_a_6a_b_aaba,m24a9d2s2m4s1d2"
      moves:
        - {type: pencilAll}
        - {type: pencilStrike, marks: [{x: 0, y: 0, n: 1}]}
        - {type: pencilStrike, marks: [{x: 0, y: 1, n: 1}]}
        - {type: pencilStrike, marks: [{x: 0, y: 2, n: 1}]}
    # Held on 1257 of 4905 positions walked.
    set:
      id: "6dx:aa_3a_3a_6a_3aa_aa__aa_3a_3a3baa,m12a6s1s2a6s2d2a9m12m6a12s4m12d2d2s4d2"
      moves:
        - {type: pencilAll}
        - {type: pencilStrike, marks: [{x: 0, y: 0, n: 5}]}
        - {type: pencilStrike, marks: [{x: 1, y: 0, n: 5}]}
        - {type: pencilStrike, marks: [{x: 0, y: 1, n: 5}]}
        - {type: pencilStrike, marks: [{x: 2, y: 0, n: 3}, {x: 2, y: 0, n: 6}]}
        - {type: pencilStrike, marks: [{x: 3, y: 0, n: 3}, {x: 3, y: 0, n: 6}]}
        - {type: pencilStrike, marks: [{x: 1, y: 1, n: 3}, {x: 1, y: 1, n: 6}]}
