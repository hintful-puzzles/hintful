      moves:
        - {type: pencilAll}
    # Held on 2044 of 4905 positions walked.
    cageLine:
      id: "6dx:_aa__a__a_3aa_a4ca_a_8a_3a_ca_,a11a6s4a12a16m15d2m20s2d2m6s3a17d3s1"
      moves:
        - {type: pencilAll}
        - {type: pencilStrike, marks: [{x: 1, y: 0, n: 3}, {x: 1, y: 0, n: 6}]}
