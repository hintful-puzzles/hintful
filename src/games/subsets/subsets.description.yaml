# yaml-language-server: $schema=../../describe/description.schema.json

game: subsets
help:
  rules: |-
    You are given a grid and a list of sets. Place every set into the grid exactly once. Some sets are given.

    1. A horseshoe symbol ⊃ points from a superset to a subset. In other words, the set on the open end must contain every letter in the set on the closed rounded end.
    2. All possible horseshoe symbols are given. This means that each set must contain a letter that doesn't appear in the adjacent set, if there is no symbol between them.
  controls: |-
    Every letter has a fixed position in each cell. A position shows its letter once the letter is marked present, a cross once it is cleared, and nothing while it is undecided. A cell whose set is given sits on a lighter surface than the ones you fill.

    {{controls}}

    ### Where can this go?

    The tally band beside the grid works in both directions. Click a set in the tally and every cell it could still legally go in is spotlighted; if it's already placed, the cell it lives in is shown in a different color. Going the other way, the inspect badge above a cell — or simply moving the keyboard cursor onto it — highlights every set that cell could still hold.

    The answers come from what's visible on the board: the cell's own marks and rule-outs, the horseshoes to its decided neighbors, and the rule that each set appears once. The horseshoes rule out two sets on their own: the empty set sits inside every set, so it can only go in a cell that every neighbor's horseshoe points into, and the full set only in a cell whose horseshoes all point out. Nothing is read off the solution, so the aid can't do the deducing for you.

    ### Ruling a set out of a cell

    Some deductions are about whole sets rather than letters: "{A,C} can't go in this cell". To record one, focus the cell (tap its inspect badge), then tap the set in the tally. It is struck through, and drops out of the sets the aid lists for that cell. Tap it again to take it back. While a cell is in focus, tapping the tally rules sets out of it; to spotlight a set instead, tap the badge again to let go of the cell first.

    With a keyboard, move the cursor down past the bottom row of the grid into the tally, keeping the cell you were on in focus. The arrow keys move between sets, Enter or Space rules one out, Backspace takes a rule-out back, and moving up from the tally's top row returns to the grid.

    **Check & save** treats a letter marked or crossed out against the solution as a mistake, and draws it in red. It treats a set ruled out of the cell it belongs in the same way.
  origins: |-
    This puzzle type was invented by Inaba Naoki under the name *サブセットリンク*, released as a [Java Applet](http://inabapuzzle.com/honkaku/subset.html) with a puzzle generator.
  hints: |-
    **Hint** explains the next step rather than simply making it, one letter or one ruled-out set at a time. It reasons only from the horseshoes, the given sets and your own letters and rule-outs, so it carries on from wherever you are, as long as none of those is wrong. If one is, whether or not it breaks a rule yet, it asks you to fix the highlighted mistakes first.

    In its words, to *mark* a letter *present* is to add it (left-click its position, or Enter), and to *clear* a letter is to rule it out (right-click, or Space).

    {{hint-marks}}

    While a hint is on show, the tally strikes through the sets already ruled out of the cell the step is about, just as it does for a cell in focus.

    The hint rules sets out too, when a deduction needs it, and says why. The usual reason is a horseshoe: the set at its open end must be strictly bigger than the set at its closed end. So a set can't go at the open end if none of the sets that can still go at the closed end fits inside it with room to spare, and a set can't go at the closed end if none of the sets that can still go at the open end holds it and more.
  parameters:
    before: |-
      Every puzzle is played on a 4×4 grid over a four-letter universe. That is the one size where the sixteen possible sets exactly fill the sixteen cells — the bijection the puzzle is built on — so the board never changes size. The one thing you can choose is how hard the deductions have to work.
    after: |-
      ### Difficulty

      *Easy* puzzles can be solved by reading the horseshoes forwards: a set placed on the closed end of a horseshoe tells you letters the open end must contain, and a letter ruled out of the open end is ruled out of the closed end too.

      *Normal* puzzles also need the argument run backwards. Because a horseshoe forces the closed end to be a **strictly smaller** set than the open end — two cells can never hold the same set, since each set is placed exactly once — a candidate for the closed end is only viable if some candidate for the open end still contains it. Rule out the last set that could sit on the open end above it, and the closed end loses that option, even though nothing about it changed directly.
name: Subsets
family: regions
sizes: {}
space:
  # The one board there is: the sixteen sets over four letters exactly fill
  # sixteen squares.
  grid: { w: "4", h: "4" }
  edges: true
  units: []
answer:
  # A set, one more than the number its letters add up to, A as 1, B as 2,
  # C as 4 and D as 8, since the marks hold no value 0.
  value: { sort: cell, domain: "range(1, 16)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, 16)" }
define:
  # The letters of set d, A as 0 up to D as 3.
  letters(d): "bits(d - 1)"
  # Every letter.
  alphabet: "letters(16)"
  # Whether set x holds set y, and is not it.
  holds(x, y): "x != y and letters(y) subset letters(x)"
  # Whether square a is the open end of a horseshoe across edge e, its set
  # holding the other end's.
  opens(e, a): >-
    (clue(shoe, e) = 1 and a = end1(e)) or (clue(shoe, e) = 2 and a = end2(e))
shape:
  # Every set is placed once.
  - "distinct(value(c) over c in cells)"
clues:
  # The horseshoe between two squares side by side: 1 where the first
  # square's set holds the second's, 2 where the second's holds the first's,
  # and 0, none, where neither holds the other. Every one there is shows.
  shoe:
    at: edge
    value: "{0, 1, 2}"
    complete: true
    means: >-
      (v = 1) = holds(value(end1(at)), value(end2(at)))
      and (v = 2) = holds(value(end2(at)), value(end1(at)))
freedom: { kind: fill }
deal:
  answer: every set in a square, shuffled
  shoe: every edge's, read off the answer
  value: every set, then as many hidden in a shuffled order as the board stays at its tier
  tier: one of the tiers, the board finished at it and not at the tier below
tiers: [Easy, Normal]
techniques:
  # A placed set goes in no other square.
  - id: placed
    on: place
    tier: Easy
    for: "c in cells where known(c), k in cells where k != c and not known(k)"
    conclude: "strike(k, value(c))"
  # Every letter that every set the closed end of a horseshoe can hold has,
  # the set at its open end has too.
  - id: carryIn
    tier: Easy
    for: >-
      e in edges, a in ends(e) where opens(e, a), b = other(e, a),
      K = {l in alphabet where forall u in cand(b): l in letters(u)}
    conclude: "forall d in cand(a) where not (K subset letters(d)): strike(a, d)"
  # A letter no set the open end of a horseshoe can hold has, the set at its
  # closed end lacks too.
  - id: carryOut
    tier: Easy
    for: >-
      e in edges, a in ends(e) where opens(e, a), b = other(e, a),
      L = {l in alphabet where forall u in cand(a): l not in letters(u)}
    conclude: >-
      forall d in cand(b) where (exists l in L: l in letters(d)): strike(b, d)
  # Neither of two squares side by side with no horseshoe between them holds
  # the empty set, which every set holds, or the set of every letter, which
  # holds every set.
  - id: noShoe
    tier: Easy
    for: "e in edges where clue(shoe, e) = 0, c in ends(e)"
    conclude: >-
      forall d in cand(c) where |letters(d)| = 0 or letters(d) = alphabet:
      strike(c, d)
  # Beside a square down to one set, with no horseshoe between them, a square
  # holds no set that holds that one or lies inside it.
  - id: noShoeBeside
    tier: Easy
    for: >-
      e in edges where clue(shoe, e) = 0, k in ends(e) where |cand(k)| = 1,
      c = other(e, k), x = first(cand(k))
    conclude: >-
      forall d in cand(c) where letters(d) subset letters(x)
      or letters(x) subset letters(d): strike(c, d)
  # A square down to one set holds it. One with none left makes the marks
  # inconsistent.
  - id: lone
    tier: Easy
    for: "c in cells where not known(c) and |cand(c)| < 2"
    conclude: "|cand(c)| = 1 and place(c, first(cand(c)))"
  # A set only one square can hold goes there. One no square can hold makes
  # the marks inconsistent.
  - id: onlyCell
    tier: Easy
    for: >-
      d in domain, C = {c in cells where d in cand(c)}
      where |C| < 2 and (|C| = 0 or not known(first(C)))
    conclude: "|C| = 1 and place(first(C), d)"
  # The open end of a horseshoe holds a set only where the closed end can
  # hold a smaller one inside it.
  - id: smaller
    tier: Easy
    for: "e in edges, a in ends(e) where opens(e, a), b = other(e, a)"
    conclude: >-
      forall d in cand(a) where not (exists u in cand(b): holds(d, u)):
      strike(a, d)
  # The closed end of a horseshoe holds a set only where the open end can
  # hold a bigger one holding it.
  - id: bigger
    tier: Normal
    for: "e in edges, a in ends(e) where opens(e, a), b = other(e, a)"
    conclude: >-
      forall d in cand(b) where not (exists u in cand(a): holds(u, d)):
      strike(b, d)
