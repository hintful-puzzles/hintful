# yaml-language-server: $schema=../../describe/description.schema.json

game: subsets
catalog:
  name: Subsets
  description: Set-defining puzzle
  objective: Place each set once, in accordance with the subset clues.
  collection: unreleased
  family: numbers
  similar: Sabusettorinku (サブセットリンク)
help:
  rules: |-
    You are given a grid and a list of sets. Place every set into the grid exactly once. Some sets are given.

    1. A horseshoe symbol ⊃ points from a superset to a subset. In other words, the set on the open end must contain every letter in the set on the closed rounded end.
    2. All possible horseshoe symbols are given. This means that each set must contain a letter that doesn't appear in the adjacent set, if there is no symbol between them.
  controls: |-
    Every letter has a fixed position in each square. A position shows its letter once every set the square can still hold has it, a cross once none has, and nothing while they differ. A square whose set is given sits on a lighter surface than the ones you fill.

    {{controls}}

    Each square starts able to hold every set not given. A set placed in a square, given or yours, drops out of every other square by itself, and a square left one set holds it.

    ### Where can this go?

    The tally band beneath the grid lists every set, a placed one in gray. Click a set in the tally and every square that can still hold it is spotlighted. Going the other way, the inspect badge above a square puts it in focus, and the tally strikes through every set it can no longer hold.

    The answers come from the squares' own possibilities, which your letters and rule-outs narrow, and from the sets already placed. The horseshoes rule nothing out by themselves, so the aid can't do the deducing for you.

    ### Ruling a set out of a square

    Some deductions are about whole sets rather than letters: "{A,C} can't go in this square". To record one, focus the square (tap its inspect badge), then tap the set in the tally. It is struck through, and the square's letters show what its remaining sets agree on. Tap it again to take it back. While a square is in focus, tapping the tally rules sets out of it; to spotlight a set instead, tap the badge again to let go of the square first.

    With a keyboard, move the cursor down past the bottom row of the grid into the tally, keeping the square you were on in focus. The arrow keys move between sets, Enter or Space rules one out or takes it back, as a click does, Backspace takes a rule-out back, and moving up from the tally's top row returns to the grid.

    **Check & save** treats a letter marked or crossed out against the solution as a mistake, and draws it in red. It treats a set ruled out of the square it belongs in the same way.
  origins: |-
    This puzzle type was invented by Inaba Naoki under the name *サブセットリンク*, released as a [Java Applet](http://inabapuzzle.com/honkaku/subset.html) with a puzzle generator.
  hints: |-
    **Hint** explains the next step rather than simply making it, a square at a time. It reasons only from the horseshoes, the placed sets and your own letters and rule-outs, so it carries on from wherever you are, as long as none of those is wrong. If one is, whether or not it breaks a rule yet, it asks you to fix the highlighted mistakes first.

    In its words, a letter that *must be present* is added to the square's set (left-click its position, or Enter), and one that *must be crossed out* is ruled out (right-click, or Space). Where no letter says it, the step names the sets that must go, written by their letters, as {A,C}, and you rule them out in the tally.

    {{hint-marks}}

    Where no letter says it, the tally crosses out each set the step rules out.

    The hint rules sets out too, when a deduction needs it, and says why. The usual reason is a horseshoe: the set at its open end must be strictly bigger than the set at its closed end. So a set can't go at the open end if none of the sets that can still go at the closed end fits inside it with room to spare, and a set can't go at the closed end if none of the sets that can still go at the open end holds it and more.
  parameters:
    before: |-
      Every puzzle is played on a 4×4 grid over a four-letter universe. That is the one size where the sixteen possible sets exactly fill the sixteen cells — the bijection the puzzle is built on — so the board never changes size. The one thing you can choose is how hard the deductions have to work.
    after: |-
      ### Difficulty

      *Easy* puzzles can be solved by reading the horseshoes forwards: a set placed on the closed end of a horseshoe tells you letters the open end must contain, and a letter ruled out of the open end is ruled out of the closed end too.

      *Normal* puzzles also need the argument run backwards. Because a horseshoe forces the closed end to be a **strictly smaller** set than the open end — two cells can never hold the same set, since each set is placed exactly once — a candidate for the closed end is only viable if some candidate for the open end still contains it. Rule out the last set that could sit on the open end above it, and the closed end loses that option, even though nothing about it changed directly.
words:
  value: set
produces: regions
sizes:
  # The one board there is: the sixteen sets over four letters exactly fill
  # sixteen squares.
  w: { min: 4, max: 4 }
  h: { min: 4, max: 4 }
  n: { min: 4, max: 4 }
space:
  grid: { w: "w", h: "h" }
  edges: true
  units: []
answer:
  # A set, one more than the number its letters add up to, A as 1, B as 2,
  # C as 4 and D as 8, since the marks hold no value 0.
  value: { sort: cell, domain: "range(1, 16)" }
given: [value]
# The sets a square can still hold, every one from the deal: a letter shows
# where they all agree.
marks:
  cand: { sort: cell, notation: "set of range(1, 16)", full: true }
define:
  # The letters of set d, A as 0 up to D as 3.
  letters(d): "bits(d - 1)"
  # Every letter.
  alphabet: "letters(16)"
  # Whether set x holds set y, and is not it.
  holds(x, y): "x != y and letters(y) subset letters(x)"
  # Whether square a is the open end of a horseshoe across edge e, its set
  # holding the other end's.
  opens(e, a): >-
    (clue(shoe, e) = 1 and a = end1(e)) or (clue(shoe, e) = 2 and a = end2(e))
shape:
  # Every set is placed once.
  - "distinct(value(c) over c in cells)"
clues:
  # The horseshoe between two squares side by side: 1 where the first
  # square's set holds the second's, 2 where the second's holds the first's,
  # and 0, none, where neither holds the other. Every one there is shows.
  shoe:
    at: edge
    value: "range(0, 2)"
    complete: true
    means: >-
      (v = 1) = holds(value(end1(at)), value(end2(at)))
      and (v = 2) = holds(value(end2(at)), value(end1(at)))
freedom: { kind: fill }
play:
  # A set drawn as its letters, A to D in the slots of a square.
  numbers: { features: { of: "letters(d)", names: ABCD, none: the empty set } }
  # Every set beneath the board, upstream's tally.
  band: true
  gaps: { shoe: shoe }
  boards: [4x4n4]
  hintMarks:
    ring: >-
      what the step decides: the letters it marks present or clears in a
      square.
    strike: >-
      the sets the step rules out of a square, crossed out in the tally where
      no letter says it.
    outline: >-
      what the step reasons from: the square across a horseshoe, or the sets
      in the tally that still fit.
    stripes: the square the step is about.
deal:
  answer: every set in a square, shuffled
  shoe: every edge's, read off the answer
  value: every set, then as many hidden in a shuffled order as the board stays at its tier
  tier: one of the tiers, the board finished at it and not at the tier below
  sample: { once: true }
  hide: given
# Upstream's: a square's set counted from 0, `_` where it is hidden, then the
# letters of the horseshoes open at it, a comma between two.
id:
  - { records: given, sides: shoe, hidden: _, from: 0, closed: false }
tiers: [Easy, Normal]
# Upstream's params, `4x4n4`; the hand-written port wrote Normal as `t`.
tierLetters: et
settings:
  n:
    kind: number
    gives: size
    letter: n
    kw: letters
    name: Letters
    doc: The letters a set is made of.
    min: 4
    max: 4
    default: 4
    words: "{n} letters"
names:
  carryIn: "letters the bigger set must hold"
  carryOut: "letters the smaller set can't hold"
  noShoe: "no empty or full set by a gap"
  noShoeBeside: "a set ruled out beside its neighbor"
  lone: "the only set left for a cell"
  onlyCell: "the only cell left for a set"
  smaller: "room for a smaller set inside"
  bigger: "room for a bigger set around"
# The walk's words for a set with one square left: the board holds every set
# once, so it is the walk's one part.
steps:
  hiddenSingle:
    ring: cell
    terms: { n: number, size: number }
    marks: { stripes: [cell] }
    look: "None of {stripes cell: the other squares} can still be {n}"
    move: "{ring} must be {n}"
techniques:
  # A placed set goes in no other square.
  - kind: peer.placed
    as: placed
    tier: Easy
    with:
      peer: "p in cells where p != c and not known(p)"
  # Every letter that every set the closed end of a horseshoe can hold has,
  # the set at its open end has too.
  - id: carryIn
    tier: Easy
    for: >-
      e in edges, a in ends(e) where opens(e, a), b = other(e, a),
      K = {l in alphabet where forall u in cand(b): l in letters(u)}
    conclude: "forall d in cand(a) where not (K subset letters(d)): strike(a, d)"
    # `common` is the set of the letters every set at the closed end has.
    says:
      terms: { common: "first({d in domain where letters(d) = K})" }
      marks: { outline: "{b}" }
      look: >-
        {ring}'s set holds {outline: its neighbor}'s, whose sets all contain
        {common}
  # A letter no set the open end of a horseshoe can hold has, the set at its
  # closed end lacks too.
  - id: carryOut
    tier: Easy
    for: >-
      e in edges, a in ends(e) where opens(e, a), b = other(e, a),
      L = {l in alphabet where forall u in cand(a): l not in letters(u)}
    conclude: >-
      forall d in cand(b) where (exists l in L: l in letters(d)): strike(b, d)
    # `lacks` is the set of the letters no set at the open end has.
    says:
      terms: { lacks: "first({d in domain where letters(d) = L})" }
      marks: { outline: "{a}" }
      look: >-
        {ring}'s set lies inside {outline: its neighbor}'s, whose sets have
        none of {lacks}
  # Neither of two squares side by side with no horseshoe between them holds
  # the empty set, which every set holds, or the set of every letter, which
  # holds every set.
  - id: noShoe
    tier: Easy
    for: "e in edges where clue(shoe, e) = 0, c in ends(e)"
    conclude: >-
      forall d in cand(c) where |letters(d)| = 0 or letters(d) = alphabet:
      strike(c, d)
    says:
      marks: { outline: "{other(e, c)}" }
      look: >-
        With no horseshoe to {outline: its neighbor}, neither set lies inside
        the other
  # Beside a square down to one set, with no horseshoe between them, a square
  # holds no set that holds that one or lies inside it.
  - kind: rel.support
    as: noShoeBeside
    tier: Easy
    says:
      terms: { only: "first(cand(k))" }
      marks: { outline: "{k}" }
      look: >-
        With no horseshoe to {outline: its neighbor}, which can only be
        {only}, neither set holds the other
    with:
      group: >-
        e in edges where clue(shoe, e) = 0, k in ends(e) where |cand(k)| = 1,
        c = other(e, k)
      end: c
      partner: k
      rel: >-
        not (letters(d) subset letters(u) or letters(u) subset letters(d))
      marks: {}
  # A square down to one set holds it.
  - kind: one.cell
    as: lone
    tier: Easy
  # A set only one square can hold goes there. One no square can hold makes
  # the marks inconsistent.
  - kind: one.place
    as: onlyCell
    tier: Easy
    with:
      group: "d in domain where not (exists c in cells: value(c) = d)"
      set: cells
      value: d
  # The open end of a horseshoe holds a set only where the closed end can
  # hold a smaller one inside it.
  - kind: rel.support
    as: smaller
    tier: Easy
    says:
      marks: { outline: "{b}" }
      look: >-
        {ring}'s set must hold a smaller one {outline: its neighbor} can
        still hold
    with:
      group: "e in edges, a in ends(e) where opens(e, a), b = other(e, a)"
      end: a
      partner: b
      rel: "holds(d, u)"
      marks: {}
  # The closed end of a horseshoe holds a set only where the open end can
  # hold a bigger one holding it.
  - kind: rel.support
    as: bigger
    tier: Normal
    says:
      marks: { outline: "{a}" }
      look: >-
        {ring}'s set must lie inside a bigger one {outline: its neighbor} can
        still hold
    with:
      group: "e in edges, a in ends(e) where opens(e, a), b = other(e, a)"
      end: b
      partner: a
      rel: "holds(u, d)"
      marks: {}
