ids:
  # Boards the hand-written port dealt, read and written back.
  - {id: "4x4n4de:13R,_,_R,2D,_,_UD,_R,_,14D,5,6D,_U,_,_URL,_,9", writesBack: true}
  - {id: "4x4n4de:_,_RL,_,_,3,_D,9D,6,10,_R,_,13L,12,_UR,1U,_UL", writesBack: true}
  - {id: "4x4n4dt:12D,_R,_,_DL,_,4L,7RL,2,10U,_,_,_UDL,_,9,_,_", writesBack: true}
  - {id: "4x4n4dt:4,_RDL,9,_D,_D,_,_UDL,10,_D,_,_D,_D,_,_URL,8,_", writesBack: true}
  # A square too many or too few; a set past the sixteen; a character the
  # code has no use for.
  - {id: "4x4n4de:_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_", refused: DESC_TOO_LONG}
  - {id: "4x4n4de:1,2,", refused: DESC_TOO_SHORT}
  - {id: "4x4n4de:16,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_", refused: DESC_OUT_OF_RANGE}
  - {id: "4x4n4de:x,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_", refused: "This game ID has \"x\" where it can't have one."}
  # A horseshoe off the board, and two on one edge opening both ways.
  - {id: "4x4n4de:0U,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_", refused: DESC_OUT_OF_RANGE}
  - {id: "4x4n4de:0R,1L,_,_,_,_,_,_,_,_,_,_,_,_,_,_", refused: DESC_CONTRADICTORY}
  # The spec's board, and its letters out of upstream's order.
  - {id: "4x4n4de:13RD,_,6R,_,_,_,_D,_UL,_R,12D,_,_DL,_UR,_,3U,10", writesBack: true}
  - {id: "4x4n4de:13DR,_,6R,_,_,_,_D,_UL,_R,12D,_,_DL,_UR,_,3U,10", refused: "This game ID has \"R\" where it can't have one."}
  # A set given twice, which no answer holds: the hand-written reader named
  # it a repeat.
  - {id: "4x4n4de:3,3,_,_,_,_,_,_,_,_,_,_,_,_,_,_", refused: DESC_CONTRADICTORY}

params:
  # Upstream's form: the board, its letters, then the tier; Normal is `t`.
  - {read: "4x4n4de", full: "4x4n4de", brief: "4x4n4", label: "4x4 Easy, 4 letters"}
  - {read: "4x4n4dt", full: "4x4n4dt", label: "4x4 Normal, 4 letters"}
  - {read: "4x4n4", full: "4x4n4de"}
  - {read: "4x4", full: "4x4n4de"}
  # Upstream's only board is 4x4 of four letters; its encoder writes others.
  - {read: "6x6n5", refused: "Width must be at most 4."}
  - {read: "4x4n3", refused: "Letters must be at least 4."}

positions:
  # The board solved.
  - id: "4x4n4de:13R,_,_R,2D,_,_UD,_R,_,14D,5,6D,_U,_,_URL,_,9"
    solve: true
    status: solved
  # The top left square's set placed again beside it: every set once, and
  # the horseshoe between them, are broken.
  - id: "4x4n4de:13R,_,_R,2D,_,_UD,_R,_,14D,5,6D,_U,_,_URL,_,9"
    moves: [{set: [1, 14]}]
    breaks: [shape.0, clue.shoe]

input:
  # The first arrow shows the cursor on the top left square's A, a given;
  # the next walks on to the A of the square beside it. Enter marks it
  # present, striking the sets that lack A, then absent, striking those that
  # hold it, then leaves it undecided: the sets the givens leave, each time.
  - id: "4x4n4de:13R,_,_R,2D,_,_UD,_R,_,14D,5,6D,_U,_,_URL,_,9"
    events:
      - {key: right}
      - {key: right}
      - {key: select, holds: {pencil.1: 69908}}
      - {key: select, holds: {pencil.1: 10786}}
      - {key: select, holds: {pencil.1: 80694}}
