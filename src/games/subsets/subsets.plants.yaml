# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # A placed set struck with the set one more.
  placed:
    conclude: strike(k, value(c)) and (value(c) = 16 or strike(k, value(c) + 1))
  # A letter some set at the closed end has read as one every set has.
  carryIn:
    for: >-
      e in edges, a in ends(e) where opens(e, a), b = other(e, a), K = {l in
      alphabet where exists u in cand(b): l in letters(u)}
  # A letter some set at the open end lacks read as one every set lacks.
  carryOut:
    for: >-
      e in edges, a in ends(e) where opens(e, a), b = other(e, a), L = {l in
      alphabet where exists u in cand(a): l not in letters(u)}
  # The empty and the full set struck beside a horseshoe too.
  noShoe:
    for: e in edges, c in ends(e)
  # Sets that hold one another struck across a horseshoe too.
  noShoeBeside:
    for: >-
      e in edges, k in ends(e) where |cand(k)| = 1, c = other(e, k), x =
      first(cand(k))
  lone:
    for: c in cells where not known(c) and |cand(c)| < 3
    conclude: "|cand(c)| >= 1 and place(c, first(cand(c)))"
  onlyCell:
    for: >-
      d in domain, C = {c in cells where d in cand(c)} where |C| < 3 and (|C| =
      0 or not known(first(C)))
    conclude: "|C| >= 1 and place(first(C), d)"
  # A smaller set one letter short read as no smaller set.
  smaller:
    conclude: >-
      forall d in cand(a) where not (exists u in cand(b): holds(d, u) and
      |letters(u)| < |letters(d)| - 1): strike(a, d)
  # A bigger set one letter more read as no bigger set.
  bigger:
    conclude: >-
      forall d in cand(b) where not (exists u in cand(a): holds(u, d) and
      |letters(u)| > |letters(d)| + 1): strike(b, d)
