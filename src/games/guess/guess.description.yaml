# yaml-language-server: $schema=../../describe/description.schema.json

game: guess
help:
  rules: |-
    Try to guess the hidden combination of colors. You will be given
    limited information about each guess you make, enabling you to
    refine the next guess.

    One setting changes what the combination can be, and a board's name
    in the Type menu says when it is on:

    {{modifiers}}
  controls: |-
    Build a guess by pressing the color buttons below the grid. Each
    color goes into the first empty peg of the row you are filling, and
    the ring shows you where the next one will land. Press **Submit**
    when the row is full. The small circles beside it give you your
    feedback: black pegs indicate how many of the colors you guessed
    were the right color in the right place, and white pegs indicate how
    many of the rest were the right colors but in the wrong place.

    Tap a peg in the row you are filling to choose where the next color
    goes instead — useful for changing your mind about one peg, and the
    only way to leave a gap in the middle of a row if you have turned
    blanks on. **Clear** empties the peg you chose, or rubs out the last
    color you placed if you have not chosen one.

    Right-click a peg in that row — or hold a finger on it — to *hold*
    it, marking that color to be carried into your next guess. A held
    peg is kept when you clear the rest, so the colors you place go into
    the gaps around it. Press **L** to number the colors, which can help
    when two of them are hard to tell apart.

    ### The keyboard

    Left and right move the cursor along the row, and a color's digit
    places it — the digit shown on that color's button. Backspace rubs
    one out and Space holds a peg. Once the row is full the cursor rests
    one step past its last peg, where Enter submits the guess. Enter on a
    peg switches Marks mode on and off, and in Marks mode the digits rule
    colors out of the slot the cursor is on and Backspace puts them all
    back. **D** does whatever Backspace does.
  sections:
    - heading: The answer row
      body: |-
        Below the rows is the answer row: one slot for each peg of the hidden
        combination, each holding a small square of every color that could
        still be in that slot. It is where you keep track of what you have
        worked out: when you rule a color out of a slot, its square goes, and
        the colors that are left are the ones you still have to decide
        between. Each color always sits in the same place in a slot, so you
        can tell at a glance which one has gone.

        To rule colors out of a slot, tap the slot. The frame moves there,
        and the color buttons now rule their color out of that slot, or put
        it back if it is already out; **Clear** puts every color back.
        Tapping a peg in the row you are filling takes you back to entering
        pegs. **Marks** switches between the two as well, keeping the frame
        in the same column, so whichever row the frame is on is always what
        the color buttons will change.

        **Check & save** checks the answer row against the hidden combination,
        as it checks your answers in every other puzzle. A slot where you have
        ruled out the color that is really there gets a red frame. It says
        which slot, not which color, and it never judges your guesses: a guess
        that isn't the answer is how you learn more.
  hints: |-
    **Next hint** first points out anything the scored rows prove that
    your answer row does not show yet, and rules those colors out of their
    slots for you, as marks you could have made yourself. It reasons only
    from the scores, never from the marks already in your answer row, and
    it waits until no slot rules out its own color, as **Check & save** does.

    {{hint-marks}}

    The ring's mark here is a frame, because it follows the square shape of
    the color blocks, so the hint calls those colors *framed*.

    Some things a single row tells you for certain:

    - A row that scored **no black pegs** has none of its colors where
      it guessed them.
    - A row that scored **nothing at all** has none of its colors
      anywhere in the answer.
    - A row where **every peg scored** holds every color the answer uses.

    Once some slots are narrowed down, a row can say more. If only two
    of a row's pegs can still be in their right places and it scored two
    black pegs, those two must be right. And when settled slots already
    account for all of a row's black pegs, none of its other pegs can be in
    place.

    When nothing more follows, the hint suggests a guess, framing one color
    in each slot. The guess always fits every score so far, so it could be
    the answer, and the hint tells you how many answers are still possible
    and the most that could be left after it. That part is a suggestion
    rather than a deduction, and the hint says so by counting rather than
    arguing.
name: Guess
family: code
sizes:
  npegs: { min: 2, max: 30 }
  ncolors: { min: 2, max: 10 }
space:
  # The answer row: a slot a cell.
  grid: { w: "npegs", h: "1" }
  units: []
answer:
  # A color a slot.
  value: { sort: cell, domain: "range(1, ncolors)" }
define:
  # How many pegs of color d guess k holds.
  pegs(k, d): "count(s in cells where peg(k, s) = d)"
  # The colors guess k holds, blanks aside.
  colors(k): "set(peg(k, s) over s in cells where peg(k, s) > 0)"
  # Whether guess k's peg in slot s may still be right there.
  open(k, s): "peg(k, s) > 0 and peg(k, s) in cand(s)"
  # The slots settled to color d: d is all they can still hold.
  settled(d): "{s in cells where cand(s) = {d}}"
  # The slots where guess k put the color they are settled to.
  pinned(k): "{s in cells where peg(k, s) > 0 and cand(s) = {peg(k, s)}}"
clues:
  # A scored guess: the color it put in each slot, 0 where it left one
  # blank, how many of them are right (black pegs), and how many are of a
  # color the answer holds, as many of each as both hold (black and white
  # pegs together).
  score:
    at: board
    fields:
      peg: { at: cell, value: "range(0, ncolors)" }
      black: { value: "range(0, w)" }
      total: { value: "range(0, w)" }
    means: >-
      black(k) = count(s in cells where value(s) = peg(k, s))
      and total(k) = sum(d in domain of
        min(n in {pegs(k, d), count(s in cells where value(s) = d)} of n))
freedom: { kind: query }
deal:
  answer: a color a slot, at random
variations:
  no duplicates:
    add:
      rules:
        distinct: "distinct(value(s) over s in cells)"
      techniques:
        # A slot settled to a color: no other slot holds it.
        - id: noRepeats
          tier: Normal
          for: "s in cells where |cand(s)| = 1, d in cand(s)"
          conclude: "forall t in cells where t != s: strike(t, d)"
tiers: [Normal]
techniques:
  # A guess that scored nothing at all: none of its colors is in the answer.
  - id: scoredNothing
    tier: Normal
    for: "k in clues(score) where total(k) = 0"
    conclude: "forall d in colors(k), s in cells: strike(s, d)"
  # A guess with no black pegs: none of its colors is where it put it.
  - id: noBlack
    tier: Normal
    for: "k in clues(score) where black(k) = 0"
    conclude: "forall s in cells where peg(k, s) > 0: strike(s, peg(k, s))"
  # A guess whose every peg scored: the answer holds only its colors.
  - id: everyPegScored
    tier: Normal
    for: "k in clues(score) where total(k) = |cells|"
    conclude: "forall d in domain - colors(k), s in cells: strike(s, d)"
  # A guess with only as many pegs that may still be right as it scored
  # black: each of them is right.
  - id: blacksForced
    tier: Normal
    for: >-
      k in clues(score)
      where black(k) > 0 and count(s in cells where open(k, s)) = black(k)
    conclude: >-
      forall s in cells where open(k, s), d in domain where d != peg(k, s):
      strike(s, d)
  # The slots settled to the color a guess put there account for all its
  # black pegs: its other pegs are all out of place.
  - id: blacksAccounted
    tier: Normal
    for: "k in clues(score), P = pinned(k) where |P| > 0 and |P| = black(k)"
    conclude: "forall s in cells where s not in P and open(k, s): strike(s, peg(k, s))"
  # The settled slots account for a guess's whole score, e of it: each of its
  # colors it holds more of than are settled is in the answer only where it
  # is settled.
  - id: totalAccounted
    tier: Normal
    for: >-
      k in clues(score),
      e = sum(d in colors(k) of min(n in {pegs(k, d), |settled(d)|} of n))
      where e > 0 and e = total(k)
    conclude: >-
      forall d in colors(k) where pegs(k, d) > |settled(d)|,
      s in cells where s not in settled(d): strike(s, d)
