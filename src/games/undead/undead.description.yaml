# yaml-language-server: $schema=../../describe/description.schema.json

game: undead
catalog:
  name: Undead
  aliases: [Haunted Mirror Maze]
  description: Monster-placing puzzle
  objective: Place ghosts, vampires and zombies to match what the mirrors see.
  collection: original
  family: objects
  similar: Haunted Mirror Maze, Spukschloss
help:
  rules: |-
    Fill every square without a mirror with a ghost, a vampire or a zombie.
    The clues, the numbers round the grid edges, show how many monsters you
    see looking into the grid from there, along a row or column.
    Zombies are always visible; ghosts are only visible when reflected in
    at least one mirror; vampires are only visible when not reflected in
    any mirror. The counts beneath the grid say how many ghosts,
    vampires and zombies it holds in all.
  controls: |-
    To place a monster, click in a square to select it, then
    click the desired monster's count beneath the grid or type the
    monster's letter on the keyboard: G for a ghost, V for a vampire or Z
    for a zombie. To erase a monster, click to select a square and then
    press Backspace.

    Right-click in a square and then type a letter to add or remove the
    monster as a pencil mark, indicating monsters that you think
    *might* go in that square. {{mark-all}} Here every pencil mark is all
    three monsters, and once every empty square has marks the press does
    nothing more. Press A to switch between
    pictures and letters (also a preference). A square's pencil marks are
    the monsters it can still hold, so **Check & save** flags a set of marks
    that leaves out the square's real monster.

    {{done-clues}}

    With the keyboard, the arrow keys move the selection around the grid.
    The keys 1, 2 and 3 work like G, V and Z, and 0, Space, Backspace and
    Delete all clear the square. Press Enter to switch between placing
    monsters and adding pencil marks. {{sticky-pencil}} Shift or Ctrl with an
    arrow key marks the clue at that end of the selected square's row or
    column as done.
  hints: |-
    **Hint** explains the next step rather than simply making it. It reasons
    only from the clues, the mirrors, your monsters and your pencil marks, so
    it carries on from wherever you are, as long as none of your monsters is
    wrong and no square's pencil marks leave out its real monster; if one
    does, it asks you to fix the highlighted mistakes first.

    Its steps work on pencil marks, so if some empty square has none, its
    first step pencils every monster into each empty square that has no marks
    yet. You can do the same yourself by pressing **Fill marks**. A square you have already
    narrowed down keeps its marks.

    {{hint-marks}}

    The hint crosses out a monster for one of two reasons: a sightline's two
    numbers leave no room for it in a square along that sightline, or the
    counts beneath the grid show that all of that monster have already been
    placed.
    It fills a square when only one monster is left uncrossed there, or when
    exactly as many squares can still hold a monster as there are of that
    monster left to place.

    Every hint is a deduction you could have made from what is on the board.
    On an **Unreasonable** board there may come a point where no deduction is
    left and the only way on is to try something and see whether it works —
    that is what [the difficulty name means](features#difficulty). The hint
    says so rather than guessing for you: save your position, try it, and
    undo if it breaks.
words:
  cell: square
  value: monster
produces: numbers
sizes:
  # Each side at most 18, narrower than the 10,000 squares a board may hold.
  w: { min: 3, max: 18 }
  h: { min: 3, max: 18 }
space:
  # A number sits in the slot beyond each end of every row and column.
  grid: { w: "w", h: "h" }
  slots: true
  units: []
answer:
  # 1 is a ghost, 2 a vampire, 3 a zombie, and 4 a mirror `\` and 5 a
  # mirror `/`, which hold no monster.
  value:
    sort: cell
    domain: "{d in range(1, 5) where (clue(mirror, c) < 0 and d < 4) or d = clue(mirror, c) + 3}"
marks:
  cand: { sort: cell, notation: "set of range(1, 5)" }
define:
  # Whether the board says how many of monster d it holds, which a board
  # built before its counts are dealt does not, and how many.
  counted(d): "exists k in clues(total): item(k) = d"
  holds(d): "sum(k in clues(total) where item(k) = d of many(k))"
  # How many monsters the sightline from slot s shows: a vampire or a zombie
  # it passes before its first mirror, and a ghost or a zombie it passes
  # after one, each time it passes it.
  seen(s): >-
    count(x in sight_direct(s, mirror) where value(x) != 1)
    + count(x in sight_bent(s, mirror) where value(x) != 2)
    + count(x in sight_twice(s, mirror) where value(x) != 2)
  # The same, of a filling f of its squares.
  shows(f, s): >-
    count(x in sight_direct(s, mirror) where f(x) != 1)
    + count(x in sight_bent(s, mirror) where f(x) != 2)
    + count(x in sight_twice(s, mirror) where f(x) != 2)
  # A slot's place going round the grid clockwise from the top left, as
  # upstream numbers them: along the top, down the right, back along the
  # bottom and up the left; and the slot at each place.
  round(s): >-
    the(r in range(0, |slots| - 1) where ofRound(r) = index(s, slots))
  ofRound(r): >-
    the(i in range(0, |slots| - 1) where (r < w and i = r)
    or (r >= w and r < w + h and i = w + h + r)
    or (r >= w + h and r < 2 * w + h and i = 3 * w + h - 1 - r)
    or (r >= 2 * w + h and i = 4 * w + 2 * h - 1 - r))
  # The most squares a sightline passes, and how many monsters the board
  # holds n of or more.
  longest: "max(s in slots of |sight(s, mirror)|)"
  kinds(n): "count(d in range(1, 3) where holds(d) >= n)"
  # How many more of monster d there is room for: those the board holds,
  # less the squares down to it alone.
  room(d): "holds(d) - count(x in cells where cand(x) = {d})"
shape:
  - "forall k in clues(total), j in clues(total) where j != k: item(j) != item(k)"
clues:
  # A mirror, `\` (1) or `/` (2), which turns a sightline a quarter turn.
  mirror:
    at: cell
    value: "range(1, 2)"
    means: "value(at) = v + 3"
  # A number beside a row or column: how many monsters its sightline shows.
  sees:
    at: slot
    value: "range(0, 2 * |cells|)"
    means: "seen(at) = v"
  # How many ghosts, vampires and zombies the board holds.
  total:
    at: board
    fields:
      item: { value: "range(1, 3)" }
      many: { value: "range(0, |cells|)" }
    means: "count(c in cells where value(c) = item(k)) = many(k)"
freedom: { kind: fill }
play:
  numbers:
    letters: GVZ
    pictures:
      paint: { 1: ghost, 2: vampire, 3: zombie }
      names: { 1: ghost, 2: vampire, 3: zombie }
      pref: { kw: monsters, name: Monster representation }
  given:
    4: { glyph: " \\ ", paint: fall }
    5: { glyph: " / ", paint: rise }
  counts: { total: item }
  countStyle: { kw: count-style, name: Monster count display }
  done: { sees: clue }
  # Upstream's three sizes, its 7x7 made an upright board of about its area.
  boards: [4x4, 5x5, 6x8]
  # Upstream's default, 4x4 Normal.
  defaultTier: Normal
  hintMarks:
    ring: the square the step decides.
    strike: the notes the step crosses out.
    outline: the sightline the step is about.
    stripes: the number the step reads.
deal:
  mirror: two squares in five, each a mirror either way at random
  answer: >-
    built a square at a time: a random monster on a random empty square,
    then every square the ladder decides from them
  sees: every number
  total: every count
  tier: one of the tiers
  sample:
    first:
      value: [4, 5]
      chance: 0.4
      within: { min: 0.22, max: 0.52 }
      # Upstream's: no sightline passing more squares than the tier allows.
      keep:
        Easy: "longest <= w + 1 and longest <= h + 1"
        Normal: "2 * longest <= 3 * w or 2 * longest <= 3 * h"
        Unreasonable: "longest <= 9"
    # Upstream's: Easy nearly all sightlines its numbers alone fill, the
    # tiers above fewer.
    sightlines:
      through: mirror
      ends: sees
      open:
        Easy: "2"
        Normal: "max(x in range(0, w + h) where 2 * x <= n of x)"
        Unreasonable: "max(x in range(0, |cells|) where x <= w + h or 2 * x <= n of x)"
    build: true
  # Upstream's: no board of one kind of monster, nor at Unreasonable of one
  # of a kind.
  keep:
    Easy: "kinds(1) >= 2"
    Normal: "kinds(1) >= 2"
    Unreasonable: "kinds(2) = 3"
id:
  - numbers: total
  - codes: { L: mirror 1, R: mirror 2 }
    before: ","
    always: true
  - numbers: sees
    before: ","
    sides: [top, right, bottom backwards, left backwards]
tiers: [Easy, Normal, Unreasonable]
tierLetters: ent
names:
  single: "the only monster left in a square"
  usedUp: "a monster count used up"
  justRoom: "a monster with just the squares it needs"
  sightline: "every way a sightline can fill"
techniques:
  # A square down to one monster holds it. One with none left, placed or
  # not, makes the marks inconsistent.
  - kind: one.cell
    as: single
    tier: Easy
    with:
      square: "true"
      move: "(known(c) or place(c, first(U)))"
  # Monster by monster: where the squares down to it alone are all the board
  # holds, no other square holds it; where just as many squares can hold it
  # as the board holds, each does.
  - kind: count.value
    as: total
    tier: Normal
    rung: [usedUp, justRoom]
    with:
      group: d in range(1, 3) where counted(d)
      set: cells
      value: d
      need: room(d)
      open: "d in cand(c) and cand(c) != {d}"
    says:
      terms: { d: d }
      marks: {}
      arms:
        # Every one of the monster is placed or down to its square.
        usedUp:
          when: "room(d) = 0"
          terms: {}
          marks: {}
          look: "No {d}s are left to place"
        # Just as many squares can still hold it as are left to place.
        justRoom:
          when: "room(d) > 0"
          terms: {}
          marks: {}
          look: "Exactly as many {nouns} can still hold a {d} as there are {d}s left to place"
          move: "{ring} can only be a {d}"
          later: "{ring} can only be a {d} too"
  # Sightline by sightline, the fewest squares first, each read from the end
  # that comes first going round the grid.
  - kind: fill.support
    as: sightline
    tier: Easy
    # Upstream's Easy: three passes over the sightlines at most, the last
    # narrowing nothing.
    most: 2
    with:
      group: >-
        n in range(0, |cells|), r in range(0, |slots| - 1), s = nth(slots, ofRound(r))
        where |sight(s, mirror)| = n and r < round(sight_exit(s, mirror)),
        t = sight_exit(s, mirror), L = sight(s, mirror),
        a = clue(sees, s), b = clue(sees, t) where a >= 0 or b >= 0,
        g = room(1), v = room(2), z = room(3)
      set: L
      fits: >-
        (a < 0 or shows(f, s) = a) and (b < 0 or shows(f, t) = b)
        and (not counted(1) or count(x in L where f(x) = 1 and |cand(x)| > 1) <= g)
        and (not counted(2) or count(x in L where f(x) = 2 and |cand(x)| > 1) <= v)
        and (not counted(3) or count(x in L where f(x) = 3 and |cand(x)| > 1) <= z)
    # Which monster shows where is the game's rule, and the help teaches it;
    # the step says only what the sightline's numbers leave no room for.
    says:
      terms: { s: s, t: t, a: a, b: b }
      marks: { stripes: L }
      again: "{stripes: the same sightline}"
      wordings:
        - when: "a < 0"
          look: "{stripes: This sightline}'s {outline t: {numeral b}} leaves no room for a {struckOr} in {ring}"
        - when: "b < 0"
          look: "{stripes: This sightline}'s {outline s: {numeral a}} leaves no room for a {struckOr} in {ring}"
        - look: "{stripes: This sightline}'s {outline s: {numeral a}} and {outline t: {numeral b}} leave no room for a {struckOr} in {ring}"
steps:
  clean:
    ring: cell
    move: "nothing, since a monster rules out no other square"
  note:
    ring: cell
    terms: { unruled: flag, vs: values }
    wordings:
      - when: unruled
        look: "Nothing rules out a monster in {ring} yet"
        move: "pencil in every one"
      - look: "Only {vs} {vs: is | are} still possible in {ring}"
        move: "pencil {vs: it | them} in"
  regionsFull:
    ring: cell
    terms: { n: number }
    look: "Every other monster is ruled out in {ring}"
    move: "it can only be {a n}"
  cull:
    ring: cell
    terms: { n: number }
    move: "no other square"
