# yaml-language-server: $schema=../../describe/description.schema.json

game: sokoban
help:
  rules: |-
    Push each barrel ({{pair:0}} square) into a target ({{pair:1}} ring). Barrels can
    be pushed up, down, left or right, but not into another barrel or the wall.
  controls: |-
    Tap or click any square you can reach to walk there, the shortest
    way round. Walking never pushes a barrel.

    To push, drag a barrel the way you want it to go, and you walk round
    behind it first; or press on your character and drag toward a barrel
    beside you. An arrow, and a ghost barrel on the square it ends on,
    show where the barrel will stop: one square
    further for each square you drag, as far as it can go before a wall
    or another barrel. A barrel you can't get behind shows no arrow. Let
    go to push. Drag back to where you started before letting go to
    change your mind.

    With a keyboard, use the arrow keys or the numeric keypad. Each press
    takes one step, and walking into a barrel pushes it. The digit keys
    work like the numeric keypad even without one: 8 is up, 2 down, 4
    left and 6 right, and 7, 9, 1 and 3 step diagonally. A diagonal step
    only walks, and only past a corner with room to go round it.
  hints: |-
    **Hint** shows the next push rather than making it. No push in Sokoban
    is forced by logic, so the hint searches for a line of pushes that gets
    every barrel onto a target and shows you one push from it: the barrel
    rings, and so does the square it goes into. Played by the hint, the
    push walks you round to the barrel first.

    {{hint-marks}}

    You can never pull a barrel, so the pushes to watch for are the ones you
    can't take back. A barrel pushed into a **corner** can never come out. A
    barrel pushed against a wall can only slide along it, and if no target
    lies that way it can never reach one. Two barrels side by side against a
    wall, or four in a square, can never move again. Any of these off a
    target means the puzzle can no longer be finished.

    So the first thing the hint looks for is another way to push the same
    barrel that would leave it, or a barrel beside it, stuck like that. It
    stripes that push and shows one that keeps the barrel free.

    Otherwise, when the search has checked the barrel's other pushes, the
    hint says what it found: it draws an arrow on each way the barrel can
    still be pushed and finish, the suggested one among them, and says when
    no other way can.

    Most of the skill in Sokoban is the order the barrels go home in, so
    that is what the hint says next, where it applies:

    - **Fill that one first.** Pushing a barrel onto a target takes a
      square to push it from and a square to stand on. When a barrel on
      another target would take up one of those, the hint outlines that
      other target and fills the ringed one first. Two targets at the end
      of a corridor are the usual case: the far one first.
    - **This barrel keeps the outlined barrel from reaching a target.** As
      the board stands, the outlined barrel can't be pushed to any empty
      target, whether because the ringed barrel is on its path or because
      it is where you would have to stand. Once the ringed barrel is
      pushed, the outlined one can be taken to a target without moving
      anything else.
    - **A run of pushes puts this barrel on a target.** When the search's
      line pushes one barrel several times running and ends with it on a
      target, the hint shows the pushes one after another, counting them
      above the sentence.

    When none of that applies, it says what the push does that you can
    see: that it puts the barrel on a target, or that it lets you out when
    barrels have shut you into a small part of the board.

    The hint refuses when there is nothing to search for: if a barrel off
    its target is already stuck, it outlines that barrel and asks you to
    undo, and it asks the same when the search proves no line of pushes from
    here can finish. A position can also be too tangled for the search to
    settle, and the hint says so; *Show solution…* then shows the finished
    board, from the board as it was dealt if not from yours. Boards are dealt
    so that the hint can see them through from the start; only a custom board
    much larger than the ones on the Type menu may be past it.

    **Check & save** asks the same question, since Sokoban has no single
    answer to check your pushes against: it won't save a position the hint
    would ask you to undo from, and outlines the stuck barrel.
name: Sokoban
family: position
sizes:
  # The game deals sides of four at the least, and loads a board of any size
  # with its desc; 99 stands for no bound.
  w: { min: 1, max: 99 }
  h: { min: 1, max: 99 }
space:
  grid: { w: "w", h: "h" }
  units: []
position:
  # What the square is: 0 floor, 1 a wall, 2 a pit, 3 a deep pit. A pit a
  # barrel is pushed into is filled, and floor after; a deep pit takes every
  # barrel pushed into it and stays.
  ground: { domain: "{0, 1, 2, 3}" }
  # 1 on a target, which is floor.
  target: { domain: "{0, 1}", on: "ground(c) = 0" }
  # 1 where a barrel stands, on floor.
  barrel: { domain: "{0, 1}", on: "ground(c) = 0" }
  # A hand-made level's letter on a barrel, 1 for A to 26 for Z, which the
  # barrel takes with it and no rule reads.
  label: { domain: "range(0, 26)", carried: true }
  # 1 on the player's square, floor with no barrel.
  man: { domain: "{0, 1}", once: "1", on: "ground(c) = 0 and barrel(c) = 0" }
freedom: { kind: transition }
define:
  # The player can stand on c.
  free(c): "ground(c) = 0 and barrel(c) = 0"
  # A barrel can be pushed onto c: floor with no barrel, or a pit of either
  # kind.
  takes(c): "barrel(c) = 0 and ground(c) != 1"
  # The player can walk to c without pushing anything.
  reach(c): "man(c) = 1 or (free(c) and exists n in adj4(c): reach(n))"
  # Square (x, y) is on the board and no wall.
  open(x, y): "on_grid(x, y) and ground(cell(x, y)) != 1"
  # Every barrel is needed on a target: no pit to fill, and no more barrels
  # than targets.
  tight: >-
    (forall c in cells: ground(c) < 2) and
    count(c in cells where barrel(c) = 1) <= count(c in cells where target(c) = 1)
  # A barrel on c, with the board to itself, could be pushed to a target:
  # it is on one, or it could be pushed to a neighbor from which it could,
  # the player standing on the far side of it.
  homeward(c): >-
    ground(c) != 1 and (target(c) = 1 or exists n in adj4(c)
    where ground(n) != 1 and open(2 * x(c) - x(n), 2 * y(c) - y(n)): homeward(n))
  # A barrel on c could move again some time: along one axis both squares
  # beside it are open, not both of them squares from which no barrel reaches
  # a target, and each holds no barrel or one that could move again itself.
  loose(c): >-
    exists n in adj4(c) where ground(n) != 1 and open(2 * x(c) - x(n), 2 * y(c) - y(n)),
    a = cell(2 * x(c) - x(n), 2 * y(c) - y(n)):
    (homeward(n) or homeward(a)) and (barrel(n) = 0 or loose(n))
    and (barrel(a) = 0 or loose(a))
moves:
  # One step to a neighboring square the player can stand on, the keyboard's:
  # a diagonal one only past a corner with a square beside both it can stand
  # on.
  step:
    for: >-
      b in cells where man(b) = 1,
      t in adj8(b) where free(t) and (x(t) = x(b) or y(t) = y(b)
      or free(cell(x(t), y(b))) or free(cell(x(b), y(t))))
    set:
      - for: "c = b"
        man: "0"
      - for: "c = t"
        man: "1"
  # A walk to any square the player can reach, a tap's.
  walk:
    for: "t in cells where man(t) = 0 and reach(t)"
    set:
      - for: "c in cells where man(c) = 1"
        man: "0"
      - for: "c = t"
        man: "1"
  # From square s the player can reach, the barrel beside it on o pushed one
  # square on, onto t: floor, or a pit, which it fills, or a deep pit, which
  # takes it. The player ends on o.
  push:
    for: >-
      s in cells where reach(s),
      o in adj4(s) where barrel(o) = 1 and on_grid(2 * x(o) - x(s), 2 * y(o) - y(s)),
      t = cell(2 * x(o) - x(s), 2 * y(o) - y(s)) where takes(t)
    set:
      - for: "c in cells where man(c) = 1"
        man: "0"
      - for: "c = o"
        man: "1"
        barrel: "0"
        label: "0"
      - for: "c = t where ground(t) = 0"
        barrel: "1"
        label: "label(o)"
      - for: "c = t where ground(t) = 2"
        ground: "0"
finish:
  # No barrel is off a target, or there is nowhere left to put one: no empty
  # target and no pit of either kind.
  - >-
    (forall c in cells: barrel(c) = 0 or target(c) = 1) or
    (forall c in cells: ground(c) < 2 and (target(c) = 0 or barrel(c) = 1))
deadEnds:
  # Where every barrel is needed, a barrel off a target that no push could
  # bring to one, even with the board to itself.
  dead: "tight and exists c in cells where barrel(c) = 1 and target(c) = 0: not homeward(c)"
  # Where every barrel is needed, a barrel off a target that can never move
  # again.
  jammed: "tight and exists c in cells where barrel(c) = 1 and target(c) = 0: not loose(c)"
deal:
  start: >-
    the game played backward from a finished board, the player pulling
    barrels out of targets and carving corridors through the rock, dealt
    again until the hint's search finishes the level
