game: numgame
help:
  rules: |-
    You are given six numbers and a target from 100 to 999. Combine the numbers two at a time with +, −, × and ÷ until one of them is the target.

    Combining two numbers replaces them with their result. Every result must be a positive whole number: you cannot subtract a number from one that is not larger, nor divide where there would be a remainder. Each number is used at most once, and you need not use them all.

    Every target can be made exactly.
  controls: |-
    {{controls}}

    The smaller number slides onto the larger, and the result takes the larger's place and says how it was made beneath its value. Which of the two you pick first makes no difference: − and ÷ always take the smaller number from or into the larger. Once a number and an operator are picked, the numbers they cannot combine with are grayed out.

    You can also pick an operator with its key: +, −, * (or x) and /. With no number picked, the key picks the number under the cursor as well, so from the keyboard a move is a number, an operator's key and Enter on the second number. Escape puts down the number you picked. Undo takes back a combination.
  origins: |-
    This is the numbers round of the British television quiz *Countdown*, where the six numbers are drawn from cards: two each of 1 to 10, and one each of 25, 50, 75 and 100.
  hints: |-
    **Hint** gives you one combination and no more: how few operations you can still finish in from the numbers you have now, how many different combinations start a way that short, and one of them, starting with the work on the biggest number. "You can finish in 5 more operations, starting 4 ways. One of them: 100 + 3 = 103." Where only one combination starts a way that short, the hint says so. The rest of the way is yours to find, and the next hint picks up from wherever you are.

    {{hint-marks}}

    If the numbers you have left can no longer make the target, the hint says so, and Undo takes you back to where they could.

name: Numgame
family: position
sizes:
  # The places the board deals a number on.
  places: { min: 6, max: 6 }
  # The number to make.
  target: { min: 1, max: 9999 }
space:
  # Six places in reading order, which no rule reads as a rectangle.
  cells: "places"
  units: []
position:
  # The number on each place, 0 where a combination has emptied it. A
  # product has no bound but the numbers dealt.
  value: { domain: "integers" }
freedom: { kind: transition }
define:
  # Of two places holding numbers, a is the one a result lands on: the
  # larger number, the lower place between equals, so the order a player
  # picks them in changes nothing.
  lands(a, b): >-
    a != b and value(a) > 0 and value(b) > 0 and
    (value(a) > value(b) or (value(a) = value(b) and index(a, cells) < index(b, cells)))
moves:
  # Each combination puts its result on place a and empties place b. Every
  # result is a positive whole number, so a difference must be more than
  # nothing and a quotient whole.
  add:
    for: "a in cells, b in cells where lands(a, b)"
    set:
      - for: "c = a"
        value: "value(a) + value(b)"
      - for: "c = b"
        value: "0"
  subtract:
    for: "a in cells, b in cells where lands(a, b) and value(a) > value(b)"
    set:
      - for: "c = a"
        value: "value(a) - value(b)"
      - for: "c = b"
        value: "0"
  multiply:
    for: "a in cells, b in cells where lands(a, b)"
    set:
      - for: "c = a"
        value: "value(a) * value(b)"
      - for: "c = b"
        value: "0"
  divide:
    for: "a in cells, b in cells where lands(a, b) and value(a) mod value(b) = 0"
    set:
      - for: "c = a"
        value: "value(a) / value(b)"
      - for: "c = b"
        value: "0"
finish:
  - "exists c in cells: value(c) = target"
deal:
  start: >-
    two small cards of each of 1 to 10 and the large ones, as Countdown
    deals them, and a target made in exactly the operations the tier asks
