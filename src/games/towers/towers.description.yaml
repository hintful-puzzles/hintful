# yaml-language-server: $schema=../../describe/description.schema.json

# Towers' help page, its rules, and the techniques `npm run describe`
# compiles to towers.compiled.ts, which solver.ts runs.
game: towers
help:
  rules: |-
    Fill in the grid with towers whose heights range from 1 to the grid
    size, so that every height appears exactly once in each row and
    column, and each clue around the edge counts the towers visible when
    looking into the grid from that direction. (Taller towers hide shorter ones behind them. So the
    sequence 2,1,4,3,5 would match a clue of 3 on the left, because the
    1 is hidden behind the 2 and the 3 is hidden behind the 4.)
  controls: |-
    To place a tower, click in a square to select it, then type the
    desired height on the keyboard. To erase a tower, click to select a
    square and then press Backspace.

    Right-click in a square and then type a number to add or remove the
    number as a pencil mark, indicating tower heights that you think
    *might* go in that square.

    Left-click on a clue to mark it as done (gray it out). To unmark a
    clue as done, left-click on it again. Drag along the clues to do the
    same to each one you pass over.

    {{sticky-pencil}}

    You can also use the arrow keys to move the selected square around.
    Press Enter to toggle between entering heights and entering pencil
    marks, and Backspace or Space to clear a square. Shift or Ctrl with an
    arrow key marks the clue at that end of the selected square's row or
    column as done.

    {{mark-all}} Once every empty square has marks, the press crosses out
    of each the heights already standing in its row and column.
  hints: |-
    **Hint** explains the next step rather than simply making it. It begins
    with any clue of 1 or of the full grid size, which place towers outright
    with no pencil marks needed, then fills in every cell's pencil marks
    (the same as pressing **Fill marks**), crosses out the heights already standing
    in each row and column, and then works from your own
    marks, so it carries on from wherever you are. If a tower you've placed
    is wrong, or a cell's pencil marks have crossed out its answer, it asks
    you to fix the highlighted mistakes first. If you would rather it left
    a cell unmarked until a step needs it, set **Hints pencil in** to
    **Only as needed** in the preferences: a cell with no marks then counts
    as holding every height not already in its row and column.

    {{hint-marks}}

    A clue is named by its number ("clue 3"); two outlined clues at either
    end of a line are a facing pair.

    The hint speaks of *heights* and of what a clue *sees*, the towers
    visible from it. A few clue ideas are worth learning by name:

    * **A clue of 1** sees only the tallest tower, so it stands right next
      to the clue.
    * **A clue as large as the grid** sees every tower, so the heights climb
      1, 2, 3, … away from it.
    * **Facing clues that add to one more than the grid size** pin down
      exactly where the tallest tower stands.
    * **Too tall, too close.** A tall tower near a clue hides everything
      shorter behind it, so it can leave the clue unable to see as many
      towers as it says.

    {{wing}}

    If you've turned on the preference that removes a height from pencil
    marks in its row and column when you place a tower, the hint leaves
    that tidying to the placement rather than spelling it out as a step of
    its own. On an Unreasonable board, deduction can run out before the
    grid is full; the hint says so rather than guessing.

name: Towers
family: latin
sizes:
  w: { min: 3, max: 9 }
space:
  grid: { w: "w", h: "w" }
  slots: true
  units: [rows, cols]
answer:
  value: { sort: cell, domain: "range(1, w)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, w)" }
  # A play aid with no meaning for the answer.
  done: { sort: slot, notation: "bool" }
define:
  visible(s): "count(c in sight(s) where forall c2 in before(c, sight(s)): value(c2) < value(c))"
  # The towers a filling of a line shows from its first cell.
  seen(f, L): "count(c in L where forall c2 in before(c, L): f(c2) < f(c))"
  # The index along a line of the nearest of the heights R placed in it, or
  # the line's length where none is.
  far(L, R): "min(i in range(0, w) where i = w or value(nth(L, i)) in R)"
  # The least i - 1 of the heights that can stand before index i of a line:
  # those not placed at i or beyond.
  short(L, i): "least(domain - set(value(c) over c in L where known(c) and index(c, L) >= i), i - 1)"
  # The least k members of a set of heights.
  least(H, k): "{h in H where |H - range(h, w)| < k}"
shape:
  - "latin(value, lines)"
clues:
  sees: { at: slot, value: "range(1, w)", means: "visible(at) = v" }
freedom: { kind: fill }
deal:
  clues: which slots show
  givens: how many
  tier: one of the tiers
tiers: [Easy, Hard, Extreme, Unreasonable]
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  # Facing clues that sum to w + 1 see a line climbing to its tallest tower
  # from both ends, so the tallest stands as many cells from one clue as that
  # clue says. Every such line in one firing, the columns before the rows, as
  # upstream's one-off did. A cell that can no longer hold it makes the marks
  # inconsistent.
  - id: facing
    tier: Easy
    rung: facing
    for: >-
      P = {s in slots where index(s, slots) < index(opposite(s), slots)
      and clue(sees, s) + clue(sees, opposite(s)) = w + 1}
      where |P| > 0
    conclude: >-
      forall s in P, c = nth(sight(s), clue(sees, s) - 1):
      w in cand(c) and place(c, w)
  # Clue by clue, in the order dealt, two readings of the towers its line
  # already shows; the first that strikes anything is the firing.
  #
  # The tallest heights placed, from w down to the first that is not, are a
  # run R. Where the clue sees one more tower than it sees of R, the cell
  # nearest the clue holds the tallest of the cells before the nearest of R,
  # so it cannot hold the shortest of the heights that can stand there
  # (`near`). Only then are those read, under `and`.
  #
  # Otherwise, a height that can still be seen, K (not placed behind one at
  # least two taller, as upstream's loop reads it), with r of K above it,
  # cannot stand within v - r - 1 cells of the clue: the tallest first.
  - id: bounds
    tier: Easy
    rung: [lineFull, lowerBound]
    for: >-
      k in clues(sees), s = at(k), v = v(k), L = sight(s), c0 = first(L),
      P = set(value(c) over c in L where known(c)),
      R = {h in domain where range(h, w) subset P},
      near = (v = count(c in L where value(c) in R
      and (forall c2 in before(c, L): value(c2) < value(c))) + 1
      and far(L, R) > 1 and (exists h in short(L, far(L, R)): h in cand(c0)))
    conclude: >-
      (near implies (forall h in short(L, far(L, R)): strike(c0, h)))
      and (near or (forall K = (domain - P) + set(value(c) over c in L where known(c)
      and not (exists c2 in before(c, L): value(c2) > value(c) + 1)),
      i in domain, h = w + 1 - i where h in K,
      j in range(0, v - |K - range(1, h)| - 2): strike(nth(L, j), h)))
  - { use: latin.hiddenSingle, tier: Easy, rung: hiddenSingle }
  - { use: latin.single, tier: Easy, rung: single }
  # Clue by clue, and cell by cell along its line: a height no filling of the
  # line from its candidates, every height once, that shows the clue's count
  # puts in the cell, is struck from it. One cell a firing.
  - id: arrangement
    tier: Hard
    rung: arrangement
    for: "k in clues(sees), s = at(k), v = v(k), L = sight(s), c in L"
    conclude: >-
      forall d in cand(c) where not (exists fill f of L from cand
      where distinct(f(x) over x in L) and f(c) = d: seen(f, L) = v):
      strike(c, d)
  - { use: latin.set, tier: Hard, rung: set }
  - { use: latin.fish, tier: Extreme, rung: set }
  - { use: latin.wing, tier: Extreme, rung: wing }
