# yaml-language-server: $schema=../../describe/description.schema.json

game: towers
catalog:
  name: Towers
  aliases: [Skyscrapers]
  description: Tower-placing Latin square puzzle
  objective: Complete the latin square of towers in accordance with the clues.
  collection: original
  family: latin
  similar: Skyscrapers
help:
  rules: |-
    Fill in the grid with towers whose heights range from 1 to the grid
    size, so that every height appears exactly once in each row and
    column, and each clue around the edge counts the towers visible when
    looking into the grid from that direction. (Taller towers hide shorter ones behind them. So the
    sequence 2,1,4,3,5 would match a clue of 3 on the left, because the
    1 is hidden behind the 2 and the 3 is hidden behind the 4.)
  controls: |-
    To place a tower, click in a square to select it, then type the
    desired height on the keyboard. To erase a tower, click to select a
    square and then press Backspace.

    Right-click in a square and then type a number to add or remove the
    number as a pencil mark, indicating tower heights that you think
    *might* go in that square.

    {{done-clues}}

    {{sticky-pencil}}

    You can also use the arrow keys to move the selected square around.
    Press Enter to toggle between entering heights and entering pencil
    marks, and Backspace or Space to clear a square. Shift or Ctrl with an
    arrow key marks the clue at that end of the selected square's row or
    column as done.

    {{mark-all}} Once every empty square has marks, the press crosses out
    of each the heights already standing in its row and column.
  hints: |-
    **Hint** explains the next step rather than simply making it. It begins
    with any clue of 1 or of the full grid size, and any facing clues that
    add to one more than it, which place towers outright with no pencil
    marks needed, then fills in every cell's pencil marks
    (the same as pressing **Fill marks**), crosses out the heights already standing
    in each row and column, and then works from your own
    marks, so it carries on from wherever you are. If a tower you've placed
    is wrong, or a cell's pencil marks have crossed out its answer, it asks
    you to fix the highlighted mistakes first. If you would rather it left
    a cell unmarked until a step needs it, set **Hints pencil in** to
    **Only as needed** in the preferences: a cell with no marks then counts
    as holding every height not already in its row and column.

    {{hint-marks}}

    A clue is named by its number ("clue 3"); two outlined clues at either
    end of a line are a facing pair.

    The hint speaks of *heights* and of what a clue *sees*, the towers
    visible from it. A few clue ideas are worth learning by name:

    * **A clue of 1** sees only the tallest tower, so it stands right next
      to the clue.
    * **A clue as large as the grid** sees every tower, so the heights climb
      1, 2, 3, … away from it.
    * **Facing clues that add to one more than the grid size** pin down
      exactly where the tallest tower stands.
    * **Too tall, too close.** A tall tower near a clue hides everything
      shorter behind it, so it can leave the clue unable to see as many
      towers as it says.

    {{wing:cell}}

    If you've turned on the preference that removes a height from pencil
    marks in its row and column when you place a tower, the hint leaves
    that tidying to the placement rather than spelling it out as a step of
    its own. On an Unreasonable board, deduction can run out before the
    grid is full; the hint says so rather than guessing.

produces: latin
words:
  cell: cell
  value: height
sizes:
  w: { min: 3, max: 9 }
space:
  grid: { w: "w", h: "w" }
  slots: true
  units: [rows, cols]
answer:
  value: { sort: cell, domain: "range(1, w)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, w)" }
define:
  visible(s): "count(c in sight(s) where forall c2 in before(c, sight(s)): value(c2) < value(c))"
  # The towers a line shows from its first cell before it reaches c.
  shownBefore(L, c): "count(c2 in before(c, L) where forall c3 in before(c2, L): value(c3) < value(c2))"
  # The towers a filling of a line shows from its first cell.
  seen(f, L): "count(c in L where forall c2 in before(c, L): f(c2) < f(c))"
  # The index along a line of the nearest of the heights R placed in it, or
  # the line's length where none is.
  far(L, R): "min(i in range(0, w) where i = w or value(nth(L, i)) in R)"
  # The least i - 1 of the heights that can stand before index i of a line:
  # those not placed at i or beyond.
  short(L, i): "least(domain - set(value(c) over c in L where known(c) and index(c, L) >= i), i - 1)"
  # The least k members of a set of heights.
  least(H, k): "{h in H where |H - range(h, w)| < k}"
shape:
  - "latin(value, lines)"
clues:
  # The second half follows from the first on a line holding every height
  # once, and says where the tallest stands: so a clue that already sees its
  # count with the tallest still to come is broken before its line is full.
  sees:
    at: slot
    value: "range(1, w)"
    means: >-
      visible(at) = v and (exists c in sight(at) where value(c) = w:
      shownBefore(sight(at), c) = v - 1)
freedom: { kind: fill }
play:
  numbers: { raised: true }
  done: { sees: clue }
  # Upstream's three sizes, each at every tier; its default 5x5.
  boards: [4x4, 5x5, 6x6]
  default: 5x5
  # Measured 2026-10-05: none in 50,000 boards built at each tier above
  # Normal.
  bounds:
    tiers:
      Tricky: { longer: { min: 4 } }
      Unreasonable: { longer: { min: 4 } }
  hintMarks:
    ring: the cell the step fills in with a height.
    strike: the heights the step crosses out of the pencil marks.
    outline: >-
      what the step reasons from: "this cell", whose heights it crosses out,
      the clue it counts, in its slot beside the grid, the tower just placed,
      the cells of a set, or "the middle cell" a step weighs and the cells it
      reads.
    stripes: >-
      the line the sentence names: the row or column a clue sees along,
      through the clue slots at both its ends. Or the several rows or columns
      it names together, such as "these 2 columns", where one height fits
      only the outlined cells.
# Upstream towers.c's: its givens hidden first, then above Easy its clues;
# an Easy board up to 5x5 shows no given, its square drawn again until the
# clues alone finish it.
deal:
  answer: a Latin square
  given: every cell's height, then each hidden while the board still finishes; none on an Easy board up to 5x5
  sees: every clue, then above Easy each hidden, once no more cells can be, while the board still finishes
  tier: one of the tiers
  sample: { latin: true }
  hide: [given, sees]
  hideFirst: [given]
  hideFrom: { sees: Normal }
  hideWhole: { given: { below: Normal, longer: { max: 5 } } }
# Upstream's: the clues a slot at a time between slashes, top, bottom, left
# and right, then a comma and the givens where there are any.
id:
  - { numbers: sees, between: "/" }
  - { digits: given, apart: "_", before: "," }
tierLetters: ehxu
tiers: [Easy, Normal, Tricky, Unreasonable]
names:
  dup: "a placed height's row and column"
  single: "the only height left in a cell"
  regionsFull: "every other height already placed"
  hiddenSingle: "the only cell left for a height"
  set: "heights already accounted for"
  wing: "a wing"
  fullLine: "a clue as large as the grid"
  tallestNearest: "a clue of 1"
  facing: "facing clues that pin the tallest"
  lineFull: "the next tower a clue must see"
  lowerBound: "a tower too tall, too close"
  arrangement: "every way a clue's line can fill"
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  # A clue as large as the grid sees every tower, so its line climbs 1, 2, …
  # away from it. One clue a firing, its cells a journey from the clue. It
  # reads no notes, so the hint offers it before they are set up.
  - id: fullLine
    tier: Easy
    for: >-
      k in clues(sees), s = at(k), L = sight(s)
      where v(k) = w and (exists c in L: not known(c))
    conclude: "forall c in L where not known(c): place(c, index(c, L) + 1)"
    says:
      terms: { s: s, v: "v(k)", L: L }
      marks: {}
      fact:
        terms: { n: "index(c, L) + 1" }
        look: "{outline s: Clue {numeral v}} sees every tower in {stripes L: this line}"
        follows: "heights must climb 1, 2, … from the clue"
        move: "{ring} must be {n}"
        again: "{stripes L: the same line} from {outline s: clue {numeral v}}"
  # A clue of 1 sees only the tallest tower, so it stands next to the clue.
  - id: tallestNearest
    tier: Easy
    for: "k in clues(sees), s = at(k), c = first(sight(s)) where v(k) = 1 and not known(c)"
    conclude: "place(c, w)"
    says:
      terms: { s: s, v: "v(k)", L: "sight(s)", n: w }
      marks: {}
      look: "{outline s: Clue {numeral v}} sees one tower in {stripes L: its line}"
      follows: "the tallest must stand next to it"
      move: "{ring} must be {n}"
  # Facing clues that sum to w + 1 see a line climbing to its tallest tower
  # from both ends, so the tallest stands as many cells from one clue as that
  # clue says. Every such line in one firing, the columns before the rows, as
  # upstream's one-off did. A cell that holds another height makes the board
  # inconsistent; the notes are not read, so the hint offers it before they
  # are set up.
  - id: facing
    tier: Easy
    for: >-
      P = {s in slots where index(s, slots) < index(opposite(s), slots)
      and clue(sees, s) + clue(sees, opposite(s)) = w + 1}
      where |P| > 0
    conclude: >-
      forall s in P, c = nth(sight(s), clue(sees, s) - 1):
      (not known(c) or value(c) = w) and place(c, w)
    # The hint names the pair whose tallest each placement is.
    says:
      terms: {}
      marks: {}
      fact:
        terms: { S: "{s, opposite(s)}", L: "sight(s)", n: w }
        look: "{outline S: These facing clues} sum to one more than the grid size"
        follows: "{derived stripes L: their line}'s tallest is pinned"
        move: "{ring} must be {n}"
        again: "{outline S: these facing clues} too"
  # Clue by clue, in the order dealt, two readings of the towers its line
  # already shows; the first that strikes anything is the firing.
  #
  # The tallest heights placed, from w down to the first that is not, are a
  # run R. Where the clue sees one more tower than it sees of R, the cell
  # nearest the clue holds the tallest of the cells before the nearest of R,
  # so it cannot hold the shortest of the heights that can stand there
  # (`near`). Only then are those read, under `and`.
  #
  # Otherwise, a height that can still be seen, K (not placed behind one at
  # least two taller, as upstream's loop reads it), with r of K above it,
  # cannot stand within v - r - 1 cells of the clue: the tallest first.
  - id: clueBounds
    tier: Easy
    rung: [lineFull, lowerBound]
    for: >-
      k in clues(sees), s = at(k), v = v(k), L = sight(s), c0 = first(L),
      P = set(value(c) over c in L where known(c)),
      R = {h in domain where range(h, w) subset P},
      near = (v = count(c in L where value(c) in R
      and (forall c2 in before(c, L): value(c2) < value(c))) + 1
      and far(L, R) > 1 and (exists h in short(L, far(L, R)): h in cand(c0)))
    conclude: >-
      (near implies (forall h in short(L, far(L, R)): strike(c0, h)))
      and (near or (forall K = (domain - P) + set(value(c) over c in L where known(c)
      and not (exists c2 in before(c, L): value(c2) > value(c) + 1)),
      i in domain, h = w + 1 - i where h in K,
      j in range(0, v - |K - range(1, h)| - 2): strike(nth(L, j), h)))
    # The hint names the clue, and which reading struck: a height a step. The
    # clue's other towers are already in sight deeper in, so the one it still
    # needs is the nearest cell, which must stand taller than every tower
    # between them.
    says:
      shown: value
      terms: { s: s, v: v, L: L, seen: "v - 1" }
      marks: {}
      arms:
        lineFull:
          when: near
          look: >-
            {outline s: Clue {numeral v}} already sees {numeral seen} {seen: tower | towers} in
            {derived stripes L: the line}, so the cell nearest it must top all
            between; height {struck} can't
        lowerBound:
          when: "true"
          look: >-
            {outline s: Clue {numeral v}} sees exactly {numeral v} towers along {derived stripes
            L: its line}; height {struck} so near it would hide too many
  - { use: latin.hiddenSingle, tier: Easy, rung: hiddenSingle }
  - { use: latin.single, tier: Easy, rung: single }
  # Clue by clue, and cell by cell along its line: a height no filling of the
  # line from its candidates, every height once, that shows the clue's count
  # puts in the cell, is struck from it. One cell a firing.
  - kind: fill.support
    as: arrangement
    tier: Normal
    rung: arrangement
    with:
      group: "k in clues(sees), s = at(k), v = v(k), L = sight(s), q in L"
      set: L
      each: "{q}"
      fits: "distinct(f(x) over x in L) and seen(f, L) = v"
    # The hint names the clue, a height a step. Which arrangements the clue
    # allows depends on every cell of its line.
    says:
      shown: value
      terms: { s: s, v: v, L: L }
      marks: { reads: L }
      look: >-
        No way for {outline s: clue {numeral v}} to show exactly {numeral v} towers along
        {derived stripes L: its line} puts height {struck} in {ring}
  - { use: latin.set, tier: Normal, rung: set }
  - { use: latin.fish, tier: Tricky, rung: set }
  - { use: latin.wing, tier: Tricky, rung: wing }
