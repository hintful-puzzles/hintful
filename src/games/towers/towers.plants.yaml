# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # The line climbing toward the clue.
  fullLine:
    conclude: "forall c in L where not known(c): place(c, w - index(c, L))"
  # The next tallest beside the clue.
  tallestNearest:
    conclude: "place(c, w - 1)"
  facing:
    conclude: >-
      forall s in P, c = nth(sight(s), clue(sees, s)): (not known(c) or value(c)
      = w) and place(c, w)
  clueBounds:
    conclude: >-
      (near implies (forall h in short(L, far(L, R)): strike(c0, h))) and (near
      or (forall K = (domain - P) + set(value(c) over c in L where known(c) and
      not (exists c2 in before(c, L): value(c2) > value(c) + 1)), i in domain, h
      = w + 1 - i where h in K, j in range(0, v - |K - range(1, h)| - 1):
      strike(nth(L, j), h)))
  arrangement:
    conclude: >-
      forall c in {q}, d in cand(c) where not (exists fill f of L from cand
      where f(c) = d and (distinct(f(x) over x in L) and seen(f, L) = v + 1):
      true): strike(c, d)
