# yaml-language-server: $schema=../../describe/description.schema.json

game: slant
help:
  rules: |-
    Fill in a diagonal line in every grid square so that there are no
    loops in the grid, and so that every numbered point has that many
    lines meeting at it.
  controls: |-
    {{controls}}

    The **Mouse button order** preference swaps the two buttons, and Enter
    and Space with them.

    The **Fade grounded components** preference dims every line that is
    joined, through other lines, to the edge of the grid: such a line can
    never be part of a loop.
  sections:
    - heading: Notes
      body: |-
        On harder boards you will often know that two squares side by side slant the
        same way before you know which way that is. **Notes** lets you write it down.
        Press the **Marks** key on the keypad, or **P**, to turn notes mode on, the same
        way as in every other puzzle that takes notes; a small pencil shows at the top
        right of the board while it is on, and pressing it again turns it off.

        In notes mode, tap near the side two squares share to put a **same-slant mark**
        (**=**) across it, and tap there again to take it off; drag on across more sides
        to do the same to each. From the keyboard, press
        **Enter** on one square, move to the square beside it and press **Enter** again;
        **Escape** lets go of the first square.

        Two squares side by side slant the same way exactly when just one of them
        touches each end of the side between them. So they do when a clue at that end
        needs exactly one more line and they are the only empty squares around it, and
        when they can neither both touch one end nor both touch the other: a **1** there
        stops them both touching it, a **3** stops them both slanting away from it.

        **Lines of 2s.** When 2s lie in a straight line with a 1 at each end, every pair
        of squares along the line, one on each side of it, slants the same way; so does
        every pair when there is a 3 at each end. A 2's four squares are the pairs on
        either side of it, and the 1s (or the 3s) leave each pair giving it exactly one of
        its two lines. A diagonal can stand in for either end: one meeting the end 2 does
        what a 1 does, and one missing it does what a 3 does.

        A mark that turns out to be wrong shows in red when you check the board.
  hints: |-
    The hint carries on from the diagonals you have drawn and your marks, as long
    as none of them is wrong. When a step needs to know that two squares slant the
    same way, it puts the mark down first, as a step of its own that says why.

    {{hint-marks}}
name: Slant
family: lines
sizes:
  # Nothing in the game bounds a side but the time a deal takes. A board one
  # square wide reaches no Normal board, so upstream refuses it.
  w: { min: 2, max: 100 }
  h: { min: 2, max: 100 }
space:
  grid: { w: "w", h: "h" }
  # The points where squares meet, where the numbers sit, and the pairs of
  # squares side by side, which the v-shapes mark.
  points: true
  edges: true
  units: []
answer:
  # A diagonal: 1 from above left to below right, 2 from above right to
  # below left, as `slash` reads them.
  value:
    sort: cell
    domain: "range(1, 2)"
marks:
  # Where two squares side by side may still meet in a v: 1 at the first end
  # of the side they share, 2 at its second, 3 at neither, where they slant
  # alike. A same-slant mark is 3 alone.
  vee: { sort: edge, notation: "set of range(1, 3)", of: "meeting(at)" }
define:
  # The two points at the ends of the side edge e's squares share, in
  # reading order.
  side(e): "{k in points(end1(e)) where k in points(end2(e))}"
  # Where e's squares meet in a v: 1 at the first end of their side, 2 at
  # its second, 3 at neither.
  meeting(e): >-
    the(i in range(1, 3) where (i < 3 and (forall c in ends(e):
    value(c) = slash(c, nth(side(e), i - 1)))) or (i = 3 and not (exists k
    in side(e): forall c in ends(e): value(c) = slash(c, k))))
  # The diagonals meeting k, of those drawn.
  lines(k): "count(c in cells(k) where value(c) = slash(c, k))"
  # The squares round k with no diagonal yet.
  open(k): "{c in cells(k) where not known(c)}"
  # The pairs marked to slant alike.
  alike: "{e in edges where vee(e) = {3}}"
  # Whether diagonal d in square c would join two points already joined.
  closes(c, d): >-
    exists k in points(c) where slash(c, k) = d, q in before(k, points(c))
    where slash(c, q) = d: q in linked(k)
  # How many more diagonals may meet the points J: a number's lines still
  # to come, and every open square round a point with none.
  room(J): >-
    sum(q in J where clue(n, q) >= 0 of clue(n, q) - lines(q))
    + sum(q in J where clue(n, q) < 0 of |open(q)|)
  # Whether the points J reach no border point and have room for at most
  # one more diagonal.
  shut(J): "(forall q in J: |cells(q)| = 4) and room(J) <= 1"
  # Whether diagonal d in square c would join two such groups of points.
  traps(c, d): >-
    exists k in points(c) where slash(c, k) = d, q in before(k, points(c))
    where slash(c, q) = d: shut(linked(k)) and shut(linked(q))
shape:
  # No loop: every point is joined, along the diagonals, to the border, which
  # on a full board is the same.
  - "forall k in points: exists q in linked(k): |cells(q)| < 4"
clues:
  # A number at a point, which that many diagonals meet.
  n:
    at: point
    value: "range(0, |cells(at)|)"
    means: "count(c in cells(at) where value(c) = slash(c, at)) = v"
freedom: { kind: fill }
deal:
  answer: a diagonal a square in a random order, the one that closes no loop where the other does
  n: at every point, then as many hidden as the board stays at its tier, the readiest first above Easy
  tier: one of the tiers
tiers: [Easy, Normal]
names:
  clue: "a clue's count of lines"
  loop: "avoiding a loop"
  pair: "a same-slant pair at a clue"
  share: "two squares sharing a clue's line"
  deadEnd: "corners that would be shut in"
  same: "squares marked to slant alike"
  one: "a pair of squares at a 1"
  three: "a pair of squares at a 3"
  two: "pairs of squares across a 2"
techniques:
  # A number with no lines left to come has none from its open squares, and
  # one with as many left as open squares has one from each. One with more
  # left than that, or fewer than none, makes the marks inconsistent.
  - id: clue
    tier: Easy
    for: "k in points where clue(n, k) >= 0, O = open(k), left = clue(n, k) - lines(k)"
    conclude: >-
      left >= 0 and left <= |O|
      and (left = 0 implies forall c in O: place(c, 3 - slash(c, k)))
      and (left = |O| implies forall c in O: place(c, slash(c, k)))
  # A diagonal joining two points already joined would close a loop, so the
  # square takes the other. One whose diagonals both would makes the marks
  # inconsistent.
  - kind: loop.never
    as: loop
    tier: Easy
    with:
      values: "range(1, 2)"
      closes: "closes(c, d)"
      move: "not closes(c, 3 - d) and place(c, 3 - d)"
  # Two open squares side by side round a number that slant alike give it
  # one line between them whichever way they slant, so the rest of its open
  # squares are read as `clue` reads them all.
  - id: pair
    tier: Normal
    for: >-
      A = alike, k in points where clue(n, k) >= 0, P = open(k) where |P| > 2,
      a in P, b in before(a, P) where b in adj4(a) and b in through(a, A),
      O = {c in open(k) where c != a and c != b},
      left = clue(n, k) - lines(k) - 1
    conclude: >-
      left >= 0 and left <= |O|
      and (left = 0 implies forall c in O: place(c, 3 - slash(c, k)))
      and (left = |O| implies forall c in O: place(c, slash(c, k)))
  # Two open squares side by side round a number that still needs one line
  # from them, its other open squares a pair slanting alike or none, give it
  # exactly one: just one of them meets it, so they slant alike.
  - id: share
    tier: Normal
    for: >-
      A = alike, k in points where clue(n, k) >= 0,
      P = open(k) where |P| = 2 or |P| = 4,
      a in P, b in before(a, P) where b in adj4(a),
      R = {c in open(k) where c != a and c != b}
      where |R| = 0 or (|R| = 2 and nth(R, 1) in adj4(nth(R, 0))
      and nth(R, 1) in through(nth(R, 0), A)),
      left = clue(n, k) - lines(k) where 2 * left = 2 + |R|
    conclude: "strike(edge(b, a), 1) and strike(edge(b, a), 2)"
  # A diagonal joining two groups of points, each cut off from the border with
  # room for one more diagonal at most, would shut them in for good, and a
  # loop would close round them. The square takes the other.
  - id: deadEnd
    tier: Normal
    for: >-
      c in cells where not known(c),
      d in range(1, 2) where not known(c) and traps(c, d)
    conclude: "not closes(c, 3 - d) and not traps(c, 3 - d) and place(c, 3 - d)"
  # A square slanting alike with a square that has its diagonal takes the
  # same one.
  - id: same
    tier: Normal
    for: "A = alike, c in cells where not known(c), q in through(c, A) where known(q)"
    conclude: "place(c, value(q))"
  # A diagonal meets one end of each side of its square, so it and the square
  # beside it meet in no v at the other.
  - id: drawn
    on: place
    tier: Easy
    for: >-
      c in cells where known(c), a in adj4(c), e = edge(c, a), S = side(e),
      i in range(1, 2) where value(c) != slash(c, nth(S, i - 1))
    conclude: "strike(e, i)"
  # Two squares side by side round a 1 meet in no v there.
  - id: one
    tier: Normal
    for: >-
      k in points where clue(n, k) = 1, a in cells(k),
      b in before(a, cells(k)) where b in adj4(a), e = edge(b, a),
      i in range(1, 2) where nth(side(e), i - 1) = k
    conclude: "strike(e, i)"
  # Two squares side by side round a 3 meet in no v away from it.
  - id: three
    tier: Normal
    for: >-
      k in points where clue(n, k) = 3, a in cells(k),
      b in before(a, cells(k)) where b in adj4(a), e = edge(b, a),
      i in range(1, 2) where nth(side(e), i - 1) != k
    conclude: "strike(e, i)"
  # A 2 takes one line from each pair of its squares, or two from one and
  # none from the other: two squares side by side meet in a v at it only
  # where the two across it can meet away from it, and away from it only
  # where those can meet at it.
  - id: two
    tier: Normal
    for: >-
      k in points where clue(n, k) = 2 and |cells(k)| = 4, a in cells(k),
      b in before(a, cells(k)) where b in adj4(a), e = edge(b, a)
      where vee(e) != {3},
      R = {c in cells(k) where c != a and c != b},
      f = edge(nth(R, 0), nth(R, 1)) where vee(f) != {1, 2, 3},
      i in range(1, 2) where nth(side(e), i - 1) = k,
      j in range(1, 2) where nth(side(f), j - 1) = k
    conclude: >-
      (3 - j not in vee(f) implies strike(e, i))
      and (j not in vee(f) implies strike(e, 3 - i))
# The hint's words. The solver's firings and the same-slant marks a firing
# cites are the planner's steps (`hint.ts`), each said here; what a clue
# already has, and why a pair can't meet in a v, are clauses another step's
# sentence says in place (a `clause` term).
phrases:
  # What lies beyond a 2 the pair across it bounds: the cap, or the 2s and
  # their pairs leading to it.
  far: >-
    {if line: {outline twos: 2s} and {outline pairs: their pairs} beyond ending in {cap} | {cap} beyond}
  # Along a line of 2s, the pair across the last of them; else the pair
  # across the one 2.
  alongPair: >-
    {if line: along {outline twos: the 2s beyond it}, the last of {outline pairs: their pairs} | {outline pairs: the pair across it}}
  alongOne: >-
    {if line: along {outline twos: the 2s beyond it}, one of the last of {outline pairs: their pairs} | one of {outline pairs: the pair across it}}
steps:
  # What a clue already has: one line from the pair its marks join, lines
  # from its decided squares (`touching` of them touch it), or both.
  hasPair:
    ring: cell
    marks: { outline: [marks] }
    move: "one line from {outline marks: its marked pair | its chained pair}"
  hasSquares:
    ring: cell
    terms: { touching: number }
    marks: { outline: [area] }
    wordings:
      - when: "touching = 0"
        move: "no line from {outline area}"
      - when: "touching = 1"
        move: "one line from {outline area}"
      - move: "{numeral touching} lines from {outline area}"
  hasBoth:
    ring: cell
    terms: { touching: number }
    marks: { outline: [marks, area] }
    wordings:
      - when: "touching = 0"
        move: "one line from {outline marks: its marked pair | its chained pair} and none from {outline area}"
      - when: "touching = 1"
        move: "one line from {outline marks: its marked pair | its chained pair} and one from {outline area}"
      - move: >-
          one line from {outline marks: its marked pair | its chained pair} and {numeral touching} from {outline area}
  # A clue still short of diagonals, needing one from each ringed square.
  clueFill:
    ring: cell
    terms: { c: number }
    marks: { outline: [clue] }
    move: "{ring} must slant toward it"
    wordings:
      - when: "c = 4"
        look: "{outline clue: this {c} clue} must be touched by all four diagonals"
      - look: "{outline clue: this {c} clue} needs a line from every square around it"
  # The same, with lines it has already (`got`); `both` where that names two
  # sources, which leaves the sentence room for little else.
  clueFillHas:
    ring: cell
    terms: { c: number, both: flag, more: number, got: { clause: [hasPair, hasSquares, hasBoth] } }
    marks: { outline: [clue] }
    move: "{ring} must slant toward it"
    wordings:
      - when: "both"
        look: "{outline clue: this {c} clue} has {got}"
      - look: "{outline clue: this {c} clue} has {got} and needs {numeral more} more"
  # A 0, touched by no diagonal, beside squares already slanting away.
  clueEmpty:
    ring: cell
    marks: { outline: [clue, area] }
    look: "{outline clue: this 0 clue} is touched by no diagonals"
    wordings:
      - when: "|outlineArea| = 0"
        move: "{ring} must slant away from it"
      - move: "{ring} must slant away from it, like {outline area}"
  # A clue already touched by all its diagonals.
  clueEmptyHas:
    ring: cell
    terms: { c: number, both: flag, got: { clause: [hasPair, hasSquares, hasBoth] } }
    marks: { outline: [clue] }
    wordings:
      - when: "both"
        look: "{outline clue: this {c} clue} has {got}"
        move: "{ring} must slant away"
      - look: "{outline clue: this {c} clue} already has {got}"
        move: "{ring} must slant away from it"
  # A later square of a clue's firing.
  continuation:
    ring: cell
    terms: { away: flag }
    marks: { outline: [clue, area] }
    move: "{ring} must slant {if away: away | toward it} too"
    wordings:
      - when: "|outlineArea| = 0"
        again: "{outline clue: the same clue}"
      - again: "{outline clue: the same clue} and {outline area}"
  loop:
    ring: cell
    marks: { outline: [area] }
    look: "diagonals in {outline area} join two corners of {ring}"
    move: "it must slant the other way to avoid a loop"
  deadend:
    ring: cell
    marks: { outline: [area] }
    move: "it must slant the other way or seal a loop"
    wordings:
      - when: "|outlineArea| = 1"
        look: "{outline area} leaves two corners of {ring} one way out each"
      - look: "{outline area} leave two corners of {ring} one way out each"
  # A square whose same-slant partner `anchor` is placed, joined to it by
  # the outlined marks.
  equiv:
    ring: cell
    terms: { v: [a backslash, a forward slash] }
    marks: { outline: [marks, anchor] }
    move: "it must be {v} too"
    wordings:
      - when: "|outlineMarks| = 1"
        look: >-
          {outline marks: the outlined mark | the outlined marks} links {ring} to {outline anchor: the outlined square}
      - look: >-
          {outline marks: the outlined mark | the outlined marks} link {ring} to {outline anchor: the outlined square}
  # Two squares round a clue that must share its one remaining line: just
  # one of two side-by-side squares touches a point only when they slant
  # the same way.
  markClue:
    ring: alike
    terms: { c: number }
    marks: { outline: [clue] }
    look: "{outline clue: this {c}} needs one line, from just {ring: the ringed pair}"
    move: "they must slant the same way"
  markClueHas:
    ring: alike
    terms: { c: number, got: { clause: [hasPair, hasSquares, hasBoth] } }
    marks: { outline: [clue] }
    move: "they must slant the same way"
    wordings:
      - when: "c > 1"
        look: "{outline clue: this {c}} has {got} and needs one more from {ring: the ringed pair}"
      - look: "{outline clue: this {c}} has {got} and needs one from {ring: the ringed pair}"
  # A pair with both v-shapes ruled out, each for a reason of its own.
  markV:
    ring: alike
    terms:
      first: { clause: [vOne, vThree, vPlaced, vAcross] }
      second: { clause: [vOne, vThree, vPlaced, vAcross] }
    look: "{ring: the ringed pair} can't both {first}, or both {second}"
    move: "they must slant the same way"
  # Both ruled out by the same kind of clue, one at each end.
  markVBoth:
    ring: alike
    terms: { one: flag }
    marks: { outline: [caps] }
    look: >-
      {ring: the ringed pair} can't both {if one: touch {outline caps: either 1} | slant away from {outline caps: either 3}}
    move: "they must slant the same way"
  # Why a pair can't meet in a v at one end of its shared side (`where`):
  # touch a 1 there, slant away from a 3, touch the corner a placed square
  # slants away from, or do either across a 2.
  vOne:
    ring: cell
    terms: { where: [above, below, on the left, on the right] }
    marks: { outline: [clue] }
    move: "touch {outline clue: the 1 {where}}"
  vThree:
    ring: cell
    terms: { where: [above, below, on the left, on the right] }
    marks: { outline: [clue] }
    move: "slant away from {outline clue: the 3 {where}}"
  vPlaced:
    ring: cell
    terms: { where: [above, below, on the left, on the right] }
    marks: { outline: [placed] }
    move: "touch the corner {where}, as {outline placed: the outlined one} already slants away from it"
  # Across a 2: the pair across it gives it at least one line (`touch`: so
  # these two can't both touch it) or at most one, for the reason `why`
  # beyond it.
  vAcross:
    ring: cell
    terms:
      touch: flag
      where: [above, below, on the left, on the right]
      why: { clause: [beyondOne, beyondThree, beyondTouches, beyondMisses] }
    marks: { outline: [two] }
    move: >-
      {if touch: touch {outline two: the 2 {where}} | slant away from {outline two: the 2 {where}}}, as {why}
  # What holds the pair across a 2, along any line of 2s beyond it (`line`):
  # a 1 or a 3 capping it (`capped` where a clue does), or a diagonal of
  # the last pair already meeting or missing the last 2.
  beyondOne:
    ring: cell
    terms: { line: flag, capped: flag }
    marks: { outline: [twos, pairs, cap] }
    move: "{alongPair} can't both touch {if capped: {outline cap: the 1} | the 1}"
  beyondThree:
    ring: cell
    terms: { line: flag, capped: flag }
    marks: { outline: [twos, pairs, cap] }
    move: "{alongPair} can't both slant away from {if capped: {outline cap: the 3} | the 3}"
  beyondTouches:
    ring: cell
    terms: { line: flag }
    marks: { outline: [twos, pairs] }
    move: "{alongOne} already touches {if line: the last 2 | it}"
  beyondMisses:
    ring: cell
    terms: { line: flag }
    marks: { outline: [twos, pairs] }
    move: "{alongOne} already slants away from {if line: the last 2 | it}"
  # A pair on a line of 2s (`single` where there is one) capped at each end
  # by the same kind of limit (the help's "Lines of 2s"): a 1, or a
  # diagonal meeting the 2 at that end, for `one`; a 3, or a diagonal
  # missing it, otherwise. The caps that are clues are outlined.
  vLine:
    ring: alike
    terms: { one: flag, single: flag }
    marks: { outline: [twos, pairs, caps] }
    move: "{ring: the ringed pair} must slant the same way"
    wordings:
      - when: "|outlineCaps| = 2"
        look: >-
          {outline twos: this 2 | these 2s} and {outline pairs: {if single: its pair | their pairs}} lie between
          {outline caps: two {if one: 1s | 3s}}
      - when: "|outlineCaps| = 0"
        look: >-
          {outline twos: this 2 | these 2s} and {outline pairs: {if single: its pair | their pairs}} lie between
          two diagonals {if one: meeting | missing} {if single: it | the end 2s}
      - look: >-
          {outline twos: this 2 | these 2s} and {outline pairs: {if single: its pair | their pairs}} lie between
          {outline caps: a {if one: 1 | 3}} and a diagonal {if one: meeting | missing} {if single: it | the end 2}
  # Both v-shapes carried across one 2, from the pair across it (`pair`): a
  # diagonal of that pair already meets the 2 (`touches`, one line) or
  # misses it (at most one), and what lies beyond supplies the other bound.
  vAcrossBoth:
    ring: alike
    terms: { touches: flag, line: flag, cap: { clause: [capClue, capDiagonal] } }
    marks: { outline: [pair, two, twos, pairs] }
    look: >-
      {outline pair: the pair across} {outline two: this 2}
      {if touches: gives it one line and, with {far}, no more | gives it at most one line and, with {far}, at least one}
    move: "{ring: the ringed pair} must slant the same way"
  # The cap a line of 2s ends in: a 1 or a 3 (`d`, outlined where `capped`),
  # or a diagonal meeting or missing the end 2.
  capClue:
    ring: cell
    terms: { d: number, capped: flag }
    marks: { outline: [cap] }
    move: "{if capped: {outline cap: a {d}} | a {d}}"
  capDiagonal:
    ring: cell
    terms: { meets: flag }
    move: "a diagonal {if meets: meeting | missing} the end 2"
