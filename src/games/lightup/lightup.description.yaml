# yaml-language-server: $schema=../../describe/description.schema.json

game: lightup
catalog:
  name: Light Up
  aliases: [Akari]
  description: Light-bulb placing puzzle
  objective: Place bulbs to light up all the squares.
  collection: original
  family: objects
  similar: Akari
help:
  rules: |-
    Place light bulbs in the grid so as to light up all the blank
    squares. A light illuminates its own square and all the squares in
    the same row or column unless blocked by walls.
    Lights may not illuminate each other. Each numbered square must be
    orthogonally adjacent to exactly the given number of lights.
  controls: |-
    {{controls}}

    A click on a square holding the other button's mark empties it, so a cross never turns straight into a light, nor a light into a cross. A left drag places one light because a row of lights would light each other.

    A square a light shines on is washed yellow. A light turns red when another lights it, a number when its lights are too many or it has no room left for them, and a cross when nothing can light its square any more.

    A light that gives a numbered wall all its lights rules out the wall's other squares. {{rules-out}}
  hints: |-
    **Hint** explains the next step rather than simply making it. Each step either puts a bulb in a square or, when a square "can't hold a bulb", marks it with a cross. The hint reasons from the numbers and your own bulbs and crosses, so it carries on from wherever you are, as long as none of them is wrong; if one is, it asks you to fix the highlighted mistakes first. A *dark* square, in its words, is a blank square no bulb lights yet; a *free* one is a blank square with neither a bulb nor a cross.

    {{hint-marks}}

    A few ideas are worth learning by name:

    * **A clue that is full**, or a 0, rules out bulbs in its other free neighbors; **a clue with just enough room** needs a bulb in every free neighbor it has left.
    * **Only one way to light it.** A dark square that nothing else can light must get its light from the one square that still can, perhaps itself.
    * On harder boards: **a bulb that would spoil every option**. When some square has to be lit, or some clue has to get a bulb, from one of a few outlined squares, a square whose bulb would leave each of them lit or beside a full clue can't hold a bulb.

    On an Unreasonable board the hint may stop and say that nothing further follows by deduction.
produces: shading
sizes:
  # Unbounded but by the time a board takes to deal.
  w: { min: 2 }
  h: { min: 2 }
space:
  grid: { w: "w", h: "h" }
  units: []
answer:
  # 1 is a bulb, 2 a square without one, and 3 a wall.
  value:
    sort: cell
    domain: "{d in range(1, 3) where (d = 3 and not floor(c)) or (d < 3 and floor(c))}"
define:
  # Whether c is a square, not a wall.
  floor(c): "clue(wall, c) < 0 and clue(number, c) < 0"
  # The squares of line L that are not walls.
  floors(L): "{x in cells(L) where floor(x)}"
  # The squares a bulb in c lights: its own, and along its row and its
  # column up to a wall.
  lights(c): "stretch(row(c), c, floors(row(c))) + stretch(col(c), c, floors(col(c)))"
  # Whether a bulb lights c.
  lit(c): "exists p in lights(c): value(p) = 1"
  # The bulbs beside k.
  bulbs(k): "count(p in adj4(k) where value(p) = 1)"
  # The squares of S still free.
  open(S): "{p in S where not known(p)}"
  # Whether a bulb in d, lighting D, would leave s unable to hold one: d
  # lights s, or d gives a number beside s its last bulb.
  spoils(d, D, s): >-
    s != d and (s in D
    or (exists k in adj4(d) where clue(number, k) >= 0 and s in adj4(k):
    bulbs(k) + 1 = clue(number, k)))
  # The squares that could spoil s: those in its lines, and those beside a
  # number beside it.
  rivals(s): "lights(s) + set(p over k in adj4(s), p in adj4(k))"
shape:
  # Every square is lit.
  - "forall c in cells where floor(c): lit(c)"
  # No bulb lights another.
  - "forall c in cells where value(c) = 1: forall p in lights(c) where p != c: value(p) = 2"
clues:
  # A wall that shows no number.
  wall:
    at: cell
    value: "range(0, 0)"
    means: "value(at) = 3"
  # A numbered wall, with as many bulbs beside it.
  number:
    at: cell
    value: "range(0, 4)"
    means: "value(at) = 3 and bulbs(at) = v"
freedom: { kind: fill }
play:
  values:
    1: { does: place a light, key: L, glyph: " L ", paint: bulb }
    2: { does: "place a cross, marking a square you think holds no light", key: [X, I], glyph: " x ", paint: cross }
  given:
    3: { glyph: "###", paint: wall }
  primary: 1
  secondary: 2
  # The answer is the bulbs alone: an open square holds none.
  blank: 2
  # A right drag crosses out the squares it passes; a left drag places one
  # bulb, where it began, since a row of bulbs light each other.
  sweepWith: secondary
  # A number counts the bulbs beside it, and the player need not cross the
  # squares round it that hold none, so it is never done.
  plain: [number]
  # A square a bulb lights is washed, and holds none: a bulb there would
  # light another.
  wash:
    when: "lit(c)"
    pref: { kw: show-lit-blobs, name: Draw non-light marks even when lit }
  # Upstream's 14x14, made an upright board of about its area; the small
  # square board's walls turned a quarter round, as upstream's.
  boards: [7x7s4, 10x10, 12x16]
  # A 2x2 has only Easy boards, and a board needs nine squares to have an
  # Unreasonable one; the symmetries' own are with their choices.
  bounds:
    tiers:
      Normal: { area: { min: 5 } }
      Unreasonable: { area: { min: 9 } }
  hintMarks:
    ring: >-
      each square the step decides: it takes a bulb, or, when the sentence
      says it "can't hold a bulb", a cross.
    outline: >-
      what the step reasons from: the clue or the dark square it is about,
      outlined apart in the color of the words that name it, and the other
      squares the reason rests on, such as a clue's bulbs.
deal:
  answer: walls at random, as symmetric as asked, and bulbs laid until every square is lit
  wall: on each wall that shows no number
  number: on each wall, then as many hidden as the board stays at its tier, each leaving its wall
  tier: one of the tiers
  options:
    walls:
      letter: b
      kw: percentage-of-black-squares
      name: "%age of walls"
      min: 5
      max: 100
      default: 20
      words: "{n}% walls"
      doc: >-
        Roughly what share of the grid is walls, from 5 to 100. If no good
        puzzle turns up with that many, the generator adds more, 5% at a time,
        up to 90%, and then starts again.
    symmetry:
      letter: s
      kw: symmetry
      name: Symmetry
      default: 2
      doc: >-
        How the walls are arranged: <em>None</em>, <em>2-way mirror</em> (the
        bottom half reflects the top), <em>2-way rotational</em> (the same
        after a half turn), <em>4-way mirror</em> (reflected both left to right
        and top to bottom) or <em>4-way rotational</em> (the same after a
        quarter turn). Only the walls follow the symmetry; the numbers in them
        need not.
      # A 3x3 has no Unreasonable board with symmetry, and none of Normal
      # with 4-way symmetry, as a 2x3 has none mirrored both ways; the other
      # boards of nine squares and more are longer. A 4x4 has no Unreasonable
      # board mirrored both ways (none in 400,000 searched, 2026-11-02) and
      # 3x4 and 3x5 have, so no bound refuses it: its deal gives up.
      choices:
        - { name: None, words: no symmetry }
        - name: 2-way mirror
          bounds: { tiers: { Unreasonable: { longer: { min: 4 } } } }
        - name: 2-way rotational
          bounds: { tiers: { Unreasonable: { longer: { min: 4 } } } }
        - name: 4-way mirror
          bounds:
            longer: { min: 3 }
            tiers:
              Normal: { longer: { min: 4 } }
              Unreasonable: { longer: { min: 4 } }
        - name: 4-way rotational
          bounds:
            square: true
            longer: { min: 3 }
            tiers:
              Normal: { longer: { min: 4 } }
              Unreasonable: { longer: { min: 4 } }
  # The walls first, at the share and the symmetry the params give (upstream's
  # set_blacks), then a bulb on a random open square and what the ladder
  # decides from it, until every square is decided.
  sample:
    # Twenty layouts refused raise the share of walls five points, to ninety:
    # a 12x16 at a fifth walls finishes at Easy once in some five hundred
    # draws, and a 3x3 at Normal not at all.
    first:
      value: 3
      share: walls
      symmetry: symmetry
      ramp: { every: 20, step: 5, top: 90 }
    build: { value: 1 }
  hide: number
  # An Unreasonable board is stripped from every number, as the hand-written
  # generator stripped every one. Hidden first at the lowest tier that
  # finishes it, thirty deals each of the 12x16 and the 10x10 took 7.8 s of
  # CPU time, against 4.8 s from every number and 5.1 s hand-written
  # (2026-11-23).
  stripFrom: everyClue
# Upstream's game ID: a digit a numbered wall, `B` a wall with none, and a
# letter a run of squares.
id:
  - digits: number
    letters: { B: wall }
tierLetters: "012"
# Upstream's IDs from before the tiers ask for the recursive solver with a
# bare `r`.
tierFlag: { letter: r, tier: Unreasonable }
tiers: [Easy, Normal, Unreasonable]
# What a bulb rules out at a glance: the other squares round a numbered wall
# it gives all its lights.
rulesOut:
  name: Cross out the other squares round a numbered wall once it has all its lights
  placing: 1
  techniques: [clueFull]
kindWords:
  # A number counts the bulbs on the squares beside it, a wall beside it
  # holding none. A step reads the squares beside it whether or not it
  # outlines them.
  group: "X in cols, c in cells(X) where clue(number, c) >= 0"
  set: "{p in adj4(c) where floor(p)}"
  need: "clue(number, c) - bulbs(c)"
  rest: 2
  fill: 1
  zero: "clue(number, c) = 0"
  mark: strand
  marks: { strand: "{c}", outline: "{p in adj4(c) where value(p) = 1}", reads: "adj4(c)" }
  unit: "this {clue}"
  has: "{outline: its bulb | its {clue} bulbs}"
  items: "{n: bulb | bulbs}"
  slots: "free {n: neighbor | neighbors}"
  restWord: "can't hold a bulb"
  fillWord: "must hold a bulb"
  terms: { clue: "clue(number, c)", placed: "bulbs(c) > 0" }
names:
  clueFull: "a number with all its bulbs"
  clueExact: "a number needing every free square"
  square: "the only way to light a square"
  darkSet: "a bulb leaving a square unlit"
  clueSet: "a bulb that would starve a number"
techniques:
  # A bulb lights its row and its column up to a wall, so no other bulb
  # stands there.
  - kind: peer.placed
    as: shine
    tier: Easy
    with:
      group: "c in cells where value(c) = 1"
      peer: "p in lights(c) where p != c and not known(p)"
      move: "place(p, 2)"
  # A number with all its bulbs has none in its other free neighbors, and
  # one needing as many as it has free neighbors has one in each. Read
  # before the dark squares: the generator keeps only the numbers a reading
  # fired on, and read after, they fire on too few to deal a 3x3 turned half
  # round at Normal.
  - kind: count.met
    as: clueFull
    tier: Easy
  - kind: count.exact
    as: clueExact
    tier: Easy
  # A dark square with one free square left that could light it, perhaps
  # itself, takes a bulb there. Read a column at a time, as upstream's scan
  # is. The strand is the square or the number a step is about, drawn apart
  # from the squares it reasons from.
  - kind: one.cell
    as: square
    tier: Easy
    with:
      group: "X in cols, c in cells(X)"
      square: "floor(c) and not lit(c)"
      options: "open(lights(c))"
      move: "place(first(U), 1)"
    says:
      terms: { dark: c }
      marks: { strand: "{c}", outline: "lights(c)" }
      move: "it must hold a bulb"
      # The one square left is the dark square itself or another. The
      # outline holds the squares that could light it less that one and
      # the dark square, so a corridor of just those shows no second mark,
      # and then the bare deictic is right.
      wordings:
        - when: "not known(c) and |lights(c)| > 1"
          look: "{outline: each outlined square} is ruled out or already lit"
          follows: "nothing else can light {ring: this dark square | these dark squares}"
        - when: "not known(c)"
          look: "every other square that could light {ring: this dark square | these dark squares} is ruled out or already lit"
        - when: "|lights(c)| > 2"
          look: "{outline: the other outlined square | the other outlined squares} can't light {strand: the outlined dark square}"
          follows: "only {ring} can"
        - look: "only {ring} can still light {strand: the outlined dark square}"
  # A dark square is lit from one of the free squares that see it, so a
  # square whose bulb would spoil every one of them holds none.
  - id: darkSet
    tier: Normal
    for: >-
      X in cols, u in cells(X) where floor(u), L = lights(u)
      where not (exists p in L: value(p) = 1),
      S = {s in L where not known(s)}
    conclude: >-
      |S| > 0
      and (forall d in rivals(first(S)) where floor(d) and not known(d),
      D = lights(d) where (forall s in S: spoils(d, D, s)):
      place(d, 2))
    says:
      shown: each
      marks: { outline: S, strand: "{u}" }
      # The squares a bulb on the ringed one blocks are the outlined ones;
      # "rule out" is lit, or beside a full clue, which the outlines let the
      # player check square by square.
      look: "a bulb on {ring} blocks {outline: every outlined square} that can light {strand: the outlined dark square}"
      move: "it can't hold a bulb"
  # A number short of m bulbs among f free squares has one in every f - m + 1
  # of them, so a square whose bulb would spoil all of some such set holds
  # none.
  - id: clueSet
    tier: Normal
    for: >-
      X in cols, k in cells(X), n = clue(number, k) where n > bulbs(k),
      F = {p in adj4(k) where floor(p) and not known(p)},
      m = n - bulbs(k) where m <= |F|, T in subsets(F) where |T| = |F| - m + 1
    conclude: >-
      forall d in rivals(first(T)) where floor(d) and not known(d),
      D = lights(d) where (forall s in T: spoils(d, D, s)):
      place(d, 2)
    says:
      shown: each
      marks: { outline: T, strand: "{k}" }
      look: "a bulb on {ring} blocks {outline: every outlined square} left for {strand: the outlined clue}'s bulb"
      move: "it can't hold a bulb"
