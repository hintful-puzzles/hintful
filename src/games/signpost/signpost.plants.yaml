# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # An unnumbered square's links read as fitting after a number only with
  # room to spare.
  onlyNext:
    for: >-
      c in cells where not known(c) and 1 not in cand(c), U = {d in cand(c)
      where may(c, compass(c, clue(arrow, c), d - 1)) and (num(c) = none or
      num(compass(c, clue(arrow, c), d - 1)) != none or |chain(compass(c,
      clue(arrow, c), d - 1))| < roomAfter(c))} where |U| < 2
  # An arrow from a numbered square read as unable to lead in.
  onlyBefore:
    for: >-
      j in cells where clue(number, j) != 1 and not entered(j), P = {p in
      aims(j) where not known(p) and 1 not in cand(p) and may(p, j) and
      clue(number, p) = none} where |P| < 2
