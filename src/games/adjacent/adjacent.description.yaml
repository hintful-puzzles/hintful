# yaml-language-server: $schema=../../describe/description.schema.json

game: adjacent
catalog:
  name: Adjacent
  description: Consecutive-number Latin square puzzle
  objective: Complete the latin square so that a bar joins exactly the neighbors one apart.
  collection: original
  family: latin
help:
  rules: |-
    Fill in the grid with numbers from 1 to the grid size, so that every
    number appears exactly once in each row and column. A bar between two
    squares means their numbers differ by exactly one. Every such bar is
    shown, so two squares without one never differ by one.
  controls: |-
    To place a number, click in a square to select it, then type the
    number on the keyboard. To erase a number, click to select a square
    and then press Backspace.

    Right-click in a square and then type a number to add or remove the
    number as a pencil mark, indicating numbers that you think
    *might* go in that square.

    {{done-clues}}

    {{sticky-pencil}}

    You can also use the arrow keys to move the selected square around.
    Press Enter to toggle between entering numbers and entering pencil
    marks, and Backspace or Space to clear a square. Shift or Ctrl with an
    arrow key marks the bar between the selected square and its neighbor
    that way as done.

    {{mark-all}} Once every empty square has marks, the press crosses out
    of each the numbers already placed in its row and column.
  hints: |-
    **Hint** explains the next step rather than simply making it. It works
    from your own numbers and pencil marks, so it carries on from wherever
    you are; if a number you've placed is wrong, or a cell's pencil marks
    have crossed out its answer, it asks you to fix the highlighted
    mistakes first. It pencils in only as it needs to: a cell with no marks
    counts as holding every number its row and column don't already hold,
    and the hint writes a cell's marks only when its next step crosses one
    out or reasons from them. If you would rather it filled in every cell's
    marks first (the same as pressing **Fill marks**), set **Hints pencil in** to
    **Every candidate first** in the preferences.

    {{hint-marks}}

    The hint reasons from the bars and from their absence. A number is
    *open* in a cell while it is still possible there: in the cell's pencil
    marks, or, in a cell with no marks, not yet ruled out by its row and
    column. So "a neighbor with nothing open one away from 6" means no
    number that could still go in the neighbor is 5 or 7, and a bar there
    rules 6 out.

    {{wing:cell}}

    If you've turned on the preference that removes a number from pencil
    marks in its row and column when you place it, the hint leaves that
    tidying to the placement rather than spelling it out as a step of its
    own. On an Unreasonable board, deduction can run out before the grid is
    full; the hint says so rather than guessing.

produces: latin
words:
  cell: cell
sizes:
  # The most a note mask holds (engine/board/candidate-bits.ts).
  w: { min: 3, max: 31 }
space:
  grid: { w: "w", h: "w" }
  edges: true
  units: [rows, cols]
answer:
  value: { sort: cell, domain: "range(1, w)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, w)" }
define:
  fits(e, a, b): "(clue(bar, e) = 1) = (abs(a - b) = 1)"
shape:
  - "latin(value, lines)"
clues:
  # 1 is a bar, 0 none.
  bar:
    at: edge
    value: "range(0, 1)"
    complete: true
    means: "(v = 1) = (abs(value(end1(at)) - value(end2(at))) = 1)"
freedom: { kind: fill }
play:
  numbers: {}
  gaps: { bar: bar }
  done: { bar: bar }
  hintNotes: implicit
  # A small board at the lower tiers and a large one at the upper. Every
  # board deals in a fraction of a second: 6x6 is left to the Custom dialog
  # only to keep the menu short. The default is upstream's, 5x5 at Normal.
  boards: [5x5, 7x7]
  defaultTier: Normal
  boardTiers:
    5x5: [Easy, Hard]
    7x7: [Tricky, Unreasonable]
  # Below 5, a board has no tier above Normal.
  bounds:
    tiers:
      Tricky: { longer: { min: 5 } }
      Hard: { longer: { min: 5 } }
      Unreasonable: { longer: { min: 5 } }
  hintMarks:
    ring: the cell the step fills in with a number.
    strike: the pencil marks the step crosses out.
    outline: >-
      what the step reasons from: the two cells either side of a bar, or of
      no bar at all (the one whose marks are struck, and "its neighbor"), the
      cells that already account for the numbers being crossed out, the
      number just placed, or "the middle cell" a step weighs and the cells it
      reads.
    stripes: >-
      the row or column the sentence names: "in this row". Or the several it
      names together, such as "these 2 columns", where one number fits only
      the outlined cells.
deal:
  answer: a Latin square
  given: every cell's number, then each hidden while the board still finishes
  bar: every edge's, a bar exactly where its two numbers differ by one
  tier: one of the tiers
  sample: { latin: true }
  hide: given
# A record a cell, upstream's: its given number or 0, then the letters URDL
# of its bars, each written from both its cells, and a comma.
id:
  - { records: given, sides: bar }
# Upstream deals Adjacent as a mode of Unequal, writing an `a` after the size,
# so its game IDs still open.
unusedLetters: { a: size }
tierLetters: tekxr
tiers: [Easy, Normal, Tricky, Hard, Unreasonable]
names:
  dup: "a placed number's row and column"
  single: "the only number left in a cell"
  regionsFull: "every other number already placed"
  hiddenSingle: "the only cell left for a number"
  set: "numbers already accounted for"
  wing: "a wing"
  adjacent: "the bars beside a placed number"
  adjacentSet: "the bars beside open cells"
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  - { use: latin.hiddenSingle, tier: Easy, rung: hiddenSingle }
  - { use: latin.single, tier: Easy, rung: single }
  # A placed number leaves its neighbor across an edge only the numbers the
  # edge's clue allows: column by column, each placed cell's neighbors up,
  # right, down, left.
  - kind: rel.support
    as: adjacent
    tier: Normal
    with:
      group: "L in cols, a in cells(L) where known(a), b in adj4(a), e = edge(a, b)"
      end: b
      partner: a
      rel: "fits(e, u, d)"
      marks: {}
    # The hint names the placed neighbor, its number, and whether a bar joins
    # them.
    says:
      terms: { a: a, v: "value(a)", bar: "clue(bar, e)", pair: "{b, a}" }
      marks: {}
      wordings:
        - when: "bar = 1"
          look: "{outline pair: a bar} joins {ring} to {outline a: the {v} beside it}: they differ by 1"
        - look: "{outline pair: no bar} joins {ring} to {outline a: the {v} beside it}: they can't differ by 1"
  # A number is struck across an edge when none of the other end's candidates
  # fits it, in the same order over every cell.
  - kind: rel.support
    as: adjacentSet
    tier: Tricky
    with:
      group: "L in cols, a in cells(L), b in adj4(a), e = edge(a, b)"
      end: b
      partner: a
      rel: "u != d and fits(e, u, d)"
      # The neighbor is in the same row or column, so it never holds d.
      terms: { bar: "clue(bar, e) = 1", pair: "{b, a}" }
      marks: {}
      link: "{outline pair: {if bar: a bar | no bar}}"
      cell: "{ring}"
      none: nothing open
      fits: "{if bar: one away from | two or more from}"
  - { use: latin.set, tier: Tricky, rung: set }
  - { use: latin.fish, tier: Hard, rung: set }
  - { use: latin.wing, tier: Hard, rung: wing }
