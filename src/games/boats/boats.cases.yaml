    opens: "7x9f4dh,4,3,2,1"
    writesBack: true
  # The columns' numbers come before the rows', and a hidden number is none:
  # the second column's is hidden. A given square is its shape.
  - id: "6x6f3deS,3,2,1:2,2,1,1,0,4,1,-,3,1,-,1,WaWWgTLqWaW"
    opens: "6x6f3deS,3,2,1"
    writesBack: true
    holds:
      dealt.n.at.0: 0
      dealt.n.at.1: 2
      dealt.n.v.0: 1
      dealt.n.v.1: 3
      dealt.seg.at.0: 0
      dealt.seg.at.1: 2
      dealt.seg.v.0: 2
      dealt.seg.v.1: 2
  - id: "10x10f4dtS,4,3,2,1:1,1,5,-,2,4,2,2,-,1,1,1,3,1,0,5,0,5,1,3,bWeWpTcRyCvW"
