    opens: "10x10f4dhS,4,3,2,1"
    writesBack: true
  # A desc that is not one: the given squares' run may end the desc or not,
  # and nothing else may follow.
  - {id: "3x3f1de,1:0,1,0,0,1,0,", opens: "3x3f1de,1"}
  - {id: "3x3f1de,1:0,1,0,0,1,0,dS", opens: "3x3f1de,1"}
  - {id: "3x3f1de,1:0,1,0,0,1,0,dX", refused: "/\\.$/"}
  - {id: "3x3f1de,1:0,1,0,0,1,0,dSz", refused: "/\\.$/"}
  - {id: "3x3f1de,1:0,1,0,0,1,4,", refused: DESC_OUT_OF_RANGE}
  - {id: "3x3f1de,1:0,1,0,0,1,0", refused: "/\\.$/"}

params:
  # Upstream's params, the fleet at the end.
  - {read: "7x9f4dh,4,3,2,1", full: "7x9f4dh,4,3,2,1"}
  - {read: "6x6f3deS,3,2,1", full: "6x6f3deS,3,2,1"}
  - {read: "5x5f2dt,0,2", full: "5x5f2dt,0,2"}
  # Without a fleet size, upstream's four; the tier and the flag are the
  # full ID's alone.
  - {read: "8x8", full: "8x8f4de,4,3,2,1"}
  - {read: "8x8f3dtS,1,1,1", brief: "8x8f3,1,1,1"}
  # A fleet the board cannot take, with upstream's words.
  - {read: "4x4f5de", refused: "Fleet size must be smaller than the width and height."}
  - {read: "4x4f3de,0,0,0", refused: "The fleet must contain at least 1 piece."}
  - {read: "4x4f3de,9,9,9", refused: "The fleet does not fit into the grid."}
  - {read: "3x3f1dn,1", refused: "/Normal/"}
  - {read: "3x3f1de,1", refused: false}

