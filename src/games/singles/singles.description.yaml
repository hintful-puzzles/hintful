# yaml-language-server: $schema=../../describe/description.schema.json

game: singles
help:
  rules: |-
    Cover some of the squares with a {{pair:0}} square, in such a way that:

    - no number appears twice in any row or column among the squares left
      clear
    - no two {{pair:0}} squares are adjacent
    - the clear squares form a single connected group (connections
      along diagonals do not count).
  controls: |-
    {{controls}}

    The cursor wraps: an arrow key pressed at an edge of the grid carries it
    to the opposite edge.

    Either button, or either key, clears a square that is already covered
    or circled.

    A covered square hides its number. Clicking outside the grid shows
    the numbers on the {{pair:0}} squares, and clicking there again hides
    them; it is the same setting as the **Show numbers on {{pair:0}}
    squares** preference.
  hints: |-
    **Hint** explains the next step rather than simply making it. It reasons
    only from the numbers and your own {{pair:0}} squares and circles, so it
    carries on from wherever you are, as long as none of those is wrong; if
    one is, it asks you to fix the highlighted mistakes first.

    In its words, a *{{pair:0}}* square is one you have covered, and a
    *clear* square is one that stays uncovered. When a step says a square
    must be clear, record that with a circle (right-click); when it must be
    {{pair:0}}, click it.

    {{hint-marks}}

    A few patterns are worth learning by name:

    * **A sandwich.** Two equal numbers with one square between them: one of
      the two must be {{pair:0}}, so the square between them must be clear.
    * **A touching pair.** Two equal numbers side by side: one of them stays
      clear, so every other copy of that number in their row or column must
      be {{pair:0}}.
    * **Pairs in neighboring lines.** A pair of equal numbers in one row and
      another pair in the next, lined up so that covering either of two
      squares would force two {{pair:0}} squares side by side. Both must be
      clear.
    * **Corners.** Where matching numbers crowd a corner of the grid, some
      ways of covering them would leave the corner square with no clear
      neighbor, so those are ruled out.
    * **Keeping the clear squares joined.** A square that would cut the
      clear squares in two if {{pair:0}}, or seal a clear square off, must
      be clear.
name: Singles
family: shading
sizes:
  # A number is one character of the desc alphabet.
  w: { min: 2, max: 61 }
  h: { min: 2, max: 61 }
space:
  grid: { w: "w", h: "h" }
  # Rows and columns are lines, but a number repeats in them.
  units: []
answer:
  # 1 is a covered square, 2 a clear one.
  value: { sort: cell, domain: "range(1, 2)" }
define:
  # The squares not covered, among which the clear squares are joined.
  uncovered: "{c in cells where value(c) != 1}"
shape:
  # No two covered squares touch.
  - "forall c in cells where value(c) = 1: forall p in adj4(c): value(p) = 2"
  # The clear squares are one group.
  - "connected({c in cells where value(c) = 2})"
clues:
  # The number on each square, which no other clear square of its row or
  # column shows where it is clear.
  number:
    at: cell
    value: "range(1, max(L in {row(at), col(at)} of |cells(L)|))"
    complete: true
    means: >-
      value(at) = 1
      or (forall L in {row(at), col(at)}, p in cells(L) where p != at and clue(number, p) = v:
      value(p) = 1)
freedom: { kind: fill }
deal:
  answer: a Latin square's numbers, and squares covered at random while the clear squares stay joined
  number: a repeated number on each covered square
  tier: one of the tiers
tiers: [Easy, Normal]
techniques:
  # A covered square's neighbors are clear.
  - id: besideCovered
    tier: Easy
    for: "c in cells where value(c) = 1"
    conclude: "forall p in adj4(c): place(p, 2)"
    # The squares it decides are named by their numbers, though the numbers
    # play no part, so the player finds them without hunting the rings.
    says:
      marks: { outline: "{c}" }
      look: "{outline: a {shaded} square (outlined)} touches {ring: this {each} | these {nouns} ({each})}"
      move: "{ring: that {each} | those {nouns}} must be {unshaded}"
  # A clear square's number is covered everywhere else in its row and column.
  - id: sameLine
    tier: Easy
    for: "c in cells where value(c) = 2, n = clue(number, c)"
    conclude: >-
      forall L in {row(c), col(c)}, p in cells(L) where p != c and clue(number, p) = n:
      place(p, 1)
    says:
      terms: { n: n }
      marks:
        outline: "{c}"
        # The line holding every square it covers, where one does: the row,
        # unless a copy in the column is still open too.
        stripes: >-
          {p in cells(row(c)) + cells(col(c)) where
          (p in cells(row(c)) and count(q in cells(col(c)) where q != c and clue(number, q) = n and not known(q)) = 0)
          or (p in cells(col(c)) and count(q in cells(row(c)) where q != c and clue(number, q) = n and not known(q)) = 0)}
      wordings:
        - when: "|stripes| > 0"
          look: "{outline: the outlined {unshaded} {n}} already holds {stripes}'s {n}"
          move: "{ring: the ringed {n} | the ringed {n}s} must be {shaded}"
        - look: "{outline: the outlined {unshaded} {n}} shares a line with {ring: the ringed {n} | each ringed {n}}"
          move: "{ring: that {n} | those {n}s} must be {shaded}"
  # Two equal numbers with one square between them: covering that square
  # would leave both clear, so it is clear.
  - id: sandwich
    tier: Easy
    for: >-
      L in lines, c in cells(L), e = nth(cells(L), index(c, cells(L)) + 2)
      where e != none and clue(number, e) = clue(number, c)
    conclude: "place(nth(cells(L), index(c, cells(L)) + 1), 2)"
    says:
      terms: { n: "clue(number, c)" }
      marks: { outline: "{c, e}" }
      look: "{outline: the outlined {n} | the outlined {n}s} sit one square apart"
      follows: "one of them must be {shaded}"
      move: "{ring: the {each} between them | the {nouns} between them} must be {unshaded}"
  # Two equal numbers side by side cannot both be covered, so every other
  # copy of their number in the line is.
  - id: pair
    tier: Easy
    for: >-
      L in lines, c in cells(L), q = nth(cells(L), index(c, cells(L)) + 1)
      where q != none and clue(number, q) = clue(number, c)
    conclude: >-
      forall p in cells(L) where p != c and p != q and clue(number, p) = clue(number, c):
      place(p, 1)
    says:
      terms: { n: "clue(number, c)" }
      marks: { outline: "{c, q}", stripes: "cells(L)" }
      look: "{outline: the outlined {n} | the outlined {n}s} touch"
      follows: "one of them stays {unshaded} and uses up the {n} in {stripes}"
      move: "{ring: the ringed {n} | the ringed {n}s} must be {shaded}"
  # Matching numbers in a corner's two by two, upstream's chain: where the
  # corner square or the one across from it matches both squares beside the
  # corner, it is covered, since clear it would leave both beside it
  # covered and the corner sealed off; failing that, a matching pair beside
  # one of the squares beside the corner leaves the other clear.
  - id: corner
    tier: Easy
    for: >-
      c in cells where |adj4(c)| = 2, s = first(adj4(c)), t = nth(adj4(c), 1),
      i = the(p in adj4(s) where p != c and p in adj4(t)),
      n = clue(number, c), ns = clue(number, s), nt = clue(number, t), ni = clue(number, i)
    conclude: >-
      (ns != n or nt != n or place(c, 1))
      and (ns != nt or ni != nt or place(i, 1))
      and ((ns = n and nt = n) or (ns = nt and ni = nt)
      or ((ns != n and ns != ni) or place(t, 2))
      and (ns = n or ns = ni or (nt != n and nt != ni) or place(s, 2)))
    says:
      arms:
        # All four match: the corner and the square across from it are covered.
        four:
          when: "ns = n and nt = n and ni = nt"
          terms: { n: n, corner: c, sides: "{s, t}", inner: i }
          marks: { outline: "{c, s, t, i}" }
          # Either end of the diagonal may be shaded already, and is then
          # outlined, not ringed.
          look: "Left {unshaded}, {ring corner: this corner {n}} would box itself in with {outline sides: its two {n}s} {shaded}"
          wordings:
            - when: "not known(c) and not known(i)"
              move: "it and {ring inner: the {n} diagonally inside} must be {shaded}"
            - when: "not known(c)"
              move: "it must be {shaded}, like {outline inner: the outlined {n} diagonally inside}"
            - look: "Left {unshaded}, {outline corner: the outlined corner {n}} would box itself in with {outline sides: its two {n}s} {shaded}"
              move: "{ring inner: the {n} diagonally inside} must be {shaded}"
        # The corner matches both squares beside it, and is covered itself.
        apex:
          when: "ns = n and nt = n"
          terms: { corner: n, beside: ns }
          marks: { outline: "{c, s, t}" }
          # "The corner" by name, so it never reads as the matching number.
          look: "Left {unshaded}, {ring: this corner {corner}} would box itself in with {outline: both {beside}s beside it} {shaded}"
          move: "it must be {shaded}"
        # The square across matches both beside it, and is covered; the corner
        # it saves is drawn apart.
        across:
          when: "ns = nt and ni = nt"
          terms: { inner: ni, beside: ns, corner: n }
          marks: { outline: "{s, t, i}", strand: "{c}" }
          look: "Left {unshaded}, {ring: this inner {inner}} would make {outline: both {beside}s} flanking {strand: corner {corner}} {shaded} and box the corner in"
          move: "it must be {shaded}"
        # One of the squares beside the corner is shaded, and the pair beside
        # the other would box the corner in: the pair is the corner and the
        # other square where they match, else that square and the one across.
        pairAtS:
          when: "ns = n or ns = ni"
          terms:
            side: s
            number: ns
            pair: "{x in {c, s, i} where x = s or (ns = n and x = c) or (ns != n and x = i)}"
          marks:
            outline: "{x in {c, s, i} where x = s or (ns = n and x = c) or (ns != n and x = i)}"
            strand: "{c}"
          # The pattern first, then the move ruled out and what it would force.
          look: &pairLook "{outline pair: the corner's {number}s} need a {shaded}; shading {ring: this {each}} forces {outline side: the side {number}}, boxing {strand: the corner} in"
          move: &pairMove "it must stay {unshaded}"
        pairAtT:
          when: "ns != n and ns != ni"
          terms:
            side: t
            number: nt
            pair: "{x in {c, t, i} where x = t or (nt = n and x = c) or (nt != n and x = i)}"
          marks:
            outline: "{x in {c, t, i} where x = t or (nt = n and x = c) or (nt != n and x = i)}"
            strand: "{c}"
          look: *pairLook
          move: *pairMove
  # A square with one neighbor not covered has that neighbor clear: covered
  # or clear, it needs one.
  - id: boxedIn
    tier: Easy
    for: "c in cells where value(c) != 1, F = {p in adj4(c) where value(p) != 1}"
    conclude: "|F| > 0 and (|F| > 1 or place(first(F), 2))"
    says:
      terms: { number: "clue(number, first(F))" }
      marks: { outline: "{c}" }
      look: "{ring: this {number}} is {outline: the outlined {unshaded} square}'s last neighbor that isn't {shaded}"
      move: "it must be {unshaded} to keep that square joined"
  # Two pairs of equal numbers in neighboring lines, one pair level with the
  # other at one end and a square off it at the other: covering either
  # square of the two by two they make there sets off a chain of covered
  # and clear squares that ends in two covered squares side by side.
  - id: offset
    tier: Normal
    for: >-
      a in cells, n = clue(number, a), b in adj8(a) where b not in adj4(a),
      m = clue(number, b), L in {col(a), row(a)},
      a1 in cells(L) where a1 != a and a1 not in adj4(b) and clue(number, a1) = n,
      b1 = the(p in adj4(a1) where p not in cells(L) and (x(p) = x(b) or y(p) = y(b)))
      where clue(number, b1) = m
    conclude: "forall p in adj4(a) where p in adj4(b): place(p, 2)"
    # The pattern by its numbers, then what follows. The pairs can sit
    # anywhere along their lines, so the words never say "overlap" or
    # "between them": the outlines show where. `p` and `q` are the numbers of
    # the two squares it decides.
    says:
      terms:
        first: n
        second: m
        p: "clue(number, first({x in adj4(a) where x in adj4(b)}))"
        q: "clue(number, nth({x in adj4(a) where x in adj4(b)}, 1))"
      marks: { outline: "{a1, b1, a, b}" }
      look: "{outline: the outlined {first}s and {second}s} mean shading {ring: the ringed {each} | either ringed {noun}} makes two {shaded} squares touch"
      move: "{ring: that {each} | the {each}} must be {unshaded}"
      wordings:
        - when: "first = second and p = q"
          look: "{outline: the outlined {first}s} mean shading {ring: the ringed {each} | either ringed {noun}} makes two {shaded} squares touch"
          move: "{ring: that {each} | both {p}s} must be {unshaded}"
        - when: "first = second"
          look: "{outline: the outlined {first}s} mean shading {ring: the ringed {each} | either ringed {noun}} makes two {shaded} squares touch"
        - when: "p = q"
          move: "{ring: that {each} | both {p}s} must be {unshaded}"
  # A square without which the squares not covered would not be one group
  # is clear: covered, it would leave a group of them with no clear square
  # to join the rest by.
  - id: split
    tier: Normal
    for: "K = cuts(uncovered), c in K where not known(c)"
    conclude: "place(c, 2)"
    says:
      terms: { number: "clue(number, c)" }
      marks: { outline: "{q in adj4(c) where value(q) != 1}" }
      look: "Shading {ring: this {number}} would cut some of {outline} off from the rest of the {unshaded} region"
      move: "it must be {unshaded}"
