# Singles' cases, which the engine's tests read
# (src/engine/testing/game-cases.ts): a position for every rung its hint
# takes, upstream's IDs read and written back, the text, the number a
# shaded square hides, and the cursor that wraps.

values:
  shaded: 1
  clear: 2

hint:
  params:
    - {w: 6, h: 6, diff: 1}
    - {w: 5, h: 5, diff: 0}
  # The hand-written port's positions, its moves as the board's edits.
  pins:
    sandwich: "6x6dk:146214162623436526534361613462465334"
    sameLine:
      id: "6x6dk:146214162623436526534361613462465334"
      moves:
        - {set: [8, clear]}
    besideCovered:
      id: "6x6dk:146214162623436526534361613462465334"
      moves:
        - {set: [8, clear]}
        - {set: [10, shaded]}
    pair:
      id: "6x6dk:445642432165334561225311213556453244"
      moves:
        - {set: [21, clear]}
    "corner.four":
      id: "6x6dk:663255261455611642532264154346416613"
      moves:
        - {set: [6, clear]}
        - {set: [27, clear]}
        - {set: [22, clear]}
    "corner.apex":
      id: "5x5de:1154415435251455411244252"
      moves:
        - {set: [23, clear]}
        - {set: [8, clear]}
    "corner.across":
      id: "6x6dk:455613345534323165563453556344231546"
      moves:
        - {set: [13, clear]}
        - {set: [31, clear]}
    "corner.pairAtS":
      id: "6x6dk:455613345534323165563453556344231546"
      moves:
        - {set: [13, clear]}
    "corner.pairAtT":
      id: "6x6dk:125136446533344162432351161354613145"
      moves:
        - {set: [12, clear]}
        - {set: [25, clear]}
        - {set: [20, clear]}
        - {set: [32, clear]}
        - {set: [9, clear]}
    boxedIn:
      id: "6x6dk:146214162623436526534361613462465334"
      moves:
        - {set: [8, clear]}
        - {set: [10, shaded]}
        - {set: [9, clear, 11, clear, 4, clear, 16, clear]}
        - {set: [0, shaded]}
        - {set: [1, clear, 6, clear]}
        - {set: [5, shaded]}
        - {set: [7, shaded]}
        - {set: [13, clear]}
        - {set: [19, shaded]}
        - {set: [18, clear, 20, clear, 25, clear]}
        - {set: [27, clear]}
        - {set: [34, clear]}
        - {set: [33, shaded]}
        - {set: [32, clear]}
        - {set: [29, clear]}
    split:
      id: "6x6dk:231635324553435412511344463361362544"
      moves:
        - {set: [18, clear]}
        - {set: [7, clear]}
        - {set: [28, clear]}
        - {set: [25, shaded]}
        - {set: [24, clear, 26, clear, 19, clear, 31, clear]}
        - {set: [20, shaded]}
        - {set: [21, clear, 14, clear]}
        - {set: [27, shaded]}
        - {set: [12, shaded]}
        - {set: [13, clear, 6, clear]}
        - {set: [11, shaded, 30, shaded]}
        - {set: [10, clear, 5, clear, 17, clear]}
        - {set: [9, shaded]}
        - {set: [8, clear, 3, clear, 15, clear]}
        - {set: [1, shaded]}
        - {set: [0, clear, 2, clear]}
        - {set: [33, clear]}
        - {set: [29, clear]}
        - {set: [4, clear]}
        - {set: [32, clear]}
    offset:
      id: "6x6dk:122513631454336424114662242615325532"
      moves:
        - {set: [25, clear]}
        - {set: [10, clear]}
        - {set: [16, clear]}
        - {set: [29, clear]}

tiers:
  # Under 4 squares both ways, at Normal.
  absent: [2x2dk, 2x3dk, 3x2dk, 3x3dk]
  # Off the menu.
  dealt: [7x9dk, 4x4de]

ids:
  # One character a square; a 3x3 whose one answer shades its corners.
  - id: "3x3:111321331"
    opens: 3x3de
    holds:
      dealt.number.v: [1, 1, 1, 3, 2, 1, 3, 3, 1]
  # A number past nine is a letter.
  - id: "12x12:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
    refused: DESC_CONTRADICTORY
    holds:
      dealt.number.v.0: 12
  # Boards upstream's generator and the hand-written port dealt.
  - {id: "6x6dk:146214162623436526534361613462465334", writesBack: true}
  - {id: "6x6dk:614262562311433246423351441133651123", writesBack: true}
  - {id: "5x5de:1154415435251455411244252", writesBack: true}
  # A number past the longer side, and a desc a square short, long or
  # holding no number.
  - {id: "3x3:123231314", refused: DESC_OUT_OF_RANGE}
  - {id: "3x3:12323131", refused: '/\.$/'}
  - {id: "3x3:1232313111", refused: '/\.$/'}
  - {id: "3x3:12323131_", refused: '/\.$/'}

positions:
  # Each number inside what its square holds.
  - id: "3x3:111321331"
    moves: [{set: [8, shaded, 0, clear]}]
    text: "+---+---+---+\n|(1)| 1 | 1 |\n+---+---+---+\n| 3 | 2 | 1 |\n+---+---+---+\n| 3 | 3 |[1]|\n+---+---+---+\n"
  # A shaded square's number is hidden until the preference shows it.
  - id: "3x3:111321331"
    moves: [{set: [8, shaded]}]
    draws: {text any: 8}
  - id: "3x3:111321331"
    moves: [{set: [8, shaded]}]
    preferences: {show-black-nums: true}
    draws: {text any: 9}
  # Each rung has its pin. The four corners alike are told by the square
  # inside matching too, which the corner that matches its neighbors alone
  # never says.
  - id: "6x6dk:663255261455611642532264154346416613"
    moves: [{set: [6, clear]}, {set: [27, clear]}, {set: [22, clear]}]
    steps:
      - rung: corner.four
        says: "/^(?!.*beside it).*diagonally inside/"

input:
  # Three steps right from the first square come back round to it.
  - id: "3x3:111321331"
    events:
      - {key: right}
      - {key: right}
      - {key: right, cursor: [0, 0]}
  # A press off the grid flips the hidden number's preference, and makes
  # no move.
  - id: "3x3:111321331"
    moves: [{set: [8, shaded]}]
    events:
      - {preferences: {show-black-nums: false}}
      - {press: margin, returns: ui, preferences: {show-black-nums: true}}
