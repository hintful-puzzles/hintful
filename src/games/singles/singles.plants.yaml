# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # A covered square's diagonal neighbors read as beside it.
  besideCovered:
    conclude: "forall c in adj8(t) where not known(c): place(c, 2)"
  # A square not yet decided read as clear.
  sameLine:
    for: c in cells where value(c) != 1, n = clue(number, c)
  # The square between read as covered.
  sandwich:
    conclude: place(nth(cells(L), index(c, cells(L)) + 1), 1)
  # Equal numbers one square apart read as a pair side by side.
  pair:
    for: >-
      L in lines, c in cells(L), q = nth(cells(L), index(c, cells(L)) + 2) where
      q != none and clue(number, q) = clue(number, c)
  # The corner covered where it matches one square beside it.
  corner:
    conclude: >-
      (ns != n or place(c, 1)) and (ns != nt or ni != nt or place(i, 1)) and
      ((ns = n and nt = n) or (ns = nt and ni = nt) or ((ns != n and ns != ni)
      or place(t, 2)) and (ns = n or ns = ni or (nt != n and nt != ni) or
      place(s, 2)))
  # The second pair's numbers not compared.
  offset:
    for: >-
      a in cells, n = clue(number, a), b in adj8(a) where b not in adj4(a), m =
      clue(number, b), L in {col(a), row(a)}, a1 in cells(L) where a1 != a and
      a1 not in adj4(b) and clue(number, a1) = n, b1 = the(p in adj4(a1) where p
      not in cells(L) and (x(p) = x(b) or y(p) = y(b)))
