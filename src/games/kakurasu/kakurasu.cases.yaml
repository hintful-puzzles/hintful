# Kakurasu's cases, which the engine's tests read
# (src/engine/testing/game-cases.ts): a position for every kind of step its
# hint takes, and a square Check & Save finds wrong.

values:
  shaded: 1
  crossed: 2

hint:
  params:
    - {w: 5, h: 5, diff: 0}
    - {w: 5, h: 5, diff: 1}
    - {w: 7, h: 7, diff: 0}
    - {w: 7, h: 7, diff: 1}
  pins:
    # Held on 839 of 901 positions walked.
    lineMet: "5x5de:11,0,14,6,9,9,4,8,4,13"
    # Held on 901 of 901 positions walked.
    lineFull: "5x5de:6,3,10,7,1,15,9,3,7,1"
    # Held on 708 of 901 positions walked.
    tooMuch: "5x5de:4,13,3,8,3,14,8,6,7,2"
    # Held on 304 of 901 positions walked.
    everyWay: "7x7dn:12,12,22,11,24,10,16,12,15,10,11,12,25,16"
    # Held on 58 of 901 positions walked.
    noWay:
      id: "7x7dn:14,4,19,12,12,11,13,28,11,10,11,12,15,10"
      moves:
        - {set: [0, 1, 7, 1, 14, 1, 21, 1, 28, 1, 35, 1, 42, 1]}
        - {set: [10, 2, 11, 2, 12, 2, 13, 2]}
        - {set: [9, 1]}
        - {set: [8, 2]}

positions:
  # Rows 4, 9, 1, 4 and columns 4, 2, 3, 6: the answer is
  #   # . # .
  #   . # # #
  #   # . . .
  #   . . . #
  - id: "4x4:4,9,1,4,4,2,3,6"
    solve: true
    status: solved
    holds:
      values: [shaded, crossed, shaded, crossed, crossed, shaded, shaded, shaded, shaded, crossed, crossed, crossed, crossed, crossed, crossed, shaded]
  # Row 2's first square is clear in the answer; shading it leaves every
  # number reachable, so only the mistake check finds it.
  - id: "4x4:4,9,1,4,4,2,3,6"
    moves: [{set: [4, shaded]}]
    breaks: []
    mistakes: 1
