# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # A white pearl read as taking no line.
  square:
    for: >-
      c in cells where clue(pearl, c) != 1, F = {e in edges(c) where not
      known(e)} where |F| > 0, W = {e in F where fits(c, e, 1) and clue(pearl,
      c) != 2}, N = {e in F where fits(c, e, 2)} where (exists e in F: e not in
      W or e not in N)
  # A black pearl read as taking no line until it has one.
  blackPearl:
    for: >-
      c in cells where clue(pearl, c) = 1, e in edges(c) where not known(e), A =
      (turnsAt(c, e, 1) and drawn(c) > 0), B = turnsAt(c, e, 2) where not A or
      not B
  # The line through the next square read as turning there.
  blackRunsOn:
    conclude: >-
      (exists x in edges(j): x != e and not bent(x, e)) and (forall x in
      edges(j) where x != e: (bent(x, e) implies place(x, 1)) and (not bent(x,
      e) implies place(x, 2)))
  # The next square read as having to turn, not run straight.
  blackCannotRunOn:
    for: >-
      c in cells where clue(pearl, c) = 1, e in edges(c) where not known(e), j =
      other(e, c) where not turns(j, e)
  # One square that cannot turn read as enough.
  whiteCannotTurn:
    for: >-
      c in cells where clue(pearl, c) = 2 and (exists x in edges(c): not
      known(x)), e in edges(c) where value(e) != 2, f in edges(c) where index(f,
      edges(c)) > index(e, edges(c)) and not bent(e, f) and value(f) != 2 and
      not turns(other(e, c), e), P = {x in edges(c) where x != e and x != f}
  # The other square read as having to turn whatever the first does.
  whiteTurnsOpposite:
    for: >-
      c in cells where clue(pearl, c) = 2, e in edges(c) where value(e) = 1, f
      in edges(c) where f != e and value(f) = 1 and not bent(e, f), k = other(f,
      c) where runs(k, f), F = {x in edges(k) where not known(x)} where |F| > 0,
      W = {x in F where turnFits(k, f, x, 1)}, N = {x in F where turnFits(k, f,
      x, 2)} where (exists x in F: x not in W or x not in N)
  # Every square read as left out of the loop a way through would close.
  earlyThrough:
    for: >-
      L = {e in edges where value(e) = 1}, Q = {q in cells where true}, c in
      cells where drawn(c) = 0, F = {e in edges(c) where not known(e)} where |F|
      > 1, W = {e in F where loopFits(c, e, 1, L, Q)}, N = {e in F where
      loopFits(c, e, 2, L, Q)} where (exists e in F: e not in W or e not in N)
