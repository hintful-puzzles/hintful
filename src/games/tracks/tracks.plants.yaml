# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # A square with two sides left read as left one.
  oneWayIn:
    for: c in cells where not off(c) and |ways(c)| + drawn(c) < 3
  # A track square with three sides left read as crossing them all.
  bothSidesLeft:
    for: >-
      c in cells where on(c) and drawn(c) < 2, F = ways(c) where |F| > 0 and |F|
      + drawn(c) <= 3
    conclude: "forall y in F: place(edge(c, y), 1)"
  # Any open side between two track squares read as closing a loop.
  closeLoop:
    for: >-
      R = {e in edges where value(e) = 1}, e in edges where not known(e) and
      on(end1(e)) and on(end2(e)) and not shut(end1(e), end2(e)), G =
      through(end1(e), R)
  # The side that joins the two ends read as stranding track with none off
  # them.
  strand:
    for: >-
      R = {e in edges where value(e) = 1}, e in edges where not known(e) and
      on(end1(e)) and on(end2(e)) and not shut(end1(e), end2(e)), G =
      through(end1(e), R), H = through(end2(e), R) where end2(e) not in G and
      ended(G) and ended(H)
  # A line its finished track meets read as short of it.
  finishEarly:
    for: >-
      R = {e in edges where value(e) = 1}, e in edges where not known(e) and
      on(end1(e)) and on(end2(e)) and not shut(end1(e), end2(e)), G =
      through(end1(e), R), H = through(end2(e), R) where end2(e) not in G and
      ended(G) and ended(H) and (exists L in lines: count(c in cells(L) where c
      in G or c in H) <= clue(count, L))
  # A line the track could still cross read as one it cannot.
  looseEnd:
    for: >-
      L in lines, F = {c in cells(L) where drawn(c) = 2} where clue(count, L) -
      |F| = 2, P = {c in cells(L) where drawn(c) = 1 and (endAlong(c, L) or
      (exists y in adj4(c) where y in cells(L): value(edge(c, y)) = 1))} where
      |P| = 1, p = nth(P, 0), Q = {y in adj4(p) where y in cells(L) and
      value(edge(p, y)) != 1}
  # A square with two ways on besides the next read as having one.
  sharedFate:
    for: >-
      L in lines where need(L) = 1, p in open(cells(L)), q in adj4(p) where q in
      open(cells(L)) and count(y in adj4(p) where y != q and not shut(p, y)) < 3
  # The same, one empty square short.
  sharedFateEmpties:
    for: >-
      L in lines where |cells(L)| - clue(count, L) - emptied(L) = 1, p in
      open(cells(L)), q in adj4(p) where q in open(cells(L)) and count(y in adj4(p)
      where y != q and not shut(p, y)) < 3
  # A side another open side joins the squares of read as the only one.
  parity:
    for: >-
      e in edges where not known(e) and not shut(end1(e), end2(e)), G =
      through(end1(e), {x in edges where x != e and not known(x) and not
      shut(end1(x), end2(x))}), k = sum(c in G of count(y in adj4(c) where y not
      in G and value(edge(c, y)) = 1) + exits(c))
