# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # A dot's squares read as the squares beside its first.
  dotTile:
    conclude: "forall c in adj4(nth(cells(at(q)), 0)): mark(c, q)"
  # A line beside a square read as a contradiction unless both sides name
  # its dot.
  split:
    conclude: arrow(end2(e)) = q
  # A square with no arrow read as in another galaxy.
  separate:
    for: >-
      e in edges where not known(e), p = arrow(end1(e)) where p != none, q =
      arrow(end2(e)) where q != p
  # A square under a dot of its own read as any other.
  enclosed:
    for: >-
      c in cells where arrow(c) = none, N = {n in adj4(c) where value(edge(c,
      n)) != 1} where |N| > 0, q = arrow(nth(N, 0)) where q != none and (forall
      n in N: arrow(n) = q)
  # The piece holding its dot read as one that must grow.
  exclave:
    for: >-
      c in cells, q = arrow(c) where q != none, G = through(c, {e in edges where
      value(e) != 1 and arrow(end1(e)) = q and arrow(end2(e)) = q}) where nth(G,
      0) = c, U = set(n over x in G, n in adj4(x) where arrow(n) = none and
      value(edge(x, n)) != 1) where |U| < 2
  # A line mirrored whether or not the square opposite has one.
  mirrorWall:
    for: >-
      e in edges where not known(e), a in {end1(e), end2(e)}, q = arrow(a) where
      q != none, b = other(e, a), a2 = opp(a, at(q)) where a2 != none, b2 =
      opp(b, at(q)) where b2 != none
