# yaml-language-server: $schema=../../describe/description.schema.json

game: blackbox
help:
  rules: |-
    Balls are hidden in the box. Fire lasers in from its edge, and find the
    balls from what each beam does. A beam goes straight across unless:

    - it meets a ball head-on, which absorbs it: **H**;
    - a ball diagonally ahead of it turns it 90 degrees away from the ball;
    - it comes back out where it went in, or a ball beside its entry square
      would turn it before it enters: it is reflected, **R**.

    Otherwise a number marks where it went in and where it came out.
  controls: |-
    {{controls}}

    A beam's result is 'H' (the beam hit a ball dead-on and stopped), 'R'
    (the beam was either reflected back the way it came or there was a ball
    just to one side of its entry point) or a number appearing in two
    squares (indicating that the beam entered one of those squares and
    emerged from the other). Clicking a beam you have already fired lights
    its result up, at both of its squares when it is a number, so you can
    find where it came out. Its path through the box is never drawn.

    When you have placed enough balls, a green button will appear in the
    top left; click that to indicate that you think you have the answer.
    The keyboard's cursor moves around the edge of the box as well as
    inside it, and onto the button once it shows.

    A square marked as known takes no ball until you right-click it again.

    Every board has exactly one answer: once every laser is fired, only one
    set of balls sends them all where they go. So **Check & save** can check
    your marks against it, as it does in every other puzzle, and highlights a
    ball on a square that holds none and a square marked as known that holds
    a ball. A game ID whose lasers allow more than one answer won't open.
  hints: |-
    **Hint** reads only what your lasers have shown, never the hidden balls,
    so it tells you nothing you could not work out yourself.

    {{hint-marks}}

    Its main tool is following a laser through the box. Start at a laser
    you have fired and walk its path through the squares you already know,
    up to the first square you know nothing about. Ask what that square
    could hold: if a ball there would send the laser somewhere it did not
    go, the square must be empty, and if leaving it empty would, it must
    hold a ball. A laser that came out at a numbered square can be followed
    from either of its two numbers, since a path runs the same both ways.

    The hint marks an empty square as known and puts a ball on a square that
    must hold one, so each later step can build on what is on the board.
    When nothing more can be settled, it asks you to fire a laser whose path
    still runs through squares nothing has settled.

    Once every laser is fired, it can happen that no single laser settles
    any more squares, though all of them together do. The hint then finds
    balls that send every laser where it went by trying, and offers them as
    one run of moves. A square no laser ever reaches is settled by the count
    alone: when the box must hold more balls than the lasers account for,
    every such square holds one, and the hint asks you to put them on.
name: Black Box
family: shading
sizes:
  w: { min: 2, max: 255 }
  h: { min: 2, max: 255 }
  # The fewest and most balls the box may hold.
  minballs: { min: 1, max: 65024 }
  maxballs: { min: 1, max: 65024 }
space:
  # A laser is fired in from a slot: one beyond each end of every row and
  # column.
  grid: { w: "w", h: "h" }
  units: []
answer:
  # 1 is a ball, 2 an empty square: `beam` reads a 1 as what turns a laser.
  value: { sort: cell, domain: "range(1, 2)" }
define:
  # A laser's result where a ball absorbs it; one reflected comes out at its
  # own slot.
  hit: "|slots|"
  balls: "count(c in cells where value(c) = 1)"
rules:
  count: "balls >= minballs and balls <= maxballs"
clues:
  # A fired laser: the slot it came out at, or hit. One that came out at
  # another slot is a clue at both, since a path runs the same either way.
  laser:
    at: slot
    value: "range(0, hit)"
    means: "beam(at) = v"
freedom: { kind: query }
deal:
  answer: >-
    balls a square at random, each on a square that keeps the board one
    answer once every laser is fired
tiers: [Normal]
techniques:
  # Follow a laser through the squares settled to the first, u, that would
  # change where it goes: where d in u would send it elsewhere, u holds the
  # other, 3 - d.
  - id: ray
    tier: Normal
    for: >-
      k in clues(laser), s = at(k), u = ahead(s) where u != none,
      d in {1, 2}, r = beam(s, u, d) where r != none and r != clue(laser, s)
    conclude: "place(u, 3 - d)"
# A ray step is one fired laser followed to the first square nothing has
# settled: one of the two things that square could hold would send the laser
# somewhere it did not go, so it holds the other. Its words name the laser by
# the marks on its ends, say where it went, and what the refuted content would
# make it do (`would`, which `hint.ts` reads off the box). The hint searches for
# a layout when no single laser settles a square, so a deduction's "so" says
# its rival was judged and lost, passed as the relation.
phrases:
  # The supposition the laser refutes: the square holding what it does not.
  supposing: "{if ball: with {ring: this square} empty | with a ball on {ring: this square}}"
steps:
  # `ball` where the square holds a ball. A pair's two ends are one ray's,
  # whichever end it is followed from, so the words speak of a ray between
  # them rather than of the one fired; `n` is the number both ends show.
  # Once the supposition has said "this square", "it" refers back to it.
  ray:
    ring: cell
    terms:
      ball: flag
      pair: flag
      hit: flag
      n: number
      would: [stop dead, come straight back, come out elsewhere, leave the box]
    marks: { outline: [ends] }
    move: "{if ball: it must hold a ball | it must be empty}"
    wordings:
      - when: pair
        look: "{outline ends: the two {n}s} are one ray's ends, but {supposing} no ray could join them"
      - look: >-
          {outline ends: the ray marked {if hit: H | R}} {if hit: hit a ball | came straight back},
          but {supposing} it would {would}
  # Nothing settles another square: fire a laser whose way through the box
  # still depends on squares nothing has settled.
  fire:
    ring: laser
    terms: { firedAny: flag }
    look: "{if firedAny: the lasers fired so far settle no other square | no laser is fired yet}"
    move: "fire {ring: this laser}"
    effect: "nothing settled yet decides where it goes"
  # One ball of a layout that sends every fired laser where it went, found by
  # trying once no single laser settles a square: the first leg names every
  # square the layout puts a ball on (`all`), and each leg puts one; the
  # planner passes where in the run the leg stands.
  layoutOnly:
    ring: cell
    look: "every laser is fired, and none settles a square alone"
    move: "put a ball on {ring: this square}"
    effect: "then every laser goes where it went"
  layout:
    ring: [square, all]
    move: "put a ball on {ring square: this square}"
    wordings:
      - when: "|ringAll| > 0"
        look: >-
          every laser is fired, and {ring all: the ringed square | the ringed squares}
          can be set so each goes where it went
      - move: "put a ball on {ring square: this square}"
  # Every laser's way is settled by the balls found, but the board must hold
  # `more`: they sit on squares no laser reaches, and the count fills every
  # one of them.
  hidden:
    ring: cell
    terms: { more: number }
    look: >-
      every laser's way is settled, and {more: 1 more ball hides | {more} more balls hide}
      on squares no laser reaches
    move: "put a ball on {ring: this square}"
  # The balls on the board send every laser where it went.
  done:
    ring: button
    move: "press {ring: the ringed button}"
    effect: "the balls you have send every laser where it went"
