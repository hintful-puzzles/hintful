# yaml-language-server: $schema=../../describe/description.schema.json

game: flip
help:
  rules: |-
    Light up every square: an unlit square holds a {{pair:0}} square and a
    lit one a {{pair:1}} disc. Pressing a square flips a group of squares,
    each from one piece to the other. Which group depends on the game mode,
    and the Type menu has a section for each:

    {{rulesets}}
  controls: |-
    {{controls}}

    In either mode, the diagram on each piece indicates which other
    squares will flip.
  hints: |-
    Pressing a square twice undoes it, and the order of presses never
    matters, so an answer is simply a set of squares to press once each.
    **Hint** takes the answer with the fewest presses and works through it
    left to right along the top row, then along the next row down. A square
    it has gone past is never pressed again.

    That order is what gives a press a reason. Once the hint has gone past
    every other square that flips some unlit square, the one square left is
    the only one that can still light it, so it has to be pressed: *"Row by
    row, only this square can still light the outlined square, so it must
    be pressed. It flips the striped ones too."* With {{choice:ruleset:0}} this is the
    square directly below an unlit one, which is the whole method: get the top
    row right and each row after it is settled by the row above.

    {{hint-marks}}

    A striped square is not part of the reason. The press flips it along
    with the rest, and a square further on will set it right if it needs it.

    The presses that come first, the top row's with {{choice:ruleset:0}}, have no reason
    of that kind: a square further on could still undo whatever they change.
    For those the hint says how many presses the board takes and that the
    ringed square is one of them: *"The whole board can be lit in 5 presses,
    and no fewer. One of them: press this square."* When only one set of
    presses lights the board at all, it says so instead. And the last press
    says that it is the last: *"Press this square: that lights the outlined
    squares and finishes the board."*
name: Flip
family: position
sizes:
  # The game bounds neither side above; 99 stands for no bound.
  w: { min: 1, max: 99 }
  h: { min: 1, max: 99 }
space:
  grid: { w: "w", h: "h" }
  units: []
  relations:
    # The squares a press of each square flips, its own among them on every
    # board the generator deals: the cross around it with Crosses, and a
    # random pattern of the eight around it with Random. The desc carries
    # them for both, so both are dealt.
    flips: dealt
position:
  # 1 where a square is still unlit, 0 where it is lit.
  grid: { domain: "{0, 1}" }
freedom: { kind: transition }
moves:
  # Press square c: every square of its pattern flips. A square whose
  # pattern is empty flips nothing, so it is no move.
  press:
    for: "c in cells where |flips(c)| > 0"
    set:
      - for: "d in flips(c)"
        grid: "1 - grid(d)"
finish:
  - "forall c in cells: grid(c) = 0"
deal:
  start: >-
    a random set of presses applied to the lit board, dealt again until some
    square is unlit
