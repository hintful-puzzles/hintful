# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # Regions inside one star short of the line's need read as enough.
  confined:
    for: >-
      dir in range(0, 1), a in range(0, w - 1), B = band(1, dir, a), n = need(B)
      where n > 0, I = inside(B), mi = sum(r in I of need(cells(r))), R =
      reaching(B), mr = sum(r in R of need(cells(r))), lines = (mi + 1 >= n and
      (exists c in open(B): region(c) not in I)) where mi + 1 >= n or mr <= n
  banded:
    for: >-
      k in range(2, w - 2), dir in range(0, 1), a in range(0, w - k), B =
      band(k, dir, a), n = need(B) + (k - 1) * stars where n > 0, I = inside(B),
      mi = sum(r in I of need(cells(r))), R = reaching(B), mr = sum(r in R of
      need(cells(r))), lines = (mi + 1 >= n and (exists c in open(B): region(c)
      not in I)) where mi + 1 >= n or mr <= n
