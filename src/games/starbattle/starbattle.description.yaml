# yaml-language-server: $schema=../../describe/description.schema.json

game: starbattle
help:
  rules: |-
    Place stars so that every row, every column and every region holds the same number of them, and no two stars touch, not even at a corner. Heavy lines divide the regions; their tints only tell neighbors apart. How many stars is the game mode:

    {{rulesets}}
  controls: |-
    {{controls}}

    A cross is your own note that a square holds no star. You need not cross anything out to finish: the puzzle is solved as soon as the stars are all in place. A star turns red when it touches another, or when its row, column or region holds too many.

    A star rules out the blank squares touching it, and the rest of its row, column or region when the star is the last one that holds. {{rules-out}}
  origins: |-
    Star Battle was invented by Hans Eendebak for the 2003 World Puzzle Championship.
  hints: |-
    **Hint** explains the next step rather than simply making it. Each step decides one or more squares from the regions and from the stars and crosses you have already placed, so it carries on from wherever you are.

    {{hint-marks}}

    A hint calls a square *open* while it holds neither a star nor a cross, so its first steps are often the crosses a star you placed gives: the squares touching it, and the rest of a row, column or region that has all its stars.

    The steps after those, easiest first:

    - A row, column or region with exactly as many open squares as it still needs stars has a star in each. One that would not have room for its stars without a certain square has a star there. Stars cannot touch, so two open squares that touch, even at a corner, have room for only one.
    - A region whose open squares all lie in one row or column must put its stars there, so when that row or column needs no more than those, its other squares are empty. The same holds the other way round, for a row or column whose open squares all lie in one region.
    - A star that would touch so many open squares of a row, column or region that too few are left for the stars it needs cannot be there.
    - On Normal boards, several rows or columns side by side are counted together: when the regions lying wholly inside them need as many stars as those rows do, the rows' other squares are empty, and when the regions reaching into them need no more than the rows do, those regions' squares outside the rows are empty.
    - On Tricky boards, a star is tried in a square where it would complete its own row, column or region. If the squares that rules out leave another row, column or region without room for its stars, the square is empty.

    If a square you marked is wrong, the hint asks you to fix the highlighted mistakes first.
name: Star Battle
family: shading
sizes:
  w: { min: 4, max: 26 }
  # The stars every row, column and region holds.
  stars: { min: 1, max: 3 }
space:
  grid: { w: "w", h: "w" }
  # The regions are a dealt partition rather than units: the soundness
  # checker builds a unit partition only from blocks, and a region holds
  # stars, not every value once.
  regions: { region: dealt }
  units: []
answer:
  # 1 is a star, 2 a square without one.
  value: { sort: cell, domain: "range(1, 2)" }
define:
  # The stars squares S still need, as a row, column or region of them.
  need(S): "stars - count(c in S where value(c) = 1)"
  # The squares of S that hold nothing yet.
  open(S): "{c in S where not known(c)}"
  # 1 where x is one of the squares S, 0 where it is not.
  own(x, S): "count(c in {x} where c in S)"
  # Whether n stars fit in the squares S with no two touching: a star is 1
  # and an empty square 2, so n stars sum to 2|S| - n.
  fits(S, n): >-
    exists fill f of S where sum(x in S of f(x)) = 2 * |S| - n
    and (forall x in S, y in before(x, S): not (f(x) = 1 and f(y) = 1 and y in adj8(x))): true
  # The most stars, up to n, that fit in the squares S with no two touching.
  most(S, n): "max(j in range(0, n) where fits(S, j))"
  # Which of the lines of one way a square is on: its row for 0, its column
  # for 1.
  along(c, dir): "(1 - dir) * y(c) + dir * x(c)"
  # The k neighboring rows (dir 0) or columns (dir 1) from the a-th.
  band(k, dir, a): "{c in cells where a <= along(c, dir) and along(c, dir) < a + k}"
  # The regions that still want stars with every open square in B.
  inside(B): "{r in region where need(cells(r)) > 0 and (forall c in open(cells(r)): c in B)}"
  # The regions that still want stars with an open square in B.
  reaching(B): "{r in region where need(cells(r)) > 0 and (exists c in open(cells(r)): c in B)}"
  # The open squares a star tried in x would touch.
  touched(x): "{p in adj8(x) where not known(p)}"
  # The open squares a star tried in x would rule out: those touching it, and
  # the rest of each row, column or region of x's that the star would
  # complete.
  ruled(x): >-
    {p in cells where not known(p) and p != x and (p in adj8(x)
    or (row(p) = row(x) and need(cells(row(x))) = 1)
    or (col(p) = col(x) and need(cells(col(x))) = 1)
    or (region(p) = region(x) and need(cells(region(x))) = 1))}
  # Whether a star tried in x would complete its row, column or region and so
  # rule out some of Q, the squares a hint names, in that unit.
  closesRow(x, Q): "need(cells(row(x))) = 1 and (exists p in Q: row(p) = row(x))"
  closesCol(x, Q): "need(cells(col(x))) = 1 and (exists p in Q: col(p) = col(x))"
  closesRegion(x, Q): "need(cells(region(x))) = 1 and (exists p in Q: region(p) = region(x))"
  # The squares of the units a star tried in x would complete among Q's.
  completing(x, Q): >-
    {c in cells where (closesRow(x, Q) and row(c) = row(x))
    or (closesCol(x, Q) and col(c) = col(x))
    or (closesRegion(x, Q) and region(c) = region(x))}
shape:
  - "forall L in lines: count(c in cells(L) where value(c) = 1) = stars"
  - "forall r in region: count(c in cells(r) where value(c) = 1) = stars"
  - "forall a in cells where value(a) = 1: forall b in adj8(a): value(b) != 1"
freedom: { kind: fill }
deal:
  region: the partition, one region a column, round stars placed at random
  stars: the stars to a row
  tier: one of the tiers
tiers: [Easy, Normal, Tricky]
techniques:
  # Nothing touching a star holds another. A star touching one makes the
  # marks inconsistent.
  - id: around
    tier: Easy
    for: "c in cells where value(c) = 1"
    conclude: >-
      (forall p in adj8(c): value(p) != 1)
      and (forall p in adj8(c) where not known(p): place(p, 2))
    # The hint names the star and outlines it; the squares touching it are its
    # step's, and the walk reads them all.
    says:
      marks: { outline: "{c}", reads: "{c} + adj8(c)" }
  # A row or column that has its stars holds no more. One with more makes
  # the marks inconsistent.
  - id: fullLine
    tier: Easy
    for: "L in lines, n = need(cells(L)) where n <= 0"
    conclude: "n = 0 and forall c in open(cells(L)): place(c, 2)"
    says:
      terms: { L: L }
      marks: { stripes: "cells(L)", reads: "cells(L)" }
  - id: fullRegion
    tier: Easy
    for: "r in region, n = need(cells(r)) where n <= 0"
    conclude: "n = 0 and forall c in open(cells(r)): place(c, 2)"
    says:
      terms: { r: r }
      marks: { stripes: "cells(r)", reads: "cells(r)" }
  # A row or column with exactly as many open squares as it still needs
  # stars has a star in each. One with fewer makes the marks inconsistent.
  - id: exactLine
    tier: Easy
    for: "L in lines, n = need(cells(L)), O = open(cells(L)) where n > 0 and n >= |O|"
    conclude: "n = |O| and forall c in O: place(c, 1)"
    says:
      terms: { L: L, n: n }
      marks: { stripes: "cells(L)", reads: "cells(L)" }
  - id: exactRegion
    tier: Easy
    for: "r in region, n = need(cells(r)), O = open(cells(r)) where n > 0 and n >= |O|"
    conclude: "n = |O| and forall c in O: place(c, 1)"
    says:
      terms: { r: r, n: n }
      marks: { stripes: "cells(r)", reads: "cells(r)" }
  # A row or column counted against its regions, two ways, the first where
  # it decides a square (`lines`): where the regions lying wholly inside it
  # need as many stars as it does, its other open squares are empty; where
  # the regions reaching into it need no more than it does, their open
  # squares outside it are empty. Regions inside needing more, or reaching
  # in needing fewer, make the marks inconsistent.
  - id: confined
    tier: Easy
    for: >-
      dir in range(0, 1), a in range(0, w - 1), B = band(1, dir, a),
      n = need(B) where n > 0,
      I = inside(B), mi = sum(r in I of need(cells(r))),
      R = reaching(B), mr = sum(r in R of need(cells(r))),
      lines = (mi = n and (exists c in open(B): region(c) not in I))
      where mi >= n or mr <= n
    conclude: >-
      mi <= n and mr >= n
      and (lines implies (forall c in open(B) where region(c) not in I: place(c, 2)))
      and (lines or mr > n or (forall r in R, c in open(cells(r)) where c not in B: place(c, 2)))
    # The hint names the lines (striped), the regions it counts them against
    # (outlined), and the stars they share.
    says:
      terms: { dir: dir, k: "1", n: n }
      marks: { stripes: B, reads: B }
      arms:
        lines:
          when: lines
          terms: { regionCount: "|I|" }
          marks: { outline: "set(c over r in I, c in cells(r))" }
        regions:
          when: "true"
          terms: { regionCount: "|R|" }
          marks: { outline: "set(c over r in R, c in cells(r))" }
  # A row or column that would have room for too few stars without an open
  # square of its: a star is there.
  - id: neededLine
    tier: Easy
    for: >-
      L in lines, n = need(cells(L)), O = open(cells(L)) where n > 0,
      x in O, E = O - {x} where not fits(E, n), room = most(E, n)
    conclude: "place(x, 1)"
    says:
      terms: { L: L, n: n, room: room }
      marks: { stripes: "cells(L)", reads: "cells(L)" }
  - id: neededRegion
    tier: Easy
    for: >-
      r in region, n = need(cells(r)), O = open(cells(r)) where n > 0,
      x in O, E = O - {x} where not fits(E, n), room = most(E, n)
    conclude: "place(x, 1)"
    says:
      terms: { r: r, n: n, room: room }
      marks: { stripes: "cells(r)", reads: "cells(r)" }
  # A star tried in a square would rule out the open squares touching it,
  # leaving a row or column it touches room for too few stars: the square is
  # empty.
  - id: crowdedLine
    tier: Easy
    for: >-
      x in cells where not known(x), R = touched(x),
      L in lines where L = row(x) or L = col(x) or (exists p in R: L = row(p) or L = col(p)),
      S = cells(L), n = need(S) - own(x, S), E = {c in open(S) where c != x and c not in R}
      where n > 0 and not fits(E, n), room = most(E, n), Q = {c in open(S) where c in R}
    conclude: "place(x, 2)"
    says:
      terms: { L: L, n: n, room: room, mine: "x in S", exhausted: "|E| = 0" }
      marks: { stripes: S, outline: Q, reads: "Q + S" }
  - id: crowdedRegion
    tier: Easy
    for: >-
      x in cells where not known(x), R = touched(x),
      g in region where g = region(x) or (exists p in R: region(p) = g),
      S = cells(g), n = need(S) - own(x, S), E = {c in open(S) where c != x and c not in R}
      where n > 0 and not fits(E, n), room = most(E, n), Q = {c in open(S) where c in R}
    conclude: "place(x, 2)"
    says:
      terms: { g: g, n: n, room: room, mine: "x in S", exhausted: "|E| = 0" }
      marks: { stripes: S, outline: Q, reads: "Q + S" }
  # Several neighboring rows or columns, fewer than all but one, counted
  # against their regions as one row or column is, the fewest first.
  - id: banded
    tier: Normal
    for: >-
      k in range(2, w - 2), dir in range(0, 1), a in range(0, w - k), B = band(k, dir, a),
      n = need(B) + (k - 1) * stars where n > 0,
      I = inside(B), mi = sum(r in I of need(cells(r))),
      R = reaching(B), mr = sum(r in R of need(cells(r))),
      lines = (mi = n and (exists c in open(B): region(c) not in I))
      where mi >= n or mr <= n
    conclude: >-
      mi <= n and mr >= n
      and (lines implies (forall c in open(B) where region(c) not in I: place(c, 2)))
      and (lines or mr > n or (forall r in R, c in open(cells(r)) where c not in B: place(c, 2)))
    # The hint names the lines (striped), the regions it counts them against
    # (outlined), and the stars they share.
    says:
      terms: { dir: dir, k: k, n: n }
      marks: { stripes: B, reads: B }
      arms:
        lines:
          when: lines
          terms: { regionCount: "|I|" }
          marks: { outline: "set(c over r in I, c in cells(r))" }
        regions:
          when: "true"
          terms: { regionCount: "|R|" }
          marks: { outline: "set(c over r in R, c in cells(r))" }
  # A star tried in a square would also complete a row, column or region of
  # its own and rule out the rest of it, leaving another room for too few
  # stars: the square is empty.
  - id: starvedLine
    tier: Tricky
    for: >-
      x in cells where not known(x), R = ruled(x),
      L in lines where L = row(x) or L = col(x) or (exists p in R: L = row(p) or L = col(p)),
      S = cells(L), n = need(S) - own(x, S), E = {c in open(S) where c != x and c not in R}
      where n > 0 and not fits(E, n), room = most(E, n), Q = {c in open(S) where c in R}
    conclude: "place(x, 2)"
    says:
      terms:
        { L: L, n: n, room: room, mine: "x in S", exhausted: "|E| = 0",
          closesRow: "closesRow(x, Q)", closesCol: "closesCol(x, Q)",
          closesRegion: "closesRegion(x, Q)" }
      marks: { stripes: S, outline: Q, reads: "Q + S + completing(x, Q)" }
  - id: starvedRegion
    tier: Tricky
    for: >-
      x in cells where not known(x), R = ruled(x),
      g in region where g = region(x) or (exists p in R: region(p) = g),
      S = cells(g), n = need(S) - own(x, S), E = {c in open(S) where c != x and c not in R}
      where n > 0 and not fits(E, n), room = most(E, n), Q = {c in open(S) where c in R}
    conclude: "place(x, 2)"
    says:
      terms:
        { g: g, n: n, room: room, mine: "x in S", exhausted: "|E| = 0",
          closesRow: "closesRow(x, Q)", closesCol: "closesCol(x, Q)",
          closesRegion: "closesRegion(x, Q)" }
      marks: { stripes: S, outline: Q, reads: "Q + S + completing(x, Q)" }
