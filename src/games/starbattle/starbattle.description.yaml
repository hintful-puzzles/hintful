# yaml-language-server: $schema=../../describe/description.schema.json

game: starbattle
catalog:
  name: Star Battle
  aliases: [Queens, Two Not Touch]
  description: Star placement puzzle
  objective: >-
    Place stars so that every row, column and region holds the same number and
    no two touch.
  collection: own
  family: objects
  similar: Queens, Two Not Touch
help:
  rules: |-
    Place stars so that every row, every column and every region holds the same number of them, and no two stars touch, not even at a corner. Heavy lines divide the regions; their tints only tell neighbors apart. How many stars is the game mode:

    {{rulesets}}
  controls: |-
    {{controls}}

    A cross is your own note that a square holds no star. You need not cross anything out to finish: the puzzle is solved as soon as the stars are all in place. A star turns red when it touches another, or when its row, column or region holds too many; the crosses of a row, column or region turn red when they leave it no room for its stars.

    A star rules out the blank squares touching it, and the rest of its row, column or region when the star is the last one that holds. {{rules-out}}
  origins: |-
    Star Battle was invented by Hans Eendebak for the 2003 World Puzzle Championship.
  hints: |-
    **Hint** explains the next step rather than simply making it. Each step decides one or more squares from the regions and from the stars and crosses you have already placed, so it carries on from wherever you are.

    {{hint-marks}}

    A hint calls a square *open* while it holds neither a star nor a cross, so its first steps are often the crosses a star you placed gives: the squares touching it, and the rest of a row, column or region that has all its stars.

    The steps after those, easiest first:

    - A row, column or region with exactly as many open squares as it still needs stars has a star in each. One that would not have room for its stars without a certain square has a star there. Stars cannot touch, so two open squares that touch, even at a corner, have room for only one.
    - A region whose open squares all lie in one row or column must put its stars there, so when that row or column needs no more than those, its other squares are empty. The same holds the other way round, for a row or column whose open squares all lie in one region.
    - A star that would touch so many open squares of a row, column or region that too few are left for the stars it needs cannot be there.
    - On Normal boards, several rows or columns side by side are counted together: when the regions lying wholly inside them need as many stars as those rows do, the rows' other squares are empty, and when the regions reaching into them need no more than the rows do, those regions' squares outside the rows are empty.
    - On Tricky boards, a star is tried in a square where it would complete its own row, column or region. If the squares that rules out leave another row, column or region without room for its stars, the square is empty.

    If a square you marked is wrong, the hint asks you to fix the highlighted mistakes first.
produces: shading
sizes:
  w: { min: 4, max: 26 }
  # The stars every row, column and region holds.
  stars: { min: 1, max: 3 }
space:
  grid: { w: "w", h: "w" }
  # The regions are a dealt partition rather than units: the soundness
  # checker builds a unit partition only from blocks, and a region holds
  # stars, not every value once.
  regions: { region: dealt }
  units: []
answer:
  # 1 is a star, 2 a square without one.
  value: { sort: cell, domain: "range(1, 2)" }
define:
  # The stars squares S still need, as a row, column or region of them.
  need(S): "stars - count(c in S where value(c) = 1)"
  # The squares of S that hold nothing yet.
  open(S): "{c in S where not known(c)}"
  # Whether n stars fit in the squares S with no two touching: a star is 1
  # and an empty square 2, so n stars sum to 2|S| - n.
  fits(S, n): >-
    exists fill f of S where sum(x in S of f(x)) = 2 * |S| - n
    and (forall x in S, y in before(x, S): not (f(x) = 1 and f(y) = 1 and y in adj8(x))): true
  # The most stars, up to n, that fit in the squares S with no two touching.
  most(S, n): "max(j in range(0, n) where fits(S, j))"
  # Which of the lines of one way a square is on: its row for 0, its column
  # for 1.
  along(c, dir): "(1 - dir) * y(c) + dir * x(c)"
  # The k neighboring rows (dir 0) or columns (dir 1) from the a-th.
  band(k, dir, a): "{c in cells where a <= along(c, dir) and along(c, dir) < a + k}"
  # The regions that still want stars with every open square in B.
  inside(B): "{r in region where need(cells(r)) > 0 and (forall c in open(cells(r)): c in B)}"
  # The regions that still want stars with an open square in B.
  reaching(B): "{r in region where need(cells(r)) > 0 and (exists c in open(cells(r)): c in B)}"
  # The open squares a star tried in x would touch.
  touched(x): "{p in adj8(x) where not known(p)}"
  # The open squares a star tried in x would rule out: those touching it, and
  # the rest of each row, column or region of x's that the star would
  # complete.
  ruled(x): >-
    {p in cells where not known(p) and p != x and (p in adj8(x)
    or (row(p) = row(x) and need(cells(row(x))) = 1)
    or (col(p) = col(x) and need(cells(col(x))) = 1)
    or (region(p) = region(x) and need(cells(region(x))) = 1))}
  # Whether a star tried in x would complete its row, column or region and so
  # rule out some of Q, the squares a hint names, in that unit.
  closesRow(x, Q): "need(cells(row(x))) = 1 and (exists p in Q: row(p) = row(x))"
  closesCol(x, Q): "need(cells(col(x))) = 1 and (exists p in Q: col(p) = col(x))"
  closesRegion(x, Q): "need(cells(region(x))) = 1 and (exists p in Q: region(p) = region(x))"
  # The squares of the units a star tried in x would complete among Q's.
  completing(x, Q): >-
    {c in cells where (closesRow(x, Q) and row(c) = row(x))
    or (closesCol(x, Q) and col(c) = col(x))
    or (closesRegion(x, Q) and region(c) = region(x))}
shape:
  - "forall L in lines: count(c in cells(L) where value(c) = 1) = stars"
  - "forall r in region: count(c in cells(r) where value(c) = 1) = stars"
  - "forall a in cells where value(a) = 1: forall b in adj8(a): value(b) != 1"
freedom: { kind: fill }
play:
  values:
    1: { does: put a star there, key: S, glyph: " * ", paint: star }
    2: { does: cross it out, key: X, glyph: " x ", paint: cross }
  primary: 1
  secondary: 2
  # The answer is the stars alone: an open square holds none.
  blank: 2
  # A click goes round empty, the button's mark and the other one.
  click: cycle
  stroke: sweep
  sizes:
    stars:
      letter: s
      # Two rows side by side hold twice the stars, none touching, so four
      # times the stars is the narrowest board each has an answer on.
      rulesets:
        - name: One star
          rule: One in each, the puzzle also known as <em>Queens</em>.
          least: 4
        - name: Two stars
          rule: Two in each, the puzzle also known as <em>Two Not Touch</em>.
          least: 8
        - name: Three stars
          rule: Three in each.
          least: 12
  boards: [5x5, 6x6, 8x8, 8x8s2, 9x9s2, 10x10s2, 12x12s3]
  # Measured 2026-10-15, the 95th of 100 deals: a Tricky board of two stars
  # takes half a second at 9x9 and a second at 10x10, but 9 at 8x8, where a
  # board seldom needs it; three stars take two seconds at Normal.
  boardTiers:
    8x8s2: [Easy, Normal]
    12x12s3: [Easy, Easy]
  hintMarks:
    ring: the squares the step decides. The sentence says what they must be.
    stripes: >-
      the row, column or region the step is about, or several rows or columns
      counted together.
    outline: >-
      what else it reasons from: a star, a region, or the squares a star would
      block.
deal:
  answer: >-
    the stars at random, as many to every row and column, none touching
    another even at a corner
  region: >-
    a region grown round each star, joined until each holds the stars, then
    mended until the board finishes at the tier
  tier: one of the tiers, the board finished at it and not at the tier below
  sample: { lines: { value: 1, count: stars, apart: adj8 }, rest: 2 }
  grow:
    partition: region
    holds: stars
    # A region of no more cells than its stars hands them over at a glance.
    smallest: "2 * stars"
    # One region a row: any other number cannot each hold a row's stars.
    parts: w
# The regions as the walls between them.
id:
  - walls: region
tierLetters: ent
tiers: [Easy, Normal, Tricky]
# What a star rules out at a glance: the squares touching it, and the rest of
# a row, column or region it fills.
rulesOut:
  name: Cross out the squares a star rules out
  placing: 1
  techniques: [around, fullLine, fullRegion]
kindWords:
  rest: 2
  fill: 1
  has: "{s: its star | its {s} stars}"
  restWord: must be empty
  items: "{n: star | stars}"
  fillWord: must hold a star
  tried: a star on
  a: a star
names:
  around: "stars never touching"
  fullLine: "a line with all its stars"
  fullRegion: "a region with all its stars"
  exactLine: "a line needing every open square"
  exactRegion: "a region needing every open square"
  confined: "a line and its regions, counted"
  neededLine: "a square a line needs"
  neededRegion: "a square a region needs"
  crowdedLine: "a star that would crowd a line"
  crowdedRegion: "a star that would crowd a region"
  banded: "several lines counted together"
  starvedLine: "a star that leaves a line short"
  starvedRegion: "a star that leaves a region short"
techniques:
  # Nothing touching a star holds another. A star touching one makes the
  # marks inconsistent.
  - kind: peer.touch
    as: around
    tier: Easy
    with: { adj: adj8, piece: star, pieces: stars, how: ", even diagonally" }
  # A row or column that has its stars holds no more. One with more makes
  # the marks inconsistent.
  - kind: count.met
    as: fullLine
    tier: Easy
    with:
      group: "L in lines"
      set: "cells(L)"
      unit: "this {if row: row | column}"
      # Whether the line is a row: its squares share a row.
      terms: { L: L, row: "forall c in cells(L): y(c) = y(first(cells(L)))", s: stars }
  - kind: count.met
    as: fullRegion
    tier: Easy
    with:
      group: "r in region"
      set: "cells(r)"
      unit: this region
      terms: { r: r, s: stars }
  # A row or column with exactly as many open squares as it still needs
  # stars has a star in each. One with fewer makes the marks inconsistent.
  - kind: count.exact
    as: exactLine
    tier: Easy
    with:
      group: "L in lines"
      set: "cells(L)"
      unit: "this {if row: row | column}"
      # `placed`: the unit already holds some of its stars.
      terms: { L: L, row: "forall c in cells(L): y(c) = y(first(cells(L)))", placed: "n < stars" }
  - kind: count.exact
    as: exactRegion
    tier: Easy
    with:
      group: "r in region"
      set: "cells(r)"
      unit: this region
      terms: { r: r, placed: "n < stars" }
  # A row or column counted against its regions, two ways, the first where
  # it decides a square (`lines`): where the regions lying wholly inside it
  # need as many stars as it does, its other open squares are empty; where
  # the regions reaching into it need no more than it does, their open
  # squares outside it are empty. Regions inside needing more, or reaching
  # in needing fewer, make the marks inconsistent.
  - id: confined
    tier: Easy
    for: >-
      dir in range(0, 1), a in range(0, w - 1), B = band(1, dir, a),
      n = need(B) where n > 0,
      I = inside(B), mi = sum(r in I of need(cells(r))),
      R = reaching(B), mr = sum(r in R of need(cells(r))),
      lines = (mi = n and (exists c in open(B): region(c) not in I))
      where mi >= n or mr <= n
    conclude: >-
      mi <= n and mr >= n
      and (lines implies (forall c in open(B) where region(c) not in I: place(c, 2)))
      and (lines or mr > n or (forall r in R, c in open(cells(r)) where c not in B: place(c, 2)))
    # The hint names the lines (striped), the regions it counts them against
    # (outlined), and the stars they share.
    says:
      # The regions the lines are counted against, and the stars: whichever
      # of the two is named first holds its stars inside the other, which
      # needs no more than those. `placed`: the first already holds some.
      terms: { dir: dir, k: "1", n: n, row: "dir = 0", multi: "n > 1" }
      marks: { stripes: B, reads: B }
      arms:
        lines:
          when: lines
          terms: { regionCount: "|I|", placed: "|I| * stars > n" }
          marks: { outline: "set(c over r in I, c in cells(r))" }
          move: "{ring} must be empty"
          wordings:
            - when: "n = 1 and regionCount = 1"
              look: "{outline: the outlined region} must put its {if placed: last star | star} in {stripes: this {if row: row | column}}, which needs only that one"
            - look: "{outline: {regionCount: the outlined region | the {regionCount} outlined regions}} {regionCount: needs | need} {if placed: {n} more | {n}} {n: star | stars}, {if multi: all in | in} {stripes: {k: this {if row: row | column} | these {k} {if row: rows | columns}}}, which {k: needs | need} only {n}"
        regions:
          when: "true"
          terms: { regionCount: "|R|", placed: "stars > n" }
          marks: { outline: "set(c over r in R, c in cells(r))" }
          move: "{ring} must be empty"
          wordings:
            - when: "n = 1 and regionCount = 1"
              look: "{stripes: this {if row: row | column}} must put its {if placed: last star | star} in {outline: the outlined region}, which needs only that one"
            - look: "{stripes: {k: this {if row: row | column} | these {k} {if row: rows | columns}}} {k: needs | need} {if placed: {n} more | {n}} {n: star | stars}, {if multi: all in | in} {outline: {regionCount: the outlined region | the {regionCount} outlined regions}}, which {regionCount: needs | need} only {n}"
  # A row or column that would have room for too few stars without an open
  # square of its: a star is there.
  - kind: room.needed
    as: neededLine
    tier: Easy
    with:
      group: "L in lines"
      set: "cells(L)"
      unit: "this {if row: row | column}"
      terms: { L: L, row: "forall c in cells(L): y(c) = y(first(cells(L)))", placed: "n < stars" }
  - kind: room.needed
    as: neededRegion
    tier: Easy
    with:
      group: "r in region"
      set: "cells(r)"
      unit: this region
      terms: { r: r, placed: "n < stars" }
  # A star tried in a square would rule out the open squares touching it,
  # leaving a row or column it touches room for too few stars: the square is
  # empty.
  - kind: room.crowded
    as: crowdedLine
    tier: Easy
    with:
      group: "L in lines"
      set: "cells(L)"
      unit: "this {if row: row | column}"
      ruled: touched(x)
      act: touch
      terms: { L: L, row: "forall c in cells(L): y(c) = y(first(cells(L)))" }
  - kind: room.crowded
    as: crowdedRegion
    tier: Easy
    with:
      group: "g in region"
      set: "cells(g)"
      unit: this region
      ruled: touched(x)
      act: touch
      terms: { g: g }
  # Several neighboring rows or columns, fewer than all but one, counted
  # against their regions as one row or column is, the fewest first.
  - id: banded
    tier: Normal
    for: >-
      k in range(2, w - 2), dir in range(0, 1), a in range(0, w - k), B = band(k, dir, a),
      n = need(B) + (k - 1) * stars where n > 0,
      I = inside(B), mi = sum(r in I of need(cells(r))),
      R = reaching(B), mr = sum(r in R of need(cells(r))),
      lines = (mi = n and (exists c in open(B): region(c) not in I))
      where mi >= n or mr <= n
    conclude: >-
      mi <= n and mr >= n
      and (lines implies (forall c in open(B) where region(c) not in I: place(c, 2)))
      and (lines or mr > n or (forall r in R, c in open(cells(r)) where c not in B: place(c, 2)))
    # The hint names the lines (striped), the regions it counts them against
    # (outlined), and the stars they share.
    says:
      terms: { dir: dir, k: k, n: n, row: "dir = 0", multi: "n > 1" }
      marks: { stripes: B, reads: B }
      arms:
        lines:
          when: lines
          terms: { regionCount: "|I|", placed: "|I| * stars > n" }
          marks: { outline: "set(c over r in I, c in cells(r))" }
          move: "{ring} must be empty"
          wordings:
            - when: "n = 1 and k = 1 and regionCount = 1"
              look: "{outline: the outlined region} must put its {if placed: last star | star} in {stripes: this {if row: row | column}}, which needs only that one"
            - look: "{outline: {regionCount: the outlined region | the {regionCount} outlined regions}} {regionCount: needs | need} {if placed: {n} more | {n}} {n: star | stars}, {if multi: all in | in} {stripes: {k: this {if row: row | column} | these {k} {if row: rows | columns}}}, which {k: needs | need} only {n}"
        regions:
          when: "true"
          terms: { regionCount: "|R|", placed: "k * stars > n" }
          marks: { outline: "set(c over r in R, c in cells(r))" }
          move: "{ring} must be empty"
          wordings:
            - when: "n = 1 and k = 1 and regionCount = 1"
              look: "{stripes: this {if row: row | column}} must put its {if placed: last star | star} in {outline: the outlined region}, which needs only that one"
            - look: "{stripes: {k: this {if row: row | column} | these {k} {if row: rows | columns}}} {k: needs | need} {if placed: {n} more | {n}} {n: star | stars}, {if multi: all in | in} {outline: {regionCount: the outlined region | the {regionCount} outlined regions}}, which {regionCount: needs | need} only {n}"
  # A star tried in a square would also complete a row, column or region of
  # its own and rule out the rest of it, leaving another room for too few
  # stars: the square is empty.
  # A cause is named where the star completes one or two of its own row,
  # column and region, not all three: those are what it rules out.
  - kind: room.crowded
    as: starvedLine
    tier: Tricky
    with:
      group: "L in lines"
      set: "cells(L)"
      unit: "this {if row: row | column}"
      ruled: ruled(x)
      act: block
      cause: &cause "(closesRow or closesCol or closesRegion) and not (closesRow and closesCol and closesRegion)"
      causeWords: &causeWords "{if closesRow: {if closesCol: row and column | {if closesRegion: row and region | row}} | {if closesCol: {if closesRegion: column and region | column} | region}}"
      marks: { stripes: "cells(L)", outline: Q, reads: "Q + cells(L) + completing(x, Q)" }
      terms:
        { L: L, row: "forall c in cells(L): y(c) = y(first(cells(L)))",
          closesRow: "closesRow(x, Q)", closesCol: "closesCol(x, Q)", closesRegion: "closesRegion(x, Q)" }
  - kind: room.crowded
    as: starvedRegion
    tier: Tricky
    with:
      group: "g in region"
      set: "cells(g)"
      unit: this region
      ruled: ruled(x)
      act: block
      cause: *cause
      causeWords: *causeWords
      marks: { stripes: "cells(g)", outline: Q, reads: "Q + cells(g) + completing(x, Q)" }
      terms:
        { g: g, closesRow: "closesRow(x, Q)", closesCol: "closesCol(x, Q)", closesRegion: "closesRegion(x, Q)" }
