# yaml-language-server: $schema=../../describe/description.schema.json

game: pegs
help:
  rules: |-
    Jump one peg over another to remove the one you jumped over. Try to
    remove all but one peg.
  controls: |-
    Drag a peg into an empty space to make a move. The target space must
    be exactly two holes away from the starting peg, in an orthogonal
    direction, and there must be a peg in the hole in between.

    With the keyboard, the arrow keys move a cursor around the board. Press
    Enter or Space on a peg to pick it up, then an arrow key to jump it in
    that direction; press Enter or Space again instead to put it back down.
  hints: |-
    **Hint** shows the next jump rather than making it. No jump in Pegs is
    forced by logic, so the hint searches for a line of jumps that leaves
    one peg and shows you its first jump. Alongside it, the hint compares that
    jump with the other jumps you could make, because telling a jump that can
    still finish from one that cannot is what winning at Pegs takes.

    {{hint-marks}}

    The game ends with one peg, so every other peg has to be taken along the
    way: **leave no peg stranded**. A peg is *stranded* when no peg is beside
    it. It cannot jump, and nothing can take it until a peg lands next to it,
    so you will have to go back for it. A peg is *cut off* when no peg can ever
    land beside it again. A board with a cut-off peg can never finish with one.

    So the first thing the hint looks for is a jump that would cut a peg off,
    either straight away or whatever you jump next. It stripes that jump,
    outlines the peg, and shows one jump that keeps the peg in reach. When the
    striped jump and the suggested one start from the same peg, the suggested
    jump is one other way that peg can go; it is offered as one way to save
    the peg, not the only one.

    Otherwise, a hint may show a **package**: a short run of jumps that clears
    a row or column of three, or a block of two by three, and puts every
    other peg back where it was. For three in a line, a spare peg beside one
    end can jump across the line into an empty hole, the line's far peg jumps
    in, and the spare jumps back to where it began. Learning these shapes is
    how to clear a board one area at a time. A package is one hint, shown a
    jump at a time.

    When the search has checked the other jumps, the hint says what it found.
    It draws an arrow on each jump that can still finish, the suggested one
    among them, and when it checked every jump it says that only those can.
    When every jump can still finish, which is usual early in a game, it says
    that too. In the middle of a game on the larger boards there are often too
    many ways to go for the search to check every jump quickly, and then the
    hint makes no claim about the jumps it did not settle. It turns to stranded
    pegs instead: a stranded peg the suggested jump goes back for, or another
    jump that would strand a peg the suggested jump keeps company. Leaving no
    peg stranded is a habit worth having rather than a rule. Sometimes the
    winning line strands a peg for a while and comes back for it later.

    The hint refuses when there is nothing to search for: if a peg is
    already cut off, it outlines the cut-off pegs and asks you to undo, and
    it asks the same when the search proves no line of jumps from here leaves
    one peg. On the larger boards a position can also be too far from any
    finish for the search to settle, and the hint says so; *Show solution…*
    then shows a finish from the board as it was dealt.

    **Check & save** asks the same question, since Pegs has no single answer
    to check your jumps against: it won't save a position the hint would
    ask you to undo from, and outlines any cut-off pegs. A position too far
    from a finish for the search to settle is saved, and the check says it
    couldn't tell.
produces: position
sizes:
  # The game deals sides above three, and loads a board of any size; 99
  # stands for no bound.
  w: { min: 2, max: 99 }
  h: { min: 2, max: 99 }
space:
  grid: { w: "w", h: "h" }
  units: []
position:
  # What is on each square: 0 an empty hole, 1 a peg, 2 no hole at all. The
  # board's shape is the squares that hold 2, which no jump changes.
  grid: { domain: "{0, 1, 2}" }
freedom: { kind: transition }
define:
  # A peg can come to stand on hole c: one stands there, or one could jump
  # in from two holes away over a third, each of which a peg can come to
  # stand on. More than a game can reach, since every peg stays where it is
  # while new ones arrive.
  arrive(c): >-
    grid(c) = 1 or (grid(c) = 0 and exists b in adj4(c)
    where on_grid(2 * x(b) - x(c), 2 * y(b) - y(c)),
    a = cell(2 * x(b) - x(c), 2 * y(b) - y(c)): arrive(a) and arrive(b))
moves:
  # The peg on f jumps the peg beside it on o into the empty hole t beyond.
  jump:
    for: >-
      f in cells where grid(f) = 1,
      o in adj4(f) where grid(o) = 1 and on_grid(2 * x(o) - x(f), 2 * y(o) - y(f)),
      t = cell(2 * x(o) - x(f), 2 * y(o) - y(f)) where grid(t) = 0
    set:
      - for: "c = f"
        grid: "0"
      - for: "c = o"
        grid: "0"
      - for: "c = t"
        grid: "1"
finish:
  - "count(c in cells where grid(c) = 1) = 1"
deadEnds:
  # A peg beside which no peg can ever come to stand is never jumped and
  # never jumps, and a jump always leaves the peg that made it, so the other
  # pegs never go below one: two are left at the least.
  frozen: >-
    count(c in cells where grid(c) = 1) > 1 and
    exists p in cells where grid(p) = 1: forall q in adj4(p): not arrive(q)
phrases:
  # The step's jump, mid-sentence, ringed on its peg and the hole it lands in.
  jump: "jump {ring peg: this peg} into {ring hole: the ringed hole}"
  # The rival jump, named as this peg's own when the same peg jumps
  # (`samePeg`); the move then names only the hole, the peg being named.
  rival: "{if samePeg: {ring peg: this peg}'s {stripes jump: striped jump} | {stripes jump: the striped jump}}"
  answer: "{if samePeg: jump into {ring hole: the ringed hole} | {jump}}"
  victim: "{outline victim: the outlined peg}"
  withArrows: "{outline jumps: {arrows: the jump with an arrow | the jumps with arrows}}"
steps:
  # A step offers the first jump of a line the search found that finishes
  # with one peg. What it says is what the search settled about the other
  # jumps, a trap the player can see first; whether "so" may be said is the
  # rival judging's, passed as the relation.
  # The jump that leaves one peg.
  last:
    ring: [peg, hole]
    move: "{jump}"
    effect: "that finishes with one peg"
  # A rival jump leaves the outlined peg frozen at once; after this jump it
  # is not, since a line that finishes starts with it.
  trap:
    ring: [peg, hole]
    terms: { samePeg: flag }
    marks: { outline: [victim], stripes: [jump] }
    look: "{rival} would cut off {victim}"
    answers: "One way to save it"
    move: "{answer}"
  # After a rival jump, every next jump leaves the outlined peg frozen.
  trapSoon:
    ring: [peg, hole]
    terms: { samePeg: flag }
    marks: { outline: [victim], stripes: [jump] }
    look: "after {rival}, any next jump cuts off {victim}"
    answers: "One way to save it"
    move: "{answer}"
  # A run of jumps clears the striped shape and leaves every other peg where
  # it began. The hint's counter shows how many jumps it takes, so the words
  # do not; the planner passes where in the run the jump stands.
  packageStart:
    ring: [peg, hole]
    terms: { shape: &shape [row, column, block] }
    marks: { stripes: [shape] }
    look: "a run of jumps clears {stripes shape: the striped {shape}} and changes nothing else"
    move: "{jump}"
  package:
    ring: [peg, hole]
    terms: { shape: *shape }
    marks: { stripes: [shape] }
    look: "to clear {stripes shape: the striped {shape}}"
    move: "{jump}"
  # Every rival was searched to the end and none can finish.
  only:
    ring: [peg, hole]
    look: "no other jump can still finish"
    move: "{jump}"
  # Every rival was settled: the jumps with arrows can finish, the rest
  # cannot. The offered jump carries an arrow too, being one of them.
  onlyThese:
    ring: [peg, hole]
    terms: { arrows: number }
    marks: { outline: [jumps] }
    look: "only {withArrows} can still finish"
    move: "{jump}"
  # The jumps with arrows can finish, at least one rival cannot, and some
  # were not settled.
  alsoThese:
    ring: [peg, hole]
    terms: { arrows: number }
    marks: { outline: [jumps] }
    look: "{withArrows} can still finish; some others cannot"
    move: "{jump}"
  # Every jump from here can still finish.
  anyJump:
    ring: [peg, hole]
    look: "every jump can still finish with one peg"
    move: "{jump}"
  # The outlined peg has no peg beside it now, and this jump lands beside
  # it; the board shows which jump that is, so the words leave the move to
  # its ring.
  joins:
    ring: move
    marks: { outline: [victim] }
    look: "{victim} is stranded, with no peg beside it"
    answers: "One way to save it"
    move: "{ring: go back for it}"
  # A rival would strand the outlined peg, where this jump keeps a peg
  # beside it.
  leavesAlone:
    ring: [peg, hole]
    terms: { samePeg: flag }
    marks: { outline: [victim], stripes: [jump] }
    look: "{rival} would strand {victim}"
    answers: "One way to keep a peg beside it"
    move: "{answer}"
  # Nothing settled about the rivals worth saying. That this jump can still
  # finish goes without saying: the hint offers no other kind.
  plain:
    ring: [peg, hole]
    move: "{jump}"
deal:
  start: >-
    Cross and Octagon: every hole a peg but one; Random: jumps played
    backward from one peg until the board reaches all four edges
