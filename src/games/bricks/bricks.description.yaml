# yaml-language-server: $schema=../../describe/description.schema.json

game: bricks
catalog:
  name: Bricks
  description: Hexagonal shading puzzle
  objective: Shade cells in the hexagonal grid, each one supported from below.
  collection: unreleased
  family: shading
  similar: Tawamurenga
help:
  rules: |-
    You're given a hexagonal grid with numbers in some of its cells. Your objective is to shade several cells while following these rules:

    1. Each shaded cell must have at least one shaded cell below it (unless it's on the bottom row).
    2. There can't be 3 or more consecutive shaded cells in a horizontal line.
    3. A number indicates the amount of shaded cells around it.
    4. Cells with numbers cannot be shaded.
  controls: |-
    {{controls}}

    The number pad moves the cursor to all six neighbors of a cell: 4 and 6 along its row, 7 and 9 to the two cells above it, and 1 and 3 to the two below. Up and Down zigzag, keeping to the column the cursor is in. Hold Shift while moving the cursor to mark clear every empty cell it leaves and enters, or Ctrl to mark those cells clear even where they are shaded.
  sections:
    - heading: What the cells show
      body: |-
        A cell you have decided is not shaded is *clear*: it takes a color of its own, with a faint cross. The numbers sit on lighter cells.
  origins: |-
    This genre was invented by [Nikoli](https://www.nikoli.co.jp/) under the name *Tawamurenga*.
  hints: |-
    **Hint** explains the next step rather than simply making it. Each step decides one cell: either it must be shaded, or it must *stay clear*, which means making it clear (right-click, or Space). The hint reasons from the numbers and your own shaded and clear cells, so it carries on from wherever you are.

    {{hint-marks}}

    A *shaded brick*, in the hint's words, is a cell you have shaded. Where a sentence says "this cell", it means the ringed one; the thinner rings in another color are the "outlined" cells it names.

    Each step is one of the rules at work on a single cell: shading it would make three in a row, leave it with nothing shaded beneath it to rest on, or give a number too many shaded neighbors; or clearing it would leave a shaded brick above with nothing to rest on, or leave a number unable to reach its count.

    If a brick or a cross is wrong, the hint asks you to fix the highlighted mistakes first, and the wrong one turns red, as it does for **Check & save**, whether or not it breaks a rule yet. A broken rule is marked as well: a bar over three in a row, a brick with nothing to rest on in red, a number in red. On an Unreasonable board it may stop and say that nothing further follows by deduction.
produces: shading
sizes:
  # The hexagon is stored as a parallelogram half its height wider, its two
  # corners holes. Unbounded but by the time a board takes to deal.
  w: { min: 2 }
  h: { min: 2 }
space:
  # The hexagon is held sheared, a parallelogram half its height wider than
  # it, the two corners outside it holes.
  grid: { w: "w", h: "h", hexagon: { outside: hole } }
  units: []
answer:
  # 1 is a shaded brick, 2 a clear square.
  value:
    sort: cell
    domain: "{d in range(1, 2) where d = 2 or (clue(hole, c) < 0 and clue(number, c) < 0)}"
define:
  # The six squares around c: a hexagon stored sheared, so the two diagonal
  # steps that run with the shear are no neighbors.
  around(c): "{p in adj8(c) where x(p) - x(c) != y(p) - y(c)}"
  # The two squares c rests on, one where c is at the left edge.
  below(c): "{p in around(c) where y(p) > y(c)}"
  # A row's i-th square.
  sq(L, i): "nth(cells(L), i)"
  # The shaded run through c along its row.
  run(c): "stretch(row(c), c, {x in cells(row(c)) where value(x) = 1})"
  # Whether c has a square beneath it that is shaded, or may yet be.
  supportable(c): "exists p in below(c): value(p) != 2"
  # The squares around k shaded, and those shaded or still open.
  shaded(k): "count(p in around(k) where value(p) = 1)"
  open(k): "count(p in around(k) where value(p) != 2)"
shape:
  # No three shaded in a row: bound by the row and a place along it, so a
  # break is marked along the three, as Unruly's is.
  - >-
    forall L in rows, i in range(0, |cells(L)| - 3):
    not (value(sq(L, i)) = 1 and value(sq(L, i + 1)) = 1 and value(sq(L, i + 2)) = 1)
  # A shaded brick rests on a shaded one, but on the bottom row.
  - "forall c in cells where value(c) = 1: y(c) = h - 1 or (exists p in below(c): value(p) = 1)"
clues:
  # A square no brick fills that shows no number: one of the stored grid's
  # corners outside the hexagon, or a number left unknown, which no deal
  # writes.
  hole:
    at: cell
    value: "range(0, 0)"
    means: "value(at) = 2"
  # A number: its square is clear, and as many around it are shaded.
  number:
    at: cell
    value: "range(0, 6)"
    means: "value(at) = 2 and count(p in around(at) where value(p) = 1) = v"
freedom: { kind: fill }
play:
  values:
    1: { does: shade it, key: "1", glyph: "###", paint: shade }
    2: { does: mark it clear, key: ["0", "2"], glyph: " x ", paint: clear }
  primary: 1
  secondary: 2
  # The answer is the shaded bricks alone: an open square is clear.
  blank: 2
  # A click goes round empty, the button's mark and the other one.
  click: cycle
  boards: [6x7, 8x10]
  # Every 2x2 board with one answer the ladder stops short of holds one
  # brick, under the deal's 40% (enumerated 2026-11-02).
  bounds:
    tiers: { Unreasonable: { area: { min: 5 } } }
  hintMarks:
    ring: >-
      the cell the step decides. The sentence says whether it must be shaded
      or stay clear.
    outline: >-
      what the step reasons from: a number, the shaded bricks beside the
      cell, the cells beneath it or the brick above it.
deal:
  answer: bricks laid from the bottom row up, at random, at least 40% of the squares
  number: on each clear square, then as many hidden as the board stays at its tier
  tier: one of the tiers
  # Row by row from the bottom, each square a brick two times in three where
  # the rules allow one (upstream's bricks_fill_grid), and drawn again where
  # under 40% are.
  sample:
    build: { value: 1, order: upward, share: 0.6666666667, least: 0.4 }
  hide: number
# Upstream's game ID: a number a shown clue, `_` between two side by side, a
# letter a run of squares without one, and `7` a hole.
id:
  - digits: number
    apart: "_"
    codes: { "7": hole 0 }
# Upstream's letters: `n` its Normal, which is Unreasonable here.
tierLetters: en
# Upstream's Tricky dealt only Normal boards, which are Unreasonable here.
tierAliases: { t: Unreasonable }
tiers: [Easy, Unreasonable]
names:
  strandSupport: "a shaded brick's only support"
  undercount: "a number short of shaded cells"
  three: "avoiding three in a row"
  unsupported: "a cell with nothing to rest on"
  overcount: "a number already met"
techniques:
  # Each technique supposes a color in an open square and sees a rule
  # broken at once, so the square is the other color: the order is the one
  # upstream's trial ranked the breaks in, clearing first. Each also holds
  # its rule on the marks as they stand, so a broken position is a
  # contradiction.
  #
  # Clearing a square would leave a shaded brick above it nothing to rest on.
  - id: strandSupport
    tier: Easy
    for: "a in cells where value(a) = 1 and y(a) < h - 1"
    conclude: >-
      supportable(a)
      and (forall c in below(a) where not known(c)
      and (forall p in below(a) where p != c: value(p) = 2):
      place(c, 1))
    # The hint outlines the brick that would be stranded.
    says:
      shown: each
      marks: { outline: "{a}" }
      look: "{outline: the outlined shaded brick above} rests only on {ring: this cell}; clearing it would strand that brick"
      move: "it must be shaded"
  # Clearing a square would leave a number too few squares to reach it.
  - id: undercount
    tier: Easy
    for: "k in cells, n = clue(number, k) where n >= 0"
    conclude: >-
      open(k) >= n
      and (open(k) > n or (forall c in around(k) where not known(c): place(c, 1)))
    # The hint names the number and outlines it.
    says:
      shown: each
      terms: { clue: k, value: n }
      marks: { outline: "{k}" }
      look: "{outline clue: the outlined {value}} beside {ring: this cell} can't reach {value} shaded {value: neighbor | neighbors} without it"
      move: "it must be shaded"
  # Shading a square would make three in a row.
  - id: three
    tier: Easy
    for: "L in rows"
    conclude: >-
      (forall c in cells(L) where value(c) = 1: |run(c)| <= 2)
      and (forall c in cells(L) where not known(c)
      and (with place(c, 1): |run(c)| > 2):
      place(c, 2))
    # Each square has the run its shading would make, which the hint outlines.
    says:
      shown: each
      fact:
        marks: { outline: "with place(c, 1): run(c)" }
        look: "Shading {ring: this cell}, next to {outline: the outlined shaded brick | the outlined shaded bricks}, would make three in a row"
        move: "it must stay clear"
  # Shading a square would leave it nothing beneath it to rest on.
  - id: unsupported
    tier: Easy
    for: "c in cells where not known(c) and y(c) < h - 1 and not supportable(c)"
    conclude: "place(c, 2)"
    # The hint outlines what the square could rest on, the squares beneath it
    # that are on the board.
    says:
      shown: each
      marks: { outline: "{p in below(c) where clue(hole, p) < 0}" }
      # An outlined cell below is an unshaded brick or a clue (a clue
      # supports nothing), so "isn't a shaded brick" says it, not "is not
      # shaded", which reads as a mark the player could place. The brick-wall
      # corners leave a cell with one support, or, at the padded triangles,
      # none to outline.
      wordings:
        - when: "|outline| = 0"
          look: "Shading {ring: this cell} would leave it with no shaded brick beneath it to rest on"
          move: "it must stay clear"
        - when: "|outline| = 1"
          look: "{outline: the outlined cell} below {ring: this cell} is all it could rest on, and it isn't a shaded brick"
          move: "it must stay clear"
        - look: "{outline: the outlined cells} below {ring: this cell} are all it could rest on, and neither is a shaded brick"
          move: "it must stay clear"
  # Shading a square would give a number too many shaded around it.
  - id: overcount
    tier: Easy
    for: "k in cells, n = clue(number, k) where n >= 0"
    conclude: >-
      shaded(k) <= n
      and (shaded(k) < n or (forall c in around(k) where not known(c): place(c, 2)))
    # The hint names the number and outlines it.
    says:
      shown: each
      terms: { clue: k, value: n }
      marks: { outline: "{k}" }
      # A 0 allows none at all: "more than its 0 shaded neighbors" is nonsense.
      wordings:
        - when: "value = 0"
          look: "{outline clue: the outlined 0} beside {ring: this cell} allows no shaded neighbors at all"
          move: "it must stay clear"
        - look: "Shading {ring: this cell} would give {outline clue: the outlined {value}} beside it more than its {value} shaded {value: neighbor | neighbors}"
          move: "it must stay clear"
