# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # A square whose loss leaves a region exactly enough read as one it needs.
  mustGrow:
    for: >-
      O = alike, d in domain, F = room(d), c in cells where value(c) = d, A =
      through(c, O) where c = nth(A, 0) and |A| != d and not grown(A), R =
      through(c, F), Y = {t in R where not known(t) and reaches(c, R, t) <= d}
  # A square that would complete the region read as one it can't take.
  onlyWay:
    for: >-
      O = alike, c in cells where known(c), A = through(c, O) where c = nth(A,
      0) and |A| < value(c) and not grown(A), d = value(c), T = set(t over a in
      A, t in adj4(a) where not known(t) and 1 + |joins(t, d, O)| < d) where |T|
      <= 1
  # A d that would complete a region of d read as making it too big.
  tooBig:
    for: >-
      O = alike, c in cells where not known(c), d in cand(c) where 1 + |joins(c,
      d, O)| >= d
  # Exactly enough room read as too little.
  noRoom:
    for: >-
      d in domain, F = room(d), c in cells where not known(c) and d in cand(c)
      and |through(c, F)| <= d
  # A group exactly near enough to join read as too far.
  tooFar:
    for: >-
      O = alike, d in domain, F = fresh(d), c in cells where not known(c) and d
      in cand(c) and |through(c, F)| < d and not (exists a in cells where
      value(a) = d: holding(a, c, O) < d)
  # A square with two numbers left read as taking the smaller.
  onlyNumber:
    for: c in cells where not known(c) and |cand(c)| <= 2
    conclude: "|cand(c)| >= 1 and place(c, min(d in cand(c)))"
