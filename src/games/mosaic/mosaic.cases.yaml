# Mosaic's cases, which the engine's tests read
# (src/engine/testing/game-cases.ts): a position for every kind of step its
# hint takes, upstream's IDs read as the right numbers, the numbers a step
# reasons from circled, and the numbers left counted.

values:
  shaded: 1
  clear: 2

hint:
  params:
    - {w: 10, h: 10, diff: 0, thorough: true}
    - {w: 10, h: 10, diff: 2, thorough: true}
  pins:
    alone.met: "10x10:0c4a5c2a3456b5a25a655b3b55a5a20a22a44b11c4a232c14a3c5f5c8d44d4b3d5c"
    alone.exact: "10x10:c3c4442a4a5a44b3a4a4d53b3a133b23a3b4a7a1a2a5b3c323g212a5b5a0b32a2e02e2"
    compared.more: "10x10du:a42b35d5a4c6a4b335b4743f67b5543b5b5b6a4f4a443b3a44a4b55e2345a4a433a1d"
    compared.same:
      id: "10x10du:a6b2c2c5c1g3c2a33a5a32d435c55c44a43d23a2a455a1d4a5b2f34d64e"
      moves:
        - {set: [0, 1, 1, 1, 2, 1, 10, 1, 11, 1, 12, 1]}
        - {set: [82, 1, 83, 1, 84, 1, 92, 1, 93, 1, 94, 1]}
        - {set: [85, 2, 95, 2]}

ids:
  # A digit is a shown number, a letter a run of squares without one, and
  # the last run is written.
  - id: "3x3:1a2a4a1a3"
    holds:
      dealt.count.at: [0, 2, 4, 6, 8]
      dealt.count.v: [1, 2, 4, 1, 3]
  # One run over the whole board shows no number, so any picture fits it.
  - id: "3x3:i"
    refused: DESC_NOT_UNIQUE
    holds:
      dealt.count.at: []

positions:
  # The numbers left are counted, and nothing is said once every one is done.
  - id: "3x3:1a2a4a1a3"
    statusbar: "Clues left: 5"
  - id: "3x3:1a2a4a1a3"
    solve: true
    statusbar: ""
  # A step circles each number it reasons from, the number its sentence
  # names, and outlines that number's block.
  - id: "10x10:0c4a5c2a3456b5a25a655b3b55a5a20a22a44b11c4a232c14a3c5f5c8d44d4b3d5c"
    steps: [{rung: alone.met, says: "/^This 0 /"}]
    circled: ["0"]
    draws: {rect hint-outline: "> 0"}
  - id: "10x10:c3c4442a4a5a44b3a4a4d53b3a133b23a3b4a7a1a2a5b3c323g212a5b5a0b32a2e02e2"
    steps: [{rung: alone.exact, says: "/^This 4 /"}]
    circled: ["4"]
    draws: {rect hint-outline: "> 0"}
  - id: "10x10du:a42b35d5a4c6a4b335b4743f67b5543b5b5b6a4f4a443b3a44a4b55e2345a4a433a1d"
    steps: [{rung: compared.more, says: "/^This 4 .* this 2,/"}]
    circled: ["2", "4"]
    draws: {rect hint-outline: "> 0"}
  - id: "10x10du:a6b2c2c5c1g3c2a33a5a32d435c55c44a43d23a2a455a1d4a5b2f34d64e"
    moves:
      - {set: [0, 1, 1, 1, 2, 1, 10, 1, 11, 1, 12, 1]}
      - {set: [82, 1, 83, 1, 84, 1, 92, 1, 93, 1, 94, 1]}
      - {set: [85, 2, 95, 2]}
    steps: [{rung: compared.same, says: "/^Both 3s /"}]
    circled: ["3", "3"]
    draws: {rect hint-outline: "> 0"}
