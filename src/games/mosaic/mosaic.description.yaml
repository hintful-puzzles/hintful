# yaml-language-server: $schema=../../describe/description.schema.json

game: mosaic
help:
  rules: |-
    Decide every square: it is either shaded or clear.
    Each number indicates how many shaded squares are in the 3×3 square
    surrounding the number – *including* the clue square
    itself.
  controls: |-
    {{controls}}

    Clicking a decided square again moves it on round shaded, clear and
    empty, and a right-click goes round the other way.

    The drag works for clearing too: start on a shaded square and the
    shaded squares you pass over are cleared with it. A whole drag is one
    step of Undo.
  sections:
    - heading: What the squares show
      body: |-
        A square you have made clear takes a color of its own, which tells it from a
        square you have not decided yet. It carries a faint cross too, unless it
        has a number, which then has the square to itself. A number is drawn on top
        of whatever its square holds, and fades once its 3×3 square is fully
        decided and agrees with it.
  hints: |-
    **Hint** explains the next step rather than simply making it. It
    reasons only from the numbers and the squares you have already made
    shaded or clear, so it carries on from wherever you are, as long as
    none of them is wrong; if one is, it asks you to fix the highlighted
    mistakes first. A number's *squares*, in its words, are its block: the
    number's own square and the eight around it, fewer at the edge of the
    grid.

    {{hint-marks}}

    Most steps come from one number alone:

    * **A number that has all its shaded squares** makes the rest of its
      block clear.
    * **A number with only as many squares left that are not clear as it
      needs** makes all of those shaded.

    Where no number settles a square alone, the hint compares two numbers
    whose blocks overlap. Both count the squares the blocks share, so the two
    differ only by the squares one of them counts and the other does not:

    * **A number that needs more shaded squares than another, by as many
      as it has empty squares outside the other's block**, makes all of
      those shaded. A 6 beside a 3, with three of its empty squares
      outside the 3's block, is the plainest case. The squares the two
      share then hold all the other number needs, so its own empty squares
      outside the first's block are clear, in the same step.
    * **Two numbers that need the same number of shaded squares, where
      every empty square of the first is in the second's block too**, make
      the second's other squares clear: the second gets all it needs from
      the squares they share.

    Where the two are the same number, the hint names each by where it
    sits: the upper 7 and the lower 7, or the left 7 and the right 7.

    An Easy puzzle as the game deals it is finished one number at a time,
    and never needs a comparison. A Normal one needs comparisons, and they
    finish it. On an Unreasonable board there comes a point where comparing
    numbers settles no square either, and the hint says that nothing further
    follows by deduction instead of choosing for you. Save your position and try a square beside a number with few
    squares left. The hint carries on from whatever you mark.
catalog:
  name: Mosaic
  aliases: [Fill-a-Pix]
  description: Grid-filling puzzle
  objective: Fill in the grid given clues about the number of nearby shaded squares.
  collection: original
  family: shading
  similar: ArtMosaico, Cuenta y Sombera, Komsu Karala, Majipiku, Voisimage, etc.
produces: shading
sizes:
  # At most 10,000 squares.
  w: { min: 3, max: 3333 }
  h: { min: 3, max: 3333 }
space:
  grid: { w: "w", h: "h" }
  units: []
answer:
  # 1 is a shaded square, 2 a clear one.
  value: { sort: cell, domain: "range(1, 2)" }
define:
  # A number's block: its own square and the eight around it, fewer at the
  # edge of the grid.
  block(c): "within(c, 1)"
  # The shaded squares the number at c still needs.
  need(c): "clue(count, c) - count(d in block(c) where value(d) = 1)"
  # The empty squares of a set.
  open(S): "{d in S where not known(d)}"
  # Whether the block of c has an empty square.
  blockOpen(c): "exists d in block(c): not known(d)"
clues:
  count: { at: cell, value: "range(0, 9)", means: "count(d in block(at) where value(d) = 1) = v" }
freedom: { kind: fill }
play:
  values:
    1: { does: shade it, key: S, glyph: "###", paint: shade }
    2: { does: make it clear, key: X, glyph: " x ", paint: clear }
  primary: 1
  secondary: 2
  # A click goes round empty, the button's mark and the other one.
  click: cycle
  stroke: sweep
  # Upstream's six sizes, three of them made upright boards of about the same
  # area. The two smallest and the largest are on the menu at Easy alone,
  # since six sizes at three tiers are more lines than a section holds: a
  # Normal board of the two smallest has a comparison or two in it, against
  # seven at 10x10, and at Unreasonable the hint has nothing to say from the
  # start on most 3x3 boards and one 5x5 board in four.
  boards: [3x3, 5x5, 8x10, 12x15, 20x25, 50x50]
  default: 8x10
  boardTiers: { 3x3: [Easy, Easy], 5x5: [Easy, Easy], 50x50: [Easy, Easy] }
  hintMarks:
    ring: >-
      the squares the step decides; the sentence says whether they must be
      shaded or clear.
    outline: >-
      the block of each number the step reasons from: the number's own square
      and the eight around it. The number itself is circled.
deal:
  answer: each square shaded at even odds
  count: >-
    every square's number, then those the deduction never read hidden, then
    each other hidden in a random order while the board still finishes at the
    tier, a tier at a time from Easy
  tier: >-
    one of the tiers, the board finished at it and not at the tier below; an
    Unreasonable board is an Easy one with numbers hidden while a search still
    proves it has one answer
  sample:
    scatter: { value: 1, share: 0.5, each: true }
    rest: 2
  hide: count
  # Upstream recommends it off from about 30x30, and its presets turn it off
  # at 50x50.
  thorough:
    letter: h
    kw: aggressive-generation
    name: Aggressive generation
    doc: >-
      Every puzzle hides the numbers the game never used while solving it.
      When on, the game also tries taking away each number that remains, and
      keeps it away whenever the puzzle still has its one solution at its
      difficulty without it, so fewer numbers are shown, which usually makes
      the puzzle harder; when off, it tries only a few. On, a large puzzle
      takes much longer to find.
    offFrom: 50
# Upstream's game ID: a digit a shown number, a letter a run of hidden ones.
id:
  - digits: count
tiers: [Easy, Normal, Unreasonable]
# A number's count over its block, which the hint names by the number and
# reads whole: the group a count kind reads.
kindWords:
  group: "k in clues(count), c = at(k)"
  set: "block(c)"
  need: "need(c)"
  rest: 2
  fill: 1
  zero: "v(k) = 0"
  mark: outline clue
  marks: { reads: "block(c)" }
  unit: "this {value}"
  has: "its {value} {shaded} {value: square | squares}"
  items: "{shaded} {n: square | squares}"
  restWord: "must be {unshaded}"
  fillWord: "must be {shaded}"
  terms: { clue: c, value: v(k) }
names:
  alone: "one number's count on its own"
  compared: "two overlapping numbers compared"
techniques:
  # One number alone, n the shaded squares it still needs: with none, the
  # rest of its block is clear; with only as many squares left that are not
  # clear as it needs, they are all shaded. Each number's two readings come
  # before the next number's, since an Easy deal hides the numbers the
  # deduction never read.
  - kind: count.both
    as: alone
    tier: Easy
    with:
      terms: { placed: "n < v(k)" }
  # Two numbers whose blocks overlap both count the squares they share, so
  # they differ by the squares only one counts: compared. A pair with a block
  # that has no empty square decides nothing `alone` has not.
  - kind: count.compare
    as: compared
    tier: Normal
    with:
      group: >-
        k in clues(count), c = at(k) where blockOpen(c),
        b in within(c, 2) where b != c and clue(count, b) != none and blockOpen(b)
      openA: open(block(c))
      openB: open(block(b))
      least: need(c)
      most: need(b)
      # Two numbers of one value are named by where they sit, as the look does.
      outsideA: "outside the {if same: {if vertical: {if first: upper | lower} | {if first: left | right}} {value} | {value}}'s block"
      outsideB: "outside the {if same: {if vertical: {if first: lower | upper} | {if first: right | left}} {value} | {otherValue}}'s block"
    # The hint names both numbers, what each says, and how many shaded squares
    # the first still needs and by how many that is more than the second; it
    # reads both blocks.
    says:
      # Two numbers of one value are named by where they sit, the upper and the
      # lower or the left and the right (`vertical`: they sit in different rows;
      # `first`: the first is the upper, or the left where they share a row).
      terms:
        clue: c
        other: b
        value: v(k)
        otherValue: "clue(count, b)"
        need: need(c)
        pair: "{c, b}"
        same: "v(k) = clue(count, b)"
        vertical: "y(c) != y(b)"
        first: "y(c) < y(b) or (y(c) = y(b) and x(c) < x(b))"
      marks: { reads: "block(c) + block(b)" }
      arms:
        more:
          wordings:
            - when: "same"
              look: "{outline clue: the {if vertical: {if first: upper | lower} | {if first: left | right}} {value}} needs {by} more {shaded} {by: square | squares} than {outline other: the {if vertical: {if first: lower | upper} | {if first: right | left}} {value}}"
            - look: "{outline clue: this {value}} needs {by} more {shaded} {by: square | squares} than {outline other: this {otherValue}}"
        same:
          wordings:
            - when: "same"
              look: "{outline pair: Both {value}s} need {need} {shaded} {need: square | squares}, and the {if vertical: {if first: upper | lower} | {if first: left | right}} {value}'s all lie in the {if vertical: {if first: lower | upper} | {if first: right | left}} {value}'s block"
            - look: "{outline clue: this {value}} and {outline other: this {otherValue}} both need {need} {shaded} {need: square | squares}, and the {value}'s all lie in the {otherValue}'s block"
