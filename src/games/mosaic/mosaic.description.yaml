# yaml-language-server: $schema=../../describe/description.schema.json

game: mosaic
help:
  rules: |-
    Decide every square: it either holds a {{pair:0}} square or is clear.
    Each number indicates how many {{pair:0}} squares are in the 3×3 square
    surrounding the number – *including* the clue square
    itself.
  controls: |-
    {{controls}}

    The drag works for clearing too: start on a shaded square and the
    shaded squares you pass over are cleared with it. A whole drag is one
    step of Undo.
  sections:
    - heading: What the squares show
      body: |-
        A square you have made clear turns {{pair:1}}, which tells it from a
        square you have not decided yet. It carries a faint cross too, unless it
        has a number, which then has the square to itself. A number is drawn on top
        of whatever its square holds, and fades once its 3×3 square is fully
        decided and agrees with it.
  hints: |-
    **Hint** explains the next step rather than simply making it. It
    reasons only from the numbers and the squares you have already made
    {{pair:0}} or clear, so it carries on from wherever you are, as long as
    none of them is wrong; if one is, it asks you to fix the highlighted
    mistakes first. A number's *squares*, in its words, are its block: the
    number's own square and the eight around it, fewer at the edge of the
    grid.

    {{hint-marks}}

    Most steps come from one number alone:

    * **A number that has all its {{pair:0}} squares** makes the rest of its
      block clear.
    * **A number with only as many squares left that are not clear as it
      needs** makes all of those {{pair:0}}.

    Where no number settles a square alone, the hint compares two numbers
    whose blocks overlap. Both count the squares the blocks share, so the two
    differ only by the squares one of them counts and the other does not:

    * **A number that needs more {{pair:0}} squares than another, by as many
      as it has empty squares outside the other's block**, makes all of
      those {{pair:0}}. A 6 beside a 3, with three of its empty squares
      outside the 3's block, is the plainest case.
    * **Two numbers that need the same number of {{pair:0}} squares, where
      every empty square of the first is in the second's block too**, make
      the second's other squares clear: the second gets all it needs from
      the squares they share.

    Where the two are the same number, the hint names each by where it
    sits: the upper 7 and the lower 7, or the left 7 and the right 7.

    An Easy puzzle as the game deals it is finished one number at a time,
    and never needs a comparison. A Normal one needs comparisons, and they
    finish it. On an Unreasonable board there comes a point where comparing
    numbers settles no square either, and the hint says that nothing further
    follows by deduction instead of choosing for you. Save your position and try a square beside a number with few
    squares left. The hint carries on from whatever you mark.
name: Mosaic
family: shading
sizes:
  # At most 10,000 squares.
  w: { min: 3, max: 3333 }
  h: { min: 3, max: 3333 }
space:
  grid: { w: "w", h: "h" }
  units: []
answer:
  # 1 is a shaded square, 2 a clear one.
  value: { sort: cell, domain: "range(1, 2)" }
define:
  # A number's block: its own square and the eight around it, fewer at the
  # edge of the grid.
  block(c): "within(c, 1)"
  # The shaded squares the number at c still needs.
  need(c): "clue(count, c) - count(d in block(c) where value(d) = 1)"
  # Whether square d is in the block of b.
  near(d, b): "abs(x(d) - x(b)) <= 1 and abs(y(d) - y(b)) <= 1"
  # The empty squares of c's block outside b's.
  only(c, b): "{d in block(c) where not known(d) and not near(d, b)}"
  # Whether the block of c has an empty square.
  open(c): "exists d in block(c): not known(d)"
clues:
  count: { at: cell, value: "range(0, 9)", means: "count(d in block(at) where value(d) = 1) = v" }
freedom: { kind: fill }
deal:
  clues: which squares show their number, fewer at higher tiers
  tier: one of the tiers
tiers: [Easy, Normal]
techniques:
  # One number alone, n the shaded squares it still needs: with none, the
  # rest of its block is clear; with only as many squares left that are not
  # clear, r, as it needs, they are all shaded. One with more shaded than
  # it says, or fewer squares left, makes the marks inconsistent. One with
  # none to need and none to spare has no empty square, and decides nothing.
  - id: alone
    tier: Easy
    for: >-
      k in clues(count), c = at(k), n = need(c),
      r = count(d in block(c) where value(d) != 2)
      where (n <= 0 or r <= v(k)) and (n != 0 or r != v(k))
    conclude: >-
      n >= 0 and r >= v(k)
      and (n = 0 implies (forall d in block(c) where not known(d): place(d, 2)))
      and (n = 0 or (forall d in block(c) where not known(d): place(d, 1)))
  # Two numbers whose blocks overlap both count the squares they share, so
  # they differ by the squares only one counts. One that needs more than the
  # other, by as many as it has empty squares outside the other's block, O,
  # needs them all; by more, the marks are inconsistent. Two that need the
  # same, the first with none outside the second's block: the second gets
  # all it needs from the squares they share, so its own are clear. A pair
  # with a block that has no empty square decides nothing `alone` has not.
  - id: compared
    tier: Normal
    for: >-
      k in clues(count), c = at(k) where open(c),
      b in within(c, 2) where b != c and clue(count, b) != none and open(b),
      n = need(c), by = n - need(b), O = only(c, b)
      where by >= |O| and (by > 0 or |only(b, c)| > 0)
    conclude: >-
      by = |O| and (forall d in O: place(d, 1))
      and (by > 0 or (forall d in only(b, c): place(d, 2)))
