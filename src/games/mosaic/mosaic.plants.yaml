# A defect planted in each of the techniques the description states, keyed by
# its id: the statement with a condition loosened, or a quantity read too
# finely, which the soundness checks under research/technique-check must find
# unsound.

techniques:
  # One square more outside the other's block than the difference.
  compared:
    for: >-
      k in clues(count), c = at(k), b in within(c, 2) where b != c and
      clue(count, b) != none, n = need(c), by = n - need(b), O = only(c, b)
      where by >= |O| - 1 and (by > 0 or |only(b, c)| > 0)
    conclude: >-
      (forall d in O: place(d, 1)) and (by > 0 or (forall d in only(b, c):
      place(d, 2)))
