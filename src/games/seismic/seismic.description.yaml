# yaml-language-server: $schema=../../describe/description.schema.json

game: seismic
catalog:
  name: Seismic
  aliases: [Hakyuu, Ripple Effect]
  description: Number placement puzzle
  objective: Place numbers in each area, spacing equal numbers far enough apart.
  collection: unreleased
  family: numbers
  similar: Hakyuu, Ripple Effect, Tectonic, Suguru
help:
  rules: |-
    You're given a grid that has been divided into areas. Fill each empty cell with a number so each area of size N contains one instance of each number between 1 and N. Depending on the game mode, the following rule is added:

    {{rulesets}}
  controls: |-
    Left-click to select a cell, then type a number on your keyboard to enter it. A number larger than the cell's area is not accepted. Press Backspace, Delete, Space or 0 to clear a cell.

    Right-click a cell, then type a number to add a pencil mark. Pencil marks can be used for any purpose. {{sticky-pencil}}

    You can also use the arrow keys to move the selected cell around. Press Enter to toggle between entering numbers and entering pencil marks.

    {{mark-all}} A cell's marks are the numbers from 1 to the size of its area. Once every empty cell has marks, the press crosses out of each the numbers already placed in its area, and the ones a placed number is too near for.
  origins: |-
    {{choice:ruleset:0}} mode is an implementation of *Hakyuu*, a puzzle invented by [Nikoli](https://www.nikoli.co.jp/). It's also known as *Ripple Effect*. More information: http://www.janko.at/Raetsel/Hakyuu/index.htm

    The inventor of {{choice:ruleset:1}} is unknown.
  hints: |-
    **Hint** explains the next step rather than simply making it. It works from your own pencil marks, and a cell with none counts as holding every number its area and the numbers near it haven't ruled out yet, so an Easy board needs no marks at all. When a step reasons from a cell's possibilities, the hint writes that cell's marks first. If you would rather it start by filling in every cell's marks (the same as pressing **Fill marks**), set **Hints pencil in** to **Every candidate first** in the preferences. As long as none of your marks has crossed out a cell's answer, it carries on from wherever you are.

    {{hint-marks}}

    Most steps are the plain rules at work: a cell with only one pencil mark left, or a number with only one cell left to go in within its area. On Normal boards one more idea appears. When every cell an area has left for some number is close enough to a cell outside it to clash, that cell cannot hold the number: whichever cell the area uses, the two would break the keep-apart rule.
produces: numbers
words:
  cell: cell
sizes:
  w: { min: 4, max: 30 }
  h: { min: 4, max: 30 }
  # Which rule keeps equal numbers apart: 0 Seismic's, 1 Tectonic's.
  mode: { min: 0, max: 1 }
space:
  grid: { w: "w", h: "h" }
  # The areas are a dealt partition rather than units: the soundness checker
  # builds a unit partition only from blocks, and an area's rule is its own
  # anyway, since it holds 1 to its size rather than every value.
  regions: { area: dealt }
  units: []
answer:
  # An area of N squares holds the numbers 1 to N.
  value: { sort: cell, domain: "range(1, |cells(area(c))|)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, |cells(area(c))|)" }
define:
  # Whether an n at a keeps an n from b: Seismic's, along a row or column as
  # far as the number; Tectonic's, the eight squares around.
  near(a, b, n): >-
    a != b and ((mode = 0 and ((y(a) = y(b) and abs(x(a) - x(b)) <= n)
    or (x(a) = x(b) and abs(y(a) - y(b)) <= n)))
    or (mode = 1 and abs(x(a) - x(b)) <= 1 and abs(y(a) - y(b)) <= 1))
shape:
  - "forall r in area: distinct(value(c) over c in cells(r))"
  - "forall a in cells, b in cells where near(a, b, value(a)): value(b) != value(a)"
freedom: { kind: fill }
play:
  numbers: {}
  # An Easy board falls to singles the board shows, so the walk that pencils
  # in only as it needs writes no notes there and is about half as long; on
  # Normal the two are about even.
  hintNotes: implicit
  # Upstream's 4x4 and 6x6, its 7x7 made an upright 6x8, and past upstream's
  # range (its generator stopped at 7x7) an upright 7x9, in both modes, at
  # both tiers: the tail of a deal, not its median, sets the largest.
  boards: [4x4, 4x4T, 6x6, 6x6T, 6x8, 6x8T, 7x9, 7x9T]
  default: 6x6
  sizes:
    mode:
      letters: ["", T]
      rulesets:
        - name: Seismic
          rule: Two equal numbers N in the same row or column must have at least N spaces between them.
        - name: Tectonic
          rule: Two equal numbers cannot be horizontally, vertically or diagonally adjacent.
  hintMarks:
    ring: the cell the step fills in, with the number to enter there or the marks to write.
    strike: the pencil marks the step crosses out.
    outline: >-
      what the step reasons from: "this cell", whose pencil marks it crosses
      out, and the number just placed, when a step crosses that number out of
      the cells it rules out.
    stripes: the area the step reasons from.
# Upstream seismic.c's: the areas grown first, to sizes drawn from a list
# (Seismic's two to five, Tectonic's five), the answer searched under them,
# then the givens hidden while the board still finishes.
deal:
  areas: the partition, connected areas of a size drawn from a list
  answer: searched under the areas
  given: every square's number, then each hidden while the board still finishes
  tier: one of the tiers
  # A draw of 1 is left out, since a pocket the growth strands is an area of
  # its own already; Tectonic's areas are five where they have room.
  divide: { partition: area, by: mode, sizes: [[2, 3, 3, 4, 4, 5], [5]] }
  sample: { search: true }
  hide: given
id:
  - walls: area
  # Upstream writes the givens after the comma even where there are none.
  - { digits: given, before: ",", always: true }
tierLetters: eh
tiers: [Easy, Normal]
names:
  dup: "a placed number's area and reach"
  single: "the only number left in a cell"
  regionsFull: "every other number placed nearby"
  hiddenSingle: "the only cell left for a number"
  starve: "a number an area needs"
# The walk's words for how far a placed number reaches: its area, and along
# its row and column as far as the number, or with Tectonic the cells
# touching it. "Within reach" is the N cells a number N keeps clear, which a
# sentence about every number at once cannot write as a count.
steps:
  clean:
    ring: cell
    terms: { mode: number }
    wordings:
      - when: mode = 1
        move: "any number already in its cell's area or in a cell touching it"
      - move: "any number N already in its cell's area or within N cells of it in its row or column"
  note:
    ring: cell
    terms: { mode: number, vs: values, unruled: flag }
    wordings:
      - when: unruled
        look: "No number stands near enough to rule one out of {ring} yet"
        move: "pencil in every one"
      - when: mode = 1
        look: "Only {vs} {vs: isn't | aren't} already in {ring}'s area or in a cell touching it"
        move: "pencil {vs: it | them} in"
      - look: "Only {vs} {vs: isn't | aren't} already in {ring}'s area or within reach along its row or column"
        move: "pencil {vs: it | them} in"
  cull:
    ring: cell
    terms: { mode: number, n: number }
    wordings:
      - when: mode = 1
        move: "area or in the cells touching it"
      - move: "area or in line within {n} {n: cell | cells}"
  regionsFull:
    ring: cell
    terms: { mode: number, n: number }
    wordings:
      - when: mode = 1
        look: "Every other number is already in {ring}'s area or in a cell touching it"
        move: "it can only be {n}"
      - look: "Every other number is already in {ring}'s area or within reach along its row or column"
        move: "it can only be {n}"
techniques:
  # A placed number leaves the rest of its area and every square it is near.
  - kind: peer.placed
    as: cull
    tier: Easy
    with:
      peer: "p in cells where p != c and (area(p) = area(c) or near(c, p, n))"
  # A square down to one number holds it.
  - kind: one.cell
    as: lone
    tier: Easy
    rung: single
  # A number with one place left in its area goes there. With none left, the
  # marks are inconsistent.
  - kind: one.place
    as: areaSingle
    tier: Easy
    rung: hiddenSingle
    with:
      group: "r in area, n in range(1, |cells(r)|) where not (exists c in cells(r): value(c) = n)"
      set: cells(r)
      value: n
  # Every place an area has left for its n is near a square outside it, so
  # that square cannot hold n: an n there would leave the area none. Every
  # such square is struck at once, by the one area.
  - id: starve
    tier: Normal
    for: >-
      r in area, n in range(1, |cells(r)|) where not (exists c in cells(r): value(c) = n),
      H = {h in cells(r) where not known(h) and n in cand(h)} where |H| > 0
    conclude: >-
      forall c in cells where area(c) != r and not known(c) and n in cand(c)
      and (forall h in H: near(c, h, n)): strike(c, n)
    says:
      terms: { n: n, tectonic: "mode = 1" }
      # The area's notes are where it can put its n: the premise.
      marks: { stripes: "cells(r)", reads: "cells(r)" }
      look: >-
        Each cell {stripes: this area} has left for its {n} is {if tectonic:
        touching {ring} | in line with {ring} and within {n} of it}
