# yaml-language-server: $schema=../../describe/description.schema.json

game: seismic
help:
  rules: |-
    You're given a grid that has been divided into areas. Fill each empty cell with a number so each area of size N contains one instance of each number between 1 and N. Depending on the game mode, the following rule is added:

    {{rulesets}}
  controls: |-
    Left-click to select a cell, then type a number on your keyboard to enter it. A number larger than the cell's area is not accepted. Press Backspace, Delete, Space or 0 to clear a cell.

    Right-click a cell, then type a number to add a pencil mark. Pencil marks can be used for any purpose. {{sticky-pencil}}

    You can also use the arrow keys to move the selected cell around. Press Enter to toggle between entering numbers and entering pencil marks.

    {{mark-all}} A cell's marks are the numbers from 1 to the size of its area. Once every empty cell has marks, the press crosses out of each the numbers already placed in its area, and the ones a placed number is too near for.
  origins: |-
    {{choice:ruleset:0}} mode is an implementation of *Hakyuu*, a puzzle invented by [Nikoli](https://www.nikoli.co.jp/). It's also known as *Ripple Effect*. More information: http://www.janko.at/Raetsel/Hakyuu/index.htm

    The inventor of {{choice:ruleset:1}} is unknown.
  hints: |-
    **Hint** explains the next step rather than simply making it. It works from your own pencil marks, and a cell with none counts as holding every number its area and the numbers near it haven't ruled out yet, so an Easy board needs no marks at all. When a step reasons from a cell's possibilities, the hint writes that cell's marks first. If you would rather it start by filling in every cell's marks (the same as pressing **Fill marks**), set **Hints pencil in** to **Every candidate first** in the preferences. As long as none of your marks has crossed out a cell's answer, it carries on from wherever you are.

    {{hint-marks}}

    Most steps are the plain rules at work: a cell with only one pencil mark left, or a number with only one cell left to go in within its area. On Normal boards one more idea appears. When every cell an area has left for some number is close enough to a cell outside it to clash, that cell cannot hold the number: whichever cell the area uses, the two would break the keep-apart rule.
name: Seismic
family: numbers
sizes:
  w: { min: 4, max: 30 }
  h: { min: 4, max: 30 }
  # Which rule keeps equal numbers apart: 0 Seismic's, 1 Tectonic's.
  mode: { min: 0, max: 1 }
space:
  grid: { w: "w", h: "h" }
  # The areas are a dealt partition rather than units: the soundness checker
  # builds a unit partition only from blocks, and an area's rule is its own
  # anyway, since it holds 1 to its size rather than every value.
  regions: { area: dealt }
  units: []
answer:
  # An area of N squares holds the numbers 1 to N.
  value: { sort: cell, domain: "range(1, |cells(area(c))|)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, 9)" }
define:
  # Whether an n at a keeps an n from b: Seismic's, along a row or column as
  # far as the number; Tectonic's, the eight squares around.
  near(a, b, n): >-
    a != b and ((mode = 0 and ((y(a) = y(b) and abs(x(a) - x(b)) <= n)
    or (x(a) = x(b) and abs(y(a) - y(b)) <= n)))
    or (mode = 1 and abs(x(a) - x(b)) <= 1 and abs(y(a) - y(b)) <= 1))
shape:
  - "forall r in area: distinct(value(c) over c in cells(r))"
  - "forall a in cells, b in cells where near(a, b, value(a)): value(b) != value(a)"
freedom: { kind: fill }
deal:
  areas: the partition, connected areas of at most nine squares
  givens: which squares show their number, fewer at higher tiers
  mode: the keep-apart rule
  tier: one of the tiers
tiers: [Easy, Normal]
techniques:
  # A placed number leaves the rest of its area and every square it is near.
  - id: cull
    on: place
    tier: Easy
    for: >-
      c in cells where known(c), n = value(c),
      p in cells where p != c and (area(p) = area(c) or near(c, p, n))
    conclude: "strike(p, n)"
  # A square down to one number holds it. One with none left makes the marks
  # inconsistent.
  - id: lone
    tier: Easy
    for: "c in cells where not known(c) and |cand(c)| < 2"
    conclude: "|cand(c)| = 1 and place(c, first(cand(c)))"
  # A number with one place left in its area goes there. With none left, the
  # marks are inconsistent.
  - id: areaSingle
    tier: Easy
    for: >-
      r in area, n in range(1, |cells(r)|) where not (exists c in cells(r): value(c) = n),
      k = count(c in cells(r) where n in cand(c)) where k < 2
    conclude: "k = 1 and place(the(c in cells(r) where n in cand(c)), n)"
  # Every place an area has left for its n is near a square outside it, so
  # that square cannot hold n: an n there would leave the area none. Every
  # such square is struck at once, by the one area.
  - id: starve
    tier: Normal
    for: >-
      r in area, n in range(1, |cells(r)|) where not (exists c in cells(r): value(c) = n),
      H = {h in cells(r) where not known(h) and n in cand(h)} where |H| > 0
    conclude: >-
      forall c in cells where area(c) != r and not known(c) and n in cand(c)
      and (forall h in H: near(c, h, n)): strike(c, n)
