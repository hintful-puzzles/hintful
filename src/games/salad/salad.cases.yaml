    - {w: 5, h: 5, diff: 0, sizes: {n: 3, mode: 1}}
    - {w: 5, h: 5, diff: 1, sizes: {n: 4, mode: 1}}
  unreached:
    note: >-
      spoken under the reading that pencils in only as needed, and Salad's hint starts on the one that pencils every candidate in first (play.hintNotes)
    regionsFull: >-
      spoken under the reading that pencils in only as needed: where every candidate is penciled in first, a square every other symbol is ruled out of is a single
