# yaml-language-server: $schema=../../describe/description.schema.json

# Salad's two rulesets: ABC End View deals border letters, Number Ball deals
# balls, and a board holds the clues its ruleset deals.
game: salad
catalog:
  name: Salad
  description: Pseudo-Latin square puzzle
  objective: Place each character once per row and column, leaving some empty.
  collection: unreleased
  family: latin
  similar: ABC End View, Nanbaboru (ナンバーボール), Number Ball
help:
  rules: |-
    Put characters from A (or 1) up to a given maximum in some of the squares, so each character appears exactly once in each row and column.

    The rules vary depending on the game mode, and the Type menu has a section for each:

    {{rulesets}}
  controls: |-
    Left-click to select a square, then type a letter or number on your keyboard to enter it. Press Backspace or Space to clear a square.

    Press 'X' to mark a square as empty. A letter and its number are the same key to the game, whichever the board shows: A is 1, B is 2, and so on.

    Right-click a square, then type a letter or number to add a pencil mark. Pencil marks can be used for any purpose. The letter 'X' can also be used to indicate a square that might be empty, and 'O' to draw a ball, a note that the square is not empty: it crosses out the square's 'X' mark. {{sticky-pencil}}

    You can also use the arrow keys to move the selected square around. Press Enter to toggle between entering letters/numbers and entering pencil marks.

    {{mark-all}} Once every empty square has marks, the press crosses out of each what is already placed in its row and column.
  origins: |-
    {{choice:ruleset:0}} is the puzzle called ABC End View, whose designer is unknown. {{choice:ruleset:1}} is the puzzle called Number Ball, invented by Inaba Naoki; the original puzzles are available here: http://www.janko.at/Raetsel/Nanbaboru/index.htm
  hints: |-
    **Hint** explains the next step rather than simply making it. When a step needs pencil marks, it starts by filling in every candidate, 'X' included, in each empty square that has none yet (the same as pressing **Fill marks**), then works from your own marks, so it carries on from wherever you are. If a letter or 'X' you've entered is wrong, or a square's pencil marks have crossed out its answer, it asks you to fix the highlighted mistakes first.

    {{hint-marks}}

    The hint speaks of *squares*, and a clue *sees* the first letter along its line. The pencil-mark 'X', the note that a square might be empty, is crossed out like any other pencil mark: a square left with only that mark must be empty. Each row and column has a fixed number of empty squares, so counting them is half the game: once a line has room for only as many empty squares as it still needs, they must all be empty. In {{choice:ruleset:1}}, where every symbol is a number, the hint says "number" wherever this says "letter".

    {{wing}}
produces: latin
sizes:
  w: { min: 3, max: 10 }
  # The symbols each line holds; the rest of it is empty.
  n: { min: 2, max: 9 }
  # 0 ABC End View's letters, 1 Number Ball's numbers.
  mode: { min: 0, max: 1 }
space:
  grid: { w: "w", h: "w" }
  slots: true
  units: [rows, cols]
answer:
  # n + 1 is the empty square, which fills the rest of each line.
  value:
    sort: cell
    domain: "range(1, n + 1)"
    repeat: { value: "n + 1", times: "w - n" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, n + 1)" }
shape:
  - "latin(value, lines)"
clues:
  # ABC End View: the first square from the clue that is not empty holds it.
  border:
    at: slot
    glyph: true
    value: "range(1, n)"
    means: >-
      exists c in sight(at):
      value(c) = v and (forall c2 in before(c, sight(at)): value(c2) = n + 1)
  # Number Ball: a ball's square is not empty.
  ball: { at: cell, value: "range(0, 0)", means: "value(at) != n + 1" }
freedom: { kind: fill }
play:
  numbers: { empty: { ball: ball } }
  boards: [4x4n3L, 5x5n3L, 5x5n4L, 6x6n4L, 7x7n4L, 8x8n5L, 5x5n3B, 5x5n4B, 6x6n3B, 6x6n4B, 7x7n4B, 8x8n5B]
  default: 4x4n3L
  # Normal where its deal is quick: forty deals each took at most 0.2 s on a
  # loaded machine. Every other Numbers shape took seconds at Normal.
  boardTiers:
    4x4n3L: [Easy, Easy]
    7x7n4L: [Easy, Easy]
    8x8n5L: [Easy, Easy]
    5x5n3B: [Easy, Easy]
    5x5n4B: [Normal, Normal]
    6x6n3B: [Easy, Easy]
    6x6n4B: [Easy, Easy]
    7x7n4B: [Easy, Easy]
    8x8n5B: [Easy, Easy]
  hintMarks:
    ring: the square the step fills in.
    strike: the pencil marks the step crosses out.
    outline: what the step reasons from.
    stripes: the row or column the sentence names.
deal:
  answer: a Latin square of o symbols, those past n read as empty
  border: every clue the answer shows, then each hidden while the board still finishes
  ball: every square's ball, then each weakened, then hidden
  given: every square, then each hidden while the board still finishes
  tier: one of the tiers
  sample: { latin: true }
  # A board whose empty squares all fall out with no symbol placed never asks
  # where a symbol goes.
  refuse: { by: [ball, emptyLine, emptySquare], places: "n + 1" }
  hide:
    # A Letters board below 8x8 is clued on its border alone.
    given: { whole: { with: Letters, shorter: { max: 7 } } }
    border:
    # A number given is weakened to its ball before the ball goes.
    ball: { after: given }
settings:
  n:
    kind: number
    gives: size
    letter: n
    kw: symbols
    name: Symbols
    doc: The amount of different symbols that appear in each row.
    min: 2
    max: 9
    default: 3
    words: "{n} symbols"
    under: w
  mode:
    kind: choice
    gives: size
    choices:
      - name: Letters
        code: L
        rule: The letters on the edge show which letter appears first when 'looking' into the grid.
        deals: [border]
        letters: true
        # No board of two letters is Normal clued on its border alone.
        bounds: { tiers: { Normal: { sizes: { n: 2 }, shorter: { min: 8 } } } }
      - name: Numbers
        code: B
        rule: Squares with a ball must contain a number. Squares with a cross must remain empty.
        deals: [ball]
        bounds: { tiers: { Normal: { sizes: { n: 2 }, shorter: { min: 5 } } } }
id:
  - { digits: border, glyphs: true, sides: [top, left, bottom, right], after: "," }
  - { digits: given, glyphs: true, codes: { O: "ball 0" } }
tierLetters: ex
tiers: [Easy, Normal]
names:
  dup: "a placed symbol's row and column"
  single: "the only symbol left in a square"
  hiddenSingle: "the only square left for a symbol"
  set: "symbols already accounted for"
  wing: "a wing"
  borderNear: "the letter a clue sees first"
  borderFar: "how far in a clue's letter sits"
  ball: "a ball's square"
  emptyLine: "a line's last squares that can be empty"
  emptySquare: "a square that can hold no symbol"
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  # Upstream's salad_letters_solver_dir, one clue a binding, square by
  # square from the clue. Near it, every square up to the first not known
  # empty holds no letter but the clue's, since the empties before its
  # letter are all the clue looks across.
  - id: borderNear
    tier: Easy
    rung: borderNear
    for: >-
      k in clues(border),
      L = sight(at(k)),
      f = index(first({c in L where not (known(c) and value(c) = n + 1)}), L)
      where f >= 0
    conclude: >-
      forall c in L where index(c, L) <= f:
      forall e in domain where e != v(k) and e <= n: strike(c, e)
    # The empty squares the clue sees past outlined, where there are any.
    says:
      terms: { k: k, v: "v(k)", f: f }
      marks:
        outline: "{c in L where index(c, L) < f}"
      wordings:
        - when: "f = 0"
          look: "{outline k: This clue} sees {v} first, and the {noun} nearest it can only be {v} or empty"
        - look: >-
            {outline k: This clue} sees {v} first past {outline: the outlined empty {noun} |
            the {numeral f} outlined empty {nouns}}, and the next {noun} can only be {v} or empty
  # And the clue's letter sits no further in than the line's empties reach,
  # less those known empty beyond anywhere it could sit, nor past the first
  # square known to hold a letter.
  - id: borderFar
    tier: Easy
    rung: borderFar
    for: >-
      k in clues(border),
      L = sight(at(k)),
      H = w - n,
      reach = H - count(c in L where index(c, L) >= H and known(c) and value(c) = n + 1),
      stop = index(first({c in L where n + 1 not in cand(c)}), L)
    conclude: >-
      forall c in L where (stop >= 0 and index(c, L) > stop) or index(c, L) > reach:
      strike(c, v(k))
    # The square that stops it outlined, where one does.
    says:
      shown: value
      terms: { k: k, v: "v(k)", reach: reach, stop: stop }
      marks:
        outline: "{c in L where stop >= 0 and stop < reach and index(c, L) = stop}"
      wordings:
        - when: "stop >= 0 and stop < reach"
          look: >-
            {outline k: This clue} sees {v} first, and cannot see past {outline: the
            outlined {noun}}, which holds a {valueNoun}
        - when: "reach = 0"
          look: "{outline k: This clue} sees {v} first, with no empty {noun} left to come before it"
        - when: "reach = 1"
          look: "{outline k: This clue} sees {v} first, after at most one empty {noun}"
        - look: "{outline k: This clue} sees {v} first, after at most {numeral reach} empty {nouns}"
  # A ball's square is struck the empty square.
  - id: ball
    tier: Easy
    rung: ball
    for: "c in cells where clue(ball, c) != none"
    conclude: "strike(c, n + 1)"
    says:
      terms:
        at: c
      marks: {}
      look: "{outline at: The outlined ball} means its square holds a {valueNoun}"
  # A line with only as many squares left that may be empty as it has empty
  # squares to place has one in each.
  - id: emptyLine
    tier: Easy
    rung: emptyLine
    for: >-
      L in units,
      E = {c in cells(L) where not known(c) and n + 1 in cand(c)},
      k = w - n - count(c in cells(L) where known(c) and value(c) = n + 1)
      where |E| > 0 and |E| = k
    conclude: "forall c in E: place(c, n + 1)"
    # Said as the line holding all its symbols, where it does, else as the
    # empty squares it still needs and has room for.
    says:
      shown: legs
      terms:
        L: L
        k: k
        s: n
        full: "count(c in cells(L) where known(c) and value(c) <= n) = n"
      marks:
        stripes: "cells(L)"
      again: "{stripes: the same {unit}}"
      later: "{ring} must be empty too"
      move: "{ring} must be empty"
      wordings:
        - when: "full"
          look: "All {numeral s} {valueNoun}s of {stripes: this {unit}} are already placed"
        - when: "k = 1"
          look: "{stripes: this {unit}} still needs one empty {noun}, and no other {noun} of it can be empty"
        - look: >-
            {stripes: this {unit}} still needs {numeral k} empty {nouns}, and only
            {numeral k} of its {nouns} can be empty
  # A square that can hold no symbol is empty.
  - id: emptySquare
    tier: Easy
    rung: emptySquare
    for: "c in cells where not known(c) and |cand(c)| = 1 and n + 1 in cand(c)"
    conclude: "place(c, n + 1)"
    says:
      terms: { at: c }
      marks: {}
      look: "Every {valueNoun} is ruled out of {ring}"
      move: "it must be empty"
  - { use: latin.hiddenSingle, tier: Easy, rung: hiddenSingle }
  - { use: latin.single, tier: Easy, rung: single }
  - { use: latin.set, tier: Normal, rung: set }
  - { use: latin.fish, tier: Normal, rung: set }
  - { use: latin.wing, tier: Normal, rung: wing }
# What the walk says where an empty square just placed rules itself out of
# the rest of a line, which it does only once the line has all its empty
# squares.
steps:
  last:
    ring: cell
    terms: { n: number, axis: unit, both: flag }
    marks: { outline: [cell] }
    look: "{outline cell: The {n} just placed} is the last empty {noun} {if both: of its row and its column | of its {axis}}"
