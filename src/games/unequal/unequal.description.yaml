# yaml-language-server: $schema=../../describe/description.schema.json

# Unequal's techniques and help page. `npm run describe` compiles the
# techniques to unequal.compiled.ts, which solver.ts runs.
game: unequal
help:
  rules: |-
    Fill in the grid with numbers from 1 to the grid size, so that every
    number appears exactly once in each row and column. A `<` sign between
    two squares points at the smaller of their two numbers. Not every sign
    is shown, especially at harder difficulties.
  controls: |-
    To place a number, click in a square to select it, then type the
    number on the keyboard. To erase a number, click to select a square
    and then press Backspace.

    Right-click in a square and then type a number to add or remove the
    number as a pencil mark, indicating numbers that you think
    *might* go in that square.

    {{done-clues}}

    {{sticky-pencil}}

    You can also use the arrow keys to move the selected square around.
    Press Enter to toggle between entering numbers and entering pencil
    marks, and Backspace or Space to clear a square. Shift or Ctrl with an
    arrow key marks the sign between the selected square and its neighbor
    that way as done.

    {{mark-all}} Once every empty square has marks, the press crosses out
    of each the numbers already placed in its row and column.
  hints: |-
    **Hint** explains the next step rather than simply making it. It works
    from your own numbers and pencil marks, so it carries on from wherever
    you are; if a number you've placed is wrong, or a cell's pencil marks
    have crossed out its answer, it asks you to fix the highlighted
    mistakes first. It pencils in only as it needs to: a cell with no marks
    counts as holding every number its row and column don't already hold,
    and the hint writes a cell's marks only when its next step crosses one
    out or reasons from them. If you would rather it filled in every cell's
    marks first (the same as pressing **Fill marks**), set **Hints pencil in** to
    **Every candidate first** in the preferences.

    {{hint-marks}}

    The hint calls every `<` sign a *greater-than sign*, and reasons from
    it both ways: the cell on its larger side can't hold anything as small
    as the smallest its partner could be, nor the one on its smaller side
    anything as large as the largest.

    {{wing:cell}}

    If you've turned on the preference that removes a number from pencil
    marks in its row and column when you place it, the hint leaves that
    tidying to the placement rather than spelling it out as a step of its
    own. On an Unreasonable board, deduction can run out before the grid is
    full; the hint says so rather than guessing.

name: Unequal
family: latin
sizes:
  order: { min: 3, max: 16 }
space:
  grid: { w: "order", h: "order" }
  edges: true
  units: [rows, cols]
answer:
  value: { sort: cell, domain: "range(1, order)" }
given: [value]
marks:
  cand: { sort: cell, notation: "set of range(1, order)" }
  # A play aid with no meaning for the answer.
  done: { sort: edge, notation: "bool" }
define:
  lesser(k): "other(at(k), v(k))"
shape:
  - "latin(value, lines)"
clues:
  # v is the end at the open side of the sign. The game deals them column by
  # column, each cell's signs up, right, down, left.
  greater:
    at: edge
    value: "ends(at)"
    means: "value(v) > value(other(at, v))"
freedom: { kind: fill }
deal:
  clues: which true inequalities show, fewer at higher tiers
  givens: how many
  tier: one of the tiers
tiers: [Easy, Normal, Tricky, Hard, Unreasonable]
techniques:
  - { use: latin.placed, tier: Easy, rung: dup }
  - { use: latin.hiddenSingle, tier: Easy, rung: hiddenSingle }
  - { use: latin.single, tier: Easy, rung: single }
  # One sign, both its ends, value by value: the larger end is larger than the
  # smaller end's least candidate, and the smaller end smaller than the larger
  # end's greatest.
  - id: sign
    tier: Normal
    rung: [greater, lesser]
    for: "k in clues(greater), big = v(k), small = lesser(k)"
    conclude: >-
      forall c in {big, small}, d in domain:
      ((c = big and (forall d2 in cand(small): d <= d2)) implies strike(c, d))
      and ((c = small and (forall d2 in cand(big): d >= d2)) implies strike(c, d))
    # The hint names the sign's two ends, and the bound each struck end is
    # held to: the least the smaller end can be, the greatest the larger. At
    # the value's extreme the bound says nothing, so the sentence names the
    # extreme instead.
    says:
      terms:
        big: big
        small: small
        lo: "min(d in cand(small))"
        hi: "max(d in cand(big))"
      marks: {}
      fact:
        # The sign's two ends, the struck one first.
        terms: { sign: "{c, the(p in {big, small} where p != c)}" }
        arms:
          least:
            when: "c = big and min(d2 in cand(small)) <= 1"
            look: "The larger side of {outline sign: this greater-than sign} can't hold the smallest number"
          greater:
            when: "c = big"
            look: "{outline small: the outlined smaller side} of {outline sign: this greater-than sign} is at least {lo}"
          most:
            when: "max(d2 in cand(big)) >= order"
            look: "The smaller side of {outline sign: this greater-than sign} can't hold the largest number"
          lesser:
            when: "c = small"
            look: "{outline big: the outlined larger side} of {outline sign: this greater-than sign} is at most {hi}"
  - { use: latin.set, tier: Tricky, rung: set }
  - { use: latin.fish, tier: Hard, rung: set }
  - { use: latin.wing, tier: Hard, rung: wing }
