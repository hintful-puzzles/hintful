# yaml-language-server: $schema=../../describe/description.schema.json

game: samegame
help:
  rules: |-
    Try to empty the playing area completely, by removing connected
    groups of two or more squares of the same color. Then try to score
    as much as possible, by removing large groups at a time instead of
    small ones.
  controls: |-
    {{controls}}

    A square's group is the squares of its color connected to it. While a
    group is highlighted, the status line prints the number of squares in
    it and the score you would gain by removing them. When a group goes,
    the squares above fall down to fill the space, and if you empty a whole
    column then the other columns move left to close the gap. You cannot
    remove a single isolated square: try to avoid dead-end positions where
    all remaining squares are isolated. The cursor wraps round at the
    edges of the grid.
  hints: |-
    **Hint** shows a group to remove next, one that still leaves a board that can
    be cleared. It searches for a way to clear the board from wherever you are,
    so it carries on from your own moves too. It is about clearing the board,
    not about the score: the group it picks is not always the one that scores
    the most.

    {{hint-marks}}

    The step says why it picked that group where it can show it. A square that
    is the last of its color can never be removed, so a hint warns you off a
    group whose removal would leave one, or would leave no two squares of one
    color side by side. Where it has checked every other group, it says which of
    them could also go next. Otherwise it points out a square with no partner of
    its color beside it that the removal brings one to.

    If no way to clear the board is left, the hint says so, and the thing to do
    is undo. **Show solution** clears the board for you.

name: Same Game
family: position
sizes:
  # A board of any size its desc gives; 99 stands for no bound.
  w: { min: 1, max: 99 }
  h: { min: 1, max: 99 }
  # The colors a square may be. The game deals three at the least, and a
  # desc loads any count.
  colors: { min: 1, max: 9 }
space:
  grid: { w: "w", h: "h" }
  units: []
position:
  # Each square's color, 0 where it is empty.
  tile: { domain: "range(0, colors)" }
freedom: { kind: transition }
define:
  # The squares joined to s through squares of its color: its group.
  joined(s, c): "c = s or (tile(c) = tile(s) and exists n in adj4(c): joined(s, n))"
  # Square c keeps a tile once s's group is removed.
  stays(s, c): "tile(c) != 0 and not joined(s, c)"
  # The columns before c's that keep a tile, which c's closes up to.
  left(s, c): "count(L in before(col(c), cols) where exists d in cells(L): stays(s, d))"
  # The tiles below c that stay, which it falls onto.
  below(s, c): "count(d in cells(col(c)) where y(d) > y(c) and stays(s, d))"
views:
  # The group a press selects.
  - joined
moves:
  # Remove the group whose first square, in reading order, is s: two or more
  # squares of one color. The tiles above fall, and the columns emptied close
  # up to the left.
  remove:
    for: >-
      s in cells where tile(s) != 0 and (exists n in adj4(s): tile(n) = tile(s))
      and forall c in cells where joined(s, c): index(c, cells) >= index(s, cells)
    set:
      - for: "c in cells"
        tile: "0"
      - for: "c in cells where stays(s, c), t = cell(left(s, c), h - 1 - below(s, c))"
        tile: "tile(c)"
finish:
  - "forall c in cells: tile(c) = 0"
deadEnds:
  # Squares are left and no two of one color are side by side, so nothing
  # can be removed.
  stuck: >-
    (exists c in cells: tile(c) != 0) and
    forall c in cells where tile(c) != 0: forall n in adj4(c): tile(n) != tile(c)
  # A removal takes two or more squares of one color, and no square changes
  # color, so a square the last of its color can never go.
  last: "exists c in cells where tile(c) != 0: forall d in cells where d != c: tile(d) != tile(c)"
steps:
  # A step removes the group the planner's line takes first (ringed). What it
  # says is what the search settled about the other groups, a trap the player
  # can see first; whether "so" may be said is the rival judging's. `color`
  # is said by the palette's name for it.
  # The removal that empties the board.
  last:
    ring: group
    move: &remove "remove {ring: this group}"
    effect: "that clears the board"
  # The only group on the board.
  none:
    ring: group
    look: "there is no other group"
    move: *remove
  # Removing the striped group would leave the outlined square the last of
  # its color.
  lastOfColor:
    ring: group
    terms: { color: number }
    marks: { outline: [square], stripes: [rival] }
    look: "removing {stripes rival: the striped group} would leave {outline square: the outlined square} the last {color} one"
    answers: &avoid "One way to avoid it"
    move: *remove
  # Removing the striped group would leave no two squares of one color side
  # by side.
  stuck:
    ring: group
    marks: { stripes: [rival] }
    look: "removing {stripes rival: the striped group} would leave no two touching squares of one color"
    answers: *avoid
    move: *remove
  # Every rival was searched to the end, and none leaves a board that can be
  # cleared.
  only:
    ring: group
    look: "removing any other group would leave a board that can never be cleared"
    move: *remove
  # Every rival was settled: the outlined groups leave a board that can be
  # cleared, the rest do not.
  onlyThese:
    ring: group
    terms: { groups: number }
    marks: { outline: [groups] }
    look: "only {ring: this group} and {outline groups: {groups: the outlined group | the outlined groups}} keep the board clearable"
    move: *remove
  # The outlined groups leave a board that can be cleared, at least one rival
  # does not, and some were not settled.
  alsoThese:
    ring: group
    terms: { groups: number }
    marks: { outline: [groups] }
    look: "{ring: this group} and {outline groups: {groups: the outlined group | the outlined groups}} keep the board clearable; some others do not"
    move: *remove
  # Every rival leaves a board that can still be cleared.
  anyGroup:
    ring: group
    look: "removing any group now keeps the board clearable"
    move: *remove
  # The outlined square has no square of its color beside it, and removing
  # the group brings one beside it.
  joins:
    ring: group
    terms: { color: number }
    marks: { outline: [square] }
    look: "{outline square: the outlined square} has no {color} square beside it"
    answers: "One way to bring one beside it"
    move: *remove
  # Nothing settled worth saying. That the board can still be cleared after
  # it goes without saying: the hint offers no other kind of removal.
  plain:
    ring: group
    move: *remove
deal:
  start: >-
    a board built backward from empty, groups dropped in so that it can be
    cleared
